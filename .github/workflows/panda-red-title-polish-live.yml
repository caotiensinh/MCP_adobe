name: Kung Fu Panda red Photoshop native typography polish from full 60-layer PSD
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-title-polish-live.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  polish:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 14
    env:
      PYTHONUTF8: '1'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - name: Check exact immutable source and unique Photoshop desktop
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [System.Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){
            throw 'RED_PS_POLISH_WRONG_DESKTOP'
          }
          $ps=@(Get-Process -Name Photoshop -ErrorAction SilentlyContinue|Where-Object {$_.SessionId -eq 1 -and $_.MainWindowHandle -ne 0})
          if($ps.Count -ne 1){throw 'RED_PS_POLISH_AMBIGUOUS_PHOTOSHOP'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $source=Join-Path $root 'MCP_KFP4_Red_PS_38151318908_60shapes.psd'
          if(-not(Test-Path -LiteralPath $source -PathType Leaf)){throw 'RED_PS_POLISH_NATIVE_60_SOURCE_ABSENT'}
          $hash=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          if($hash -ne '8B5C0C0702EE7E2953F479563550956DEE66838D7DD554BACC141DB51F715337'){
            throw 'RED_PS_POLISH_SOURCE_SHA_CHANGED_NO_WRITE'
          }
          Write-Host "RED_PS_POLISH_SOURCE=PASS pid=$($ps[0].Id) bytes=$((Get-Item $source).Length) sha256=$hash"
      - name: Scale and reposition three editable Type layers, persist each, export Photoshop PNG
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          uv run --python 3.12 python -m py_compile scripts/panda_red_photoshop_title_layout.py
          if($LASTEXITCODE -ne 0){throw 'RED_PS_POLISH_SOURCE_SYNTAX_FAILED'}
          $sw=[System.Diagnostics.Stopwatch]::StartNew()
          uv run --python 3.12 python scripts/panda_red_photoshop_title_layout.py
          $rc=$LASTEXITCODE
          $sw.Stop()
          Write-Host "RED_PS_POLISH_FULL_WALL_MS=$($sw.ElapsedMilliseconds) rc=$rc"
          if($rc -ne 0){throw 'RED_PS_POLISH_UNCERTAIN_STOP_NEVER_BLIND_REPLAY'}
      - name: Collect actual polished native Photoshop document and PNG with matched SHA
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $folder=Join-Path $PWD 'panda_red_polished'
          New-Item -ItemType Directory -Path $folder -Force|Out-Null
          foreach($ext in @('psd','png')){
            $src=Join-Path $root ("MCP_KFP4_Red_PS_{0}_polished.{1}" -f $env:GITHUB_RUN_ID,$ext)
            if(Test-Path -LiteralPath $src -PathType Leaf){
              $dst=Join-Path $folder ("kung_fu_panda_4_red_polished.{0}" -f $ext)
              Copy-Item -LiteralPath $src -Destination $dst -ErrorAction Stop
              $old=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash
              $new=(Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash
              if($old -ne $new){throw 'RED_PS_POLISH_ARTIFACT_COPY_SHA_MISMATCH'}
              Write-Host "RED_PS_POLISH_ARTIFACT=PASS ext=$ext bytes=$((Get-Item $src).Length) sha256=$old"
            }else{Write-Host "RED_PS_POLISH_ARTIFACT_ABSENT=$ext"}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-panda-photoshop-60-native-polished
          path: panda_red_polished/*
          if-no-files-found: warn
          retention-days: 14
