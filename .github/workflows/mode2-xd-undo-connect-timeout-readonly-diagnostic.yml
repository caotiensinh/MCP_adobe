name: Mode 2 XD Undo Connect timeout evidence and performance read-only
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-undo-connect-timeout-readonly-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  read-only:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Inspect one-shot markers, processes, port owners and timing without connecting
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_NOT_MRCAO_SESSION1'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $dir=Join-Path $root 'mode2-disposable-native'
          $undoMarker=Join-Path $dir 'Mode2_GUID_Fill_Undo_Once.marker'
          $undoReceipt=Join-Path $dir 'mode2_exact_guid_fill_undo_receipt.json'
          Write-Host "MODE2_UNDO_MARKER_EXISTS=$(Test-Path -LiteralPath $undoMarker)"
          Write-Host "MODE2_UNDO_RECEIPT_EXISTS=$(Test-Path -LiteralPath $undoReceipt)"
          if(Test-Path -LiteralPath $undoReceipt){
            $u=Get-Content -LiteralPath $undoReceipt -Raw -Encoding UTF8|ConvertFrom-Json
            Write-Host "MODE2_UNDO_RECEIPT_STATE=$($u.state) OP=$($u.operation_id)"
          }
          $r=Get-Content -LiteralPath (Join-Path $dir 'mode2_exact_guid_fill_mutation_receipt.json') -Raw -Encoding UTF8|ConvertFrom-Json
          Write-Host "MODE2_FILL_RECEIPT_STATE=$($r.state) OP=$($r.operation_id)"
          $sw=[Diagnostics.Stopwatch]::StartNew()
          $baseline='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          foreach($rel in @('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd')){
            $part=[Diagnostics.Stopwatch]::StartNew()
            $h=(Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash
            Write-Host "MODE2_TIMING_HASH_PROTECTED_MS=$($part.ElapsedMilliseconds) OK=$($h -eq $baseline)"
            if($h -ne $baseline){throw 'MODE2_PROTECTED_SHA_CHANGED'}
          }
          $part=[Diagnostics.Stopwatch]::StartNew()
          $h=(Get-FileHash -LiteralPath (Join-Path $dir 'Mode2_Undo_E2E_38584984023.xd') -Algorithm SHA256).Hash
          Write-Host "MODE2_TIMING_HASH_DISPOSABLE_MS=$($part.ElapsedMilliseconds) SHA=$h"
          if($h -ne '1E15162107A64E3D7D4CAF8C12B88FE24B64488DA9788854E6D300DDBAE88C2F'){throw 'MODE2_DISPOSABLE_HASH_CHANGED'}
          Write-Host "MODE2_HASH_TOTAL_MS=$($sw.ElapsedMilliseconds)"
          $sw.Restart()
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $tops=[System.Windows.Automation.AutomationElement]::RootElement.FindAll(
            [System.Windows.Automation.TreeScope]::Children,
            [System.Windows.Automation.Condition]::TrueCondition)
          $xd=@($tops|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          Write-Host "MODE2_TIMING_UIA_WINDOW_ENUM_MS=$($sw.ElapsedMilliseconds) XD=$($xd.Count) TEST=$($test.Count)"
          if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_NOT_SOLE_SAVED_DISPOSABLE'}
          $sw.Restart()
          $items=$test[0].FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
          Write-Host "MODE2_TIMING_UIA_DESCENDANTS_MS=$($sw.ElapsedMilliseconds) COUNT=$($items.Count)"
          foreach($port in @(8765,8766)){
            $listen=@(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue)
            $est=@(Get-NetTCPConnection -LocalPort $port -State Established -ErrorAction SilentlyContinue)
            Write-Host "MODE2_PORT=$port LISTEN=$($listen.Count) CONNECTED=$($est.Count)"
          }
          foreach($proc in @(Get-CimInstance Win32_Process | Where-Object{
            $_.Name -in @('XD.exe','powershell.exe','python.exe','uv.exe')
          })|Select-Object -First 20){
            Write-Host "MODE2_RUNNING_PROCESS=$($proc.Name) PID=$($proc.ProcessId) SESSION=$($proc.SessionId)"
          }
          Write-Host 'MODE2_CONNECT_TIMEOUT_DIAGNOSTIC_READONLY=PASS'
          Write-Host 'MODE2_GUI_UNDO_OR_CONNECT_INVOKED=False'
