name: Mode 2 XD reselect saved rectangle and native Fill color readback once
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-saved-rectangle-color-readback-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  select:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stage exact new Rectangle GUID over 8766 then select through explicit XD menu once
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $nativeSha='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          $savedRectSha='1E15162107A64E3D7D4CAF8C12B88FE24B64488DA9788854E6D300DDBAE88C2F'
          $rels=@('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd')
          foreach($rel in $rels){if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $nativeSha){throw 'MODE2_PROTECTED_NATIVE_NOT_BASELINE'}}
          $disposable=Join-Path $root 'mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd'
          if((Get-FileHash -LiteralPath $disposable -Algorithm SHA256).Hash -ne $savedRectSha){throw 'MODE2_SAVED_34_NODE_DISPOSABLE_SHA_MISMATCH'}
          $develop=Join-Path $env:LOCALAPPDATA 'Packages\Adobe.XD_pc75e8sa7ep4e\LocalState\develop'
          $git=(Get-Command git -ErrorAction Stop).Source
          $plugin=Join-Path $develop 'MCPAdobeMode2Experiment\main.js'
          if((& $git hash-object -- $plugin).Trim() -ne 'd47edb15284ff4653da919513815fe4f9d846a70'){throw 'MODE2_INSTALLED_TICKET_RECOVERY_PLUGIN_NOT_PINNED'}
          Write-Host 'MODE2_NATIVE_34_NODE_AND_UXP_BUILD_PINNED=PASS'
          $reload=Join-Path $root 'mode2-disposable-native\Mode2_FixtureSelection_PluginReload_Once.marker'
          $selectionMarker=Join-Path $root 'mode2-disposable-native\Mode2_SavedRect_AfterColdReopen_ColorRead_Once.marker'
          if(!(Test-Path -LiteralPath $reload -PathType Leaf)){throw 'MODE2_FIXTURE_PLUGIN_NOT_RELOADED'}
          if(Test-Path -LiteralPath $selectionMarker){throw 'MODE2_COLD_REOPEN_COLOR_SELECTION_ALREADY_INVOKED_NO_REPLAY'}
          $receipt=Join-Path $root 'mode2-disposable-native\mode2_fill_rect_guid_receipt.json'
          if(!(Test-Path -LiteralPath $receipt -PathType Leaf)){throw 'MODE2_NEW_RECT_CREATION_RECEIPT_MISSING'}
          $created=Get-Content -LiteralPath $receipt -Raw -Encoding UTF8|ConvertFrom-Json
          if($created.state -ne 'applied' -or $created.name -ne 'MODE2_DISPOSABLE_FILL_RECT_GUID_E2E'){throw 'MODE2_NEW_RECT_CREATION_NOT_PROVEN'}
          if(@(Get-Process -Name Illustrator,Photoshop,PickerHost -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_OTHER_ADOBE_APP'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $scope=[System.Windows.Automation.TreeScope]::Children
          $desc=[System.Windows.Automation.TreeScope]::Descendants
          $cond=[System.Windows.Automation.Condition]::TrueCondition
          $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
          $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -eq 0){
            $tracking=$env:RUNNER_TRACKING_ID
            try{$env:RUNNER_TRACKING_ID='';Start-Process -FilePath $disposable -ErrorAction Stop}finally{$env:RUNNER_TRACKING_ID=$tracking}
            Write-Host 'MODE2_SAVED_RECT_DISPOSABLE_OPENED_ONCE'
          }elseif($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_FOREIGN_XD_WINDOW_NOT_ALLOWED'}
          $ready=$false
          for($i=1;$i -le 16;$i++){
            Start-Sleep -Seconds 3
            $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
            $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
            $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
            $prod=@(Get-NetTCPConnection -LocalPort 8765 -State Established -ErrorAction SilentlyContinue)
            Write-Host "MODE2_GUID_SELECTION_HOST_POLL=$i XD=$($xd.Count) TEST=$($test.Count) PRODUCTION=$($prod.Count)"
            if($xd.Count -eq 1 -and $test.Count -eq 1 -and $prod.Count -ge 1){$ready=$true;break}
          }
          if(-not $ready){throw 'MODE2_NEW_RECT_NATIVE_HOST_OR_PRODUCTION_BRIDGE_NOT_READY'}
          $win=$test[0]
          $wp=$win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
          if($wp.Current.WindowVisualState -eq [System.Windows.Automation.WindowVisualState]::Minimized){
            $wp.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Normal)
          }
          try{$win.SetFocus()}catch{}
          Start-Sleep -Seconds 1
          $aid=[System.Windows.Automation.AutomationElement]::AutomationIdProperty
          $file=$win.FindFirst($desc,(New-Object System.Windows.Automation.PropertyCondition($aid,'AppMenu_File')))
          if(-not $file){throw 'MODE2_FILE_MENU_UNAVAILABLE'}
          $fileXp=$file.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
          $fileXp.Expand();Start-Sleep -Milliseconds 200
          $nodes=$win.FindAll($desc,$cond)
          $save=@($nodes|Where-Object {[string]$_.Current.AutomationId -eq 'AppMenu_Save' -and [string]$_.Current.ControlType.ProgrammaticName -eq 'ControlType.MenuItem'})
          $fileXp.Collapse()
          if($save.Count -ne 1 -or $save[0].Current.IsEnabled){throw 'MODE2_SAVED_34_NODE_DISPOSABLE_NOT_CLEAN'}
          Write-Host 'MODE2_NEW_RECT_SAVED_NATIVE_CLEAN=PASS'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          $uv=(Get-Command uv -ErrorAction Stop).Source
          if(@(Get-NetTCPConnection -LocalPort 8766 -State Listen -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_8766_UNOWNED_LISTENER'}
          $stdout=Join-Path $env:RUNNER_TEMP 'mode2_fixture_connect_selected.txt'
          $stderr=Join-Path $env:RUNNER_TEMP 'mode2_fixture_connect_errors.txt'
          $child=Start-Process -FilePath $uv -ArgumentList @('run','--python','3.12','python','scripts/mode2_staged_rect_select_watch.py','--wait-seconds','85') -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try{
            $listen=$false
            for($i=1;$i -le 35;$i++){
              Start-Sleep -Milliseconds 450
              if($child.HasExited){throw 'MODE2_READBACK_LISTENER_EARLY_EXIT'}
              if(@(Get-NetTCPConnection -LocalPort 8766 -State Listen -ErrorAction SilentlyContinue).Count -eq 1){$listen=$true;break}
            }
            if(-not $listen){throw 'MODE2_EXPERIMENTAL_LISTENER_NOT_READY'}
            Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class Mode2StagedSelectForeground { [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h); }'
            function Open-ExperimentMenu {
              for($attempt=1;$attempt -le 12;$attempt++){
                $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
                $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
                $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
                if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_STAGE_SELECT_FOREIGN_WINDOW'}
                $script:win=$test[0]
                try{
                  $wp=$script:win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
                  if($wp.Current.WindowVisualState -eq [System.Windows.Automation.WindowVisualState]::Minimized){
                    $wp.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Normal)
                  }
                }catch{}
                try{$script:win.SetFocus()}catch{}
                [void][Mode2StagedSelectForeground]::SetForegroundWindow([IntPtr]$script:win.Current.NativeWindowHandle)
                Start-Sleep -Milliseconds 380
                $script:plugins=$script:win.FindFirst($desc,(New-Object System.Windows.Automation.PropertyCondition($aid,'AppMenuBar_Plugins')))
                if(-not $script:plugins){
                  Write-Host "MODE2_MENU_RETRY=$attempt PLUGINS_NOT_AVAILABLE"
                  continue
                }
                $px=$script:plugins.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
                if($px.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$px.Expand()}
                Start-Sleep -Milliseconds 220
                $list=$script:win.FindAll($desc,$cond)
                $rootItems=@($list|Where-Object {
                  [string]$_.Current.Name -eq 'MCP Adobe Mode 2 Experimental' -and
                  [string]$_.Current.ControlType.ProgrammaticName -eq 'ControlType.MenuItem'
                })
                Write-Host "MODE2_MENU_RETRY=$attempt EXPERIMENTAL_ROOT_COUNT=$($rootItems.Count) CONTROLS=$($list.Count)"
                if($rootItems.Count -ne 1){
                  if($rootItems.Count -gt 1){throw 'MODE2_EXPERIMENTAL_MENU_AMBIGUOUS'}
                  continue
                }
                $expand=$rootItems[0].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
                if($expand.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$expand.Expand()}
                Start-Sleep -Milliseconds 260
                return @($script:win.FindAll($desc,$cond))
              }
              throw 'MODE2_EXPERIMENTAL_SUBMENU_NOT_UNIQUE'
            }
            $list=@(Open-ExperimentMenu)
            $connect=@($list|Where-Object {[string]$_.Current.Name -eq 'MCP Adobe Mode 2 Connect' -and
              [string]$_.Current.ControlType.ProgrammaticName -eq 'ControlType.MenuItem' -and $_.Current.IsEnabled})
            if($connect.Count -ne 1){throw 'MODE2_EXPERIMENTAL_CONNECT_COMMAND_NOT_UNIQUE'}
            $connect[0].GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Write-Host 'MODE2_EXPERIMENTAL_CONNECT_MENU_INVOKED_ONCE'
            $connected=$false
            for($i=1;$i -le 30;$i++){
              Start-Sleep -Milliseconds 350
              if(@(Get-NetTCPConnection -LocalPort 8766 -State Established -ErrorAction SilentlyContinue).Count -ge 1){$connected=$true;break}
            }
            if(-not $connected){throw 'MODE2_EXPERIMENTAL_CONNECT_NOT_ESTABLISHED'}
            Write-Host 'MODE2_EXPERIMENTAL_8766_CONNECTED=PASS'
            $list=@(Open-ExperimentMenu)
            $select=@($list|Where-Object {[string]$_.Current.Name -eq 'MCP Mode 2 Select Staged Disposable Rectangle' -and
              [string]$_.Current.ControlType.ProgrammaticName -eq 'ControlType.MenuItem' -and $_.Current.IsEnabled})
            if($select.Count -ne 1){throw 'MODE2_STAGED_RECT_SELECT_MENU_NOT_UNIQUE'}
            $stageReady=$false
            for($i=1;$i -le 70;$i++){
              Start-Sleep -Milliseconds 350
              if($child.HasExited){
                Write-Host "MODE2_STAGING_BRIDGE_EXIT=$($child.ExitCode)"
                if(Test-Path -LiteralPath $stdout){Get-Content -LiteralPath $stdout -Tail 50|ForEach-Object {Write-Host "MODE2_STAGE_STDOUT=$_"}}
                if(Test-Path -LiteralPath $stderr){Get-Content -LiteralPath $stderr -Tail 50|ForEach-Object {Write-Host "MODE2_STAGE_STDERR=$_"}}
                throw 'MODE2_SELECTION_STAGING_BRIDGE_EXITED_NO_NATIVE_SELECTION'
              }
              if((Test-Path -LiteralPath $stdout) -and (Select-String -LiteralPath $stdout -Pattern '^MODE2_STAGED_DISPOSABLE_RECT_AWAITING_MENU=PASS$' -Quiet)){$stageReady=$true;break}
            }
            if(-not $stageReady){throw 'MODE2_SELECTION_STAGE_NOT_ATTESTED_NO_INVOKE'}
            "run=$env:GITHUB_RUN_ID at=$([DateTime]::UtcNow.ToString('o'))" | Set-Content -LiteralPath $selectionMarker -Encoding ASCII -NoNewline
            $select[0].GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Write-Host 'MODE2_EXPERIMENTAL_SELECT_GUID_MENU_INVOKED_ONCE'
            if(-not $child.WaitForExit(90000)){throw 'MODE2_EXPERIMENTAL_SELECTION_WATCH_TIMEOUT'}
            if(Test-Path -LiteralPath $stdout){Get-Content -LiteralPath $stdout|ForEach-Object {Write-Host $_}}
            if(Test-Path -LiteralPath $stderr){Get-Content -LiteralPath $stderr -Tail 12|ForEach-Object {Write-Host "MODE2_EXPERIMENTAL_STDERR=$_"}}
            if(-not (Select-String -LiteralPath $stdout -Pattern '^MODE2_NEW_RECT_EXPLICIT_SELECT_AND_INSPECT=PASS$' -Quiet)){throw 'MODE2_EXPERIMENTAL_SELECTION_NOT_ATTESTED'}
            if(-not (Select-String -LiteralPath $stdout -Pattern '^MODE2_SAVED_RECT_INITIAL_FILL_READBACK=PASS$' -Quiet)){throw 'MODE2_REAL_SAVED_RECT_INITIAL_FILL_UNVERIFIED'}
            Write-Host 'MODE2_NATIVE_NEW_RECT_SELECT_AND_INITIAL_FILL=PASS'
          }finally{
            if(-not $child.HasExited){Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue}
          }
          foreach($rel in $rels){if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $nativeSha){throw 'MODE2_NATIVE_CHANGED_BY_SELECTION'}}
          if((Get-FileHash -LiteralPath $disposable -Algorithm SHA256).Hash -ne $savedRectSha){throw 'MODE2_SAVED_RECT_CHANGED_BY_SELECTION'}
          Write-Host 'MODE2_NEW_RECT_SELECT_ALL_NATIVE_DISK_HASHES_UNCHANGED=PASS'
