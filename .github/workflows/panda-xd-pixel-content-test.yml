name: XD panda pixel-content regression gate
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths:
      - ".github/workflows/panda-xd-pixel-content-test.yml"
      - "scripts/panda_xd_visual_acceptance.py"
      - "tests/test_panda_xd_visual_acceptance.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pixel-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image reader only for visual regression
        run: python -m pip install 'Pillow>=10,<13'
      - name: Prove invisible panda fails and visible sample passes
        env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s tests -p test_panda_xd_visual_acceptance.py -v
