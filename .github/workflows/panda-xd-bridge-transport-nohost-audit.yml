name: Panda XD transport and actual app desktop presence without bridge calls
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-xd-bridge-transport-nohost-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Inspect real XD app, localhost 8765 and supervisor without Adobe or MCP commands
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [System.Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){
            throw 'PANDA_XD_TRANSPORT_WRONG_DESKTOP'
          }
          foreach($n in @('XD','ApplicationFrameHost','Photoshop','Illustrator')){
            $ps=@(Get-Process -Name $n -ErrorAction SilentlyContinue)
            foreach($p in $ps){
              Write-Host "PANDA_XD_PROCESS name=$($p.ProcessName) pid=$($p.Id) session=$($p.SessionId) title=$($p.MainWindowTitle) handle=$($p.MainWindowHandle)"
            }
            Write-Host "PANDA_XD_PROCESS_COUNT name=$n count=$($ps.Count)"
          }
          foreach($port in @(8765,8787,8081)){
            $listeners=@(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue)
            $sockets=@(Get-NetTCPConnection -State Established -LocalPort $port -ErrorAction SilentlyContinue)
            Write-Host "PANDA_XD_TRANSPORT port=$port listeners=$($listeners.Count) connected=$($sockets.Count)"
            foreach($entry in $listeners){
              $p=Get-CimInstance Win32_Process -Filter "ProcessId=$($entry.OwningProcess)" -ErrorAction SilentlyContinue
              Write-Host "PANDA_XD_PORT_OWNER port=$port pid=$($entry.OwningProcess) exe=$($p.Name)"
            }
            foreach($entry in $sockets){
              $peer=@(Get-NetTCPConnection -State Established -LocalPort $entry.RemotePort -RemotePort $port -ErrorAction SilentlyContinue | Select-Object -First 1)
              Write-Host "PANDA_XD_CONNECTION port=$port peerPort=$($entry.RemotePort) owner=$($entry.OwningProcess) peerOwner=$($peer[0].OwningProcess)"
            }
          }
          $src=Join-Path $env:USERPROFILE 'Documents\MCPAdobe\MCP_Mode1_Panda_XD_38136531800.xd'
          if(Test-Path -LiteralPath $src -PathType Leaf){
            $hash=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash
            Write-Host "PANDA_XD_NATIVE_SOURCE sha256=$hash bytes=$((Get-Item $src).Length)"
          }
          Write-Host 'PANDA_XD_NO_HOST_CALL_AUDIT=PASS zero_mcp_requests=1 zero_adobe_mutations=1'
