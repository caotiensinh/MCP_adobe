name: Targeted Illustrator CEP upstream

on:
  push:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-illustrator-cep-upstream.yml"
      - "scripts/probe_illustrator_cep_upstream.py"

concurrency:
  group: targeted-illustrator-cep-upstream-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-cep:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Prepare gateway test environment
        shell: powershell
        run: |
          uv python install 3.12
          uv sync --python 3.12
      - name: Checkout pinned CEP upstream
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dst=Join-Path $env:RUNNER_TEMP 'Illustrator_MCP_upstream'
          if(Test-Path $dst){Remove-Item -Recurse -Force $dst}
          git clone https://github.com/jinkeda/Illustrator_MCP.git $dst
          git -C $dst checkout --detach 5d7a3edc8ebc89a0fc56b059e1311d3b2bfca815
          $actual=(git -C $dst rev-parse HEAD).Trim()
          Write-Host "UPSTREAM_HEAD=$actual"
          if($actual -ne '5d7a3edc8ebc89a0fc56b059e1311d3b2bfca815'){throw 'Pinned upstream checkout mismatch'}
      - name: Build and install CEP panel with StartOn
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:RUNNER_TEMP 'Illustrator_MCP_upstream'
          $cep=Join-Path $src 'cep-extension'
          Push-Location $cep
          try {
            npm ci
            if($LASTEXITCODE -ne 0){throw 'npm ci failed'}
            npm run typecheck
            if($LASTEXITCODE -ne 0){throw 'npm typecheck failed'}
            npm run build
            if($LASTEXITCODE -ne 0){throw 'npm build failed'}
            node validate-panel.mjs $cep
            if($LASTEXITCODE -ne 0){throw 'CEP validation failed'}
          } finally { Pop-Location }

          # Upstream has AutoVisible=true but no StartOn. For this isolated proof,
          # start the panel when Illustrator activates so the React hook can auto-connect.
          $manifest=Join-Path $cep 'CSXS\manifest.xml'
          $xml=[IO.File]::ReadAllText($manifest)
          if($xml -notmatch '<StartOn>') {
            $needle='<AutoVisible>true</AutoVisible>'
            $replacement=$needle + "`r`n                    <StartOn>`r`n                        <Event>applicationActivate</Event>`r`n                        <Event>com.adobe.csxs.events.ApplicationActivate</Event>`r`n                    </StartOn>"
            if(-not $xml.Contains($needle)){throw 'CEP manifest AutoVisible marker not found'}
            $xml=$xml.Replace($needle,$replacement)
            [IO.File]::WriteAllText($manifest,$xml,(New-Object Text.UTF8Encoding($false)))
          }
          $installedXml=[IO.File]::ReadAllText($manifest)
          if($installedXml -notmatch '<StartOn>' -or $installedXml -notmatch 'applicationActivate'){
            throw 'StartOn patch verification failed'
          }
          Write-Host 'CEP_STARTON_PATCH=PASS'

          $target=Join-Path $env:APPDATA 'Adobe\CEP\extensions\com.illustrator.mcp.panel'
          if(Test-Path -LiteralPath $target){Remove-Item -Recurse -Force $target}
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item -Path (Join-Path $cep '*') -Destination $target -Recurse -Force
          reg add 'HKEY_CURRENT_USER\Software\Adobe\CSXS.11' /v PlayerDebugMode /t REG_SZ /d 1 /f | Out-Null
          reg add 'HKEY_CURRENT_USER\Software\Adobe\CSXS.12' /v PlayerDebugMode /t REG_SZ /d 1 /f | Out-Null
          node (Join-Path $target 'validate-panel.mjs') $target
          if($LASTEXITCODE -ne 0){throw 'Installed CEP validation failed'}
          Write-Host "CEP_TARGET=$target"
      - name: Install pinned upstream Python server
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:RUNNER_TEMP 'Illustrator_MCP_upstream'
          $venv=Join-Path $env:RUNNER_TEMP 'Illustrator_MCP_venv'
          if(Test-Path $venv){Remove-Item -Recurse -Force $venv}
          uv venv --python 3.12 $venv
          $python=Join-Path $venv 'Scripts\python.exe'
          uv pip install --python $python -e $src
          if($LASTEXITCODE -ne 0){throw 'Pinned upstream Python install failed'}
          & $python -c "import illustrator_mcp; print('UPSTREAM_PYTHON_IMPORT=PASS')"
      - name: Live CEP connection and document create gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $venv=Join-Path $env:RUNNER_TEMP 'Illustrator_MCP_venv'
          $upstreamPython=Join-Path $venv 'Scripts\python.exe'
          $p=Get-Process -Name Illustrator -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          $target=$null
          if($p){$target=$p.Path}
          if(-not $target){
            $shell=New-Object -ComObject WScript.Shell
            $roots=@((Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'),(Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'))
            foreach($root in $roots){
              if(-not (Test-Path -LiteralPath $root)){continue}
              foreach($lnk in @(Get-ChildItem -LiteralPath $root -Recurse -Filter '*.lnk' -File -ErrorAction SilentlyContinue | Where-Object {$_.Name -match 'Illustrator'})){
                $candidate=$shell.CreateShortcut($lnk.FullName).TargetPath
                if($candidate -and (Test-Path -LiteralPath $candidate -PathType Leaf)){$target=$candidate;break}
              }
              if($target){break}
            }
          }
          if(-not $target){throw 'Illustrator executable not found'}
          Write-Host "ILLUSTRATOR_EXE=$target"
          Get-Process -Name Illustrator,CEPHtmlEngine -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $env:UPSTREAM_PYTHON=$upstreamPython
          $env:ILLUSTRATOR_EXE=$target
          uv run python scripts/probe_illustrator_cep_upstream.py
          if($LASTEXITCODE -ne 0){throw 'CEP live create probe failed'}
          $cep=Get-Process -Name CEPHtmlEngine -ErrorAction SilentlyContinue | Select-Object -First 1
          if(-not $cep){throw 'CEP live probe passed without a CEPHtmlEngine process'}
          Write-Host "CEP_HTML_ENGINE=PASS PID=$($cep.Id) SESSION=$($cep.SessionId)"
