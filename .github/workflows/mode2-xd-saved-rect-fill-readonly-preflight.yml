name: Mode 2 XD saved rectangle Fill read-only preflight
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-saved-rect-fill-readonly-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read native ownership and installed experimental UXP without invoking XD
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1) {
            throw 'MODE2_WRONG_DESKTOP_RUNNER'
          }
          $root = Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $baseline = '3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          $saved = '1E15162107A64E3D7D4CAF8C12B88FE24B64488DA9788854E6D300DDBAE88C2F'
          foreach ($rel in @('MCP_Mode1_Panda_XD_38136531800.xd', 'mode2-isolated\Panda_Mode2_Editable_Experiment.xd')) {
            $h = (Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash
            if ($h -ne $baseline) { throw "MODE2_PROTECTED_PANDA_CHANGED: $rel" }
          }
          Write-Host 'MODE2_TWO_PANDA_SHA256_UNCHANGED=PASS'
          $native = Join-Path $root 'mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd'
          $disk = (Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash
          Write-Host "MODE2_DISPOSABLE_CURRENT_SHA256=$disk"
          if ($disk -ne $saved) { throw 'MODE2_DISPOSABLE_NOT_SAVED_RECTANGLE_BASELINE' }
          $receipt = Join-Path $root 'mode2-disposable-native\mode2_fill_rect_guid_receipt.json'
          $r = Get-Content -LiteralPath $receipt -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($r.state -ne 'applied' -or
              $r.node_id -ne '9989e92f-7c9b-4721-9cdc-b5b5ea33cdf2' -or
              $r.document_id -ne '98d6635b-3767-4254-b200-ec8442b69ad2' -or
              $r.name -ne 'MODE2_DISPOSABLE_FILL_RECT_GUID_E2E') {
            throw 'MODE2_DISPOSABLE_RECTANGLE_RECEIPT_UNVERIFIED'
          }
          Write-Host 'MODE2_SAVED_RECTANGLE_RECEIPT_AND_HASH=PASS'
          $package = Join-Path $env:LOCALAPPDATA 'Packages\Adobe.XD_pc75e8sa7ep4e\LocalState\develop'
          $installed = Join-Path $package 'MCPAdobeMode2Experiment\main.js'
          $manifest = Join-Path $package 'MCPAdobeMode2Experiment\manifest.json'
          $prod = Join-Path $package 'MCPAdobeBridge\main.js'
          if (!(Test-Path -LiteralPath $installed -PathType Leaf) -or
              !(Test-Path -LiteralPath $manifest -PathType Leaf) -or
              !(Test-Path -LiteralPath $prod -PathType Leaf)) { throw 'MODE2_EXPECTED_PLUGIN_FILES_NOT_PRESENT' }
          $m = Get-Content -LiteralPath $manifest -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($m.id -ne 'MCPADM2E') { throw 'MODE2_INSTALLED_PLUGIN_ID_NOT_EXPERIMENTAL' }
          $git = (Get-Command git -ErrorAction Stop).Source
          $liveHash = (& $git hash-object -- $installed).Trim()
          $repoHash = (& $git hash-object -- 'experimental/mode2-xd-uxp/main.js').Trim()
          $productionHash = (& $git hash-object -- $prod).Trim()
          Write-Host "MODE2_INSTALLED_UXP_GIT_BLOB=$liveHash"
          Write-Host "MODE2_REPOSITORY_UXP_GIT_BLOB=$repoHash"
          Write-Host "MODE2_PRODUCTION_UXP_GIT_BLOB=$productionHash"
          if ($repoHash -ne 'd47edb15284ff4653da919513815fe4f9d846a70') {
            throw 'MODE2_CHECKOUT_EXPECTED_FILL_INSPECTOR_REVISION_MISMATCH'
          }
          if ($liveHash -eq $repoHash) {
            Write-Host 'MODE2_FILL_INSPECTOR_FILES_INSTALLED=PASS'
            Write-Host 'MODE2_FILL_INSPECTOR_LIVE_ACTIVE=NOT_YET_ATTESTED'
          } else {
            Write-Host 'MODE2_FILL_INSPECTOR_FILES_INSTALLED=BLOCKED_VERSION_MISMATCH'
            Write-Host 'MODE2_NEXT_ACTION=CONTROLLED_EXPERIMENTAL_ONLY_UPGRADE'
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $tops = [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
            [System.Windows.Automation.TreeScope]::Children,
            [System.Windows.Automation.Condition]::TrueCondition)
          $xd = @($tops | Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $test = @($xd | Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          Write-Host "MODE2_XD_WINDOWS=$($xd.Count) DISPOSABLE_WINDOWS=$($test.Count)"
          if ($xd.Count -gt 1 -or ($xd.Count -eq 1 -and $test.Count -ne 1)) {
            throw 'MODE2_FOREIGN_OR_AMBIGUOUS_XD_WINDOW'
          }
          foreach ($port in @(8765,8766)) {
            $listen = @(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue)
            $established = @(Get-NetTCPConnection -LocalPort $port -State Established -ErrorAction SilentlyContinue)
            Write-Host "MODE2_PORT=$port LISTEN=$($listen.Count) ESTABLISHED=$($established.Count)"
          }
          Write-Host 'MODE2_READONLY_PRECHECK=PASS'
          Write-Host 'MODE2_MUTATION_OR_PLUGIN_RELOAD_ATTEMPTED=False'
