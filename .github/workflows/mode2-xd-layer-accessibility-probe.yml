name: Mode 2 XD layer selection UI accessibility probe
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-layer-accessibility-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  inspect-layer-controls:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Inspect actual XD layer accessibility without clicks
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $sha='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          foreach($rel in @('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd','mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd')){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $sha){throw 'MODE2_NATIVE_FILE_CHANGED'}
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_DISPOSABLE_WINDOW_NOT_SINGLE'}
          $all=$test[0].FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
          $matches=@($all|Where-Object {[string]$_.Current.Name -match 'Panda|Layers|Layer|Artboard|Ellipse|XD Right Ear'})
          Write-Host "MODE2_UIA_ALL_CONTROLS=$($all.Count) MATCHING=$($matches.Count)"
          foreach($node in $matches|Select-Object -First 70){
            $selectPattern=$false
            $invokePattern=$false
            try{$null=$node.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern);$selectPattern=$true}catch{}
            try{$null=$node.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern);$invokePattern=$true}catch{}
            $rect=$node.Current.BoundingRectangle
            Write-Host "MODE2_UIA_TARGET name=$([string]$node.Current.Name) id=$([string]$node.Current.AutomationId) type=$([string]$node.Current.ControlType.ProgrammaticName) enabled=$($node.Current.IsEnabled) selection=$selectPattern invoke=$invokePattern bounds=$([int]$rect.X),$([int]$rect.Y),$([int]$rect.Width),$([int]$rect.Height)"
          }
          Write-Host 'MODE2_UIA_SELECTION_ACTION_PERFORMED=False'
          Write-Host 'MODE2_LAYER_ACCESSIBILITY_PROBE=PASS'
