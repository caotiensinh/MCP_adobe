name: Mode 2 XD live region node read-only acceptance
# 2026-10-14 verify scenegraph on recovered isolated-copy host; read-only only.
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-live-node-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm XD is sole GUI owner and verify live node targeting without writes
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_RUNNER'}
          foreach($app in @('Illustrator','Photoshop')){
            if(@(Get-Process -Name $app -ErrorAction SilentlyContinue).Count -gt 0){throw "MODE2_OTHER_APP_ACTIVE_$app"}
          }
          $xd=@(Get-Process -Name XD -ErrorAction SilentlyContinue | Where-Object {$_.SessionId -eq 1 -and $_.MainWindowHandle -ne 0})
          Write-Host "MODE2_XD_INTERACTIVE_COUNT=$($xd.Count)"
          $source=Join-Path $env:USERPROFILE "Documents\MCPAdobe\MCP_Mode1_Panda_XD_38136531800.xd"
          $copy=Join-Path $env:USERPROFILE "Documents\MCPAdobe\mode2-isolated\Panda_Mode2_Editable_Experiment.xd"
          $expected="3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1"
          foreach($file in @($source,$copy)){if((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected){throw "MODE2_BASELINE_CHANGED"}}
          Write-Host "MODE2_NATIVE_BASELINE_HASH=PASS"
          if($xd.Count -ne 1){throw 'MODE2_XD_NOT_READY_NO_AUTO_LAUNCH'}
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          @'
          import asyncio,hashlib,json,time
          from mcp import Client
          from scripts.export_region_metadata import payload,normalize_xd_canvas_snapshot
          from mcp_adobe.region_targeting import Rect,candidates_in_region
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as client:
                  async def read(cap):
                      response=await asyncio.wait_for(client.call_tool("creative_read",{"application":"xd","capability":cap,"arguments":{}}),timeout=12)
                      return payload(response)
                  health=await read("creative.health")
                  graph_a=await read("creative.scenegraph.list")
                  frame=await read("creative.canvas.frame")
                  graph_b=await read("creative.scenegraph.list")
                  if json.dumps(graph_a,sort_keys=True,default=str)!=json.dumps(graph_b,sort_keys=True,default=str):
                      raise RuntimeError("MODE2_GRAPH_CHANGED_DURING_CAPTURE")
                  metadata=normalize_xd_canvas_snapshot(graph_b,frame)
                  layers=metadata["layers"]
                  matched=[layer for layer in layers if layer.get("bounds") and not layer.get("background")]
                  if not matched: raise RuntimeError("MODE2_NO_TARGETABLE_NODE")
                  first=matched[0]
                  b=first["bounds"]
                  region=Rect(float(b["left"]),float(b["top"]),float(b["right"]),float(b["bottom"]))
                  candidates=candidates_in_region(region,layers)
                  if str(first["id"]) not in [str(c["layer_id"]) for c in candidates]:
                      raise RuntimeError("MODE2_EXPECTED_NODE_NOT_FOUND")
                  digest=hashlib.sha256(json.dumps(graph_b,sort_keys=True,default=str).encode()).hexdigest()
                  print("MODE2_XD_READONLY="+json.dumps({"passed":True,"document_identity":metadata["document_identity"],"nodes":len(layers),"selected_node_id":str(first["id"]),"candidate_count":len(candidates),"ambiguous":len(candidates)>1,"scenegraph_sha256":digest,"preview_frame_verified":False,"writes":0,"region_editor_enabled":False}),flush=True)
          asyncio.run(main())
          '@ | Set-Content -LiteralPath .\mode2_xd_probe.py -Encoding UTF8
          uv run --python 3.12 python .\mode2_xd_probe.py
          if($LASTEXITCODE -ne 0){throw 'MODE2_XD_READONLY_ACCEPTANCE_FAILED'}
