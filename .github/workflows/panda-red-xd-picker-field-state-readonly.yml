name: Panda red XD PickerHost Edit WM_GETTEXT and UIA readback only
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-xd-picker-field-state-readonly.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Check whether previous WM_SETTEXT reached real XD save edit, without any write
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'XD_FIELD_WRONG_DESKTOP'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;using System.Runtime.InteropServices;using System.Text;
          public class XdFieldProbe {
            public delegate bool EnumProc(IntPtr h,IntPtr arg);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb,IntPtr arg);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h,StringBuilder s,int len);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h,out uint pid);
            [DllImport("user32.dll",CharSet=CharSet.Unicode,SetLastError=true)] public static extern IntPtr SendMessage(IntPtr h,uint msg,IntPtr wp,StringBuilder buffer);
            [DllImport("user32.dll",SetLastError=true)] public static extern IntPtr SendMessage(IntPtr h,uint msg,IntPtr wp,IntPtr lp);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h,StringBuilder buffer,int len);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
          }
          '@
          $dir=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $src=Join-Path $dir 'MCP_Mode1_Panda_XD_38136531800.xd'
          $dst=Join-Path $dir 'MCP_KFP4_Red_XD_38205166138.xd'
          $sha='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          if((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -ne $sha){throw 'XD_FIELD_SOURCE_CHANGED'}
          $picker=@(Get-Process -Name PickerHost -ErrorAction SilentlyContinue|Where-Object {$_.SessionId -eq 1})
          if($picker.Count -ne 1){throw 'XD_FIELD_PICKER_NOT_UNIQUE'}
          $id=[uint32]$picker[0].Id
          $dialogs=New-Object System.Collections.Generic.List[System.IntPtr]
          $cb=[XdFieldProbe+EnumProc]{
            param([IntPtr]$h,[IntPtr]$arg)
            $p=[uint32]0;[void][XdFieldProbe]::GetWindowThreadProcessId($h,[ref]$p)
            $cls=New-Object System.Text.StringBuilder(80)
            [void][XdFieldProbe]::GetClassName($h,$cls,80)
            if($p -eq $id -and $cls.ToString() -eq '#32770' -and [XdFieldProbe]::IsWindowVisible($h)){$dialogs.Add($h)}
            return $true
          }
          [void][XdFieldProbe]::EnumWindows($cb,[IntPtr]::Zero)
          if($dialogs.Count -ne 1){throw 'XD_FIELD_DIALOG_NOT_UNIQUE'}
          $dialog=[System.Windows.Automation.AutomationElement]::FromHandle($dialogs[0])
          $all=$dialog.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
          $names=@($all|Where-Object{[string]$_.Current.AutomationId -eq '1001' -and [string]$_.Current.ClassName -eq 'Edit'})
          if($names.Count -ne 1){throw "XD_FIELD_EDIT_NOT_UNIQUE count=$($names.Count)"}
          $el=$names[0];$h=[IntPtr]$el.Current.NativeWindowHandle
          $length=[XdFieldProbe]::SendMessage($h,[uint32]14,[IntPtr]::Zero,[IntPtr]::Zero).ToInt64()
          $wmBuffer=New-Object System.Text.StringBuilder(4096)
          $copied=[XdFieldProbe]::SendMessage($h,[uint32]13,[IntPtr]4096,$wmBuffer).ToInt64()
          $osBuffer=New-Object System.Text.StringBuilder(4096)
          $osCopied=[XdFieldProbe]::GetWindowText($h,$osBuffer,4096)
          $native=$wmBuffer.ToString()
          $expected=$dst
          Write-Host "XD_FIELD_NATIVE_READBACK hwnd=$h wmLength=$length wmCopied=$copied win32Copied=$osCopied wmValueLength=$($native.Length) targetMatch=$($native -eq $expected) uiName=$($el.Current.Name)"
          try{
            $p=$el.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
            $v=[string]$p.Current.Value
            Write-Host "XD_FIELD_UIA_READBACK valueLength=$($v.Length) targetMatch=$($v -eq $expected) value=$v"
          }catch{Write-Host "XD_FIELD_UIA_VALUE_UNAVAILABLE class=$($_.Exception.GetType().Name)"}
          Write-Host "XD_FIELD_TARGET_EXISTS=$(Test-Path -LiteralPath $dst -PathType Leaf)"
          if((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -ne $sha){throw 'XD_FIELD_SOURCE_CHANGED_AFTER_READ'}
          Write-Host 'XD_FIELD_READONLY=PASS'
