name: Red Panda Photoshop live 6-20 native component checkpoint
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-ps-native-6-to-20.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  draw:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 17
    env:
      PYTHONUTF8: '1'
      UV_LINK_MODE: copy
      RED_PS_SOURCE_NAME: MCP_KFP4_Red_PS_38148390967_5shapes.psd
      RED_PS_SOURCE_SHA: 9b87cfef62bf63cb5a7797974285077e69e71fb4a4bfc603b891b4ce41b4a710
      RED_PS_START: '6'
      RED_PS_END: '20'
    steps:
      - uses: actions/checkout@v4
      - name: Assert MRCAO exclusive interactive Photoshop process and verified five-stroke PSD
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [System.Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){
            throw 'RED_PS_20_WRONG_INTERACTIVE_OWNER'
          }
          $ps=@(Get-Process -Name Photoshop -ErrorAction SilentlyContinue|Where-Object{$_.SessionId -eq 1 -and $_.MainWindowHandle -ne 0})
          if($ps.Count -ne 1){throw 'RED_PS_20_GUI_AMBIGUOUS'}
          $source=Join-Path (Join-Path $env:USERPROFILE 'Documents\MCPAdobe') $env:RED_PS_SOURCE_NAME
          if(-not(Test-Path -LiteralPath $source -PathType Leaf)){throw 'RED_PS_20_SOURCE_ABSENT'}
          $checksum=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          if($checksum -ne $env:RED_PS_SOURCE_SHA){throw 'RED_PS_20_SOURCE_SHA_MISMATCH_NO_WRITE'}
          Write-Host "RED_PS_20_SOURCE=PASS pid=$($ps[0].Id) sha256=$checksum size=$((Get-Item $source).Length)"
      - name: Draw 15 independent native Adobe components, readback and save after each
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          uv run --python 3.12 python -m py_compile scripts/panda_red_photoshop_resume_range.py scripts/panda_red_photoshop_vector_fill.py
          if($LASTEXITCODE -ne 0){throw 'RED_PS_20_CODE_SYNTAX_FAILED'}
          uv run --python 3.12 python scripts/panda_red_photoshop_resume_range.py
          if($LASTEXITCODE -ne 0){throw 'RED_PS_20_UNKNOWN_RESULT_CHECKPOINT_SAVED_DO_NOT_RETRY'}
      - name: Persist real current-run Photoshop outputs with SHA check
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $dest=Join-Path $PWD 'red_ps_twenty'
          New-Item -ItemType Directory -Path $dest -Force|Out-Null
          foreach($extension in @('psd','png')){
            $source=Join-Path $root ("MCP_KFP4_Red_PS_{0}_20shapes.{1}" -f $env:GITHUB_RUN_ID,$extension)
            if(Test-Path -LiteralPath $source -PathType Leaf){
              $target=Join-Path $dest ("red_panda_20.{0}" -f $extension)
              Copy-Item -LiteralPath $source -Destination $target -ErrorAction Stop
              $hash=(Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
              if((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash -ne $hash){throw 'RED_PS_20_COPY_SHA_MISMATCH'}
              Write-Host "RED_PS_20_ARTIFACT=$extension bytes=$((Get-Item $source).Length) sha256=$hash"
            }else{Write-Host "RED_PS_20_ARTIFACT_NOT_PRESENT=$extension"}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kung-fu-red-photoshop-native-up-to-20-components
          path: red_ps_twenty/*
          if-no-files-found: warn
          retention-days: 14
