name: Live Adobe XD direct interaction

on:
  push:
    branches: [feat/xd-live-interaction]
    paths:
      - ".github/workflows/targeted-xd-live-interaction.yml"
      - "src/mcp_adobe/xd.py"
      - "src/mcp_adobe/xd_bridge.py"
      - "src/mcp_adobe/server.py"
      - "adobe-xd-plugin/**"
      - "scripts/install_xd_plugin.ps1"
      - "scripts/install_local_host.ps1"
      - "tests/test_xd.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-adobe-xd-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  xd-live:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      - name: Prepare runtime and targeted XD tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $machine=[Environment]::GetEnvironmentVariable('Path','Machine')
          $user=[Environment]::GetEnvironmentVariable('Path','User')
          $env:Path=(@($machine,$user,$env:Path) | Where-Object {$_}) -join ';'
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)) {
            $uvDir=Join-Path $HOME '.local\bin'
            if(Test-Path (Join-Path $uvDir 'uv.exe')) { $env:Path="$uvDir;$env:Path" }
          }
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)){ throw 'uv unavailable' }
          uv sync --python 3.12
          if($LASTEXITCODE -ne 0){ throw "uv sync failed rc=$LASTEXITCODE" }
          uv run python -m unittest tests.test_xd -v
          if($LASTEXITCODE -ne 0){ throw "XD targeted tests failed rc=$LASTEXITCODE" }

      - name: Refresh persistent MCP host for XD
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell -ExecutionPolicy Bypass -File scripts/install_local_host.ps1 -SkipStartupRegistration
          if($LASTEXITCODE -ne 0){ throw "persistent MCP host refresh failed rc=$LASTEXITCODE" }

          $deadline=(Get-Date).AddSeconds(45)
          do {
            Start-Sleep -Milliseconds 500
            $p8787=@(Get-NetTCPConnection -State Listen -LocalPort 8787 -ErrorAction SilentlyContinue)
            $p8765=@(Get-NetTCPConnection -State Listen -LocalPort 8765 -ErrorAction SilentlyContinue)
          } until(($p8787.Count -gt 0 -and $p8765.Count -gt 0) -or (Get-Date) -gt $deadline)

          if($p8787.Count -eq 0){ throw 'MCP gateway port 8787 did not become ready' }
          if($p8765.Count -eq 0){ throw 'XD bridge port 8765 did not become ready' }
          Write-Host 'XD_MCP_GATEWAY_PORT_8787=PASS'
          Write-Host 'XD_MCP_BRIDGE_PORT_8765=PASS'

      - name: Install updated XD plugin
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          powershell -ExecutionPolicy Bypass -File scripts/install_xd_plugin.ps1 -NoReloadHint
          if($LASTEXITCODE -ne 0){ throw "XD plugin install failed rc=$LASTEXITCODE" }

          $packagesRoot=Join-Path $env:LOCALAPPDATA 'Packages'
          $installed=Get-ChildItem -LiteralPath $packagesRoot -Directory -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match 'Adobe.*XD|XD.*Adobe'} |
            ForEach-Object { Join-Path $_.FullName 'LocalState\develop\MCPAdobeBridge\main.js' } |
            Where-Object {Test-Path -LiteralPath $_} |
            Select-Object -First 1
          if(-not $installed){ throw 'installed XD MCP plugin main.js not found' }
          $raw=Get-Content -LiteralPath $installed -Raw
          if(-not $raw.Contains('applyPendingCommand')){ throw 'installed XD plugin does not contain command-context batch apply' }
          if(-not $raw.Contains('mcpAdobeConnect')){ throw 'installed XD plugin does not contain connect command handler' }
          if(-not $raw.Contains('xd-one-click-v2')){ throw 'installed XD plugin does not contain expected bridge build marker' }
          $manifestPath=Join-Path (Split-Path -Parent $installed) 'manifest.json'
          $manifest=Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $connectEntry=@($manifest.uiEntryPoints | Where-Object {$_.commandId -eq 'mcpAdobeConnect'}) | Select-Object -First 1
          $applyEntry=@($manifest.uiEntryPoints | Where-Object {$_.commandId -eq 'mcpAdobeApply'}) | Select-Object -First 1
          $panelEntry=@($manifest.uiEntryPoints | Where-Object {$_.panelId -eq 'mcpAdobeBridge'}) | Select-Object -First 1
          if(-not $connectEntry -or $connectEntry.type -ne 'menu' -or $connectEntry.shortcut.win -ne 'Ctrl+Alt+Shift+9'){ throw 'installed XD manifest missing official connect entry point' }
          if(-not $applyEntry -or $applyEntry.type -ne 'menu' -or $applyEntry.shortcut.win -ne 'Ctrl+Alt+Shift+8'){ throw 'installed XD manifest missing official apply entry point' }
          if(-not $panelEntry -or $panelEntry.type -ne 'panel'){ throw 'installed XD manifest missing official panel entry point' }
          Write-Host "XD_PLUGIN_INSTALL=PASS PATH=$installed"

      - name: Restart XD and load fresh MCP command bridge
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'

          function Get-XdProcess {
            return Get-Process -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ProcessName -match '^(XD|AdobeXD)$' -or
                $_.MainWindowTitle -match 'Adobe XD'
              } |
              Where-Object {$_.MainWindowHandle -ne 0} |
              Select-Object -First 1
          }

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class XdWindowNative {
              [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@

          $xd=Get-XdProcess
          if($xd){
            $title=[string]$xd.MainWindowTitle
            Write-Host "XD_PRE_RESTART PID=$($xd.Id) TITLE=$title SESSION=$($xd.SessionId)"
            if($title -ne 'Adobe XD'){ throw "BLOCKED_SAFE_XD_RESTART: active document/window detected: $title" }
            $oldPid=$xd.Id
            [void]$xd.CloseMainWindow()
            $deadline=(Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $remaining=Get-Process -Id $oldPid -ErrorAction SilentlyContinue
            } until(-not $remaining -or (Get-Date) -gt $deadline)
            if($remaining){ Stop-Process -Id $oldPid -Force -ErrorAction Stop; Start-Sleep -Seconds 2 }
            Write-Host "XD_FRESH_RESTART_CLOSE=PASS OLD_PID=$oldPid"
          }

          $start=Get-StartApps -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -match '^Adobe XD$|Adobe.*XD'} |
            Select-Object -First 1
          if(-not $start){ throw 'Adobe XD start-app registration was not found' }
          Start-Process explorer.exe "shell:AppsFolder\$($start.AppID)"
          $deadline=(Get-Date).AddSeconds(60)
          do {
            Start-Sleep -Seconds 1
            $xd=Get-XdProcess
          } until($xd -or (Get-Date) -gt $deadline)
          if(-not $xd){ throw 'Adobe XD interactive window did not appear after restart' }
          Write-Host "XD_FRESH_RESTART_OPEN=PASS PID=$($xd.Id) TITLE=$($xd.MainWindowTitle)"

          [void][XdWindowNative]::ShowWindow($xd.MainWindowHandle, 9)
          if(-not [XdWindowNative]::SetForegroundWindow($xd.MainWindowHandle)){ throw 'failed to foreground fresh Adobe XD window' }
          Start-Sleep -Milliseconds 700
          [System.Windows.Forms.SendKeys]::SendWait('^n')
          Write-Host 'XD_TEST_DOCUMENT_REQUEST=CTRL+N'
          Start-Sleep -Seconds 4

          [void][XdWindowNative]::SetForegroundWindow($xd.MainWindowHandle)
          Start-Sleep -Milliseconds 500
          [System.Windows.Forms.SendKeys]::SendWait('^%+9')
          Write-Host 'XD_CONNECT_COMMAND_REQUEST=PASS shortcut=Ctrl+Alt+Shift+9 schema=uiEntryPoints'

          $deadline=(Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Milliseconds 500
            $connected=@(Get-NetTCPConnection -State Established -LocalPort 8765 -ErrorAction SilentlyContinue)
          } until($connected.Count -gt 0 -or (Get-Date) -gt $deadline)
          if($connected.Count -eq 0){ throw 'XD connect command did not establish bridge port 8765' }
          Write-Host "XD_COMMAND_CONNECT=PASS connections=$($connected.Count)"

          @'
          import asyncio, json
          from collections.abc import Mapping
          from mcp import Client

          def walk(value):
              yield value
              if isinstance(value, Mapping):
                  for child in value.values(): yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value: yield from walk(child)

          def find_key(value, key):
              for node in walk(value):
                  if isinstance(node, Mapping) and key in node: return node[key]
              return None

          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as client:
                  health = await client.call_tool("creative_read", {"application":"xd","capability":"creative.health","arguments":{}})
                  if health.is_error: raise RuntimeError(f"XD health failed: {health}")
                  payload=health.structured_content
                  print("XD_FRESH_HEALTH="+json.dumps(payload,ensure_ascii=False,default=str),flush=True)
                  if find_key(payload,"bridge_build")!="xd-one-click-v2":
                      raise RuntimeError("XD loaded stale plugin build: "+str(find_key(payload,"bridge_build")))
                  if find_key(payload,"pending_count")!=0:
                      raise RuntimeError("fresh XD plugin retained pending work: "+str(find_key(payload,"pending_count")))
                  doc = await client.call_tool("creative_read", {"application":"xd","capability":"creative.document.info","arguments":{}})
                  if doc.is_error: raise RuntimeError(f"XD document read failed: {doc}")
                  print("XD_FRESH_DOCUMENT="+json.dumps(doc.structured_content,ensure_ascii=False,default=str),flush=True)
                  print("XD_FRESH_PLUGIN_BUILD=PASS",flush=True)
          asyncio.run(main())
          '@ | Set-Content -Path xd_fresh_plugin_check.py -Encoding UTF8
          uv run python xd_fresh_plugin_check.py

      - name: Queue visual composition through MCP live-build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import asyncio
          import json
          from collections.abc import Mapping
          from mcp import Client

          URL = "http://127.0.0.1:8787/mcp"
          STEPS = [
              {
                  "label": "card background",
                  "capability": "creative.shape.rectangle",
                  "arguments": {
                      "name": "MCP XD Card",
                      "width": 520,
                      "height": 320,
                      "x": 120,
                      "y": 100,
                      "fill": "#1F2937",
                  },
              },
              {
                  "label": "accent",
                  "capability": "creative.shape.rectangle",
                  "arguments": {
                      "name": "MCP XD Accent",
                      "width": 520,
                      "height": 18,
                      "x": 120,
                      "y": 100,
                      "fill": "#4F7CFF",
                  },
              },
              {
                  "label": "title",
                  "capability": "creative.text.create",
                  "arguments": {
                      "name": "MCP XD Title",
                      "text": "MCP Adobe XD",
                      "fontSize": 32,
                      "x": 165,
                      "y": 165,
                      "fill": "#FFFFFF",
                  },
              },
              {
                  "label": "subtitle",
                  "capability": "creative.text.create",
                  "arguments": {
                      "name": "MCP XD Subtitle",
                      "text": "One-click approved composition",
                      "fontSize": 18,
                      "x": 165,
                      "y": 220,
                      "fill": "#D1D5DB",
                  },
              },
              {
                  "label": "button",
                  "capability": "creative.shape.rectangle",
                  "arguments": {
                      "name": "MCP XD Button",
                      "width": 210,
                      "height": 58,
                      "x": 165,
                      "y": 300,
                      "fill": "#4F7CFF",
                  },
              },
              {
                  "label": "button label",
                  "capability": "creative.text.create",
                  "arguments": {
                      "name": "MCP XD Button Label",
                      "text": "Apply once",
                      "fontSize": 20,
                      "x": 210,
                      "y": 318,
                      "fill": "#FFFFFF",
                  },
              },
          ]

          def walk(value):
              yield value
              if isinstance(value, Mapping):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from walk(child)

          def find_key(value, key):
              for node in walk(value):
                  if isinstance(node, Mapping) and key in node:
                      return node[key]
              return None

          async def call(client, tool, capability, arguments):
              result = await client.call_tool(
                  tool,
                  {
                      "application": "xd",
                      "capability": capability,
                      "arguments": arguments,
                  },
              )
              print(
                  "XD_MCP_CALL=" +
                  json.dumps(
                      {
                          "tool": tool,
                          "capability": capability,
                          "is_error": result.is_error,
                          "structured": result.structured_content,
                          "content": [str(x) for x in result.content],
                      },
                      ensure_ascii=False,
                      default=str,
                  ),
                  flush=True,
              )
              if result.is_error:
                  raise RuntimeError(f"{tool}/{capability} failed: {result}")
              return result.structured_content

          async def main():
              async with Client(URL) as client:
                  health = await call(client, "creative_read", "creative.health", {})
                  if find_key(health, "bridge") != "connected":
                      raise RuntimeError("XD bridge is not connected")

                  stale_pending = find_key(health, "pending_count")
                  if isinstance(stale_pending, int) and stale_pending > 0:
                      cleared = await call(
                          client,
                          "creative_write",
                          "xd.queue.clear",
                          {"reason": "fresh MCP live-build test"},
                      )
                      print(
                          "XD_STALE_QUEUE_CLEARED=" +
                          json.dumps(
                              {
                                  "before": stale_pending,
                                  "result": cleared,
                              },
                              ensure_ascii=False,
                              default=str,
                          ),
                          flush=True,
                      )
                      health = await call(client, "creative_read", "creative.health", {})
                      if find_key(health, "pending_count") != 0:
                          raise RuntimeError("XD stale pending queue could not be cleared")

                  before = await call(client, "creative_read", "creative.document.info", {})
                  before_count = find_key(before, "rootChildren")
                  if not isinstance(before_count, int):
                      before_count = 0

                  result = await client.call_tool(
                      "creative_live_build",
                      {
                          "application": "xd",
                          "steps": STEPS,
                          "step_delay_ms": 150,
                      },
                  )
                  print(
                      "XD_LIVE_BUILD_QUEUE=" +
                      json.dumps(
                          {
                              "is_error": result.is_error,
                              "structured": result.structured_content,
                              "content": [str(x) for x in result.content],
                          },
                          ensure_ascii=False,
                          default=str,
                      ),
                      flush=True,
                  )
                  if result.is_error:
                      raise RuntimeError(f"XD creative_live_build queue failed: {result}")
                  payload = result.structured_content
                  if not isinstance(payload, Mapping):
                      raise RuntimeError("XD live-build returned no structured payload")
                  if payload.get("steps_completed") != len(STEPS):
                      raise RuntimeError(
                          f"XD queue incomplete: {payload.get('steps_completed')}/{len(STEPS)}"
                      )

                  queued_health = await call(client, "creative_read", "creative.health", {})
                  pending = find_key(queued_health, "pending_count")
                  if pending != len(STEPS):
                      raise RuntimeError(
                          f"XD pending approval count mismatch: expected={len(STEPS)} actual={pending}"
                      )

                  Path = __import__("pathlib").Path
                  Path("xd_one_click_state.json").write_text(
                      json.dumps(
                          {
                              "before_rootChildren": before_count,
                              "expected_created": len(STEPS),
                              "pending": pending,
                          }
                      ),
                      encoding="utf-8",
                  )
                  print(
                      "XD_ONE_CLICK_QUEUE=PASS " +
                      json.dumps(
                          {
                              "steps": len(STEPS),
                              "pending_count": pending,
                              "before_rootChildren": before_count,
                          },
                          ensure_ascii=False,
                      ),
                      flush=True,
                  )

          asyncio.run(main())
          '@ | Set-Content -Path xd_one_click_queue.py -Encoding UTF8
          uv run python xd_one_click_queue.py

      - name: Apply queued XD composition with one command approval
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(-not (Test-Path 'xd_one_click_state.json')){ throw 'XD one-click state file missing' }
          $xd=Get-Process -ErrorAction SilentlyContinue |
            Where-Object {($_.ProcessName -match '^(XD|AdobeXD)$' -or $_.MainWindowTitle -match 'Adobe XD') -and $_.MainWindowHandle -ne 0} |
            Select-Object -First 1
          if(-not $xd){ throw 'Adobe XD window unavailable for approval command' }

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class XdApplyNative {
              [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@
          [void][XdApplyNative]::ShowWindow($xd.MainWindowHandle, 9)
          if(-not [XdApplyNative]::SetForegroundWindow($xd.MainWindowHandle)){ throw 'failed to foreground XD for approval command' }
          Start-Sleep -Milliseconds 500

          [System.Windows.Forms.SendKeys]::SendWait('^%+8')
          Write-Host 'XD_ONE_CLICK_APPROVAL_REQUEST=PASS shortcut=Ctrl+Alt+Shift+8 schema=uiEntryPoints'
          Start-Sleep -Seconds 3

      - name: Verify applied XD composition through MCP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import asyncio
          import json
          from pathlib import Path
          from collections.abc import Mapping
          from mcp import Client

          URL = "http://127.0.0.1:8787/mcp"

          def walk(value):
              yield value
              if isinstance(value, Mapping):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from walk(child)

          def find_key(value, key):
              for node in walk(value):
                  if isinstance(node, Mapping) and key in node:
                      return node[key]
              return None

          async def call(client, capability):
              result = await client.call_tool(
                  "creative_read",
                  {
                      "application": "xd",
                      "capability": capability,
                      "arguments": {},
                  },
              )
              if result.is_error:
                  raise RuntimeError(f"{capability} failed: {result}")
              print(
                  "XD_VERIFY_CALL=" +
                  json.dumps(result.structured_content, ensure_ascii=False, default=str),
                  flush=True,
              )
              return result.structured_content

          async def main():
              state = json.loads(Path("xd_one_click_state.json").read_text(encoding="utf-8"))
              async with Client(URL) as client:
                  health = await call(client, "creative.health")
                  pending = find_key(health, "pending_count")
                  if pending != 0:
                      raise RuntimeError(f"XD approval did not drain pending queue: {pending}")

                  document = await call(client, "creative.document.info")
                  after = find_key(document, "rootChildren")
                  before = int(state["before_rootChildren"])
                  expected = int(state["expected_created"])
                  if not isinstance(after, int) or after < before + expected:
                      raise RuntimeError(
                          f"XD composition read-back mismatch: before={before} expected+={expected} after={after}"
                      )
                  print(
                      "XD_ONE_CLICK_COMPOSITION=PASS " +
                      json.dumps(
                          {
                              "before_rootChildren": before,
                              "after_rootChildren": after,
                              "created": expected,
                              "pending_count": pending,
                          },
                          ensure_ascii=False,
                      ),
                      flush=True,
                  )

          asyncio.run(main())
          '@ | Set-Content -Path xd_one_click_verify.py -Encoding UTF8
          uv run python xd_one_click_verify.py

      - name: Verify XD remains interactive
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $xd=Get-Process -ErrorAction SilentlyContinue |
            Where-Object {
              ($_.ProcessName -match '^(XD|AdobeXD)$' -or $_.MainWindowTitle -match 'Adobe XD') -and
              $_.MainWindowHandle -ne 0
            } |
            Select-Object -First 1
          if(-not $xd){ throw 'Adobe XD disappeared after direct MCP write' }
          $ws=@(Get-NetTCPConnection -State Established -LocalPort 8765 -ErrorAction SilentlyContinue)
          if($ws.Count -eq 0){ throw 'XD MCP bridge disconnected after direct write' }
          Write-Host "XD_DIRECT_WINDOW=PASS PID=$($xd.Id) TITLE=$($xd.MainWindowTitle) WS=$($ws.Count)"
