name: Panda red XD inspect exact artboard insertion and Layers UI read only
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-xd-artboard-insertion-ui-readonly.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Enumerate only target red editor Layers and artboard controls no click
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'XD_ARTBOARD_UI_WRONG_SESSION'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          foreach($pair in @(
            @('MCP_Mode1_Panda_XD_38136531800.xd','3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'),
            @('MCP_KFP4_Red_XD_38205166138.xd','58966788CF369885C2395CE217D6E0443ED57BCD7F40BD550B2F3A24C2B5B831'))) {
            if((Get-FileHash -LiteralPath (Join-Path $root $pair[0]) -Algorithm SHA256).Hash -ne $pair[1]){throw 'XD_ARTBOARD_UI_NATIVE_CHANGED'}
          }
          $desktop=[System.Windows.Automation.AutomationElement]::RootElement
          $top=$desktop.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $target=@($top|Where-Object{[string]$_.Current.Name -match '^MCP_KFP4_Red_XD_38205166138.*Adobe XD$' -and [string]$_.Current.ClassName -eq 'ApplicationFrameWindow'})
          $picker=@(Get-Process -Name PickerHost -ErrorAction SilentlyContinue|Where-Object{$_.SessionId -eq 1})
          if($target.Count -ne 1 -or $picker.Count -ne 0){throw 'XD_ARTBOARD_UI_WINDOW_NOT_EXACT'}
          $children=$target[0].FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $cores=@($children|Where-Object{[string]$_.Current.ClassName -eq 'Windows.UI.Core.CoreWindow'})
          if($cores.Count -ne 1){throw 'XD_ARTBOARD_UI_CORE_NOT_UNIQUE'}
          $core=$cores[0]
          $nodes=$core.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
          Write-Host "XD_ARTBOARD_UI_NODES=$($nodes.Count)"
          $printed=0
          foreach($node in $nodes){
            $name=[string]$node.Current.Name
            $id=[string]$node.Current.AutomationId
            $type=[string]$node.Current.ControlType.ProgrammaticName
            $candidate=($name -match 'SPRK_default|custom|Artboard|Layers|Design|Canvas|layer|SPR' -or
                 $id -match 'artboard|layer|canvas|hierarchy|design|document')
            if($candidate -or ($type -match 'TreeItem|ListItem|TabItem' -and $printed -lt 100)){
              $bounds=$node.Current.BoundingRectangle
              Write-Host "XD_ARTBOARD_UI_NODE type=$type name=$($name.Substring(0,[Math]::Min(100,$name.Length))) id=$id enabled=$($node.Current.IsEnabled) bounds=$([Math]::Round($bounds.Left)),$([Math]::Round($bounds.Top)),$([Math]::Round($bounds.Width)),$([Math]::Round($bounds.Height))"
              $printed++
              if($printed -ge 110){break}
            }
          }
          Write-Host "XD_ARTBOARD_UI_CANDIDATES=$printed"
          Write-Host 'XD_ARTBOARD_UI_READONLY_DONE=PASS'
      - name: Capture actual XD selection parent and artboard read-only
        shell: powershell
        env:
          UV_LINK_MODE: copy
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          $py=Join-Path $env:RUNNER_TEMP 'panda_red_selection_info.py'
          @'
          import asyncio,json
          from mcp import Client
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  for cap in ("creative.health","creative.selection.get","creative.document.info","creative.scenegraph.list"):
                      r=await asyncio.wait_for(c.call_tool("creative_read",{"application":"xd","capability":cap,"arguments":{}}),timeout=10)
                      p=r.structured_content or {}
                      data=p.get("result") or {}
                      print("XD_ARTBOARD_MCP_READ="+json.dumps({"capability":cap,"is_error":r.is_error,"ok":p.get("ok"),"result":data},ensure_ascii=False,default=str)[:9000],flush=True)
                      if r.is_error or p.get("ok") is not True:raise RuntimeError("XD_ARTBOARD_MCP_FAILED "+cap)
          asyncio.run(main())
          '@|Set-Content -LiteralPath $py -Encoding UTF8
          uv run --no-project --with 'mcp>=2,<3' --python 3.12 python $py
          if($LASTEXITCODE -ne 0){throw 'XD_ARTBOARD_MCP_CLIENT_FAILED'}
