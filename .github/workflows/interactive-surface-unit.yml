name: Interactive surface unit validation

on:
  push:
    branches:
      - "feat/**"
    paths:
      - "src/mcp_adobe/**"
      - "tests/test_photoshop.py"
      - "tests/test_illustrator.py"
      - "tests/test_xd.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/interactive-surface-unit.yml"
  pull_request:
    paths:
      - "src/mcp_adobe/**"
      - "tests/test_photoshop.py"
      - "tests/test_illustrator.py"
      - "tests/test_xd.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/interactive-surface-unit.yml"

permissions:
  contents: read

concurrency:
  group: interactive-surface-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  targeted-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
      - name: Sync runtime
        run: uv sync --python 3.12
      - name: Targeted interaction adapter tests
        run: uv run python -m unittest tests.test_photoshop tests.test_illustrator tests.test_xd -v
