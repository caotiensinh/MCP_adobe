name: Mode1 PANDA tri-app runtime blocker diagnosis
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mode1-panda-ps-ai-xd-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: panda-triapp-diagnostics-read-only
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read-only Adobe PS AI XD process, port and coordinator statuses
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Output "PANDA_HOST=$env:COMPUTERNAME SESSION=$([System.Diagnostics.Process]::GetCurrentProcess().SessionId)"
          foreach($name in @('Photoshop.exe','Illustrator.exe','XD.exe','Adobe XD.exe')){
            $processes=@(Get-CimInstance Win32_Process -Filter "Name='$name'" -ErrorAction SilentlyContinue)
            foreach($p in $processes){Write-Output "PANDA_APP_PROCESS name=$($p.Name) pid=$($p.ProcessId) session=$($p.SessionId)"}
            if($processes.Count -eq 0){Write-Output "PANDA_APP_ABSENT=$name"}
          }
          foreach($port in @(8787,8081,8765)){
            $p=@(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue)
            Write-Output "PANDA_PORT port=$port listeners=$($p.Count)"
          }
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object {$_}) -join ';'
          uv sync --python 3.12
          if($LASTEXITCODE -ne 0){throw 'PANDA_DEPENDENCY_SETUP_FAILED'}
          @'
          import asyncio,json
          from mcp import Client
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  for app in ("illustrator","photoshop","xd"):
                      cap="creative.health"
                      args={"probe":False,"timeout":5} if app=="illustrator" else {}
                      try:
                          r=await c.call_tool("creative_read",{"application":app,"capability":cap,"arguments":args})
                          p=r.structured_content
                          print("PANDA_APP_HEALTH="+json.dumps({"application":app,"is_error":r.is_error,
                              "payload":p},ensure_ascii=False,default=str)[:8000],flush=True)
                      except Exception as e:
                          print("PANDA_APP_HEALTH_EXCEPTION="+json.dumps({"application":app,"type":type(e).__name__,"error":str(e)[:300]}),flush=True)
                  print("PANDA_READONLY_DIAG=PASS",flush=True)
          asyncio.run(main())
          '@ | Set-Content -LiteralPath panda_preflight.py -Encoding UTF8
          uv run python panda_preflight.py
          if($LASTEXITCODE -ne 0){throw 'PANDA_DIAG_FAILED'}
