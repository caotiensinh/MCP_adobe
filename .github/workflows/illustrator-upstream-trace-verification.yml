name: Illustrator upstream trace verification
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths:
      - "src/mcp_adobe/illustrator_upstream_trace.py"
      - "tests/test_illustrator_upstream_trace.py"
      - ".github/workflows/illustrator-upstream-trace-verification.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run --with pytest pytest -q tests/test_illustrator_upstream_trace.py
