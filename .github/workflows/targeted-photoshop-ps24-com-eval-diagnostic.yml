name: Targeted Photoshop 24 COM evalFile diagnostic

on:
  pull_request:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-photoshop-ps24-com-eval-diagnostic.yml"

concurrency:
  group: targeted-photoshop-ps24-com-eval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Diagnose COM DoJavaScript and evalFile
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Win32ComReady {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
          }
          '@

          $ps=Get-Process -Name Photoshop -ErrorAction SilentlyContinue |
            Where-Object {$_.Path -and $_.MainWindowHandle -ne 0} |
            Select-Object -First 1
          if(-not $ps){throw 'Photoshop is not running interactively'}
          $version=([regex]::Match((Get-Item $ps.Path).VersionInfo.ProductVersion,'\d+\.\d+(?:\.\d+)?')).Value
          Write-Host "PHOTOSHOP_VERSION=$version PID=$($ps.Id) SESSION=$($ps.SessionId)"
          if(-not $version.StartsWith('24.')){throw "Expected Photoshop 24.x, got $version"}
          if($ps.SessionId -ne 1){throw "Expected Session 1, got $($ps.SessionId)"}

          # The previous probe returned 0x8001010A (RPC_E_SERVERCALL_RETRYLATER),
          # which means the Photoshop COM server is busy. The UIA workflow opens
          # Preferences on every PR sync, so detect and dismiss only that known modal
          # before touching COM. Verify it is actually gone; do not blindly retry.
          $root=[System.Windows.Automation.AutomationElement]::RootElement
          $pidCond=New-Object System.Windows.Automation.PropertyCondition(
            [System.Windows.Automation.AutomationElement]::ProcessIdProperty,$ps.Id)

          function Get-PhotoshopWindows {
            $all=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,$pidCond)
            $items=@()
            for($i=0;$i -lt $all.Count;$i++){
              $e=$all.Item($i)
              if($e.Current.ControlType -eq [System.Windows.Automation.ControlType]::Window){$items += $e}
            }
            return $items
          }

          $windows=Get-PhotoshopWindows
          foreach($w in $windows){Write-Host "PS_WINDOW_BEFORE name='$($w.Current.Name)' hwnd=$($w.Current.NativeWindowHandle) class='$($w.Current.ClassName)'"}
          $prefs=@($windows | Where-Object {$_.Current.Name -eq 'Preferences'})
          if($prefs.Count -gt 0){
            Write-Host "PHOTOSHOP_PREFERENCES_MODAL_FOUND=$($prefs.Count)"
            foreach($pref in $prefs){
              $closed=$false
              $pattern=$null
              if($pref.TryGetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern,[ref]$pattern)){
                try {$pattern.Close();$closed=$true;Write-Host 'PREFERENCES_CLOSE_METHOD=WindowPattern.Close'} catch {Write-Host "PREFERENCES_WINDOWPATTERN_CLOSE_ERROR=$($_.Exception.Message)"}
              }
              if(-not $closed){
                [Win32ComReady]::SetForegroundWindow([IntPtr]$pref.Current.NativeWindowHandle) | Out-Null
                Start-Sleep -Milliseconds 300
                [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
                Write-Host 'PREFERENCES_CLOSE_METHOD=Escape'
              }
            }
            $deadline=[DateTime]::UtcNow.AddSeconds(8)
            do {
              Start-Sleep -Milliseconds 400
              $still=@(Get-PhotoshopWindows | Where-Object {$_.Current.Name -eq 'Preferences'})
              if($still.Count -eq 0){break}
            } while([DateTime]::UtcNow -lt $deadline)
            if($still.Count -gt 0){throw 'Photoshop Preferences modal is still open after targeted close'}
            Write-Host 'PHOTOSHOP_PREFERENCES_MODAL_CLOSED=PASS'
          } else {
            Write-Host 'PHOTOSHOP_PREFERENCES_MODAL_FOUND=0'
          }

          $windowsAfter=Get-PhotoshopWindows
          foreach($w in $windowsAfter){Write-Host "PS_WINDOW_AFTER name='$($w.Current.Name)' hwnd=$($w.Current.NativeWindowHandle) class='$($w.Current.ClassName)'"}
          Start-Sleep -Seconds 1

          $out=Join-Path $env:RUNNER_TEMP 'mcp-adobe-com-eval-diagnostic'
          New-Item -ItemType Directory -Force $out | Out-Null
          $jsx=Join-Path $out 'probe.jsx'
          $vbs=Join-Path $out 'probe.vbs'
          $resultFile=Join-Path $out 'result.txt'
          Remove-Item $jsx,$vbs,$resultFile -Force -ErrorAction SilentlyContinue

          $jsxBody=@'
          (function () {
            try {
              var v = app.version;
              var n = app.name;
              var d = app.documents.add(320, 240, 72, 'MCP Adobe Eval Diagnostic');
              return 'JSXOK|' + v + '|' + n + '|' + d.name;
            } catch (e) {
              return 'JSXFAIL|' + e.toString();
            }
          })();
          '@
          [IO.File]::WriteAllText($jsx,[char]0xFEFF + $jsxBody,(New-Object Text.UTF8Encoding($false)))

          $vbsBody=@'
          On Error Resume Next
          Dim shell, jsxPath, outFile, app, inlineResult, evalResult, jsxForJs, wrapper, errNum, errDesc
          Set shell = CreateObject("WScript.Shell")
          jsxPath = shell.Environment("PROCESS")("PSMCP_JSX")
          outFile = shell.Environment("PROCESS")("PSMCP_RESULT")

          Sub WriteResult(text)
              Dim fso, stream
              Err.Clear
              Set fso = CreateObject("Scripting.FileSystemObject")
              Set stream = fso.CreateTextFile(outFile, True, True)
              stream.Write text
              stream.Close
          End Sub

          Err.Clear
          Set app = CreateObject("Photoshop.Application")
          If Err.Number <> 0 Then
              WriteResult "COM_CONNECT_FAIL|NUMBER=" & Err.Number & "|DESCRIPTION=" & Err.Description
              WScript.Quit 1
          End If

          Err.Clear
          inlineResult = app.DoJavaScript("app.version + '|' + app.name")
          If Err.Number <> 0 Then
              WriteResult "INLINE_FAIL|NUMBER=" & Err.Number & "|DESCRIPTION=" & Err.Description
              WScript.Quit 1
          End If

          jsxForJs = Replace(jsxPath, "\", "\\")
          jsxForJs = Replace(jsxForJs, "'", "\'")
          wrapper = "try { var r = $.evalFile('" & jsxForJs & "'); 'EVALOK|' + r; } catch(e) { 'EVALFAIL|' + e.toString() + '|LINE=' + e.line + '|NUMBER=' + e.number; }"
          Err.Clear
          evalResult = app.DoJavaScript(wrapper)
          errNum = Err.Number
          errDesc = Err.Description
          If errNum <> 0 Then
              WriteResult "DOJAVASCRIPT_FAIL|INLINE=" & inlineResult & "|NUMBER=" & errNum & "|DESCRIPTION=" & errDesc
              WScript.Quit 1
          End If

          WriteResult "INLINEOK|" & inlineResult & "|" & evalResult
          '@
          [IO.File]::WriteAllText($vbs,$vbsBody,(New-Object Text.UTF8Encoding($false)))
          $env:PSMCP_JSX=$jsx
          $env:PSMCP_RESULT=$resultFile
          & cscript.exe //nologo $vbs
          $rc=$LASTEXITCODE
          $result=if(Test-Path $resultFile){Get-Content $resultFile -Raw}else{'RESULT_FILE_MISSING'}
          Write-Host "CSCRIPT_RC=$rc"
          Write-Host "DIAGNOSTIC_RESULT=$result"
          if($result -notmatch '^INLINEOK\|24\.0\.0\|Adobe Photoshop\|EVALOK\|JSXOK\|24\.0\.0\|Adobe Photoshop\|'){
            throw "Photoshop COM eval diagnostic failed: $result"
          }
          Write-Host 'PHOTOSHOP_COM_INLINE=PASS'
          Write-Host 'PHOTOSHOP_COM_EVALFILE=PASS'
