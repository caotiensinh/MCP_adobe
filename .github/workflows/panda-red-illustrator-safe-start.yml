name: Red Panda Illustrator safe desktop launch and CEP readiness
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-illustrator-safe-start.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  launch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - name: Launch only installed Illustrator GUI without terminating XD or Photoshop
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO'){throw 'RED_AI_WRONG_HOST'}
          if([System.Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'RED_AI_WRONG_SESSION'}
          $running=@(Get-Process -Name Illustrator -ErrorAction SilentlyContinue)
          if($running.Count -gt 0 -and @($running|Where-Object{$_.SessionId -eq 1 -and $_.MainWindowHandle -ne 0}).Count -eq 0){
            throw 'RED_AI_PROCESS_HEADLESS_STOP_NO_DUPLICATE_LAUNCH'
          }
          $inventory=@(& "$PWD/scripts/adobe_inventory.ps1")
          $app=@($inventory|Where-Object {$_.PSObject.Properties.Name -contains 'Illustrator'}|Select-Object -Last 1)
          if($app.Count -ne 1){throw 'RED_AI_INVENTORY_UNAVAILABLE'}
          $exe=[string]$app[0].Illustrator
          if(-not $exe -or -not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'RED_AI_EXECUTABLE_NOT_FOUND'}
          Write-Host "RED_AI_EXE_PRESENT=PASS path=$exe"
          if($running.Count -eq 0){
            $originalTracking=$env:RUNNER_TRACKING_ID
            try{
              $env:RUNNER_TRACKING_ID=''
              $proc=Start-Process -FilePath $exe -PassThru
            }finally{$env:RUNNER_TRACKING_ID=$originalTracking}
            Write-Host "RED_AI_START_REQUESTED_ONCE=PASS pid=$($proc.Id)"
          }else{Write-Host "RED_AI_ALREADY_RUNNING=PASS"}
          $deadline=(Get-Date).AddSeconds(150)
          do{
            $live=@(Get-Process -Name Illustrator -ErrorAction SilentlyContinue|Where-Object {$_.SessionId -eq 1 -and $_.MainWindowHandle -ne 0})
            if($live.Count -eq 1){break}
            if($live.Count -gt 1){throw 'RED_AI_MULTIPLE_WINDOWS_AMBIGUOUS'}
            Start-Sleep -Seconds 2
          }until((Get-Date)-ge $deadline)
          if($live.Count -ne 1){throw 'RED_AI_GUI_TIMEOUT_NO_RELAUNCH'}
          Write-Host "RED_AI_INTERACTIVE_WINDOW=PASS pid=$($live[0].Id) title=$($live[0].MainWindowTitle)"
      - name: Read actual Illustrator CEP panel, callback and queued operations without changes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          @'
          import asyncio,json,time
          from mcp import Client
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  r=await asyncio.wait_for(c.call_tool("creative_read",{
                      "application":"illustrator","capability":"creative.health",
                      "arguments":{"probe":False,"timeout":6}}),timeout=12)
                  p=r.structured_content or {}
                  if r.is_error or p.get("ok") is not True:
                      raise RuntimeError("RED_AI_HEALTH_MCP_ERROR "+str(r.content)[:300])
                  data=(p.get("result") or {}).get("connection",{}).get("data",{})
                  panel=(data.get("layers") or {}).get("panel") or {}
                  execu=data.get("execution") or {}
                  summary={"panel":panel,"execution":execu,"blockedAt":data.get("blockedAt"),
                      "ready":data.get("ready"),"recovery":data.get("recovery")}
                  print("RED_AI_LIVE_CEP_DIAG="+json.dumps(summary,default=str),flush=True)
                  if panel.get("status")!="ok" or panel.get("busy") is True or execu.get("unresolvedJobs"):
                      raise RuntimeError("RED_AI_PANEL_NOT_READY_NO_CANVAS_WRITES")
                  print("RED_AI_CEP_PANEL_IDLE=PASS",flush=True)
          asyncio.run(main())
          '@ | Set-Content -LiteralPath .\red_ai_panel_probe.py -Encoding UTF8
          uv run --python 3.12 python .\red_ai_panel_probe.py
          if($LASTEXITCODE -ne 0){throw 'RED_AI_CEP_NOT_READY_INSPECT_DIAG_NOT_RESTART'}
