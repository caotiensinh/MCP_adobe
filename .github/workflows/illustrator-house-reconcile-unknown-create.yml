name: Illustrator reconcile uncertain house create job
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/illustrator-house-reconcile-unknown-create.yml"]
permissions:
  contents: read
concurrency:
  group: illustrator-desktop-exclusive
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile original job token without replay or filesystem mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object {$_}) -join ';'
          uv sync --python 3.12
          @'
          import asyncio,json
          from mcp import Client
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  r=await c.call_tool("illustrator_job_status",{"params":{"jobId":"job_40275b48de5d"}})
                  print("CREATE_JOB_STATUS="+json.dumps({"error":r.is_error,"payload":r.structured_content,"text":str(r.content)[:500]},default=str)[:7000],flush=True)
                  if r.is_error:
                      print("CREATE_JOB_RECONCILIATION=UNKNOWN",flush=True)
                  else:
                      print("CREATE_JOB_RECONCILIATION=RECEIVED",flush=True)
          asyncio.run(main())
          '@ | Set-Content -LiteralPath reconcile_create.py -Encoding UTF8
          uv run python reconcile_create.py
