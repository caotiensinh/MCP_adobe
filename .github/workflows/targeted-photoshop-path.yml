name: Targeted Photoshop custom path override

on:
  push:
    branches: [fix/photoshop-path-override]
    paths:
      - "src/mcp_adobe/mcp_stdio.py"
      - "scripts/real_e2e.py"
      - "tests/test_transport.py"
      - "tests/test_real_e2e.py"
      - ".github/workflows/targeted-photoshop-path.yml"

concurrency:
  group: targeted-photoshop-path-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targeted:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Install
        shell: powershell
        run: |
          uv python install 3.12
          uv sync --python 3.12
      - name: Targeted regression tests
        shell: powershell
        run: |
          uv run python -m unittest tests.test_transport tests.test_real_e2e -v
      - name: Verify launcher injects real running Photoshop path
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          uv run python -c "from mcp_adobe.mcp_stdio import photoshop_stdio_config; c=photoshop_stdio_config(); p=c.env.get('PHOTOSHOP_PATH'); print('PHOTOSHOP_PATH='+str(p)); assert p and p.lower().endswith('photoshop.exe')"
      - name: Diagnose Photoshop COM registration
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Host '=== Photoshop COM ProgIDs in HKCR ==='
          Get-ChildItem 'Registry::HKEY_CLASSES_ROOT' -ErrorAction SilentlyContinue |
            Where-Object { $_.PSChildName -like 'Photoshop.Application*' } |
            ForEach-Object {
              Write-Host "PROGID=$($_.PSChildName)"
              $clsidKey = Join-Path $_.PSPath 'CLSID'
              if (Test-Path $clsidKey) {
                $clsid=(Get-ItemProperty $clsidKey -ErrorAction SilentlyContinue).'(default)'
                Write-Host "CLSID=$clsid"
              }
            }
          try {
            $app=New-Object -ComObject Photoshop.Application -ErrorAction Stop
            Write-Host "COM_ACTIVATION=PASS"
            try { Write-Host "COM_VERSION=$($app.Version)" } catch {}
            [Runtime.InteropServices.Marshal]::FinalReleaseComObject($app) | Out-Null
          } catch {
            Write-Host "COM_ACTIVATION=FAIL"
            Write-Host "COM_HRESULT=0x$('{0:X8}' -f ($_.Exception.HResult -band 0xffffffffL))"
            Write-Host "COM_ERROR=$($_.Exception.Message)"
          }
      - name: Probe direct Photoshop JSX execution without COM
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $process=Get-Process -Name Photoshop -ErrorAction Stop | Where-Object {$_.Path} | Select-Object -First 1
          if(-not $process){throw 'Photoshop process/path unavailable'}
          $photoshop=$process.Path
          $marker=Join-Path $env:RUNNER_TEMP 'mcp_adobe_photoshop_direct_jsx_marker.txt'
          $jsx=Join-Path $env:RUNNER_TEMP 'mcp_adobe_photoshop_direct_jsx_probe.jsx'
          Remove-Item -Force $marker,$jsx -ErrorAction SilentlyContinue
          $markerJs=$marker.Replace('\','/')
          $script="var f=new File('$markerJs'); if(!f.open('w')){throw new Error('open marker failed');} f.write('PASS:'+app.version); f.close();"
          [IO.File]::WriteAllText($jsx,$script,(New-Object Text.UTF8Encoding($false)))
          Write-Host "PHOTOSHOP=$photoshop"
          Write-Host "JSX=$jsx"
          Start-Process -FilePath $photoshop -ArgumentList @('-r',$jsx) | Out-Null
          $deadline=[DateTime]::UtcNow.AddSeconds(30)
          while(-not (Test-Path -LiteralPath $marker) -and [DateTime]::UtcNow -lt $deadline){Start-Sleep -Milliseconds 500}
          if(-not (Test-Path -LiteralPath $marker)){throw 'Photoshop -r JSX probe did not create marker within 30 seconds'}
          $value=Get-Content -LiteralPath $marker -Raw
          Write-Host "DIRECT_JSX_RESULT=$value"
          if($value -notmatch '^PASS:'){throw "Unexpected JSX marker: $value"}
      - name: Verify upstream subprocess starts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          uv run python -c "from mcp_adobe.mcp_stdio import McpSubprocessToolClient,photoshop_stdio_config; c=McpSubprocessToolClient(photoshop_stdio_config()); c.start(); print('tool_count='+str(len(c.tool_names))); c.close()"
      - name: Ensure Illustrator is running
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Process -Name Illustrator -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          if($p){Write-Host "Illustrator already running: $($p.Path)"; exit 0}
          $shell=New-Object -ComObject WScript.Shell
          $roots=@((Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'),(Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'))
          $target=$null
          foreach($root in $roots){
            if(-not (Test-Path -LiteralPath $root)){continue}
            foreach($lnk in @(Get-ChildItem -LiteralPath $root -Recurse -Filter '*.lnk' -File -ErrorAction SilentlyContinue | Where-Object {$_.Name -match 'Illustrator'})){
              $candidate=$shell.CreateShortcut($lnk.FullName).TargetPath
              if($candidate -and (Test-Path -LiteralPath $candidate -PathType Leaf)){$target=$candidate;break}
            }
            if($target){break}
          }
          if(-not $target){throw 'Illustrator executable not found via running process or Start Menu shortcut'}
          Write-Host "Starting Illustrator: $target"
          Start-Process -FilePath $target | Out-Null
          $deadline=[DateTime]::UtcNow.AddSeconds(30)
          do{Start-Sleep -Milliseconds 500;$p=Get-Process -Name Illustrator -ErrorAction SilentlyContinue | Select-Object -First 1}while(-not $p -and [DateTime]::UtcNow -lt $deadline)
          if(-not $p){throw 'Illustrator did not start within 30 seconds'}
          Start-Sleep -Seconds 5
      - name: Diagnose Illustrator COM registration
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Host '=== Illustrator COM ProgIDs in HKCR ==='
          Get-ChildItem 'Registry::HKEY_CLASSES_ROOT' -ErrorAction SilentlyContinue |
            Where-Object { $_.PSChildName -like 'Illustrator.Application*' } |
            ForEach-Object { Write-Host "PROGID=$($_.PSChildName)" }
          try {
            $app=New-Object -ComObject Illustrator.Application -ErrorAction Stop
            Write-Host 'ILLUSTRATOR_COM_ACTIVATION=PASS'
            try { Write-Host "ILLUSTRATOR_COM_VERSION=$($app.Version)" } catch {}
            [Runtime.InteropServices.Marshal]::FinalReleaseComObject($app) | Out-Null
          } catch {
            Write-Host 'ILLUSTRATOR_COM_ACTIVATION=FAIL'
            Write-Host "ILLUSTRATOR_COM_HRESULT=0x$('{0:X8}' -f ($_.Exception.HResult -band 0xffffffffL))"
            Write-Host "ILLUSTRATOR_COM_ERROR=$($_.Exception.Message)"
          }
      - name: Illustrator live read E2E
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          uv run python scripts/real_e2e.py illustrator
      - name: Illustrator live write E2E
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'mcp_adobe_targeted\illustrator'
          if(Test-Path $out){Remove-Item -Recurse -Force $out}
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          uv run python scripts/real_e2e.py illustrator --write --output-dir $out
          $files=@(Get-ChildItem -Path $out -File)
          $files | Select-Object Name,Length,LastWriteTime
          if($files.Count -eq 0){throw 'Illustrator write E2E produced no output files'}
      - name: Photoshop live read E2E
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          uv run python scripts/real_e2e.py photoshop
