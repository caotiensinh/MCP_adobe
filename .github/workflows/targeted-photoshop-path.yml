name: Targeted Photoshop custom path override

on:
  push:
    branches: [fix/photoshop-path-override]
    paths:
      - "src/mcp_adobe/mcp_stdio.py"
      - "scripts/real_e2e.py"
      - "tests/test_transport.py"
      - "tests/test_real_e2e.py"
      - ".github/workflows/targeted-photoshop-path.yml"

permissions:
  contents: read

jobs:
  targeted:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Install
        shell: powershell
        run: |
          uv python install 3.12
          uv sync --python 3.12
      - name: Targeted regression tests
        shell: powershell
        run: |
          uv run python -m unittest tests.test_transport tests.test_real_e2e -v
      - name: Verify launcher injects real running Photoshop path
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          uv run python -c "from mcp_adobe.mcp_stdio import photoshop_stdio_config; c=photoshop_stdio_config(); p=c.env.get('PHOTOSHOP_PATH'); print('PHOTOSHOP_PATH='+str(p)); assert p and p.lower().endswith('photoshop.exe')"
      - name: Diagnose Photoshop COM registration
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Host '=== Photoshop COM ProgIDs in HKCR ==='
          Get-ChildItem 'Registry::HKEY_CLASSES_ROOT' -ErrorAction SilentlyContinue |
            Where-Object { $_.PSChildName -like 'Photoshop.Application*' } |
            ForEach-Object {
              Write-Host "PROGID=$($_.PSChildName)"
              Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue | Format-List
              $clsidKey = Join-Path $_.PSPath 'CLSID'
              if (Test-Path $clsidKey) {
                $clsid=(Get-ItemProperty $clsidKey -ErrorAction SilentlyContinue).'(default)'
                Write-Host "CLSID=$clsid"
                if ($clsid) {
                  foreach ($view in @(
                    "Registry::HKEY_CLASSES_ROOT\CLSID\$clsid\LocalServer32",
                    "Registry::HKEY_CLASSES_ROOT\Wow6432Node\CLSID\$clsid\LocalServer32"
                  )) {
                    if (Test-Path $view) {
                      Write-Host "LOCALSERVER_KEY=$view"
                      Get-ItemProperty $view -ErrorAction SilentlyContinue | Format-List
                    }
                  }
                }
              }
            }
          Write-Host '=== COM activation probe ==='
          try {
            $type=[type]::GetTypeFromProgID('Photoshop.Application')
            Write-Host "GetTypeFromProgID=$type"
          } catch { Write-Host "GetTypeFromProgID_ERROR=$($_.Exception.Message)" }
          try {
            $app=New-Object -ComObject Photoshop.Application -ErrorAction Stop
            Write-Host "COM_ACTIVATION=PASS"
            try { Write-Host "COM_VERSION=$($app.Version)" } catch {}
            [Runtime.InteropServices.Marshal]::FinalReleaseComObject($app) | Out-Null
          } catch {
            Write-Host "COM_ACTIVATION=FAIL"
            Write-Host "COM_HRESULT=0x$('{0:X8}' -f ($_.Exception.HResult -band 0xffffffffL))"
            Write-Host "COM_ERROR=$($_.Exception.Message)"
          }
      - name: Verify upstream subprocess starts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          uv run python -c "from mcp_adobe.mcp_stdio import McpSubprocessToolClient,photoshop_stdio_config; c=McpSubprocessToolClient(photoshop_stdio_config()); c.start(); print('tool_count='+str(len(c.tool_names))); c.close()"
      - name: Illustrator live read E2E
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          uv run python scripts/real_e2e.py illustrator
      - name: Illustrator live write E2E
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'mcp_adobe_targeted\illustrator'
          if(Test-Path $out){Remove-Item -Recurse -Force $out}
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          uv run python scripts/real_e2e.py illustrator --write --output-dir $out
          Get-ChildItem -Path $out -File | Select-Object Name,Length,LastWriteTime
      - name: Photoshop live read E2E
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          uv run python scripts/real_e2e.py photoshop
      - name: Photoshop live write E2E
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'mcp_adobe_targeted\photoshop'
          if(Test-Path $out){Remove-Item -Recurse -Force $out}
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          uv run python scripts/real_e2e.py photoshop --write --output-dir $out
          $files=@(Get-ChildItem -Path $out -File)
          if($files.Count -lt 2){throw 'Expected PSD and PNG outputs'}
          $files | Select-Object Name,Length,LastWriteTime
