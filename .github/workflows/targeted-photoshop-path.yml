name: Targeted Photoshop custom path override

on:
  push:
    branches: [fix/photoshop-path-override]
    paths:
      - "src/mcp_adobe/mcp_stdio.py"
      - "scripts/real_e2e.py"
      - "tests/test_transport.py"
      - "tests/test_real_e2e.py"
      - ".github/workflows/targeted-photoshop-path.yml"

permissions:
  contents: read

jobs:
  targeted:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Install
        shell: powershell
        run: |
          uv python install 3.12
          uv sync --python 3.12
      - name: Targeted regression tests
        shell: powershell
        run: |
          uv run python -m unittest tests.test_transport tests.test_real_e2e -v
      - name: Verify launcher injects real running Photoshop path
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          uv run python -c "from mcp_adobe.mcp_stdio import photoshop_stdio_config; c=photoshop_stdio_config(); p=c.env.get('PHOTOSHOP_PATH'); print('PHOTOSHOP_PATH='+str(p)); assert p and p.lower().endswith('photoshop.exe')"
      - name: Expose upstream startup exception
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          uv run python -c "from mcp_adobe.mcp_stdio import McpSubprocessToolClient,photoshop_stdio_config; c=McpSubprocessToolClient(photoshop_stdio_config()); c.start(); print(sorted(c.tool_names)); c.close()"
      - name: Photoshop live read E2E
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          uv run python scripts/real_e2e.py photoshop
      - name: Photoshop live write E2E
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'mcp_adobe_targeted\photoshop'
          if(Test-Path $out){Remove-Item -Recurse -Force $out}
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          uv run python scripts/real_e2e.py photoshop --write --output-dir $out
          $files=@(Get-ChildItem -Path $out -File)
          if($files.Count -lt 2){throw 'Expected PSD and PNG outputs'}
          $files | Select-Object Name,Length,LastWriteTime
