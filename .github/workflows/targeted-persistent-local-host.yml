name: Deploy persistent MCP Adobe local host

on:
  push:
    branches: [feat/illustrator-cep-backend]
    paths:
      - "src/mcp_adobe/server.py"
      - "src/mcp_adobe/illustrator.py"
      - "src/mcp_adobe/illustrator_cep.py"
      - "tests/test_illustrator.py"
      - "tests/test_illustrator_cep.py"
      - "scripts/install_local_host.ps1"
      - "scripts/install_illustrator_cep_backend.ps1"
      - "scripts/install_windows.ps1"
      - "tests/test_illustrator_cep_installer_contract.py"
      - "tests/test_server.py"
      - "tests/test_install_windows.py"
      - "tests/test_persistent_local_host.py"
      - ".github/workflows/targeted-persistent-local-host.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistent-mcp-adobe-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-persistent-host:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - name: Provision pinned Node for CEP build
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Refresh toolchain and targeted unit tests
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $machine=[Environment]::GetEnvironmentVariable('Path','Machine')
          $user=[Environment]::GetEnvironmentVariable('Path','User')
          $env:Path=(@($machine,$user,$env:Path) | Where-Object {$_}) -join ';'
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)) {
            $uvDir=Join-Path $HOME '.local\bin'
            if(Test-Path (Join-Path $uvDir 'uv.exe')) { $env:Path="$uvDir;$env:Path" }
          }
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)){ throw 'uv unavailable' }
          uv sync
          uv run python -m unittest tests.test_server tests.test_install_windows tests.test_persistent_local_host -v

      - name: Ensure production Illustrator CEP backend
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'MCPAdobe\illustrator-mcp'
          $metaPath=Join-Path $root 'install-metadata.json'
          $python=Join-Path $root 'venv\Scripts\python.exe'
          $source=Join-Path $root 'source'
          $panel=Join-Path $env:APPDATA 'Adobe\CEP\extensions\com.illustrator.mcp.panel\CSXS\manifest.xml'
          $expected='5d7a3edc8ebc89a0fc56b059e1311d3b2bfca815'
          $reuse=$false
          if((Test-Path $metaPath) -and (Test-Path $python) -and (Test-Path $panel) -and (Test-Path $source)){
            try {
              $meta=Get-Content -LiteralPath $metaPath -Raw | ConvertFrom-Json
              $sha=(git -C $source rev-parse HEAD).Trim()
              $version=(& $python -c "import importlib.metadata as m; print(m.version('illustrator-mcp'))").Trim()
              $manifestText=Get-Content -LiteralPath $panel -Raw
              $autoStartOk=(
                $manifestText.Contains('<StartOn>') -and
                $manifestText.Contains('<Event>applicationActivate</Event>') -and
                $manifestText.Contains('<Event>com.adobe.csxs.events.ApplicationActivate</Event>')
              )
              if($meta.upstream_sha -eq $expected -and $sha -eq $expected -and $version -eq '3.0.0' -and $autoStartOk){
                $reuse=$true
              }
            } catch {
              Write-Host "PRODUCTION_ILLUSTRATOR_BACKEND_REUSE=NO reason=$($_.Exception.Message)"
            }
          }
          if($reuse){
            Write-Host "PRODUCTION_ILLUSTRATOR_BACKEND_REUSE=PASS sha=$expected version=3.0.0"
          } else {
            Write-Host "PRODUCTION_ILLUSTRATOR_BACKEND_UPGRADE=CONTROLLED_STOP"
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install_local_host.ps1 -StopOnly
            if($LASTEXITCODE -ne 0){ throw "controlled persistent host stop failed: $LASTEXITCODE" }

            $uv=(Get-Command uv).Source
            $node=(Get-Command node).Source
            $npmCmd=Get-Command npm.cmd -ErrorAction SilentlyContinue
            if($npmCmd){ $npm=$npmCmd.Source } else { $npm=(Get-Command npm -ErrorAction Stop).Source }
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install_illustrator_cep_backend.ps1 `
              -PythonVersion 3.12 `
              -UvCommandPath $uv `
              -NodeCommandPath $node `
              -NpmCommandPath $npm
            if($LASTEXITCODE -ne 0){ throw "production Illustrator backend install failed: $LASTEXITCODE" }
          }

      - name: Install and start persistent local host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $uv=(Get-Command uv).Source
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install_local_host.ps1 -PythonVersion 3.12 -UvCommandPath $uv
          if($LASTEXITCODE -ne 0){ throw "persistent local host install failed: $LASTEXITCODE" }

      - name: Ensure Illustrator interactive host and CEP auto-start
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $aiPath='D:\Ilustrator\Adobe Illustrator 2023\Support Files\Contents\Windows\Illustrator.exe'
          if(-not (Test-Path $aiPath)){ throw "Illustrator executable missing: $aiPath" }

          function Test-PanelConnected {
            return @(Get-NetTCPConnection -State Established -LocalPort 8081 -ErrorAction SilentlyContinue).Count -gt 0
          }

          $visible=Get-Process -Name Illustrator -ErrorAction SilentlyContinue |
            Where-Object {$_.MainWindowHandle -ne 0} |
            Select-Object -First 1

          if($visible -and -not (Test-PanelConnected)){
            $title=[string]$visible.MainWindowTitle
            $safeHome=(-not $title) -or ($title -match '^Adobe Illustrator(?: 2023)?$')
            $ownedProbe=(
              $title -match '^MCP Adobe Interactive Selection Probe(?: \[Recovered\])?\*? @' -or
              $title -match '^ChatGPT MCP Direct Interaction(?: \[Recovered\])?\*? @'
            )
            if(-not $safeHome -and -not $ownedProbe){
              throw "CEP auto-start requires one safe Illustrator restart, but a non-test document/window appears active: $title"
            }
            Write-Host "ILLUSTRATOR_AUTOSTART_RESTART=START PID=$($visible.Id) TITLE=$title OWNED_PROBE=$ownedProbe"
            if($ownedProbe){
              Write-Host 'ILLUSTRATOR_AUTOSTART_RESTART_FORCE=TEST_OWNED_DOCUMENT_ONLY'
              Stop-Process -Id $visible.Id -Force -ErrorAction Stop
            } elseif(-not $visible.CloseMainWindow()){
              throw "Illustrator refused graceful restart required to load updated CEP manifest"
            }
            $deadline=(Get-Date).AddSeconds(25)
            do {
              Start-Sleep -Milliseconds 500
              $remaining=Get-Process -Id $visible.Id -ErrorAction SilentlyContinue
            } until(-not $remaining -or (Get-Date) -gt $deadline)
            if($remaining){
              throw "Illustrator did not exit after safe CEP lifecycle restart request"
            }
            $visible=$null
          }

          if(-not $visible){
            $oldTracking=$env:RUNNER_TRACKING_ID
            try {
              Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
              $p=Start-Process -FilePath $aiPath -PassThru
              Write-Host "ILLUSTRATOR_LAUNCHED_PID=$($p.Id)"
            } finally {
              if($null -ne $oldTracking){ $env:RUNNER_TRACKING_ID=$oldTracking }
            }
          }

          $deadline=(Get-Date).AddSeconds(100)
          do {
            Start-Sleep -Seconds 2
            $visible=Get-Process -Name Illustrator -ErrorAction SilentlyContinue |
              Where-Object {$_.MainWindowHandle -ne 0} |
              Select-Object -First 1
          } until($visible -or (Get-Date) -gt $deadline)
          if(-not $visible){ throw 'Illustrator interactive window did not become visible within 100 seconds' }
          Write-Host "ILLUSTRATOR_HOST=PASS PID=$($visible.Id) SESSION=$($visible.SessionId)"

          $deadline=(Get-Date).AddSeconds(90)
          do {
            if(Test-PanelConnected){ break }
            Start-Sleep -Seconds 1
          } until((Get-Date) -gt $deadline)
          if(-not (Test-PanelConnected)){
            throw 'Illustrator CEP panel did not auto-start and connect to port 8081 after application activation'
          }
          Write-Host 'ILLUSTRATOR_CEP_AUTOSTART=PASS'

      - name: Verify persistent ports
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 5
          foreach($port in @(8787,8081,8765)){
            $listeners=@(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue)
            if($listeners.Count -ne 1){ throw "expected one listener on $port, got $($listeners.Count)" }
            $ownerPid=$listeners[0].OwningProcess
            $p=Get-CimInstance Win32_Process -Filter "ProcessId=$ownerPid"
            Write-Host "PERSISTENT_PORT_$port=PASS PID=$ownerPid EXE=$($p.ExecutablePath) CMD=$($p.CommandLine)"
          }

      - name: Verify HTTP MCP to live Illustrator twice
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import asyncio
          import json
          import time
          from mcp import Client

          URL = "http://127.0.0.1:8787/mcp"

          def walk(value):
              yield value
              if isinstance(value, dict):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from walk(child)

          def find_key(value, key):
              for node in walk(value):
                  if isinstance(node, dict) and key in node:
                      return node[key]
              return None

          async def health(label: str, *, probe: bool):
              async with Client(URL) as client:
                  listed = await client.list_tools()
                  names = {tool.name for tool in listed.tools}
                  required = {
                      "creative_discover",
                      "creative_read",
                      "creative_write",
                      "creative_authorized_write",
                  }
                  if names != required:
                      raise RuntimeError(f"unexpected tools: {sorted(names)}")
                  result = await client.call_tool(
                      "creative_read",
                      {
                          "application": "illustrator",
                          "capability": "creative.health",
                          "arguments": {"probe": probe, "timeout": 5.0},
                      },
                  )
                  if result.is_error:
                      raise RuntimeError(f"Illustrator health tool failed: {result}")
                  payload = result.structured_content
                  print(
                      label + "=" +
                      json.dumps(payload, ensure_ascii=False, default=str),
                      flush=True,
                  )
                  return payload

          def require_panel_connected(payload):
              layers = find_key(payload, "layers")
              if not isinstance(layers, dict):
                  raise RuntimeError("Illustrator health omitted layers")
              panel = layers.get("panel")
              if not isinstance(panel, dict):
                  raise RuntimeError("Illustrator health omitted panel layer")
              status = panel.get("status")
              if status not in {"ok", "degraded"}:
                  raise RuntimeError(
                      "Illustrator panel is not connected: " +
                      json.dumps(panel, ensure_ascii=False, default=str)
                  )
              execution = find_key(payload, "execution")
              unresolved = execution.get("unresolvedJobs", []) if isinstance(execution, dict) else []
              if unresolved:
                  raise RuntimeError(
                      "Illustrator has unresolved jobs; do not retry blindly: " +
                      json.dumps(
                          {
                              "panel": panel,
                              "execution": execution,
                              "blockedAt": find_key(payload, "blockedAt"),
                              "blocking": find_key(payload, "blocking"),
                          },
                          ensure_ascii=False,
                          default=str,
                      )
                  )
              # panel.busy/activeRequestId are expected while this health request
              # itself is being serviced. They are not a fault when no unresolved
              # job exists and the panel heartbeat/status are healthy.

          def require_live_probe(payload):
              require_panel_connected(payload)
              layers = find_key(payload, "layers")
              illustrator = layers.get("illustrator") if isinstance(layers, dict) else None
              if not isinstance(illustrator, dict) or illustrator.get("status") != "ok":
                  raise RuntimeError(
                      "Illustrator probe did not confirm the host: " +
                      json.dumps(payload, ensure_ascii=False, default=str)
                  )

          local = asyncio.run(
              health("PERSISTENT_HTTP_ILLUSTRATOR_LOCAL_1", probe=False)
          )
          require_panel_connected(local)
          probed = asyncio.run(
              health("PERSISTENT_HTTP_ILLUSTRATOR_HEALTH_1", probe=True)
          )
          require_live_probe(probed)

          time.sleep(8)

          local2 = asyncio.run(
              health("PERSISTENT_HTTP_ILLUSTRATOR_LOCAL_2", probe=False)
          )
          require_panel_connected(local2)
          probed2 = asyncio.run(
              health("PERSISTENT_HTTP_ILLUSTRATOR_HEALTH_2", probe=True)
          )
          require_live_probe(probed2)
          print("PERSISTENT_MCP_ADOBE_HOST_E2E=PASS", flush=True)
          '@ | Set-Content -Path persistent_host_probe.py -Encoding UTF8
          uv run python persistent_host_probe.py

      - name: Verify host survives client disconnect
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          foreach($port in @(8787,8081,8765)){
            if(@(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue).Count -eq 0){
              throw "persistent host lost port $port after client disconnect"
            }
          }
          Write-Host 'PERSISTENT_HOST_AFTER_CLIENT_DISCONNECT=PASS'

      - name: Live bounded Illustrator selection interaction
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import asyncio
          import json
          from collections.abc import Mapping
          from mcp import Client

          URL = "http://127.0.0.1:8787/mcp"
          DOC_NAME = "MCP Adobe Interactive Selection Probe"
          PROBE_ID = "mcp_adobe_interactive_probe"
          PROBE_NAME = "ChatGPT Live Selection Probe"

          def walk(value):
              yield value
              if isinstance(value, Mapping):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from walk(child)

          def find_key(value, key):
              for node in walk(value):
                  if isinstance(node, Mapping) and key in node:
                      return node[key]
              return None

          def find_item(value, token):
              for node in walk(value):
                  if not isinstance(node, Mapping):
                      continue
                  if node.get("uuid") == token:
                      return node
                  ref = node.get("itemRef")
                  if isinstance(ref, Mapping):
                      ident = ref.get("identity")
                      if isinstance(ident, Mapping) and ident.get("itemId") == token:
                          return node
              return None

          async def call(client, tool, application, capability, arguments):
              result = await client.call_tool(
                  tool,
                  {
                      "application": application,
                      "capability": capability,
                      "arguments": arguments,
                  },
              )
              if result.is_error:
                  raise RuntimeError(f"{tool}/{capability} failed: {result}")
              payload = result.structured_content
              print(
                  f"LIVE_{capability}=" +
                  json.dumps(payload, ensure_ascii=False, default=str),
                  flush=True,
              )
              return payload

          async def main():
              async with Client(URL) as client:
                  await call(
                      client, "creative_write", "illustrator",
                      "creative.document.create",
                      {"width": 640, "height": 420, "color_mode": "RGB", "name": DOC_NAME},
                  )
                  await call(
                      client, "creative_write", "illustrator",
                      "creative.shape.rectangle",
                      {
                          "id": PROBE_ID,
                          "name": PROBE_NAME,
                          "x": 100,
                          "y": 100,
                          "width": 160,
                          "height": 90,
                          "fill": {"r": 24, "g": 119, "b": 242},
                      },
                  )

                  await call(
                      client, "creative_write", "illustrator",
                      "creative.object.select",
                      {"uuids": [PROBE_ID]},
                  )
                  selection = await call(
                      client, "creative_read", "illustrator",
                      "creative.selection.get", {},
                  )
                  if find_key(selection, "selectionCount") != 1:
                      raise RuntimeError("expected exactly one live Illustrator selection")
                  item = find_item(selection, PROBE_ID)
                  if item is None:
                      raise RuntimeError("selected object did not read back with the requested MCP ID")
                  bounds = item.get("bounds")
                  if not isinstance(bounds, Mapping):
                      raise RuntimeError("selected object has no readable bounds")
                  before_x = float(bounds["x"])
                  before_y = float(bounds["y"])
                  print(
                      f"ILLUSTRATOR_SELECTION_BASELINE=PASS id={PROBE_ID} x={before_x} y={before_y}",
                      flush=True,
                  )

                  moved = await call(
                      client, "creative_write", "illustrator",
                      "creative.selection.move",
                      {"deltaX": 12, "deltaY": 0},
                  )
                  if find_key(moved, "selected_uuid") != PROBE_ID:
                      raise RuntimeError("selection.move did not target the current live selection")
                  moved_selection = await call(
                      client, "creative_read", "illustrator",
                      "creative.selection.get", {},
                  )
                  moved_item = find_item(moved_selection, PROBE_ID)
                  moved_x = float(moved_item["bounds"]["x"])
                  if abs((moved_x - before_x) - 12.0) > 0.01:
                      raise RuntimeError(
                          f"selection.move readback mismatch: before={before_x} after={moved_x}"
                      )
                  print("ILLUSTRATOR_SELECTION_MOVE_READBACK=PASS dx=12", flush=True)

                  await call(
                      client, "creative_write", "illustrator",
                      "creative.selection.update",
                      {"properties": {"opacity": 61}},
                  )
                  found = await call(
                      client, "creative_read", "illustrator",
                      "creative.object.find", {"name": PROBE_NAME},
                  )
                  found_item = find_item(found, PROBE_ID)
                  opacity = find_key(found_item, "opacity") if found_item else None
                  if opacity is None or abs(float(opacity) - 61.0) > 0.01:
                      raise RuntimeError(f"selection.update opacity readback mismatch: {opacity}")
                  print("ILLUSTRATOR_SELECTION_OPACITY_READBACK=PASS opacity=61", flush=True)

                  await call(
                      client, "creative_write", "illustrator",
                      "creative.undo", {"count": 1},
                  )
                  found_after_opacity_undo = await call(
                      client, "creative_read", "illustrator",
                      "creative.object.find", {"name": PROBE_NAME},
                  )
                  undo_item = find_item(found_after_opacity_undo, PROBE_ID)
                  undo_opacity = find_key(undo_item, "opacity") if undo_item else None
                  if undo_opacity is None or abs(float(undo_opacity) - 100.0) > 0.01:
                      raise RuntimeError(f"opacity undo readback mismatch: {undo_opacity}")
                  print("ILLUSTRATOR_SELECTION_OPACITY_UNDO=PASS", flush=True)

                  await call(
                      client, "creative_write", "illustrator",
                      "creative.undo", {"count": 1},
                  )
                  found_after_move_undo = await call(
                      client, "creative_read", "illustrator",
                      "creative.object.find", {"name": PROBE_NAME},
                  )
                  final_item = find_item(found_after_move_undo, PROBE_ID)
                  final_bounds = find_key(final_item, "bounds") if final_item else None
                  if not isinstance(final_bounds, Mapping):
                      raise RuntimeError("move undo readback did not contain bounds")
                  final_x = final_bounds.get("x")
                  if final_x is None:
                      left = final_bounds.get("left")
                      final_x = left
                  if final_x is None or abs(float(final_x) - before_x) > 0.01:
                      raise RuntimeError(
                          f"move undo readback mismatch: expected={before_x} actual={final_x}"
                      )
                  print("ILLUSTRATOR_SELECTION_MOVE_UNDO=PASS", flush=True)
                  print("ILLUSTRATOR_DIRECT_INTERACTION_E2E=PASS", flush=True)

          asyncio.run(main())
          '@ | Set-Content -Path illustrator_direct_interaction.py -Encoding UTF8
          uv run python illustrator_direct_interaction.py
