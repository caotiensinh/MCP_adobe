name: Mode 2 XD new experimental plugin menu discovery
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-fixture-plugin-menu-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  discover:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Inspect new UXP commands and runtime state without reload
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $marker=Join-Path $root 'mode2-disposable-native\Mode2_FixtureSelection_PluginReload_Once.marker'
          Write-Host "MODE2_FIXTURE_RELOAD_MARKER=$(Test-Path -LiteralPath $marker)"
          foreach($port in @(8765,8766)){
            $l=@(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue)
            $e=@(Get-NetTCPConnection -LocalPort $port -State Established -ErrorAction SilentlyContinue)
            Write-Host "MODE2_DISCOVERY_PORT=$port LISTEN=$($l.Count) ESTABLISHED=$($e.Count)"
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $scope=[System.Windows.Automation.TreeScope]::Children
          $desc=[System.Windows.Automation.TreeScope]::Descendants
          $cond=[System.Windows.Automation.Condition]::TrueCondition
          $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
          $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_FOREIGN_XD_WINDOW'}
          $win=$test[0]
          $wp=$win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
          if($wp.Current.WindowVisualState -eq [System.Windows.Automation.WindowVisualState]::Minimized){
            $wp.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Normal)
          }
          try{$win.SetFocus()}catch{}
          Start-Sleep -Seconds 1
          $aid=[System.Windows.Automation.AutomationElement]::AutomationIdProperty
          $pluginMenu=$win.FindFirst($desc,(New-Object System.Windows.Automation.PropertyCondition($aid,'AppMenuBar_Plugins')))
          if(-not $pluginMenu){throw 'MODE2_PLUGIN_MENU_NOT_AVAILABLE'}
          $px=$pluginMenu.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
          if($px.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$px.Expand()}
          Start-Sleep -Milliseconds 300
          $nodes=$win.FindAll($desc,$cond)
          foreach($item in @($nodes|Where-Object {[string]$_.Current.ControlType.ProgrammaticName -eq 'ControlType.MenuItem' -and [string]$_.Current.Name -match '(MCP|Fixture|Mode 2|Connect)'})|Select-Object -First 30){
            Write-Host "MODE2_PLUGIN_MENU_ITEM_NAME=$([string]$item.Current.Name) ID=$([string]$item.Current.AutomationId) ENABLED=$($item.Current.IsEnabled)"
          }
          $submenu=@($nodes|Where-Object {[string]$_.Current.Name -match 'MCP Adobe Mode 2 Experimental'})
          foreach($candidate in $submenu|Select-Object -First 3){
            $supported=@($candidate.GetSupportedPatterns()|ForEach-Object {$_.ProgrammaticName})
            Write-Host "MODE2_EXPERIMENTAL_ROOT_TYPE=$([string]$candidate.Current.ControlType.ProgrammaticName) PATTERNS=$($supported -join ',')"
            $ex=$null;try{$ex=$candidate.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)}catch{}
            if($ex){
              if($ex.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$ex.Expand()}
              Start-Sleep -Milliseconds 250
              $all=$win.FindAll($desc,$cond)
              foreach($item in @($all|Where-Object {[string]$_.Current.ControlType.ProgrammaticName -eq 'ControlType.MenuItem' -and [string]$_.Current.Name -match '(MCP|Fixture|Connect|Select)'})|Select-Object -First 35){
                Write-Host "MODE2_PLUGIN_SUBMENU_NAME=$([string]$item.Current.Name) ID=$([string]$item.Current.AutomationId) ENABLED=$($item.Current.IsEnabled)"
              }
              $ex.Collapse()
            }
          }
          if($px.Current.ExpandCollapseState -eq [System.Windows.Automation.ExpandCollapseState]::Expanded){$px.Collapse()}
          Write-Host 'MODE2_PLUGIN_MENU_DISCOVERY_READONLY=PASS'
