name: Panda red XD target-owned CoreWindow Save As stage once
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-xd-savedraft-corewindow-saveas-once.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Verify Untitled child CoreWindow owner and invoke its real File Save As once
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'XD_SAVE_STAGE_WRONG_DESKTOP'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;using System.Runtime.InteropServices;using System.Text;
          public class XdDraftCore {
            public delegate bool EnumProc(IntPtr h,IntPtr arg);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr parent,EnumProc callback,IntPtr arg);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc callback,IntPtr arg);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h,out uint pid);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h,StringBuilder s,int len);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
          }
          '@
          function ClassOf([IntPtr]$handle){
            $buffer=New-Object System.Text.StringBuilder(150)
            [void][XdDraftCore]::GetClassName($handle,$buffer,150)
            return $buffer.ToString()
          }
          $base=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $source=Join-Path $base 'MCP_Mode1_Panda_XD_38136531800.xd'
          $target=Join-Path $base 'MCP_KFP4_Red_XD_38205166138.xd'
          $oldHash='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $oldHash -or (Test-Path -LiteralPath $target)){throw 'XD_SAVE_STAGE_NATIVE_GUARD_FAILED'}
          $desktop=[System.Windows.Automation.AutomationElement]::RootElement
          $tops=$desktop.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $drafts=@($tops|Where-Object{[string]$_.Current.Name -match '^Untitled-1.*Adobe XD$' -and [string]$_.Current.ClassName -eq 'ApplicationFrameWindow'})
          $original=@($tops|Where-Object{[string]$_.Current.Name -match '^MCP_Mode1_Panda_XD_38136531800.*Adobe XD$'})
          $xd=@(Get-Process -Name XD -ErrorAction SilentlyContinue|Where-Object {$_.SessionId -eq 1})
          $pickers=@(Get-Process -Name PickerHost -ErrorAction SilentlyContinue|Where-Object {$_.SessionId -eq 1})
          Write-Host "XD_SAVE_STAGE_BEFORE draft=$($drafts.Count) original=$($original.Count) xd=$($xd.Count) picker=$($pickers.Count)"
          if($drafts.Count -ne 1 -or $original.Count -ne 1 -or $xd.Count -ne 1 -or $pickers.Count -gt 0){throw 'XD_SAVE_STAGE_UNSAFE_DESKTOP'}
          $frame=[IntPtr]$drafts[0].Current.NativeWindowHandle
          $xdPid=[uint32]$xd[0].Id
          $childHandles=New-Object 'System.Collections.Generic.List[System.IntPtr]'
          $callback=[XdDraftCore+EnumProc]{
            param([IntPtr]$handle,[IntPtr]$ignored)
            $process=[uint32]0
            [void][XdDraftCore]::GetWindowThreadProcessId($handle,[ref]$process)
            if($process -eq $xdPid -and (ClassOf $handle) -eq 'Windows.UI.Core.CoreWindow'){$childHandles.Add($handle)}
            return $true
          }
          [void][XdDraftCore]::EnumChildWindows($frame,$callback,[IntPtr]::Zero)
          Write-Host "XD_SAVE_STAGE_DRAFT_CHILD_CORE_COUNT=$($childHandles.Count)"
          if($childHandles.Count -ne 1){throw 'XD_SAVE_STAGE_DRAFT_CORE_NOT_UNIQUE'}
          $core=[System.Windows.Automation.AutomationElement]::FromHandle($childHandles[0])
          $nameCond=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'TitleText')
          $titleEls=$core.FindAll([System.Windows.Automation.TreeScope]::Descendants,$nameCond)
          if($titleEls.Count -ne 1 -or [string]$titleEls[0].Current.Name -notmatch '^Untitled-1'){throw 'XD_SAVE_STAGE_CORE_TITLE_MISMATCH'}
          Write-Host "XD_SAVE_STAGE_NATIVE_CORE_VERIFIED=PASS hwnd=$($childHandles[0]) title=$($titleEls[0].Current.Name)"
          $fileCond=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'AppMenu_File')
          $menuEls=$core.FindAll([System.Windows.Automation.TreeScope]::Descendants,$fileCond)
          if($menuEls.Count -ne 1 -or [string]$menuEls[0].Current.Name -ne 'File'){throw 'XD_SAVE_STAGE_FILE_MENU_AMBIGUOUS'}
          [void][XdDraftCore]::SetForegroundWindow($frame)
          Start-Sleep -Milliseconds 400
          if([XdDraftCore]::GetForegroundWindow() -ne $frame){throw 'XD_SAVE_STAGE_NOT_FOCUSED'}
          $menu=$menuEls[0].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
          if($menu.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){
            $menu.Expand()
            Write-Host 'XD_SAVE_STAGE_FILE_EXPANDED_ONCE=PASS'
          }else{Write-Host 'XD_SAVE_STAGE_FILE_ALREADY_OPEN=PASS'}
          Start-Sleep -Milliseconds 350
          $popups=New-Object 'System.Collections.Generic.List[System.IntPtr]'
          $getPopups=[XdDraftCore+EnumProc]{
            param([IntPtr]$handle,[IntPtr]$ignored)
            $process=[uint32]0
            [void][XdDraftCore]::GetWindowThreadProcessId($handle,[ref]$process)
            if($process -eq $xdPid -and [XdDraftCore]::IsWindowVisible($handle) -and (ClassOf $handle) -eq 'Xaml_WindowedPopupClass'){
              $popups.Add($handle)
            }
            return $true
          }
          [void][XdDraftCore]::EnumWindows($getPopups,[IntPtr]::Zero)
          $saveAs=@()
          $saveCond=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'AppMenu_SaveAs')
          foreach($popupHandle in $popups){
            $popup=[System.Windows.Automation.AutomationElement]::FromHandle($popupHandle)
            $found=$popup.FindAll([System.Windows.Automation.TreeScope]::Descendants,$saveCond)
            foreach($item in $found){
              if([string]$item.Current.Name -eq 'Save As...' -and $item.Current.IsEnabled){$saveAs+=,$item}
            }
          }
          Write-Host "XD_SAVE_STAGE_SAVEMENU_MATCHES=$($saveAs.Count)"
          if($saveAs.Count -ne 1){throw 'XD_SAVE_STAGE_SAVEAS_NOT_UNIQUE_NO_INVOKE'}
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $oldHash -or (Test-Path -LiteralPath $target)){throw 'XD_SAVE_STAGE_GUARD_CHANGED_NO_INVOKE'}
          try{$saveAs[0].GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()}catch{throw "XD_SAVE_STAGE_INVOKE_UNKNOWN_NO_REPLAY $($_.Exception.GetType().Name)"}
          Write-Host 'XD_SAVE_STAGE_SAVEAS_INVOKED_ONCE=PASS'
          $deadline=(Get-Date).AddSeconds(28)
          $dialogs=@()
          do{
            Start-Sleep -Milliseconds 550
            $windows=$desktop.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
            $dialogs=@($windows|Where-Object{[string]$_.Current.ClassName -eq '#32770' -or [string]$_.Current.Name -match 'Save As|Save a File|Save Local'})
            $pickers=@(Get-Process -Name PickerHost -ErrorAction SilentlyContinue|Where-Object{$_.SessionId -eq 1})
            if($dialogs.Count -gt 0 -or $pickers.Count -gt 0){break}
          }until((Get-Date)-ge $deadline)
          Write-Host "XD_SAVE_STAGE_AFTER picker=$($pickers.Count) dialog=$($dialogs.Count) target_exists=$(Test-Path -LiteralPath $target)"
          foreach($d in $dialogs){Write-Host "XD_SAVE_STAGE_DIALOG title=$($d.Current.Name) class=$($d.Current.ClassName) pid=$($d.Current.ProcessId)"}
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $oldHash){throw 'XD_SAVE_STAGE_ORIGINAL_SHA_CHANGED'}
          if($dialogs.Count -eq 0 -and $pickers.Count -eq 0){throw 'XD_SAVE_STAGE_NO_PICKER_AFTER_ONE_INVOKE_UNKNOWN_NO_REPLAY'}
          Write-Host 'XD_SAVE_STAGE_PICKER_OBSERVED=PASS'
