name: Readiness regression targeted

on:
  push:
    branches: [fix/readiness-regression-tests]

permissions:
  contents: read

jobs:
  readiness-regression:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Setup Python
        shell: powershell
        run: uv python install 3.12
      - name: Install
        shell: powershell
        run: uv sync --python 3.12
      - name: Targeted regression tests
        shell: powershell
        run: uv run python -m unittest tests.test_photoshop tests.test_xd tests.test_application_readiness -v
