name: Targeted Photoshop live inspect

on:
  push:
    branches: [test/photoshop-live-inspect]
    paths:
      - "scripts/photoshop_live_inspect.py"
      - ".github/workflows/targeted-photoshop-live-inspect.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Discover Photoshop
        id: adobe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/adobe_inventory.ps1 -GitHubOutput

      - name: Bootstrap runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $machine=[Environment]::GetEnvironmentVariable('Path','Machine')
          $user=[Environment]::GetEnvironmentVariable('Path','User')
          $env:Path=(@($machine,$user,$env:Path) | Where-Object {$_}) -join ';'

          if(-not (Get-Command node -ErrorAction SilentlyContinue) -or -not (Get-Command npx -ErrorAction SilentlyContinue)) {
            $standard='C:\Program Files\nodejs'
            if(Test-Path (Join-Path $standard 'node.exe')) {
              $standard | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $env:Path="$standard;$env:Path"
            }
          }
          if(-not (Get-Command node -ErrorAction SilentlyContinue) -or -not (Get-Command npx -ErrorAction SilentlyContinue)) {
            throw 'node/npx unavailable on runner'
          }

          if(-not (Get-Command uv -ErrorAction SilentlyContinue)) {
            $uvDir=Join-Path $HOME '.local\bin'
            if(Test-Path (Join-Path $uvDir 'uv.exe')) {
              $uvDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              $env:Path="$uvDir;$env:Path"
            }
          }
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)) { throw 'uv unavailable on runner' }
          node --version
          npx --version
          uv --version

      - name: Verify live Photoshop host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $psPath='${{ steps.adobe.outputs.photoshop }}'
          if([string]::IsNullOrWhiteSpace($psPath)){ throw 'Photoshop executable not discovered' }
          if(-not (Get-Process -Name Photoshop -ErrorAction SilentlyContinue)) {
            Start-Process -FilePath $psPath
            Start-Sleep -Seconds 5
          }
          $ps=Get-Process -Name Photoshop -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0} | Select-Object -First 1
          if(-not $ps){ throw 'Photoshop interactive window not found' }
          Write-Host "PHOTOSHOP_HOST=PASS PID=$($ps.Id) SESSION=$($ps.SessionId) HWND=$($ps.MainWindowHandle)"

      - name: Install gateway runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          uv sync

      - name: Capture active Photoshop document through MCP
        shell: powershell
        env:
          PHOTOSHOP_PATH: ${{ steps.adobe.outputs.photoshop }}
          PHOTOSHOP_SCRIPT_TIMEOUT: "180000"
        run: |
          $ErrorActionPreference='Stop'
          uv run python scripts/photoshop_live_inspect.py

      - name: Upload live preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photoshop-live-inspect-${{ github.run_id }}
          path: ${{ runner.temp }}\mcp-adobe-photoshop-live-inspect\*
          if-no-files-found: warn
          retention-days: 2
