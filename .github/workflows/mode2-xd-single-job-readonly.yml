name: Mode 2 XD single-job guarded host readback
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  mode2-live:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: One-job guarded XD native open connect and node readback
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_RUNNER'}
          foreach($app in @('Illustrator','Photoshop')){if(@(Get-Process -Name $app -ErrorAction SilentlyContinue).Count -gt 0){throw "MODE2_OTHER_APP_ACTIVE_$app"}}
          Write-Host 'MODE2_SINGLE_JOB_PREFLIGHT=PASS'
          Add-Type -AssemblyName UIAutomationClient
          $tops=[System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $doc=@($tops | Where-Object {[string]$_.Current.Name -match '^MCP_Mode1_Panda_XD_38136531800.*Adobe XD$'})
          $other=@($tops | Where-Object {[string]$_.Current.Name -match 'Adobe XD$' -and [string]$_.Current.Name -ne 'Adobe XD' -and [string]$_.Current.Name -notmatch '^MCP_Mode1_Panda_XD_38136531800.*Adobe XD$'})
          $ws=@(Get-NetTCPConnection -LocalPort 8765 -State Established -ErrorAction SilentlyContinue)
          if($other.Count -gt 0 -or $doc.Count -gt 1){throw 'MODE2_UNEXPECTED_ADOBE_DOCUMENT'}
          if($doc.Count -eq 1){
            Write-Host "MODE2_REUSE_VERIFIED_DOCUMENT=PASS websocket=$($ws.Count)"
          }else{
            if($ws.Count -gt 0){throw 'MODE2_CONNECTED_BUT_NO_KNOWN_DOCUMENT'}
            & .\scripts\panda_xd_recover_headless_uwp.ps1
            if(-not $?){throw 'MODE2_RECOVERY_FAILED'}
          }
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [System.Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'PANDA_XD_OPEN_WRONG_DESKTOP'}
          $source=Join-Path $env:USERPROFILE 'Documents\MCPAdobe\MCP_Mode1_Panda_XD_38136531800.xd'
          $expected='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          if(-not(Test-Path -LiteralPath $source -PathType Leaf) -or
             (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $expected){
            throw 'PANDA_XD_OPEN_NATIVE_SOURCE_NOT_TRUSTED'
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          function Get-Tops {
            $root=[System.Windows.Automation.AutomationElement]::RootElement
            return $root.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          }
          $top=Get-Tops
          $xdHomeWindows=@();$document=@();$other=@()
          foreach($w in $top){
            $title=[string]$w.Current.Name
            if($title -eq 'Adobe XD'){$xdHomeWindows+=,$w}
            elseif($title -match '^MCP_Mode1_Panda_XD_38136531800.*Adobe XD$'){$document+=,$w}
            elseif($title -match 'Adobe XD$'){$other+=,$w}
          }
          Write-Host "PANDA_XD_OPEN_PREFLIGHT home=$($xdHomeWindows.Count) requestedDoc=$($document.Count) otherDocs=$($other.Count)"
          if($other.Count -gt 0 -or $document.Count -gt 1){throw 'PANDA_XD_OPEN_OTHER_DOCUMENT_UNSAFE'}
          $socket=@(Get-NetTCPConnection -LocalPort 8765 -State Established -ErrorAction SilentlyContinue)
          $pickers=@(Get-Process -Name PickerHost -ErrorAction SilentlyContinue | Where-Object {$_.SessionId -eq 1})
          if($pickers.Count -gt 0){throw 'PANDA_XD_OPEN_NATIVE_PICKER_ACTIVE_REFUSE'}
          if($document.Count -eq 0){
            if($xdHomeWindows.Count -ne 1 -or $socket.Count -ne 0){
              throw 'PANDA_XD_OPEN_NO_UNIQUE_IDLE_HOME'
            }
            $tracking=$env:RUNNER_TRACKING_ID
            try{
              $env:RUNNER_TRACKING_ID=''
              Start-Process -FilePath $source -ErrorAction Stop
            }finally{$env:RUNNER_TRACKING_ID=$tracking}
            Write-Host 'PANDA_XD_NATIVE_OS_OPEN_REQUESTED_ONCE=PASS'
          }else{
            Write-Host 'PANDA_XD_NATIVE_ALREADY_OPEN=PASS no second open'
          }
          $deadline=(Get-Date).AddSeconds(100);$found=$false
          do{
            $tops=Get-Tops
            $documents=@()
            foreach($win in $tops){
              if([string]$win.Current.Name -match '^MCP_Mode1_Panda_XD_38136531800.*Adobe XD$'){
                $documents+=,$win
              }
            }
            if($documents.Count -gt 1){throw 'PANDA_XD_OPEN_MULTIPLE_DOCUMENT_WINDOWS'}
            if($documents.Count -eq 1){$found=$true;break}
            Start-Sleep -Seconds 2
          }until((Get-Date)-ge $deadline)
          if(-not $found){throw 'PANDA_XD_OPEN_NATIVE_DOCUMENT_GUI_NOT_VISIBLE_NO_REPLAY'}
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $expected){
            throw 'PANDA_XD_OPEN_NATIVE_SOURCE_CHANGED_AFTER_OPEN'
          }
          Write-Host "PANDA_XD_NATIVE_DOCUMENT_VISIBLE=PASS title=$($documents[0].Current.Name) source_sha256=$expected"
          & .\scripts\panda_xd_reconnect_saved_gui_uia.ps1
          if(-not $?){throw 'MODE2_CONNECT_FAILED'}
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_RUNNER'}
          foreach($app in @('Illustrator','Photoshop')){
            if(@(Get-Process -Name $app -ErrorAction SilentlyContinue).Count -gt 0){throw "MODE2_OTHER_APP_ACTIVE_$app"}
          }
          $xd=@(Get-Process -Name XD -ErrorAction SilentlyContinue | Where-Object {$_.SessionId -eq 1})
          Add-Type -AssemblyName UIAutomationClient
          $gui=[System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $docs=@($gui | Where-Object {[string]$_.Current.Name -match '^MCP_Mode1_Panda_XD_38136531800.*Adobe XD$' -and [string]$_.Current.ClassName -eq 'ApplicationFrameWindow'})
          Write-Host "MODE2_XD_PROCESS_COUNT=$($xd.Count) nativeDocumentWindows=$($docs.Count)"
          if($xd.Count -ne 1 -or $docs.Count -ne 1){throw 'MODE2_XD_DOC_OR_SESSION_NOT_UNIQUE'}
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          @'
          import asyncio,hashlib,json,time
          from mcp import Client
          from scripts.export_region_metadata import payload,normalize_xd_canvas_snapshot
          from mcp_adobe.region_targeting import Rect,candidates_in_region
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as client:
                  async def read(cap):
                      response=await asyncio.wait_for(client.call_tool("creative_read",{"application":"xd","capability":cap,"arguments":{}}),timeout=12)
                      value=payload(response)
                      if cap=="creative.scenegraph.list" and isinstance(value,dict) and isinstance(value.get("result"),dict):
                          if value.get("ok") is not True: raise RuntimeError("MODE2_SCENEGRAPH_ENVELOPE_NOT_OK")
                          value=value["result"]
                      return value
                  health=await read("creative.health")
                  graph_a=await read("creative.scenegraph.list")
                  frame=await read("creative.canvas.frame")
                  graph_b=await read("creative.scenegraph.list")
                  if json.dumps(graph_a,sort_keys=True,default=str)!=json.dumps(graph_b,sort_keys=True,default=str):
                      raise RuntimeError("MODE2_GRAPH_CHANGED_DURING_CAPTURE")
                  print("MODE2_FRAME_SCHEMA="+json.dumps({"graph_keys":sorted(graph_b.keys()) if isinstance(graph_b,dict) else [],"frame_keys":sorted(frame.keys()) if isinstance(frame,dict) else [],"graph_doc":str(graph_b.get("document_id"))[:80] if isinstance(graph_b,dict) else "", "frame_doc":str(frame.get("document_id"))[:80] if isinstance(frame,dict) else "","graph_nested_keys":sorted(graph_b.get("result",{}).keys()) if isinstance(graph_b,dict) and isinstance(graph_b.get("result"),dict) else [],"frame_nested_keys":sorted(frame.get("result",{}).keys()) if isinstance(frame,dict) and isinstance(frame.get("result"),dict) else []}),flush=True)
                  metadata=normalize_xd_canvas_snapshot(graph_b,frame)
                  layers=metadata["layers"]
                  matched=[layer for layer in layers if layer.get("bounds") and not layer.get("background")]
                  if not matched: raise RuntimeError("MODE2_NO_TARGETABLE_NODE")
                  first=matched[0]
                  b=first["bounds"]
                  region=Rect(float(b["left"]),float(b["top"]),float(b["right"]),float(b["bottom"]))
                  candidates=candidates_in_region(region,layers)
                  if str(first["id"]) not in [str(c["layer_id"]) for c in candidates]:
                      raise RuntimeError("MODE2_EXPECTED_NODE_NOT_FOUND")
                  digest=hashlib.sha256(json.dumps(graph_b,sort_keys=True,default=str).encode()).hexdigest()
                  print("MODE2_XD_READONLY="+json.dumps({"passed":True,"document_identity":metadata["document_identity"],"nodes":len(layers),"selected_node_id":str(first["id"]),"candidate_count":len(candidates),"ambiguous":len(candidates)>1,"scenegraph_sha256":digest,"preview_frame_verified":False,"writes":0,"region_editor_enabled":False}),flush=True)
          asyncio.run(main())
          '@ | Set-Content -LiteralPath .\mode2_xd_probe.py -Encoding UTF8
          uv run --python 3.12 python .\mode2_xd_probe.py
          if($LASTEXITCODE -ne 0){throw 'MODE2_XD_READONLY_ACCEPTANCE_FAILED'}
          Write-Host 'MODE2_SINGLE_JOB_ACCEPTANCE=PASS'
