name: Adobe Windows CI and E2E

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "adobe-xd-plugin/**"
      - "pyproject.toml"
      - "manifest.json"
      - ".mcpbignore"
      - ".github/workflows/adobe-windows-e2e.yml"
  workflow_dispatch:
    inputs:
      run_adobe_live:
        description: "Run live Photoshop/Illustrator E2E against the interactive Windows desktop"
        required: false
        default: false
        type: boolean
      xd_live:
        description: "Run live Adobe XD bridge read E2E (XD + MCP Adobe Bridge panel must be open)"
        required: false
        default: false
        type: boolean
      xd_write:
        description: "Queue an XD test rectangle and require an Apply pending click"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: adobe-windows-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adobe-real-e2e:
    name: Windows Adobe CI and optional live E2E
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      UV_LINK_MODE: copy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner and Adobe inventory
        id: inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Runner=$env:RUNNER_NAME"
          Write-Host "Machine=$env:COMPUTERNAME"
          Write-Host "User=$(whoami)"
          Write-Host "Session=$env:SESSIONNAME"
          $interactive = [Environment]::UserInteractive -and -not [string]::IsNullOrWhiteSpace($env:SESSIONNAME)
          Write-Host "UserInteractive=$interactive"

          Write-Host '--- runner service ---'
          Get-CimInstance Win32_Service | Where-Object {
            $_.Name -like 'actions.runner.*' -or $_.PathName -like '*actions-runner-adobe*'
          } | Select-Object Name,State,StartMode,StartName,PathName | Format-List

          Write-Host '--- Adobe registry entries ---'
          $uninstallRoots = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          foreach ($root in $uninstallRoots) {
            Get-ItemProperty $root -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -match 'Adobe.*(Photoshop|Illustrator|XD)' } |
              Select-Object DisplayName,DisplayVersion,InstallLocation,DisplayIcon |
              Format-Table -AutoSize
          }

          $fixedDrives = @(Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | ForEach-Object { $_.DeviceID })
          Write-Host "FixedDrives=$($fixedDrives -join ',')"

          $photoshopPatterns = @()
          $illustratorPatterns = @()
          foreach ($drive in $fixedDrives) {
            $photoshopPatterns += @(
              "$drive\Program Files\Adobe\Adobe Photoshop *\Photoshop.exe",
              "$drive\Adobe\Adobe Photoshop *\Photoshop.exe",
              "$drive\Adobe Photoshop *\Photoshop.exe"
            )
            $illustratorPatterns += @(
              "$drive\Program Files\Adobe\Adobe Illustrator *\Support Files\Contents\Windows\Illustrator.exe",
              "$drive\Adobe\Adobe Illustrator *\Support Files\Contents\Windows\Illustrator.exe",
              "$drive\Adobe Illustrator *\Support Files\Contents\Windows\Illustrator.exe"
            )
          }

          function Find-FirstFile([string[]]$patterns) {
            foreach ($pattern in $patterns) {
              $hit = Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($hit) { return $hit.FullName }
            }
            return $null
          }

          $photoshop = Find-FirstFile $photoshopPatterns
          $illustrator = Find-FirstFile $illustratorPatterns

          $xdCurrent = @(Get-AppxPackage -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'Adobe.*XD|XD.*Adobe' })
          $xdAll = @()
          try {
            $xdAll = @(Get-AppxPackage -AllUsers -ErrorAction Stop | Where-Object { $_.Name -match 'Adobe.*XD|XD.*Adobe' })
          } catch {
            Write-Warning "Get-AppxPackage -AllUsers unavailable for this account: $($_.Exception.Message)"
          }
          $xdFound = ($xdCurrent.Count + $xdAll.Count) -gt 0

          Write-Host "Photoshop=$photoshop"
          Write-Host "Illustrator=$illustrator"
          @($xdCurrent + $xdAll) | Sort-Object PackageFullName -Unique | ForEach-Object {
            Write-Host "AdobeXD=$($_.Name) $($_.Version) $($_.InstallLocation)"
          }

          "interactive=$($interactive.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "photoshop_found=$(([bool]$photoshop).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "illustrator_found=$(([bool]$illustrator).ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "xd_found=$($xdFound.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false

      - name: Setup portable Python 3.12
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          uv python install 3.12
          uv python find 3.12

      - name: Toolchain
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --version
          npm --version
          npx --version
          uv --version
          uv run --python 3.12 python --version

      - name: Install gateway environment
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          uv sync --python 3.12

      - name: Unit and regression tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          uv run python -m unittest discover -s tests -v

      - name: Claude Desktop MCPB validate and pack
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          powershell -ExecutionPolicy Bypass -File scripts/build_mcpb.ps1
          if (-not (Test-Path 'dist\mcp-adobe-creative-gateway.mcpb')) {
            throw 'MCPB artifact was not created'
          }
          Get-Item 'dist\mcp-adobe-creative-gateway.mcpb' | Select-Object FullName,Length,LastWriteTime

      - name: Claude Desktop MCPB packaged runtime smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          uv run python scripts/smoke_mcpb.py dist/mcp-adobe-creative-gateway.mcpb --exercise-adapters

      - name: Upload Claude Desktop MCPB
        uses: actions/upload-artifact@v4
        with:
          name: mcp-adobe-claude-desktop
          path: dist/mcp-adobe-creative-gateway.mcpb
          retention-days: 7
          if-no-files-found: error

      - name: Adobe XD plugin static validation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          node --check adobe-xd-plugin/main.js
          $manifest = Get-Content adobe-xd-plugin/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.manifestVersion -ne 4) { throw "XD manifestVersion must be 4" }
          if ($manifest.host.app -ne 'XD') { throw "XD manifest host must be XD" }
          if (-not ($manifest.entrypoints | Where-Object { $_.type -eq 'panel' -and $_.id -eq 'mcpAdobeBridge' })) {
            throw 'XD manifest is missing mcpAdobeBridge panel entrypoint'
          }
          Write-Host "PASS: XD plugin manifest/main.js static validation"

      - name: Photoshop real write E2E
        if: github.event_name == 'workflow_dispatch' && inputs.run_adobe_live && steps.inventory.outputs.interactive == 'true' && steps.inventory.outputs.photoshop_found == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'mcp_adobe\photoshop'
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          uv run python scripts/real_e2e.py photoshop --write --output-dir $out
          Get-ChildItem -Path $out -File | Select-Object Name,Length,LastWriteTime

      - name: Illustrator real write E2E
        if: github.event_name == 'workflow_dispatch' && inputs.run_adobe_live && steps.inventory.outputs.interactive == 'true' && steps.inventory.outputs.illustrator_found == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'mcp_adobe\illustrator'
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          uv run python scripts/real_e2e.py illustrator --write --output-dir $out
          Get-ChildItem -Path $out -File | Select-Object Name,Length,LastWriteTime

      - name: Adobe XD live bridge E2E
        if: github.event_name == 'workflow_dispatch' && inputs.run_adobe_live && inputs.xd_live && steps.inventory.outputs.interactive == 'true' && steps.inventory.outputs.xd_found == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $args = @('--connect-timeout', '30')
          if ('${{ inputs.xd_write }}' -eq 'true') {
            $args += @('--write', '--approval-timeout', '90')
          }
          uv run python scripts/xd_real_e2e.py @args

      - name: Adobe environment status
        if: always()
        shell: powershell
        run: |
          Write-Host "INTERACTIVE=${{ steps.inventory.outputs.interactive }}"
          Write-Host "PHOTOSHOP_FOUND=${{ steps.inventory.outputs.photoshop_found }}"
          Write-Host "ILLUSTRATOR_FOUND=${{ steps.inventory.outputs.illustrator_found }}"
          Write-Host "XD_INSTALLATION=${{ steps.inventory.outputs.xd_found }}"
          Write-Host 'XD_BRIDGE=IMPLEMENTED: local UXP WebSocket bridge with explicit Apply pending approval for mutations.'
          if ('${{ github.event_name }}' -ne 'workflow_dispatch' -or '${{ inputs.run_adobe_live }}' -ne 'true') {
            Write-Host 'LIVE_E2E=SKIPPED: push CI never writes to Adobe applications. Use workflow_dispatch with run_adobe_live=true.'
          }

      - name: Live Adobe prerequisite gate
        if: always() && github.event_name == 'workflow_dispatch' && inputs.run_adobe_live
        shell: powershell
        run: |
          if ('${{ steps.inventory.outputs.interactive }}' -ne 'true') {
            throw 'BLOCKED: Adobe live E2E requires the repository runner in an interactive desktop session. Run scripts/start_adobe_runner_interactive.ps1 -StopService from an elevated logged-in PowerShell, keep the runner console open, then dispatch this workflow again.'
          }
          if ('${{ steps.inventory.outputs.photoshop_found }}' -ne 'true') { throw 'BLOCKED: Photoshop installation is not visible to the interactive runner account.' }
          if ('${{ steps.inventory.outputs.illustrator_found }}' -ne 'true') { throw 'BLOCKED: Illustrator installation is not visible to the interactive runner account.' }
          if ('${{ inputs.xd_live }}' -eq 'true' -and '${{ steps.inventory.outputs.xd_found }}' -ne 'true') { throw 'BLOCKED: Adobe XD installation is not visible to the interactive runner account.' }
          if ('${{ inputs.xd_write }}' -eq 'true' -and '${{ inputs.xd_live }}' -ne 'true') { throw 'Invalid dispatch: xd_write=true requires xd_live=true.' }
