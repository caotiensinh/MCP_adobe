name: Diagnose Adobe XD queue retention

on:
  push:
    branches: [feat/xd-live-interaction]
    paths:
      - ".github/workflows/diagnose-xd-queue.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    env:
      PYTHONUTF8: "1"
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      - name: Prepare MCP client runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $machine=[Environment]::GetEnvironmentVariable('Path','Machine')
          $user=[Environment]::GetEnvironmentVariable('Path','User')
          $env:Path=(@($machine,$user,$env:Path) | Where-Object {$_}) -join ';'
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)){
            $uvDir=Join-Path $HOME '.local\bin'
            if(Test-Path (Join-Path $uvDir 'uv.exe')){ $env:Path="$uvDir;$env:Path" }
          }
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)){ throw 'uv unavailable' }
          uv sync --python 3.12
          if($LASTEXITCODE -ne 0){ throw "uv sync failed rc=$LASTEXITCODE" }

      - name: Ensure loaded XD panel is connected
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes

          $xd=Get-Process -ErrorAction SilentlyContinue |
            Where-Object {
              ($_.ProcessName -match '^(XD|AdobeXD)$' -or $_.MainWindowTitle -match 'Adobe XD') -and
              $_.MainWindowHandle -ne 0
            } |
            Select-Object -First 1
          if(-not $xd){ throw 'Adobe XD interactive window is not open' }
          if($xd.MainWindowTitle -eq 'Adobe XD'){ throw 'Adobe XD is still on Home screen; queue diagnostic requires document context' }
          Write-Host "XD_QUEUE_DIAG_WINDOW=PASS PID=$($xd.Id) TITLE=$($xd.MainWindowTitle)"

          $connected=@(Get-NetTCPConnection -State Established -LocalPort 8765 -ErrorAction SilentlyContinue)
          if($connected.Count -eq 0){
            $root=[System.Windows.Automation.AutomationElement]::FromHandle($xd.MainWindowHandle)
            if(-not $root){ throw 'UI Automation could not attach to XD' }
            $cond=New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::AutomationIdProperty,
              'reconnect'
            )
            $button=$root.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$cond)
            if(-not $button){ throw 'XD MCP Reconnect button not found' }
            try {
              $invoke=$button.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
              $invoke.Invoke()
            } catch {
              $legacy=$button.GetCurrentPattern([System.Windows.Automation.LegacyIAccessiblePattern]::Pattern)
              $legacy.DoDefaultAction()
            }
            Write-Host 'XD_QUEUE_DIAG_RECONNECT_REQUEST=PASS'
            $deadline=(Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $connected=@(Get-NetTCPConnection -State Established -LocalPort 8765 -ErrorAction SilentlyContinue)
            } until($connected.Count -gt 0 -or (Get-Date) -gt $deadline)
          }
          if($connected.Count -eq 0){ throw 'XD panel is not connected to bridge port 8765' }
          Write-Host "XD_QUEUE_DIAG_WS=PASS connections=$($connected.Count)"

      - name: Queue each XD visual step and inspect retention
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import asyncio
          import json
          from collections.abc import Mapping
          from mcp import Client

          URL = "http://127.0.0.1:8787/mcp"

          STEPS = [
              ("01 card background", "creative.shape.rectangle", {
                  "name": "XD Queue Probe Card",
                  "width": 520, "height": 320, "x": 120, "y": 100, "fill": "#1F2937",
              }),
              ("02 accent", "creative.shape.rectangle", {
                  "name": "XD Queue Probe Accent",
                  "width": 18, "height": 320, "x": 120, "y": 100, "fill": "#F05A67",
              }),
              ("03 title", "creative.text.create", {
                  "name": "XD Queue Probe Title",
                  "text": "MCP Adobe XD",
                  "fontSize": 34, "x": 180, "y": 155, "fill": "#FFFFFF",
              }),
              ("04 subtitle", "creative.text.create", {
                  "name": "XD Queue Probe Subtitle",
                  "text": "Live MCP queue retention",
                  "fontSize": 20, "x": 180, "y": 215, "fill": "#D1D5DB",
              }),
              ("05 button", "creative.shape.rectangle", {
                  "name": "XD Queue Probe Button",
                  "width": 190, "height": 58, "x": 180, "y": 310, "fill": "#2563EB",
              }),
              ("06 button label", "creative.text.create", {
                  "name": "XD Queue Probe Button Label",
                  "text": "Continue",
                  "fontSize": 20, "x": 230, "y": 327, "fill": "#FFFFFF",
              }),
          ]

          def walk(value):
              yield value
              if isinstance(value, Mapping):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from walk(child)

          def values_for_key(value, key):
              return [
                  node[key]
                  for node in walk(value)
                  if isinstance(node, Mapping) and key in node
              ]

          def first_key(value, key):
              vals = values_for_key(value, key)
              return vals[0] if vals else None

          async def call(client, tool, capability, arguments):
              result = await client.call_tool(
                  tool,
                  {
                      "application": "xd",
                      "capability": capability,
                      "arguments": arguments,
                  },
              )
              payload = result.structured_content
              print(
                  "XD_QUEUE_DIAG_CALL=" +
                  json.dumps(
                      {
                          "tool": tool,
                          "capability": capability,
                          "is_error": result.is_error,
                          "structured": payload,
                          "content": [str(x) for x in result.content],
                      },
                      ensure_ascii=False,
                      default=str,
                  ),
                  flush=True,
              )
              if result.is_error:
                  raise RuntimeError(f"{tool}/{capability} failed: {result}")
              return payload

          async def health(client):
              payload = await call(client, "creative_read", "creative.health", {})
              return first_key(payload, "pending_count"), payload

          async def clear(client, reason):
              payload = await call(
                  client,
                  "creative_write",
                  "xd.queue.clear",
                  {"reason": reason},
              )
              pending, _ = await health(client)
              if pending != 0:
                  raise RuntimeError(f"XD queue clear did not reach zero: {pending}")
              return payload

          async def main():
              async with Client(URL) as client:
                  start_pending, start_health = await health(client)
                  print(
                      "XD_QUEUE_DIAG_START=" +
                      json.dumps(
                          {
                              "pending_count": start_pending,
                              "bridge_build": first_key(start_health, "bridge_build"),
                              "bridge": first_key(start_health, "bridge"),
                          },
                          ensure_ascii=False,
                      ),
                      flush=True,
                  )
                  await clear(client, "queue retention diagnostic start")

                  observations = []
                  try:
                      for index, (label, capability, arguments) in enumerate(STEPS, start=1):
                          before_ws = None
                          written = await call(client, "creative_write", capability, arguments)
                          write_pending = first_key(written, "pending_count")
                          operation_id = first_key(written, "operation_id")
                          status = first_key(written, "status")
                          health_pending, health_payload = await health(client)
                          observation = {
                              "index": index,
                              "label": label,
                              "capability": capability,
                              "status": status,
                              "operation_id": operation_id,
                              "write_pending": write_pending,
                              "health_pending": health_pending,
                              "bridge": first_key(health_payload, "bridge"),
                              "bridge_build": first_key(health_payload, "bridge_build"),
                          }
                          observations.append(observation)
                          print(
                              "XD_QUEUE_DIAG_STEP=" +
                              json.dumps(observation, ensure_ascii=False, default=str),
                              flush=True,
                          )
                          if write_pending != index or health_pending != index:
                              print(
                                  "XD_QUEUE_DIAG_FIRST_DIVERGENCE=" +
                                  json.dumps(observation, ensure_ascii=False, default=str),
                                  flush=True,
                              )
                              break
                  finally:
                      await clear(client, "queue retention diagnostic cleanup")
                      print("XD_QUEUE_DIAG_CLEANUP=PASS pending_count=0", flush=True)

                  if len(observations) == len(STEPS):
                      expected = list(range(1, len(STEPS) + 1))
                      write_counts = [item["write_pending"] for item in observations]
                      health_counts = [item["health_pending"] for item in observations]
                      if write_counts == expected and health_counts == expected:
                          print(
                              "XD_QUEUE_RETENTION=PASS " +
                              json.dumps(observations, ensure_ascii=False, default=str),
                              flush=True,
                          )
                          return

                  raise RuntimeError(
                      "XD queue retention diverged: " +
                      json.dumps(observations, ensure_ascii=False, default=str)
                  )

          asyncio.run(main())
          '@ | Set-Content -Path xd_queue_retention_diag.py -Encoding UTF8
          uv run python xd_queue_retention_diag.py

      - name: Capture XD bridge socket state
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Get-NetTCPConnection -LocalPort 8765 -ErrorAction SilentlyContinue |
            Sort-Object State,RemotePort |
            ForEach-Object {
              Write-Host "XD_QUEUE_DIAG_TCP STATE=$($_.State) PID=$($_.OwningProcess) LOCAL=$($_.LocalAddress):$($_.LocalPort) REMOTE=$($_.RemoteAddress):$($_.RemotePort)"
            }
