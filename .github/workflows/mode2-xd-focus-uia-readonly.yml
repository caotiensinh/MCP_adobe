name: Mode 2 XD foreground UIA host diagnostic
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-focus-uia-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  host-window:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Inspect and focus only the verified Adobe XD disposable window
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $expected='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          foreach($rel in @('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd','mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd')){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $expected){throw 'MODE2_DISPOSABLE_PROTECTED_HASH_CHANGED'}
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Mode2ForegroundWin {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          '@
          $scope=[System.Windows.Automation.TreeScope]::Children
          $desc=[System.Windows.Automation.TreeScope]::Descendants
          $cond=[System.Windows.Automation.Condition]::TrueCondition
          function Get-XD {
            $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
            return @($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          }
          $xd=@(Get-XD)
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_WRONG_DISPOSABLE_WINDOW'}
          $win=$test[0]
          $nativeHandle=[IntPtr]$win.Current.NativeWindowHandle
          $foreground=[Mode2ForegroundWin]::GetForegroundWindow()
          $p=$win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
          Write-Host "MODE2_UIA_HOST_HANDLE=$nativeHandle FOREGROUND_BEFORE=$foreground MINIMIZED=$($p.Current.WindowVisualState)"
          $children=$win.FindAll($desc,$cond)
          Write-Host "MODE2_UIA_DESCENDANTS_BEFORE=$($children.Count)"
          foreach($x in @($children)|Select-Object -First 30){
            Write-Host "MODE2_UIA_BEFORE_TYPE=$([string]$x.Current.ControlType.ProgrammaticName) NAME=$([string]$x.Current.Name) ID=$([string]$x.Current.AutomationId)"
          }
          if($p.Current.WindowVisualState -eq [System.Windows.Automation.WindowVisualState]::Minimized){
            $p.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Normal)
          }
          try{$win.SetFocus()}catch{Write-Host "MODE2_SETFOCUS_NOT_AVAILABLE=$($_.Exception.GetType().Name)"}
          [void][Mode2ForegroundWin]::SetForegroundWindow($nativeHandle)
          Start-Sleep -Seconds 3
          $xd=@(Get-XD)
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_HOST_CHANGED_AFTER_FOCUS'}
          $children=$test[0].FindAll($desc,$cond)
          Write-Host "MODE2_UIA_DESCENDANTS_AFTER=$($children.Count) FOREGROUND_AFTER=$([Mode2ForegroundWin]::GetForegroundWindow())"
          foreach($x in @($children)|Select-Object -First 40){
            Write-Host "MODE2_UIA_AFTER_TYPE=$([string]$x.Current.ControlType.ProgrammaticName) NAME=$([string]$x.Current.Name) ID=$([string]$x.Current.AutomationId)"
          }
          $file=@($children|Where-Object {[string]$_.Current.AutomationId -eq 'AppMenu_File'})
          $plugin=@($children|Where-Object {[string]$_.Current.AutomationId -eq 'AppMenuBar_Plugins'})
          Write-Host "MODE2_UIA_FILE_COUNT=$($file.Count) PLUGINS_COUNT=$($plugin.Count)"
          Write-Host 'MODE2_UIA_FOCUS_READONLY_COMPLETE=PASS'
