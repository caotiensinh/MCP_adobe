name: Mode 2 XD cold-reopen saved rectangle and probe new Fill inspector once
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-fill-inspector-cold-reopen-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  cold-reopen:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Close only clean saved disposable XD once, cold reopen, verify new UXP method without writes
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){
            throw 'MODE2_WRONG_HOST_OR_DESKTOP'
          }
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $base='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          $saved='1E15162107A64E3D7D4CAF8C12B88FE24B64488DA9788854E6D300DDBAE88C2F'
          $native=Join-Path $root 'mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd'
          $pandas=@('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd')
          foreach($rel in $pandas){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $base){
              throw 'MODE2_PANDA_HASH_CHANGED_NO_EXIT'
            }
          }
          if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash -ne $saved){throw 'MODE2_TEST_SHA_CHANGED_NO_EXIT'}
          $receipt=Get-Content -LiteralPath (Join-Path $root 'mode2-disposable-native\mode2_fill_rect_guid_receipt.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if($receipt.node_id -ne '9989e92f-7c9b-4721-9cdc-b5b5ea33cdf2' -or $receipt.state -ne 'applied'){
            throw 'MODE2_RECT_RECEIPT_UNVERIFIED'
          }
          $marker=Join-Path $root 'mode2-disposable-native\Mode2_FillInspector_ColdReopen_Once.marker'
          if(Test-Path -LiteralPath $marker){throw 'MODE2_COLD_REOPEN_ALREADY_ATTEMPTED_NO_REPLAY'}
          $develop=Join-Path $env:LOCALAPPDATA 'Packages\Adobe.XD_pc75e8sa7ep4e\LocalState\develop'
          $installed=Join-Path $develop 'MCPAdobeMode2Experiment\main.js'
          $production=Join-Path $develop 'MCPAdobeBridge\main.js'
          $git=(Get-Command git -ErrorAction Stop).Source
          if((& $git hash-object -- $installed).Trim() -ne 'd47edb15284ff4653da919513815fe4f9d846a70'){
            throw 'MODE2_NEW_EXPERIMENTAL_UXP_NOT_INSTALLED'
          }
          $prodSha=(Get-FileHash -LiteralPath $production -Algorithm SHA256).Hash
          if(@(Get-Process -Name Illustrator,Photoshop,PickerHost -ErrorAction SilentlyContinue).Count -gt 0){
            throw 'MODE2_FOREIGN_ADOBE_PROCESS_OR_DIALOG'
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $scope=[System.Windows.Automation.TreeScope]::Children
          $desc=[System.Windows.Automation.TreeScope]::Descendants
          $cond=[System.Windows.Automation.Condition]::TrueCondition
          $aid=[System.Windows.Automation.AutomationElement]::AutomationIdProperty
          function XD-Windows {
            return @([System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond) |
              Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          }
          $xd=@(XD-Windows)
          $test=@($xd|Where-Object{[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_NOT_ONLY_SAVED_DISPOSABLE_WINDOW'}
          $win=$test[0]
          $oldPid=$win.Current.ProcessId
          $running=@(Get-Process -Name XD -ErrorAction SilentlyContinue)
          if($running.Count -ne 1 -or $running[0].Id -ne $oldPid){
            throw 'MODE2_XD_PROCESS_OWNERSHIP_AMBIGUOUS'
          }
          $wp=$win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
          if($wp.Current.WindowVisualState -eq [System.Windows.Automation.WindowVisualState]::Minimized){
            $wp.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Normal)
          }
          try{$win.SetFocus()}catch{}
          Start-Sleep -Milliseconds 650
          $fileMenu=$win.FindFirst($desc,(New-Object System.Windows.Automation.PropertyCondition($aid,'AppMenu_File')))
          if(-not $fileMenu){throw 'MODE2_FILE_MENU_NOT_FOUND'}
          $fx=$fileMenu.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
          if($fx.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$fx.Expand()}
          Start-Sleep -Milliseconds 260
          $menus=$win.FindAll($desc,$cond)
          $save=@($menus|Where-Object{
            [string]$_.Current.AutomationId -eq 'AppMenu_Save' -and
            [string]$_.Current.ControlType.ProgrammaticName -eq 'ControlType.MenuItem'
          })
          $fx.Collapse()
          if($save.Count -ne 1 -or $save[0].Current.IsEnabled){throw 'MODE2_DOCUMENT_DIRTY_REFUSE_COLD_REOPEN'}
          Write-Host 'MODE2_SAVED_DOCUMENT_CLEAN_BEFORE_COLD_REOPEN=PASS'
          "run=$env:GITHUB_RUN_ID oldpid=$oldPid at=$([DateTime]::UtcNow.ToString('o'))"|
            Set-Content -LiteralPath $marker -Encoding ASCII -NoNewline
          $wp.Close()
          Write-Host "MODE2_GRACEFUL_XD_CLOSE_INVOKED_ONCE_PID=$oldPid"
          $exited=$false
          for($i=1;$i -le 24;$i++){
            Start-Sleep -Milliseconds 600
            if(!(Get-Process -Id $oldPid -ErrorAction SilentlyContinue)){$exited=$true;break}
          }
          if(-not $exited){throw 'MODE2_XD_PROCESS_STILL_RUNNING_AFTER_GRACEFUL_CLOSE_NO_FORCE_KILL'}
          Write-Host 'MODE2_OLD_XD_PROCESS_EXITED=PASS'
          if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash -ne $saved){throw 'MODE2_TEST_FILE_CHANGED_ON_CLOSE'}
          $tracking=$env:RUNNER_TRACKING_ID
          try{$env:RUNNER_TRACKING_ID='';Start-Process -FilePath $native -ErrorAction Stop}
          finally{$env:RUNNER_TRACKING_ID=$tracking}
          Write-Host 'MODE2_SAVED_DISPOSABLE_COLD_OPEN_REQUESTED_ONCE'
          $newPid=0
          for($i=1;$i -le 30;$i++){
            Start-Sleep -Seconds 2
            $xd=@(XD-Windows)
            $test=@($xd|Where-Object{[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
            $p=@(Get-NetTCPConnection -LocalPort 8765 -State Established -ErrorAction SilentlyContinue)
            if($xd.Count -gt 1){throw 'MODE2_FOREIGN_XD_AFTER_REOPEN'}
            if($xd.Count -eq 1 -and $test.Count -eq 1 -and $test[0].Current.ProcessId -ne $oldPid -and $p.Count -ge 1){
              $newPid=$test[0].Current.ProcessId;break
            }
            Write-Host "MODE2_COLD_REOPEN_POLL=$i XD=$($xd.Count) TEST=$($test.Count) PROD8765=$($p.Count)"
          }
          if($newPid -eq 0){throw 'MODE2_NEW_XD_PROCESS_NOT_ATTESTED'}
          Write-Host "MODE2_NEW_XD_PROCESS_PID=$newPid"
          $win=$test[0]
          $wp=$win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
          if($wp.Current.WindowVisualState -eq [System.Windows.Automation.WindowVisualState]::Minimized){
            $wp.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Normal)
          }
          try{$win.SetFocus()}catch{}
          Start-Sleep -Milliseconds 600
          if(@(Get-NetTCPConnection -LocalPort 8766 -State Listen -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_UNKNOWN_8766_LISTENER'}
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          $uv=(Get-Command uv -ErrorAction Stop).Source
          & $uv run --python 3.12 python -m py_compile scripts/mode2_fill_method_presence_probe.py
          if($LASTEXITCODE -ne 0){throw 'MODE2_PRESENCE_PROBE_INVALID'}
          $out=Join-Path $env:RUNNER_TEMP 'mode2_cold_inspector_out.txt'
          $err=Join-Path $env:RUNNER_TEMP 'mode2_cold_inspector_err.txt'
          $child=Start-Process -FilePath $uv -ArgumentList @('run','--python','3.12','python','scripts/mode2_fill_method_presence_probe.py','--wait-seconds','70') -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
          try{
            $listen=$false
            for($i=1;$i -le 38;$i++){
              Start-Sleep -Milliseconds 400
              if($child.HasExited){throw 'MODE2_COLD_PRESENCE_LISTENER_EXITED'}
              if(@(Get-NetTCPConnection -LocalPort 8766 -State Listen -ErrorAction SilentlyContinue).Count -eq 1){$listen=$true;break}
            }
            if(-not $listen){throw 'MODE2_PRESENCE_LISTENER_NOT_READY'}
            $plugins=$win.FindFirst($desc,(New-Object System.Windows.Automation.PropertyCondition($aid,'AppMenuBar_Plugins')))
            if(-not $plugins){throw 'MODE2_PLUGINS_MENU_MISSING'}
            $px=$plugins.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
            if($px.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$px.Expand()}
            Start-Sleep -Milliseconds 250
            $items=$win.FindAll($desc,$cond)
            $exp=@($items|Where-Object{
              [string]$_.Current.Name -eq 'MCP Adobe Mode 2 Experimental' -and
              [string]$_.Current.ControlType.ProgrammaticName -eq 'ControlType.MenuItem'
            })
            if($exp.Count -ne 1){throw 'MODE2_EXPERIMENTAL_MENU_NOT_UNIQUE_AFTER_COLD_REOPEN'}
            $ex=$exp[0].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
            if($ex.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$ex.Expand()}
            Start-Sleep -Milliseconds 250
            $items=$win.FindAll($desc,$cond)
            $connect=@($items|Where-Object{
              [string]$_.Current.Name -eq 'MCP Adobe Mode 2 Connect' -and
              [string]$_.Current.ControlType.ProgrammaticName -eq 'ControlType.MenuItem' -and $_.Current.IsEnabled
            })
            if($connect.Count -ne 1){throw 'MODE2_EXPERIMENTAL_CONNECT_NOT_UNIQUE'}
            $connect[0].GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Write-Host 'MODE2_COLD_EXPERIMENTAL_CONNECT_INVOKED_ONCE'
            if(-not $child.WaitForExit(80000)){throw 'MODE2_COLD_INSPECTOR_PROBE_TIMEOUT'}
            if(Test-Path -LiteralPath $out){Get-Content -LiteralPath $out|ForEach-Object{Write-Host $_}}
            if(Test-Path -LiteralPath $err){Get-Content -LiteralPath $err -Tail 20|ForEach-Object{Write-Host "MODE2_COLD_ERR=$_"}}
            if($child.ExitCode -ne 0 -or
               -not (Select-String -LiteralPath $out -Pattern '^MODE2_LIVE_FILL_INSPECTOR_METHOD_PRESENT=PASS$' -Quiet)){
              throw 'MODE2_NEW_UXP_NOT_CONFIRMED_AFTER_COLD_REOPEN'
            }
          }finally{
            if(-not $child.HasExited){Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue}
            if(Test-Path -LiteralPath $out){Get-Content -LiteralPath $out -Tail 12|ForEach-Object{Write-Host "MODE2_COLD_PROBE_OUT=$_"}}
            if(Test-Path -LiteralPath $err){Get-Content -LiteralPath $err -Tail 12|ForEach-Object{Write-Host "MODE2_COLD_PROBE_ERR=$_"}}
          }
          foreach($rel in $pandas){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $base){throw 'MODE2_PROTECTED_CHANGED'}
          }
          if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash -ne $saved){throw 'MODE2_DISPOSABLE_CHANGED'}
          if((Get-FileHash -LiteralPath $production -Algorithm SHA256).Hash -ne $prodSha){throw 'MODE2_PRODUCTION_PLUGIN_CHANGED'}
          Write-Host 'MODE2_COLD_REOPEN_FILL_CAPABILITY_VERIFIED=PASS'
          Write-Host 'MODE2_NO_ADOBE_DOCUMENT_WRITE_ATTEMPTED=True'
