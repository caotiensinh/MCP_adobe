name: Canvas annotation targeting tests
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths:
      - src/mcp_adobe/region_targeting.py
      - tests/test_region_targeting.py
      - tests/test_region_annotation_ui.py
      - ui/region_annotation.html
      - scripts/export_region_metadata.py
      - tests/test_export_region_metadata.py
      - src/mcp_adobe/xd_scenegraph_targeting.py
      - tests/test_xd_scenegraph_targeting.py
      - adobe-xd-plugin/main.js
      - scripts/capture_region_preview.py
      - tests/test_capture_region_preview.py
      - scripts/capture_bound_region_pair.py
      - scripts/probe_adobe_desktop_health.py
      - tests/test_capture_bound_region_pair.py
      - tests/xd_scenegraph_uxp_contract.cjs
      - .github/workflows/canvas-region-targeting.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  region:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python MCP dependencies
        run: python -m pip install "mcp>=2,<3"
      - name: Run targeting and metadata normalization tests without model calls
        run: |
          PYTHONPATH=src python -m unittest tests.test_region_targeting tests.test_region_annotation_ui tests.test_export_region_metadata tests.test_xd_scenegraph_targeting tests.test_capture_region_preview tests.test_capture_bound_region_pair -v
      - name: Validate browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]; self.active=False
              def handle_starttag(self, tag, attrs):
                  if tag=='script': self.active=True
              def handle_endtag(self, tag):
                  if tag=='script': self.active=False
              def handle_data(self, data):
                  if self.active: self.scripts.append(data)
          parser=Scripts(); parser.feed(Path('ui/region_annotation.html').read_text(encoding='utf-8'))
          Path('/tmp/region-annotation.js').write_text('\n'.join(parser.scripts),encoding='utf-8')
          PY
          node --check /tmp/region-annotation.js
          node --check adobe-xd-plugin/main.js
          node tests/xd_scenegraph_uxp_contract.cjs

  live-metadata-read:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        application: [photoshop, illustrator, xd]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Export real Photoshop document metadata (read-only)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $machine=[Environment]::GetEnvironmentVariable('Path','Machine')
          $user=[Environment]::GetEnvironmentVariable('Path','User')
          $env:Path=(@($machine,$user,$env:Path) | Where-Object {$_}) -join ';'
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)){throw 'uv missing'}
          uv sync --python 3.12
          if($LASTEXITCODE -ne 0){throw 'uv sync failed'}
          uv run python scripts/export_region_metadata.py --application "${{ matrix.application }}" --output "$env:RUNNER_TEMP\adobe_region_metadata_${{ matrix.application }}.json"
          if($LASTEXITCODE -ne 0){throw 'REGION_METADATA=FAIL upstream snapshot unavailable'}
          Write-Host 'REGION_METADATA_LIVE=PASS read-only snapshot'

  desktop-health-probe:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check PS AI XD via existing MCP read-only endpoint
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=([Environment]::GetEnvironmentVariable('Path','Machine')+';'+[Environment]::GetEnvironmentVariable('Path','User')+';'+$env:Path)
          uv sync --python 3.12
          if($LASTEXITCODE -ne 0){throw 'uv sync failed'}
          uv run python scripts/probe_adobe_desktop_health.py
          if($LASTEXITCODE -ne 0){throw 'desktop probe failed'}
