name: Illustrator restored-host CEP acceptance
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/illustrator-restored-host-cep-acceptance.yml"]
permissions:
  contents: read
concurrency:
  group: illustrator-desktop-exclusive
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Verify Illustrator and CEP readiness after launch
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Start-Sleep -Seconds 10
          $ai=@(Get-Process Illustrator -ErrorAction SilentlyContinue)
          $cep=@(Get-Process CEPHtmlEngine -ErrorAction SilentlyContinue)
          Write-Output "HOST=$env:COMPUTERNAME AI_COUNT=$($ai.Count) CEP_COUNT=$($cep.Count)"
          foreach($p in $ai){Write-Output "AI_PROCESS pid=$($p.Id) responding=$($p.Responding) title=$($p.MainWindowTitle)"}
          $port=@(Get-NetTCPConnection -LocalPort 8081 -State Established -ErrorAction SilentlyContinue)
          Write-Output "CEP_SOCKET_COUNT=$($port.Count)"
          $gateway=@(Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue)
          Write-Output "GATEWAY_LISTEN=$($gateway.Count)"
          $trace=Join-Path $env:LOCALAPPDATA 'MCPAdobe\illustrator-mcp\callback_trace.log'
          if(Test-Path $trace){Write-Output "TRACE_LAST_WRITE=$((Get-Item $trace).LastWriteTime.ToString('o'))"}
          if($ai.Count -lt 1){throw "Illustrator closed after recovery"}
