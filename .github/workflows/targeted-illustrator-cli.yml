name: Targeted Illustrator BridgeTalk staged probe

on:
  push:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-illustrator-cli.yml"

concurrency:
  group: targeted-illustrator-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staged-probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Separate startup loader from BridgeTalk runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Process -Name Illustrator -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          $target=$null
          if($p){$target=$p.Path}
          if(-not $target){
            $shell=New-Object -ComObject WScript.Shell
            $roots=@((Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'),(Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'))
            foreach($root in $roots){
              if(-not (Test-Path -LiteralPath $root)){continue}
              foreach($lnk in @(Get-ChildItem -LiteralPath $root -Recurse -Filter '*.lnk' -File -ErrorAction SilentlyContinue | Where-Object {$_.Name -match 'Illustrator'})){
                $candidate=$shell.CreateShortcut($lnk.FullName).TargetPath
                if($candidate -and (Test-Path -LiteralPath $candidate -PathType Leaf)){$target=$candidate;break}
              }
              if($target){break}
            }
          }
          if(-not $target){throw 'Illustrator executable not found'}
          Write-Host "ILLUSTRATOR_EXE=$target"
          $windowsDir=Split-Path $target -Parent
          $contentsDir=Split-Path $windowsDir -Parent
          $supportDir=Split-Path $contentsDir -Parent
          $installRoot=Split-Path $supportDir -Parent
          $startupDir=Join-Path $installRoot 'Startup Scripts'
          New-Item -ItemType Directory -Force -Path $startupDir | Out-Null

          $ready=Join-Path $env:RUNNER_TEMP 'mcp_adobe_bt_stage_ready.txt'
          $loaded=Join-Path $env:RUNNER_TEMP 'mcp_adobe_bt_stage_loaded.txt'
          $result=Join-Path $env:RUNNER_TEMP 'mcp_adobe_bt_stage_result.txt'
          $readyProbe=Join-Path $startupDir '00_mcp_adobe_ready_probe.jsx'
          $btProbe=Join-Path $startupDir '01_mcp_adobe_bt_probe.jsx'
          Remove-Item -Force $ready,$loaded,$result,$readyProbe,$btProbe -ErrorAction SilentlyContinue
          $readyJs=$ready.Replace('\','/')
          $loadedJs=$loaded.Replace('\','/')
          $resultJs=$result.Replace('\','/')

          $readyLines=@(
            '#target illustrator',
            "var f=new File('$readyJs');if(f.open('w')){f.write('PASS:'+app.version);f.close();}"
          )
          [IO.File]::WriteAllLines($readyProbe,$readyLines,(New-Object Text.UTF8Encoding($false)))

          $body="var z=new File('$resultJs');if(z.open('w')){z.write('PASS:'+app.version);z.close();}"
          $bodyEscaped=$body.Replace('"','\"')
          $bodyLine='bt.body="' + $bodyEscaped + '";'
          $btLines=@(
            '#target illustrator',
            "var l=new File('$loadedJs');if(l.open('w')){l.write('LOADED:'+app.version);l.close();}",
            'var bt=new BridgeTalk();',
            'bt.target="illustrator";',
            $bodyLine,
            'bt.send();'
          )
          [IO.File]::WriteAllLines($btProbe,$btLines,(New-Object Text.UTF8Encoding($false)))
          Write-Host '=== 01 BridgeTalk probe ==='
          Get-Content -LiteralPath $btProbe

          try {
            Get-Process -Name Illustrator -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            Start-Process -FilePath $target | Out-Null
            $deadline=[DateTime]::UtcNow.AddSeconds(45)
            while(-not (Test-Path -LiteralPath $ready) -and [DateTime]::UtcNow -lt $deadline){Start-Sleep -Milliseconds 500}
            if(-not (Test-Path -LiteralPath $ready)){throw 'Known-good 00 startup probe did not run'}
            Write-Host "READY=$(Get-Content -LiteralPath $ready -Raw)"

            $deadline=[DateTime]::UtcNow.AddSeconds(10)
            while(-not (Test-Path -LiteralPath $loaded) -and [DateTime]::UtcNow -lt $deadline){Start-Sleep -Milliseconds 200}
            if(-not (Test-Path -LiteralPath $loaded)){throw '01 BridgeTalk startup file did not reach LOADED marker'}
            Write-Host "LOADED=$(Get-Content -LiteralPath $loaded -Raw)"

            $deadline=[DateTime]::UtcNow.AddSeconds(20)
            while(-not (Test-Path -LiteralPath $result) -and [DateTime]::UtcNow -lt $deadline){Start-Sleep -Milliseconds 200}
            if(-not (Test-Path -LiteralPath $result)){throw 'BridgeTalk message was sent but result body did not execute'}
            $value=Get-Content -LiteralPath $result -Raw
            Write-Host "SELF_MESSAGE_RESULT=$value"
            if($value -notmatch '^PASS:'){throw "Unexpected result: $value"}
          } finally {
            Remove-Item -Force $readyProbe,$btProbe -ErrorAction SilentlyContinue
          }
