name: Targeted Illustrator session diagnostics

on:
  push:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-illustrator-cli.yml"

concurrency:
  group: targeted-illustrator-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  session-diagnostics:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect runner and Adobe Windows sessions
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Host "CURRENT_USER=$env:USERNAME"
          Write-Host "CURRENT_SESSION_ID=$([System.Diagnostics.Process]::GetCurrentProcess().SessionId)"
          Write-Host '=== Relevant processes ==='
          Get-Process -ErrorAction SilentlyContinue |
            Where-Object { $_.ProcessName -match 'Runner|Illustrator|Photoshop|powershell|explorer' } |
            Sort-Object SessionId,ProcessName |
            Select-Object ProcessName,Id,SessionId,Path |
            Format-Table -AutoSize
          Write-Host '=== quser ==='
          quser 2>&1
          Write-Host '=== qwinsta ==='
          qwinsta 2>&1
          Write-Host '=== service status ==='
          Get-CimInstance Win32_Service -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match 'actions.runner|github' -or $_.DisplayName -match 'Actions Runner|GitHub' } |
            Select-Object Name,State,StartName,ProcessId,PathName |
            Format-List
