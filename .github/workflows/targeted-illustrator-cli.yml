name: Targeted Illustrator startup script bootstrap

on:
  push:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-illustrator-cli.yml"

concurrency:
  group: targeted-illustrator-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  startup-script:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Probe Illustrator Startup Scripts bootstrap
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Process -Name Illustrator -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          $target=$null
          if($p){$target=$p.Path}
          if(-not $target){
            $shell=New-Object -ComObject WScript.Shell
            $roots=@((Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'),(Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'))
            foreach($root in $roots){
              if(-not (Test-Path -LiteralPath $root)){continue}
              foreach($lnk in @(Get-ChildItem -LiteralPath $root -Recurse -Filter '*.lnk' -File -ErrorAction SilentlyContinue | Where-Object {$_.Name -match 'Illustrator'})){
                $candidate=$shell.CreateShortcut($lnk.FullName).TargetPath
                if($candidate -and (Test-Path -LiteralPath $candidate -PathType Leaf)){$target=$candidate;break}
              }
              if($target){break}
            }
          }
          if(-not $target){throw 'Illustrator executable not found'}
          Write-Host "ILLUSTRATOR_EXE=$target"
          $windowsDir=Split-Path $target -Parent
          $contentsDir=Split-Path $windowsDir -Parent
          $supportDir=Split-Path $contentsDir -Parent
          $installRoot=Split-Path $supportDir -Parent
          $startupDir=Join-Path $installRoot 'Startup Scripts'
          New-Item -ItemType Directory -Force -Path $startupDir | Out-Null
          Write-Host "STARTUP_DIR=$startupDir"
          $probe=Join-Path $startupDir 'mcp_adobe_bootstrap_probe.jsx'
          $marker=Join-Path $env:RUNNER_TEMP 'mcp_adobe_illustrator_startup_marker.txt'
          Remove-Item -Force $marker,$probe -ErrorAction SilentlyContinue
          $markerJs=$marker.Replace('\','/')
          $lines=@(
            '#target illustrator',
            "try { app.preferences.setBooleanPreference('ShowExternalJSXWarning', false); } catch(e) {}",
            "var f=new File('$markerJs');",
            "if(!f.open('w')){throw new Error('open marker failed');}",
            "f.write('PASS:'+app.version);",
            'f.close();'
          )
          [IO.File]::WriteAllLines($probe,$lines,(New-Object Text.UTF8Encoding($false)))
          try {
            Get-Process -Name Illustrator -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            Start-Process -FilePath $target | Out-Null
            $deadline=[DateTime]::UtcNow.AddSeconds(45)
            while(-not (Test-Path -LiteralPath $marker) -and [DateTime]::UtcNow -lt $deadline){Start-Sleep -Milliseconds 500}
            if(-not (Test-Path -LiteralPath $marker)){
              $proc=Get-Process -Name Illustrator -ErrorAction SilentlyContinue | Select-Object -First 1
              Write-Host "ILLUSTRATOR_RUNNING=$([bool]$proc)"
              throw 'Illustrator Startup Scripts probe did not create marker within 45 seconds'
            }
            $value=Get-Content -LiteralPath $marker -Raw
            Write-Host "STARTUP_SCRIPT_RESULT=$value"
            if($value -notmatch '^PASS:'){throw "Unexpected startup marker: $value"}
          } finally {
            Remove-Item -Force $probe -ErrorAction SilentlyContinue
          }
