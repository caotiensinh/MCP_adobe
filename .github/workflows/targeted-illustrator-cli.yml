name: Targeted Illustrator JSX CLI variants

on:
  push:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-illustrator-cli.yml"

concurrency:
  group: targeted-illustrator-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli-variants:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Probe Illustrator JSX launch variants
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Process -Name Illustrator -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          $target=$null
          if($p){$target=$p.Path}
          if(-not $target){
            $shell=New-Object -ComObject WScript.Shell
            $roots=@((Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'),(Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'))
            foreach($root in $roots){
              if(-not (Test-Path -LiteralPath $root)){continue}
              foreach($lnk in @(Get-ChildItem -LiteralPath $root -Recurse -Filter '*.lnk' -File -ErrorAction SilentlyContinue | Where-Object {$_.Name -match 'Illustrator'})){
                $candidate=$shell.CreateShortcut($lnk.FullName).TargetPath
                if($candidate -and (Test-Path -LiteralPath $candidate -PathType Leaf)){$target=$candidate;break}
              }
              if($target){break}
            }
          }
          if(-not $target){throw 'Illustrator executable not found'}
          Write-Host "ILLUSTRATOR_EXE=$target"

          $variants=@(
            @{Name='plain'; Prefix=@()},
            @{Name='dash_r'; Prefix=@('-r')},
            @{Name='slash_run'; Prefix=@('/run')},
            @{Name='dash_run'; Prefix=@('-run')}
          )
          $passed=$false
          foreach($v in $variants){
            Get-Process -Name Illustrator -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            $marker=Join-Path $env:RUNNER_TEMP ("mcp_adobe_illustrator_"+$v.Name+"_marker.txt")
            $jsx=Join-Path $env:RUNNER_TEMP ("mcp_adobe_illustrator_"+$v.Name+"_probe.jsx")
            Remove-Item -Force $marker,$jsx -ErrorAction SilentlyContinue
            $markerJs=$marker.Replace('\','/')
            $script="#target illustrator`nvar f=new File('$markerJs'); if(!f.open('w')){throw new Error('open marker failed');} f.write('PASS:'+app.version); f.close();"
            [IO.File]::WriteAllText($jsx,$script,(New-Object Text.UTF8Encoding($false)))
            $args=@($v.Prefix)+@($jsx)
            Write-Host "=== VARIANT=$($v.Name) ARGS=$($args -join ' ') ==="
            Start-Process -FilePath $target -ArgumentList $args | Out-Null
            $deadline=[DateTime]::UtcNow.AddSeconds(20)
            while(-not (Test-Path -LiteralPath $marker) -and [DateTime]::UtcNow -lt $deadline){Start-Sleep -Milliseconds 500}
            if(Test-Path -LiteralPath $marker){
              $value=Get-Content -LiteralPath $marker -Raw
              Write-Host "VARIANT_RESULT=$($v.Name):$value"
              if($value -match '^PASS:'){$passed=$true;break}
            } else {
              $proc=Get-Process -Name Illustrator -ErrorAction SilentlyContinue | Select-Object -First 1
              Write-Host "VARIANT_RESULT=$($v.Name):NO_MARKER process_running=$([bool]$proc)"
            }
          }
          if(-not $passed){throw 'All Illustrator direct JSX CLI variants failed'}
