name: Mode 2 XD unsaved-state root cause read-only
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-unsaved-state-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect native file, XD menus, and live graph without mutation
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $expected='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          $native=Join-Path $root 'mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd'
          $marker=Join-Path $root 'mode2-disposable-native\Mode2_Experimental_Reload_Once.marker'
          Write-Host "MODE2_RELOAD_MARKER=$(Test-Path -LiteralPath $marker)"
          foreach($rel in @('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd','mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd')){
            $h=(Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash
            Write-Host "MODE2_NATIVE_FILE=$rel BASELINE_MATCH=$($h -eq $expected)"
            if($h -ne $expected){throw 'MODE2_READONLY_BASELINE_DIVERGED'}
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $rootUI=[System.Windows.Automation.AutomationElement]::RootElement
          $scope=[System.Windows.Automation.TreeScope]::Children
          $desc=[System.Windows.Automation.TreeScope]::Descendants
          $cond=[System.Windows.Automation.Condition]::TrueCondition
          $top=$rootUI.FindAll($scope,$cond)
          $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          Write-Host "MODE2_CURRENT_XD=$($xd.Count) TEST=$($test.Count)"
          if($xd.Count -eq 0){
            $track=$env:RUNNER_TRACKING_ID
            try{$env:RUNNER_TRACKING_ID='';Start-Process -FilePath $native -ErrorAction Stop}finally{$env:RUNNER_TRACKING_ID=$track}
            Write-Host 'MODE2_READONLY_TEST_OPEN_REQUESTED'
          }elseif($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_FOREIGN_WINDOW_NO_INSPECTION'}
          $ready=$false
          for($i=0;$i -lt 13;$i++){
            Start-Sleep -Seconds 3
            $top=$rootUI.FindAll($scope,$cond)
            $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
            $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
            $ws=@(Get-NetTCPConnection -LocalPort 8765 -State Established -ErrorAction SilentlyContinue)
            if($xd.Count -eq 1 -and $test.Count -eq 1 -and $ws.Count -ge 1){$ready=$true;break}
          }
          if(-not $ready){throw 'MODE2_READONLY_HOST_NOT_READY'}
          $aid=[System.Windows.Automation.AutomationElement]::AutomationIdProperty
          foreach($name in @('AppMenu_File','AppMenu_Edit')){
            $menu=$test[0].FindFirst($desc,(New-Object System.Windows.Automation.PropertyCondition($aid,$name)))
            if(-not $menu){throw "MODE2_MENU_NOT_FOUND_$name"}
            $xp=$menu.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
            try{
              $xp.Expand()
              Start-Sleep -Milliseconds 240
              $children=$test[0].FindAll($desc,$cond)
              $targetName=if($name -eq 'AppMenu_File'){'Save'}else{'^(Undo|Redo)( |$)'}
              foreach($node in @($children|Where-Object {[string]$_.Current.Name -match $targetName -and [string]$_.Current.ControlType.ProgrammaticName -eq 'ControlType.MenuItem'})|Select-Object -First 12){
                Write-Host "MODE2_MENU_STATE MENU=$name NAME=$([string]$node.Current.Name) ID=$([string]$node.Current.AutomationId) ENABLED=$($node.Current.IsEnabled)"
              }
            }finally{
              if($xp.Current.ExpandCollapseState -eq [System.Windows.Automation.ExpandCollapseState]::Expanded){$xp.Collapse()}
            }
          }
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          @'
          import asyncio,json
          from mcp import Client
          from scripts.export_region_metadata import payload,unwrap
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  data={}
                  for cap in ("creative.health","creative.scenegraph.list","creative.selection.get"):
                      response=await asyncio.wait_for(c.call_tool("creative_read",{"application":"xd","capability":cap,"arguments":{}}),timeout=14)
                      d=unwrap(payload(response))
                      if isinstance(d,dict) and isinstance(d.get("result"),dict):d=unwrap(d["result"])
                      data[cap]=d
                  h,g,s=(data[x] for x in ("creative.health","creative.scenegraph.list","creative.selection.get"))
                  print("MODE2_DIRTY_STATE_LIVE="+json.dumps({"bridge_build":h.get("bridge_build"),"pending_count":h.get("pending_count"),"scene_id":g.get("document_id"),"nodes":g.get("node_count"),"complete":g.get("complete"),"selection_count":len(s.get("items",[])) if isinstance(s.get("items"),list) else None},sort_keys=True),flush=True)
                  if not g.get("complete") or g.get("node_count")!=33:raise RuntimeError("MODE2_SCENEGRAPH_CHANGED")
          asyncio.run(main())
          '@ | Set-Content -LiteralPath .\mode2_dirty_readback.py -Encoding UTF8
          uv run --python 3.12 python .\mode2_dirty_readback.py
          if($LASTEXITCODE -ne 0){throw 'MODE2_DIRTY_STATE_MCP_READ_FAILED'}
          if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash -ne $expected){throw 'MODE2_DISPOSABLE_NATIVE_CHANGED_DURING_INSPECTION'}
          Write-Host 'MODE2_UNSAVED_DIAGNOSTIC_NO_MUTATION=PASS'
