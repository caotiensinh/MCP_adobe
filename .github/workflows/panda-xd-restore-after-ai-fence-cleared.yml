name: Panda XD restore UWP GUI once after Illustrator fence clearance
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-xd-restore-after-ai-fence-cleared.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  restore:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Recover only XD by vetted UIA/UWP script; never open or alter Adobe source documents
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [System.Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){
            throw 'PANDA_XD_RESTORE_WRONG_INTERACTIVE_SESSION'
          }
          $script=Join-Path $PWD 'scripts/panda_xd_recover_headless_uwp.ps1'
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){
            foreach($errorItem in $errors){Write-Host "PANDA_XD_RESTORE_PARSE_FAIL=$($errorItem.Message)"}
            throw 'PANDA_XD_RESTORE_SCRIPT_PARSE_BAD'
          }
          $source=Join-Path $env:USERPROFILE 'Documents\MCPAdobe\MCP_Mode1_Panda_XD_38136531800.xd'
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne '3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'){
            throw 'PANDA_XD_RESTORE_ORIGINAL_DOCUMENT_CHANGED_NO_LAUNCH'
          }
          # This is a PowerShell script, not an external executable:
          # $LASTEXITCODE is sticky from preceding native processes and is not
          # authoritative here. Throwing inside the script is fail-closed.
          & $script
          if(-not $?){throw 'PANDA_XD_RESTORE_POWERSHELL_SCRIPT_FAILED'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $uiRoot=[System.Windows.Automation.AutomationElement]::RootElement
          $top=$uiRoot.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $homes=0
          foreach($win in $top){
            if([string]$win.Current.Name -eq 'Adobe XD'){$homes++}
          }
          if($homes -lt 1){throw 'PANDA_XD_RESTORE_HOME_WINDOW_MISSING_AFTER_SCRIPT'}
          Write-Host "PANDA_XD_RESTORE_READBACK=PASS home_windows=$homes"
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne '3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'){
            throw 'PANDA_XD_RESTORE_ORIGINAL_DOCUMENT_MODIFIED'
          }
          Write-Host 'PANDA_XD_RESTORE_NATIVE_SOURCE_UNCHANGED=PASS'
