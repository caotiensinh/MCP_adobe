name: Mode 2 XD confirm existing disposable Revert dialog once
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-confirm-revert-dialog-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  confirm-once:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Confirm only existing disposable-native Revert dialog without invoking Revert again
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $expected='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          $rels=@('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd','mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd')
          foreach($rel in $rels){if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $expected){throw 'MODE2_REVERT_CONFIRM_SOURCE_HASH_MISMATCH'}}
          $requested=Join-Path $root 'mode2-disposable-native\Mode2_OneTime_RevertDirtyToSaved.marker'
          $confirmed=Join-Path $root 'mode2-disposable-native\Mode2_OneTime_RevertDialogConfirmed.marker'
          if(!(Test-Path -LiteralPath $requested -PathType Leaf)){throw 'MODE2_NO_PRIOR_REVERT_REQUEST'}
          if(Test-Path -LiteralPath $confirmed){throw 'MODE2_REVERT_DIALOG_ALREADY_CONFIRMED_NO_REPLAY'}
          if(@(Get-Process -Name Illustrator,Photoshop,PickerHost -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_FOREIGN_ADOBE_OR_PICKER'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_REVERT_DIALOG_WRONG_WINDOW'}
          $desc=[System.Windows.Automation.TreeScope]::Descendants
          $cond=[System.Windows.Automation.Condition]::TrueCondition
          $nodes=$test[0].FindAll($desc,$cond)
          $message=@($nodes|Where-Object {[string]$_.Current.AutomationId -eq 'MessageBlock' -and [string]$_.Current.Name -match '^Do you want to revert to the most recently saved version of the document "Mode2_Undo_E2E_38584984023\.xd"\?$'})
          $warning=@($nodes|Where-Object {[string]$_.Current.AutomationId -eq 'DetailsBlock' -and [string]$_.Current.Name -eq 'Your current changes will be lost.'})
          $accept=@($nodes|Where-Object {[string]$_.Current.AutomationId -eq 'dialogPlatformRevertButton' -and [string]$_.Current.Name -eq 'Revert' -and $_.Current.IsEnabled})
          $cancel=@($nodes|Where-Object {[string]$_.Current.AutomationId -eq 'dialogPlatformCancelButton' -and [string]$_.Current.Name -eq 'Cancel' -and $_.Current.IsEnabled})
          Write-Host "MODE2_PENDING_REVERT_DIALOG_MESSAGE=$($message.Count) WARNING=$($warning.Count) ACCEPT=$($accept.Count) CANCEL=$($cancel.Count)"
          if($message.Count -ne 1 -or $warning.Count -ne 1 -or $accept.Count -ne 1 -or $cancel.Count -ne 1){throw 'MODE2_PENDING_DISPOSABLE_DIALOG_NOT_UNIQUE'}
          $pattern=$accept[0].GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
          "run=$env:GITHUB_RUN_ID at=$([DateTime]::UtcNow.ToString('o'))" | Set-Content -LiteralPath $confirmed -Encoding ASCII -NoNewline
          $pattern.Invoke()
          Write-Host 'MODE2_PENDING_REVERT_DIALOG_CONFIRMED_ONCE'
          Start-Sleep -Seconds 3
          foreach($rel in $rels){if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $expected){throw 'MODE2_NATIVE_CHANGED_AFTER_REVERT_CONFIRM'}}
          $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_WINDOW_CHANGED_AFTER_REVERT'}
          $remaining=$test[0].FindAll($desc,$cond)
          $dialog=@($remaining|Where-Object {[string]$_.Current.AutomationId -eq 'dialogPlatformRevertButton' -and $_.Current.IsEnabled})
          Write-Host "MODE2_REVERT_DIALOG_REMAINING=$($dialog.Count)"
          if($dialog.Count -gt 0){throw 'MODE2_REVERT_DIALOG_STILL_ACTIVE'}
          Write-Host 'MODE2_DISPOSABLE_REVERT_CONFIRM_AND_NATIVE_HASH=PASS'
