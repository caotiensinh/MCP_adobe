name: Targeted Photoshop 24 Generator live

on:
  pull_request:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-photoshop-ps24-loader-matrix.yml"

concurrency:
  group: targeted-photoshop-generator-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Prove external JSX control
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ps=Get-Process -Name Photoshop -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          if(-not $ps){throw 'Photoshop is not running'}
          $v=([regex]::Match((Get-Item $ps.Path).VersionInfo.ProductVersion,'\d+\.\d+(?:\.\d+)?')).Value
          if(-not $v.StartsWith('24.')){throw "Expected Photoshop 24.x, got $v"}
          "PHOTOSHOP_EXE=$($ps.Path)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PHOTOSHOP_VERSION=$v PID=$($ps.Id) SESSION=$($ps.SessionId)"

          $marker=Join-Path $env:RUNNER_TEMP 'ps24-jsx-marker.txt'
          $jsx=Join-Path $env:RUNNER_TEMP 'ps24-marker.jsx'
          $m=$marker.Replace('\\','/')
          $script="var f=new File('$m');f.open('w');f.write('PASS|'+app.version);f.close();"
          [IO.File]::WriteAllText($jsx,$script,(New-Object Text.UTF8Encoding($false)))

          function Try-Jsx([string]$mode,[string[]]$argv) {
            Remove-Item $marker -Force -ErrorAction SilentlyContinue
            Write-Host "TRY_JSX_MODE=$mode"
            try { Start-Process -FilePath $ps.Path -ArgumentList $argv -ErrorAction Stop | Out-Null } catch { Write-Host "START_ERROR=$($_.Exception.Message)" }
            $until=[DateTime]::UtcNow.AddSeconds(12)
            do { if(Test-Path $marker){return $true};Start-Sleep 1 } while([DateTime]::UtcNow -lt $until)
            return $false
          }

          $mode=$null
          if(Try-Jsx 'dash-r' @('-r',$jsx)){$mode='dash-r'}
          elseif(Try-Jsx 'direct-file' @($jsx)){$mode='direct-file'}
          else {
            Remove-Item $marker -Force -ErrorAction SilentlyContinue
            try { Start-Process -FilePath $jsx -ErrorAction Stop | Out-Null } catch { Write-Host "ASSOCIATION_ERROR=$($_.Exception.Message)" }
            $until=[DateTime]::UtcNow.AddSeconds(12)
            do { if(Test-Path $marker){$mode='association';break};Start-Sleep 1 } while([DateTime]::UtcNow -lt $until)
          }
          if(-not $mode){throw 'NO_EXTERNAL_JSX_CONTROL_PATH'}
          $result=Get-Content $marker -Raw
          Write-Host "JSX_MODE=$mode RESULT=$result"
          if($result -notmatch '^PASS\|24\.'){throw "Unexpected JSX result: $result"}
          "JSX_CONTROL_MODE=$mode" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'PHOTOSHOP_JSX_CONTROL=PASS'

      - name: Build and install pinned Generator bridge
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:RUNNER_TEMP 'ps-generator-bridge'
          if(Test-Path $src){Remove-Item -Recurse -Force $src}
          git clone https://github.com/emptykid/photoshop-manipulate-bridge.git $src
          if($LASTEXITCODE -ne 0){throw 'Generator clone failed'}
          git -C $src checkout --detach c44e4b38a733a05a167b93b2522d2d9d4fb40706
          if((git -C $src rev-parse HEAD).Trim() -ne 'c44e4b38a733a05a167b93b2522d2d9d4fb40706'){throw 'Generator pin mismatch'}

          $server=Join-Path $src 'src\server.ts'
          $code=Get-Content $server -Raw
          $needle='server.listen(this.port, () => {'
          if(-not $code.Contains($needle)){throw 'Generator listen call changed'}
          $code=$code.Replace($needle,"server.listen(this.port, '127.0.0.1', () => {")
          [IO.File]::WriteAllText($server,$code,(New-Object Text.UTF8Encoding($false)))

          Push-Location $src
          try {
            npm install --no-audit --no-fund
            if($LASTEXITCODE -ne 0){throw 'Generator npm install failed'}
            npm run build
            if($LASTEXITCODE -ne 0){throw 'Generator build failed'}
          } finally { Pop-Location }
          if(-not (Test-Path (Join-Path $src 'dist\index.js'))){throw 'Generator dist/index.js missing'}

          $dest=Join-Path $env:CommonProgramFiles 'Adobe\Plug-Ins\CC\Generator\photoshop-manipulate-bridge'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item (Join-Path $src 'dist\*') $dest -Recurse -Force
          if(-not (Test-Path (Join-Path $dest 'index.js'))){throw 'Generator install verify failed'}
          Write-Host "GENERATOR_DEST=$dest"
          Write-Host 'GENERATOR_BUILD_INSTALL=PASS'

      - name: Enable Generator and prove HTTP bridge
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $marker=Join-Path $env:RUNNER_TEMP 'generator-enable-marker.txt'
          $jsx=Join-Path $env:RUNNER_TEMP 'enable-generator.jsx'
          $m=$marker.Replace('\\','/')
          $script="try{$.evalFile(File(app.path+'/Presets/Scripts/generate.jsx'));var f=new File('$m');f.open('w');f.write('PASS');f.close();}catch(e){var f=new File('$m');f.open('w');f.write('FAIL|'+e.toString());f.close();}"
          [IO.File]::WriteAllText($jsx,$script,(New-Object Text.UTF8Encoding($false)))
          Remove-Item $marker -Force -ErrorAction SilentlyContinue
          if($env:JSX_CONTROL_MODE -eq 'dash-r'){Start-Process -FilePath $env:PHOTOSHOP_EXE -ArgumentList @('-r',$jsx) | Out-Null}
          elseif($env:JSX_CONTROL_MODE -eq 'direct-file'){Start-Process -FilePath $env:PHOTOSHOP_EXE -ArgumentList @($jsx) | Out-Null}
          else {Start-Process -FilePath $jsx | Out-Null}
          $until=[DateTime]::UtcNow.AddSeconds(20)
          do { if(Test-Path $marker){break};Start-Sleep 1 } while([DateTime]::UtcNow -lt $until)
          if(-not (Test-Path $marker)){throw 'Generator enable JSX did not execute'}
          $result=Get-Content $marker -Raw
          Write-Host "GENERATOR_ENABLE_RESULT=$result"
          if($result -notmatch '^PASS'){throw $result}

          $ready=$false
          $until=[DateTime]::UtcNow.AddSeconds(35)
          do {
            try {$r=Invoke-RestMethod 'http://127.0.0.1:8020/status' -TimeoutSec 2;if($r.status -eq 'running'){$ready=$true;break}} catch {}
            Start-Sleep 2
          } while([DateTime]::UtcNow -lt $until)
          if(-not $ready){throw 'GENERATOR_BRIDGE_NOT_REACHABLE_AFTER_ENABLE'}
          Write-Host 'GENERATOR_HTTP_BRIDGE=PASS'

      - name: Create PSD and PNG through Photoshop
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'ps-generator-e2e'
          New-Item -ItemType Directory -Force $out | Out-Null
          $psd=Join-Path $out 'live.psd';$png=Join-Path $out 'live.png'
          Remove-Item $psd,$png -Force -ErrorAction SilentlyContinue
          $p=$psd.Replace('\\','/');$n=$png.Replace('\\','/')
          $jsx="var d=app.documents.add(320,240,72,'MCP Adobe Generator Live');var f1=new File('$p');var o1=new PhotoshopSaveOptions();o1.layers=true;d.saveAs(f1,o1,true,Extension.LOWERCASE);var f2=new File('$n');var o2=new PNGSaveOptions();d.saveAs(f2,o2,true,Extension.LOWERCASE);'PASS';"
          $body=@{script=$jsx}|ConvertTo-Json -Compress
          $resp=Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:8020/execute' -ContentType 'application/json' -Body $body -TimeoutSec 30
          $resp|ConvertTo-Json -Depth 8
          if(-not $resp.success){throw 'Generator execute failed'}
          if(-not (Test-Path $psd)){throw 'PSD missing'}
          if(-not (Test-Path $png)){throw 'PNG missing'}
          $pb=[IO.File]::ReadAllBytes($psd);$nb=[IO.File]::ReadAllBytes($png)
          if([Text.Encoding]::ASCII.GetString($pb,0,4) -ne '8BPS'){throw 'PSD signature invalid'}
          $sig=@(137,80,78,71,13,10,26,10)
          for($i=0;$i -lt 8;$i++){if($nb[$i] -ne $sig[$i]){throw 'PNG signature invalid'}}
          Write-Host "PSD_BYTES=$($pb.Length) PNG_BYTES=$($nb.Length)"
          Write-Host 'PHOTOSHOP_GENERATOR_CREATE_SAVE_EXPORT=PASS'
