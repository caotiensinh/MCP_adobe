name: Targeted Photoshop 24 packaged UXP live

on:
  pull_request:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-photoshop-ps24-loader-matrix.yml"

concurrency:
  group: targeted-photoshop-packaged-uxp-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Verify Photoshop 24 host and installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ps=Get-Process -Name Photoshop -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          if(-not $ps){throw 'Photoshop is not running'}
          $v=([regex]::Match((Get-Item $ps.Path).VersionInfo.ProductVersion,'\d+\.\d+(?:\.\d+)?')).Value
          if(-not $v.StartsWith('24.')){throw "Expected Photoshop 24.x, got $v"}
          $upi='C:\Program Files\Common Files\Adobe\Adobe Desktop Common\RemoteComponents\UPI\UnifiedPluginInstallerAgent\UnifiedPluginInstallerAgent.exe'
          if(-not (Test-Path $upi)){
            $upi=Get-ChildItem 'C:\Program Files\Common Files\Adobe' -Filter 'UnifiedPluginInstallerAgent.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if(-not $upi){throw 'UnifiedPluginInstallerAgent.exe not found'}
          "UPI_EXE=$upi" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PHOTOSHOP_VERSION=$v SESSION=$($ps.SessionId)"
          Write-Host "UPI_EXE=$upi"
          Write-Host 'PACKAGED_UXP_PREREQUISITES=PASS'

      - name: Install Adobe packaging CLI
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tool=Join-Path $env:RUNNER_TEMP 'uxp120-package-cli'
          if(Test-Path $tool){Remove-Item -Recurse -Force $tool}
          New-Item -ItemType Directory -Force $tool | Out-Null
          Push-Location $tool
          try {
            npm init -y | Out-Null
            npm install --ignore-scripts --no-audit --no-fund --fetch-retries=2 --fetch-timeout=60000 @adobe/uxp-devtools-cli@1.2.0 tar@6 fs-extra@9
            if($LASTEXITCODE -ne 0){throw 'Adobe UXP CLI install failed'}
          } finally { Pop-Location }
          $uxp=Join-Path $tool 'node_modules\@adobe\uxp-devtools-cli\src\uxp.js'
          if(-not (Test-Path $uxp)){throw 'UXP CLI entry missing'}
          "UXP_JS=$uxp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'UXP_PACKAGING_CLI=PASS'

      - name: Package minimal Photoshop plugin as CCX
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'ps24-packaged-probe'
          $out=Join-Path $env:RUNNER_TEMP 'ps24-packaged-output'
          Remove-Item $dir,$out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $dir,$out | Out-Null
          $utf8=New-Object System.Text.UTF8Encoding($false)
          $manifest=[ordered]@{
            id='com.mcpadobe.ps24.packagedprobe'
            name='MCP Adobe PS24 Packaged Probe'
            version='1.0.0'
            main='index.html'
            host=@([ordered]@{app='PS';minVersion='22.0.0'})
            manifestVersion=4
            entrypoints=@([ordered]@{type='panel';id='packagedprobe';minimumSize=[ordered]@{width=230;height=200};maximumSize=[ordered]@{width=2000;height=2000};preferredDockedSize=[ordered]@{width=230;height=200};preferredFloatingSize=[ordered]@{width=300;height=250};label=[ordered]@{default='MCP Packaged Probe'}})
          }
          [IO.File]::WriteAllText((Join-Path $dir 'manifest.json'),($manifest|ConvertTo-Json -Depth 12),$utf8)
          [IO.File]::WriteAllText((Join-Path $dir 'index.html'),'<!doctype html><html><body><h3>MCP Adobe Packaged Probe</h3><div id="state">loaded</div><script src="main.js"></script></body></html>',$utf8)
          [IO.File]::WriteAllText((Join-Path $dir 'main.js'),'console.log("MCP_ADOBE_PACKAGED_PROBE_BOOT=PASS");',$utf8)
          Push-Location $dir
          try {
            node $env:UXP_JS plugin package --manifest (Join-Path $dir 'manifest.json') --apps PS --outputPath $out
            if($LASTEXITCODE -ne 0){throw 'UXP plugin package command failed'}
          } finally { Pop-Location }
          Get-ChildItem $out -Force | Format-List FullName,Length,LastWriteTime
          $ccx=Get-ChildItem $out -Filter '*.ccx' -File -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if(-not $ccx){throw 'No CCX package produced'}
          "CCX_FILE=$ccx" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CCX_FILE=$ccx"
          Write-Host 'PHOTOSHOP_CCX_PACKAGE=PASS'

      - name: Install CCX with Adobe Unified Plugin Installer
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host '--- BEFORE INSTALL ---'
          & $env:UPI_EXE /list all 2>&1 | Out-String | Write-Host
          $p=Start-Process -FilePath $env:UPI_EXE -ArgumentList @('/install',('"'+$env:CCX_FILE+'"')) -PassThru -Wait
          Write-Host "UPI_INSTALL_RC=$($p.ExitCode)"
          Start-Sleep 4
          Write-Host '--- AFTER INSTALL ---'
          $list=(& $env:UPI_EXE /list all 2>&1 | Out-String)
          Write-Host $list
          $external=Join-Path $env:APPDATA 'Adobe\UXP\Plugins\External'
          if(Test-Path $external){
            Write-Host "--- EXTERNAL UXP ROOT: $external ---"
            Get-ChildItem $external -Directory -Recurse -ErrorAction SilentlyContinue | Select-Object -First 80 -ExpandProperty FullName | Write-Host
          }
          $found=$false
          if($list -match 'MCP Adobe PS24 Packaged Probe|com\.mcpadobe\.ps24\.packagedprobe'){$found=$true}
          if(Test-Path $external){
            $hits=Get-ChildItem $external -File -Filter manifest.json -Recurse -ErrorAction SilentlyContinue | Where-Object {(Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue) -match 'com\.mcpadobe\.ps24\.packagedprobe'}
            if($hits){$found=$true;$hits | ForEach-Object {Write-Host "INSTALLED_MANIFEST=$($_.FullName)"}}
          }
          if(-not $found){throw 'CCX installer returned without verifiable installed plugin'}
          Write-Host 'PHOTOSHOP_PACKAGED_UXP_INSTALL=PASS'
