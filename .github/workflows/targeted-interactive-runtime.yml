name: Targeted interactive runtime contract

on:
  push:
    branches: [fix/interactive-ci-runtime-contract]
    paths:
      - "scripts/start_adobe_runner_interactive.ps1"
      - "tests/test_audit_config_cli.py"
      - "tests/test_oauth_preflight_cli.py"
      - "tests/test_server_transports.py"
      - ".github/workflows/adobe-windows-e2e.yml"
      - ".github/workflows/targeted-interactive-runtime.yml"

permissions:
  contents: read

jobs:
  targeted:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify desktop runner evidence contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = (whoami).Trim()
          $services = @(Get-CimInstance Win32_Service | Where-Object {
            $_.Name -like 'actions.runner.caotiensinh-MCP_adobe.*' -or $_.PathName -like '*actions-runner-adobe*'
          })
          $serviceListenerRunning = @($services | Where-Object { $_.State -eq 'Running' }).Count -gt 0
          $serviceIdentity = $identity -match '^(nt authority\\(network service|local service|system)|nt authority\\system)$'
          $interactive = (-not $serviceIdentity) -and (-not $serviceListenerRunning)
          Write-Host "identity=$identity session=$env:SESSIONNAME marker=$env:MCP_ADOBE_INTERACTIVE_RUNNER service_running=$serviceListenerRunning interactive=$interactive"
          if (-not $interactive) { throw 'Desktop runner evidence contract did not recognize the current MRCAO interactive listener.' }
          Write-Host 'PASS: desktop runner evidence contract'

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false

      - name: Install environment
        shell: powershell
        run: |
          uv python install 3.12
          uv sync --python 3.12

      - name: PowerShell parse
        shell: powershell
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\scripts\start_adobe_runner_interactive.ps1",
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'PASS: interactive runner helper parses'

      - name: Reproduce run 67 failure set
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          uv run python -m unittest `
            tests.test_audit_config_cli `
            tests.test_oauth_preflight_cli `
            tests.test_server_transports `
            tests.test_windows_helpers `
            tests.test_interactive_workspace_ownership `
            -v
