name: PANDA XD Save local from verified File menu
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths:
      - ".github/workflows/panda-xd-menu-native-save.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  save:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Open real XD File menu and save existing Untitled test document
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $errors=$null;$tokens=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/panda_xd_save_via_menu.ps1'),[ref]$tokens,[ref]$errors)
          if(@($errors).Count -gt 0){throw "XD_MENU_NATIVE_SAVE_PS_PARSE_FAILED $($errors[0].Message)"}
          Write-Host 'XD_MENU_NATIVE_SAVE_AST=PASS'
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/panda_xd_save_via_menu.ps1 -RunId 38132321143
          if($LASTEXITCODE -ne 0){throw 'XD_MENU_NATIVE_SAVE_E2E_FAILED'}
      - name: Collect actual XD original if saved
        if: always()
        shell: powershell
        run: |
          $file=Join-Path $env:USERPROFILE 'Documents\MCPAdobe\MCP_Mode1_Panda_XD_38132321143.xd'
          if(Test-Path -LiteralPath $file){
            Copy-Item -LiteralPath $file -Destination (Join-Path $PWD 'panda_xd_native_blank.xd')
            Write-Host "XD_MENU_NATIVE_ARTIFACT_BYTES=$((Get-Item $file).Length)"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panda-xd-native-blank-original
          path: panda_xd_native_blank.xd
          if-no-files-found: ignore
          retention-days: 14
