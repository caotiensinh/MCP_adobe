name: Red Panda Illustrator read-only unknown write reconciliation
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-ai-unknown-write-reconcile.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - name: Read native AI checkpoint and current CEP active/blocked jobs, no writes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO'){throw 'RED_AI_FORENSIC_WRONG_HOST'}
          if([System.Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'RED_AI_FORENSIC_WRONG_SESSION'}
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          uv run --python 3.12 python scripts/panda_red_illustrator_reconcile_readonly.py
          if($LASTEXITCODE -ne 0){throw 'RED_AI_FORENSIC_SCRIPT_FAILED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: red-ai-unknown-write-reconciled-state
          path: red_ai_reconcile/reconcile.json
          if-no-files-found: warn
          retention-days: 14
