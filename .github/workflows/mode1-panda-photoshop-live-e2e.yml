name: Mode1 PANDA Photoshop live per-shape E2E
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths:
      - ".github/workflows/mode1-panda-photoshop-live-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  panda-photoshop:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      UV_LINK_MODE: copy
      PANDA_PS_RESUME_RUN_ID: "38113688652"
    steps:
      - uses: actions/checkout@v4
      - name: Verify MRCAO interactive desktop, launch Photoshop only if absent
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO'){throw 'PANDA_PS_WRONG_HOST'}
          $current=[System.Diagnostics.Process]::GetCurrentProcess()
          Write-Host "PS_RUNNER_SESSION=$($current.SessionId)"
          if($current.SessionId -ne 1){throw "PS_WRONG_DESKTOP_SESSION_$($current.SessionId)"}
          $ps=Get-Process -Name Photoshop -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0 -and $_.SessionId -eq 1} | Select-Object -First 1
          if(-not $ps){
            $exe=$null
            foreach($drive in @(Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue)){
              foreach($pattern in @("$($drive.Root)Program Files\Adobe\Adobe Photoshop *\Photoshop.exe","$($drive.Root)Adobe\Adobe Photoshop *\Photoshop.exe")){
                $candidate=Get-Item $pattern -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
                if($candidate){$exe=$candidate.FullName;break}
              }
              if($exe){break}
            }
            if(-not $exe){
              $candidates=New-Object System.Collections.Generic.List[string]
              foreach($key in @('HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\Photoshop.exe','HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\Photoshop.exe')){
                try {
                  $entry=Get-ItemProperty -Path $key -ErrorAction Stop
                  $value=$entry.'(default)'
                  if($value){$candidates.Add([string]$value);Write-Host "PS_REGISTRY_APP_PATH=$value"}
                }catch{}
              }
              try {
                $shell=New-Object -ComObject WScript.Shell
                foreach($folder in @((Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'),(Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'))){
                  if(-not (Test-Path $folder)){continue}
                  foreach($link in @(Get-ChildItem -LiteralPath $folder -Filter '*.lnk' -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.Name -match 'Photoshop'})){
                    $linkTarget=$shell.CreateShortcut($link.FullName).TargetPath
                    Write-Host "PS_START_MENU_LINK=$($link.FullName) TARGET=$linkTarget"
                    if($linkTarget){$candidates.Add([string]$linkTarget)}
                  }
                }
              }catch{Write-Host "PS_SHORTCUT_SCAN_WARNING=$($_.Exception.Message)"}
              foreach($folder in @(
                (Join-Path $env:ProgramFiles 'Adobe'),
                (Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Adobe'),
                'C:\Adobe','D:\Adobe','D:\Program Files\Adobe',
                'C:\Program Files\Adobe','C:\Program Files (x86)\Adobe'
              )){
                if(-not $folder -or -not (Test-Path $folder)){continue}
                Write-Host "PS_SCANNING_DIRECTORY=$folder"
                foreach($file in @(Get-ChildItem -LiteralPath $folder -Filter 'Photoshop.exe' -File -Recurse -ErrorAction SilentlyContinue)){
                  $candidates.Add($file.FullName)
                  Write-Host "PS_DISCOVERED_BINARY=$($file.FullName)"
                }
              }
              foreach($pathCandidate in @($candidates | Select-Object -Unique)){
                if(Test-Path -LiteralPath $pathCandidate -PathType Leaf){$exe=$pathCandidate;break}
              }
            }
            if(-not $exe){
              foreach($drive in @(Get-PSDrive -PSProvider FileSystem -ErrorAction SilentlyContinue)){
                Write-Host "PS_DRIVE_FOUND=$($drive.Root)"
              }
              foreach($p in @(Get-CimInstance Win32_Process -Filter "Name='Photoshop.exe'" -ErrorAction SilentlyContinue)){
                Write-Host "PS_PROCESS_NO_INTERACTIVE_WINDOW pid=$($p.ProcessId) session=$($p.SessionId) path=$($p.ExecutablePath)"
              }
              Write-Host "PS_INSTALLED_APP_HINTS=$(@(Get-StartApps -ErrorAction SilentlyContinue | Where-Object {$_.Name -match 'Photoshop'} | ForEach-Object { $_.Name + ' ' + $_.AppID }) -join ';')"
              throw 'PANDA_PS_EXECUTABLE_NOT_FOUND_AFTER_FULL_TARGETED_DISCOVERY'
            }
            $p=Start-Process -FilePath $exe -PassThru
            Write-Host "PS_LAUNCH_REQUEST=PASS pid=$($p.Id) exe=$exe"
            $deadline=(Get-Date).AddSeconds(90)
            do{
              Start-Sleep -Seconds 2
              $ps=Get-Process -Name Photoshop -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowHandle -ne 0 -and $_.SessionId -eq 1} | Select-Object -First 1
            }until($ps -or (Get-Date) -gt $deadline)
          }
          if(-not $ps){throw 'PANDA_PS_INTERACTIVE_WINDOW_NOT_READY'}
          Write-Host "PS_INTERACTIVE_WINDOW=PASS pid=$($ps.Id) session=$($ps.SessionId) title=$($ps.MainWindowTitle)"
          $gateway=@(Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction SilentlyContinue)
          if($gateway.Count -eq 0){throw 'PANDA_MCP_GATEWAY_NOT_LISTENING_NO_BLIND_RESTART'}
          Write-Host "PS_GATEWAY_8787=PASS"
      - name: Paint panda by independently verified MCP writes and checkpoint PSD
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          uv sync --python 3.12
          if($LASTEXITCODE -ne 0){throw 'PANDA_PS_UV_FAILED'}
          uv run python scripts/panda_photoshop_mode1_e2e.py
          if($LASTEXITCODE -ne 0){throw 'PANDA_PS_E2E_FAILED_INSPECT_LOGS_BEFORE_RETRY'}
      - name: Collect only existing Adobe-produced files
        if: always()
        shell: powershell
        run: |
          $p=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          foreach($ext in @('psd','png')){
            $source=Join-Path $p "MCP_Mode1_Panda_PS_$env:PANDA_PS_RESUME_RUN_ID.$ext"
            if(Test-Path -LiteralPath $source){
              Copy-Item -LiteralPath $source -Destination (Join-Path $PWD "panda_mode1_photoshop.$ext")
              Write-Host "PS_ARTIFACT_FILE=$source bytes=$((Get-Item -LiteralPath $source).Length)"
            }else{
              Write-Host "PS_ARTIFACT_NOT_YET_PRESENT=$source"
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mode1-panda-photoshop-actual-files
          path: |
            panda_mode1_photoshop.psd
            panda_mode1_photoshop.png
          if-no-files-found: ignore
          retention-days: 14
