name: Targeted Photoshop 24 COM ExtendScript live

on:
  pull_request:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-photoshop-ps24-com-extendscript.yml"

concurrency:
  group: targeted-photoshop-ps24-com-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Control Photoshop 24 through COM ExtendScript
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ps=Get-Process -Name Photoshop -ErrorAction SilentlyContinue |
            Where-Object {$_.Path -and $_.MainWindowHandle -ne 0} |
            Select-Object -First 1
          if(-not $ps){throw 'Photoshop is not running interactively'}
          $version=([regex]::Match((Get-Item $ps.Path).VersionInfo.ProductVersion,'\d+\.\d+(?:\.\d+)?')).Value
          Write-Host "PHOTOSHOP_EXE=$($ps.Path)"
          Write-Host "PHOTOSHOP_VERSION=$version PID=$($ps.Id) SESSION=$($ps.SessionId) HWND=$($ps.MainWindowHandle)"
          if(-not $version.StartsWith('24.')){throw "Expected Photoshop 24.x, got $version"}
          if($ps.SessionId -ne 1){throw "Expected Photoshop in interactive Session 1, got $($ps.SessionId)"}

          $out=Join-Path $env:RUNNER_TEMP 'mcp-adobe-ps24-com-live'
          New-Item -ItemType Directory -Force $out | Out-Null
          $psd=Join-Path $out 'mcp-adobe-com-live.psd'
          $png=Join-Path $out 'mcp-adobe-com-live.png'
          $jsx=Join-Path $out 'mcp-adobe-com-live.jsx'
          $vbs=Join-Path $out 'mcp-adobe-com-bridge.vbs'
          $resultFile=Join-Path $out 'mcp-adobe-com-result.txt'
          Remove-Item $psd,$png,$jsx,$vbs,$resultFile -Force -ErrorAction SilentlyContinue

          $psdJs=$psd.Replace([char]92,[char]47)
          $pngJs=$png.Replace([char]92,[char]47)
          Write-Host "PSD_JS_PATH=$psdJs"
          Write-Host "PNG_JS_PATH=$pngJs"
          $jsxBody=@"
          (function () {
            var hostVersion = app.version;
            var hostName = app.name;
            var doc = app.documents.add(UnitValue(320, 'px'), UnitValue(240, 'px'), 72, 'MCP Adobe COM Live');
            var psdFile = new File('$psdJs');
            var psdOptions = new PhotoshopSaveOptions();
            psdOptions.layers = true;
            psdOptions.embedColorProfile = true;
            doc.saveAs(psdFile, psdOptions, true, Extension.LOWERCASE);
            var pngFile = new File('$pngJs');
            var pngOptions = new PNGSaveOptions();
            pngOptions.compression = 9;
            pngOptions.interlaced = false;
            doc.saveAs(pngFile, pngOptions, true, Extension.LOWERCASE);
            return 'PHOTOSHOP_COM_LIVE=PASS|' + hostVersion + '|' + hostName + '|' + doc.name +
              '|PSD=' + psdFile.fsName + '|PSD_EXISTS=' + psdFile.exists +
              '|PNG=' + pngFile.fsName + '|PNG_EXISTS=' + pngFile.exists;
          })();
          "@
          [IO.File]::WriteAllText($jsx,[char]0xFEFF + $jsxBody,(New-Object Text.UTF8Encoding($false)))

          $vbsBody=@'
          On Error Resume Next
          Dim shell, jsxPath, outFile, photoshopApp, result, jsxForJs

          Sub WriteResult(text)
              On Error Resume Next
              Dim fso, stream, writeErr
              Err.Clear
              Set fso = CreateObject("Scripting.FileSystemObject")
              Set stream = fso.CreateTextFile(outFile, True, True)
              writeErr = Err.Number
              If writeErr <> 0 Then
                  WScript.Echo "ERROR: Failed to write script result (" & writeErr & ")"
                  WScript.Quit 1
              End If
              Err.Clear
              stream.Write text
              writeErr = Err.Number
              If writeErr <> 0 Then
                  WScript.Echo "ERROR: Failed to write script result (" & writeErr & ")"
                  WScript.Quit 1
              End If
              stream.Close
          End Sub

          Set shell = CreateObject("WScript.Shell")
          jsxPath = shell.Environment("PROCESS")("PSMCP_JSX")
          outFile = shell.Environment("PROCESS")("PSMCP_RESULT")
          If jsxPath = "" Or outFile = "" Then
              WScript.Echo "ERROR: Missing Photoshop script paths"
              WScript.Quit 1
          End If

          Set photoshopApp = CreateObject("Photoshop.Application")
          If Err.Number <> 0 Then
              WriteResult "ERROR: Failed to connect to Photoshop - " & Err.Description
              WScript.Quit 1
          End If

          Err.Clear
          jsxForJs = Replace(jsxPath, "\", "\\")
          jsxForJs = Replace(jsxForJs, "'", "\'")
          result = photoshopApp.DoJavaScript("$.evalFile('" & jsxForJs & "')")
          If Err.Number <> 0 Then
              WriteResult "ERROR: " & Err.Description
              WScript.Quit 1
          End If
          If IsNull(result) Or IsEmpty(result) Then
              result = ""
          Else
              result = CStr(result)
          End If
          WriteResult result
          '@
          [IO.File]::WriteAllText($vbs,$vbsBody,(New-Object Text.UTF8Encoding($false)))

          $env:PSMCP_JSX=$jsx
          $env:PSMCP_RESULT=$resultFile
          & cscript.exe //nologo $vbs
          $rc=$LASTEXITCODE
          Write-Host "CSCRIPT_RC=$rc"
          if($rc -ne 0){throw "COM bridge cscript failed rc=$rc"}
          if(-not (Test-Path $resultFile)){throw 'COM bridge produced no result file'}
          $result=Get-Content $resultFile -Raw
          Write-Host "COM_RESULT=$result"
          if($result -match '^ERROR:'){throw $result}
          if($result -notmatch '^PHOTOSHOP_COM_LIVE=PASS\|24\.'){throw "Unexpected COM result: $result"}
          Write-Host 'PHOTOSHOP_COM_APP_INFO=PASS'
          Write-Host 'PHOTOSHOP_COM_DOC_NEW=PASS'

          Write-Host '--- COM OUTPUT DIRECTORY ---'
          Get-ChildItem $out -Force | ForEach-Object {
            Write-Host "OUT_FILE=$($_.FullName) BYTES=$($_.Length)"
          }
          if(-not (Test-Path $psd)){throw 'PSD was not created by Photoshop COM/ExtendScript'}
          if(-not (Test-Path $png)){throw 'PNG was not created by Photoshop COM/ExtendScript'}
          $pb=[IO.File]::ReadAllBytes($psd)
          $nb=[IO.File]::ReadAllBytes($png)
          if($pb.Length -lt 4 -or [Text.Encoding]::ASCII.GetString($pb,0,4) -ne '8BPS'){throw 'PSD signature invalid'}
          $pngSig=@(137,80,78,71,13,10,26,10)
          if($nb.Length -lt 8){throw 'PNG too small'}
          for($i=0;$i -lt 8;$i++){if($nb[$i] -ne $pngSig[$i]){throw 'PNG signature invalid'}}
          Write-Host "PSD_PATH=$psd PSD_BYTES=$($pb.Length) PSD_HEADER=$([Text.Encoding]::ASCII.GetString($pb,0,4))"
          Write-Host "PNG_PATH=$png PNG_BYTES=$($nb.Length)"
          Write-Host 'PHOTOSHOP_COM_PSD_VERIFY=PASS'
          Write-Host 'PHOTOSHOP_COM_PNG_VERIFY=PASS'
          Write-Host 'PHOTOSHOP_24_COM_LIVE_OPERATION_VERIFY=PASS'

      - name: Install MCP Adobe gateway
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check -e .
          if($LASTEXITCODE -ne 0){throw 'MCP Adobe editable install failed'}
          Write-Host 'MCP_ADOBE_INSTALL=PASS'

      - name: Live MCP Adobe Photoshop adapter through alisaitteke transport
        timeout-minutes: 4
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ps=Get-Process -Name Photoshop -ErrorAction SilentlyContinue |
            Where-Object {$_.Path -and $_.MainWindowHandle -ne 0} |
            Select-Object -First 1
          if(-not $ps){throw 'Photoshop disappeared before MCP Adobe adapter test'}
          $env:PHOTOSHOP_PATH=$ps.Path
          $env:PSMCP_FEEDBACK='0'
          $env:PSMCP_UPDATE_CHECK='0'
          $out=Join-Path $env:RUNNER_TEMP 'mcp-adobe-adapter-live'
          New-Item -ItemType Directory -Force $out | Out-Null
          $env:MCP_ADOBE_ADAPTER_OUT=$out
          $probe=Join-Path $env:RUNNER_TEMP 'mcp_adobe_photoshop_adapter_live_probe.py'
          @'
          import json
          import os
          from pathlib import Path

          from mcp_adobe.core import CapabilityRegistry
          from mcp_adobe.mcp_stdio import McpSubprocessToolClient, photoshop_stdio_config
          from mcp_adobe.photoshop import PhotoshopAdapter

          out = Path(os.environ["MCP_ADOBE_ADAPTER_OUT"])
          out.mkdir(parents=True, exist_ok=True)
          psd = out / "mcp-adobe-adapter-live.psd"
          png = out / "mcp-adobe-adapter-live.png"
          for path in (psd, png):
              try:
                  path.unlink()
              except FileNotFoundError:
                  pass

          client = McpSubprocessToolClient(photoshop_stdio_config())
          adapter = PhotoshopAdapter(client, writes_enabled=True)
          registry = CapabilityRegistry()
          try:
              registry.register(adapter)
              info = adapter.info()
              print("MCP_ADOBE_PHOTOSHOP_TRANSPORT=" + str(info.transport))
              print("MCP_ADOBE_PHOTOSHOP_UPSTREAM=" + str(info.upstream_repository))
              print("MCP_ADOBE_PHOTOSHOP_SNAPSHOT=" + str(info.upstream_snapshot))
              if not info.connected:
                  raise RuntimeError("MCP Adobe Photoshop subprocess transport did not connect")
              print("MCP_ADOBE_PHOTOSHOP_CONNECTED=PASS")

              version = client.call_tool("photoshop_get_version", {})
              print("MCP_ADOBE_APP_INFO=" + json.dumps(version, ensure_ascii=True, default=str))
              version_text = json.dumps(version, ensure_ascii=True, default=str)
              if "24.0" not in version_text:
                  raise RuntimeError(f"Photoshop 24 version not proven through upstream MCP: {version_text}")
              print("MCP_ADOBE_APP_INFO=PASS")

              health = registry.execute("photoshop", "creative.health", {})
              print("MCP_ADOBE_HEALTH=" + json.dumps(health, ensure_ascii=True, default=str))
              if not health.get("ok"):
                  raise RuntimeError("creative.health failed")
              print("MCP_ADOBE_HEALTH=PASS")

              created = registry.execute(
                  "photoshop",
                  "creative.document.create",
                  {"width": 320, "height": 240, "resolution": 72, "colorMode": "RGB"},
              )
              print("MCP_ADOBE_CREATE=" + json.dumps(created, ensure_ascii=True, default=str))
              if not created.get("ok"):
                  raise RuntimeError("creative.document.create failed")
              print("MCP_ADOBE_DOC_NEW=PASS")

              saved = registry.execute(
                  "photoshop",
                  "creative.document.save",
                  {"path": str(psd), "format": "PSD"},
              )
              print("MCP_ADOBE_SAVE=" + json.dumps(saved, ensure_ascii=True, default=str))
              if not saved.get("ok"):
                  raise RuntimeError("creative.document.save failed")
              print("MCP_ADOBE_SAVE_PSD=PASS")

              exported = registry.execute(
                  "photoshop",
                  "creative.document.export",
                  {"path": str(png), "format": "PNG"},
              )
              print("MCP_ADOBE_EXPORT=" + json.dumps(exported, ensure_ascii=True, default=str))
              if not exported.get("ok"):
                  raise RuntimeError("creative.document.export failed")
              print("MCP_ADOBE_EXPORT_PNG=PASS")
          finally:
              client.close()

          if not psd.is_file():
              raise RuntimeError(f"MCP Adobe PSD missing: {psd}")
          if not png.is_file():
              raise RuntimeError(f"MCP Adobe PNG missing: {png}")
          psd_bytes = psd.read_bytes()
          png_bytes = png.read_bytes()
          if psd_bytes[:4] != b"8BPS":
              raise RuntimeError(f"MCP Adobe PSD signature invalid: {psd_bytes[:4]!r}")
          if png_bytes[:8] != b"\x89PNG\r\n\x1a\n":
              raise RuntimeError(f"MCP Adobe PNG signature invalid: {png_bytes[:8]!r}")
          print(f"MCP_ADOBE_PSD_PATH={psd} BYTES={len(psd_bytes)} HEADER=8BPS")
          print(f"MCP_ADOBE_PNG_PATH={png} BYTES={len(png_bytes)}")
          print("MCP_ADOBE_PSD_SIGNATURE=PASS")
          print("MCP_ADOBE_PNG_SIGNATURE=PASS")
          print("MCP_ADOBE_PHOTOSHOP_24_LIVE_E2E=PASS")
          '@ | Set-Content -Path $probe -Encoding utf8
          python $probe
          if($LASTEXITCODE -ne 0){throw 'MCP Adobe Photoshop live adapter probe failed'}
