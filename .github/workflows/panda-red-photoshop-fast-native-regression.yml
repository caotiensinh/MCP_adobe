name: Red Panda Photoshop fast one-call native shape safety regression
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths:
      - ".github/workflows/panda-red-photoshop-fast-native-regression.yml"
      - "scripts/panda_red_photoshop_fast_native.py"
      - "tests/test_panda_red_ps_fast_native.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate actual generated JSX against mock Photoshop DOM
        run: |
          python -m py_compile scripts/panda_red_photoshop_fast_native.py tests/test_panda_red_ps_fast_native.py
          python -m unittest tests.test_panda_red_ps_fast_native -v
