name: Panda red XD native PickerHost exact Save As control census
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-xd-pickerhost-exact-controls-readonly.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Inspect verified PickerHost field and Save button without input
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'RED_XD_PICKER_WRONG_DESKTOP'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;using System.Runtime.InteropServices;using System.Text;
          public class XdPickerInspector{
            public delegate bool EnumProc(IntPtr h,IntPtr arg);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb,IntPtr arg);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h,out uint pid);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h,StringBuilder s,int max);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h,StringBuilder s,int max);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
          }
          '@
          $dir=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $old=Join-Path $dir 'MCP_Mode1_Panda_XD_38136531800.xd'
          $target=Join-Path $dir 'MCP_KFP4_Red_XD_38205166138.xd'
          $original='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          if((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash -ne $original){throw 'RED_XD_PICKER_ORIGINAL_CHANGED'}
          if(Test-Path -LiteralPath $target){throw 'RED_XD_PICKER_TARGET_ALREADY_EXISTS'}
          $picker=@(Get-Process -Name PickerHost -ErrorAction SilentlyContinue | Where-Object{$_.SessionId -eq 1})
          if($picker.Count -ne 1){throw "RED_XD_PICKER_COUNT=$($picker.Count)"}
          $pickerPid=[uint32]$picker[0].Id
          Write-Host "RED_XD_PICKER_PROCESS pid=$pickerPid"
          $handles=New-Object System.Collections.Generic.List[System.IntPtr]
          $cb=[XdPickerInspector+EnumProc]{
            param([IntPtr]$h,[IntPtr]$arg)
            $pidValue=[uint32]0
            [void][XdPickerInspector]::GetWindowThreadProcessId($h,[ref]$pidValue)
            if($pidValue -eq $pickerPid){$handles.Add($h)}
            return $true
          }
          [void][XdPickerInspector]::EnumWindows($cb,[IntPtr]::Zero)
          Write-Host "RED_XD_PICKER_WINDOWS=$($handles.Count)"
          foreach($handle in $handles){
            $cls=New-Object System.Text.StringBuilder(160)
            $txt=New-Object System.Text.StringBuilder(160)
            [void][XdPickerInspector]::GetClassName($handle,$cls,160)
            [void][XdPickerInspector]::GetWindowText($handle,$txt,160)
            Write-Host "RED_XD_PICKER_WIN hwnd=$handle class=$($cls.ToString()) title=$($txt.ToString()) visible=$([XdPickerInspector]::IsWindowVisible($handle))"
            try{
              $el=[System.Windows.Automation.AutomationElement]::FromHandle($handle)
              $tree=$el.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
              Write-Host "RED_XD_PICKER_TREE hwnd=$handle nodes=$($tree.Count)"
              $count=0
              foreach($node in $tree){
                $name=[string]$node.Current.Name;$id=[string]$node.Current.AutomationId
                if($name -match 'Save|Untitled|File name|FileName|Folder|Location|Computer' -or $id -match '1001|FileName|FileNameControlHost|^1$'){
                  Write-Host "RED_XD_PICKER_FIELD name=$($name.Substring(0,[Math]::Min(110,$name.Length))) id=$id control=$($node.Current.ControlType.ProgrammaticName) hwnd=$($node.Current.NativeWindowHandle) enabled=$($node.Current.IsEnabled)"
                  $count++
                }
                if($count -ge 40){break}
              }
            }catch{Write-Host "RED_XD_PICKER_ENUM_EXCEPTION class=$($_.Exception.GetType().Name)"}
          }
          $root=[System.Windows.Automation.AutomationElement]::RootElement
          $top=$root.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          foreach($el in $top){
            $n=[string]$el.Current.Name
            if($n -match 'Save As|Save a File|Untitled|Adobe XD'){
              Write-Host "RED_XD_PICKER_TOP name=$n pid=$($el.Current.ProcessId) class=$($el.Current.ClassName)"
            }
          }
          if((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash -ne $original){throw 'RED_XD_PICKER_ORIGINAL_SHA_CHANGED'}
          Write-Host 'RED_XD_PICKER_READONLY=PASS'
