name: Panda red XD active Open picker exact input and button read-only census
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-xd-open-picker-control-census.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Observe only existing XD Open picker unique controls without typing
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'XD_PICKER_WRONG_DESKTOP'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          foreach($pair in @(
            @('MCP_Mode1_Panda_XD_38136531800.xd','3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'),
            @('MCP_KFP4_Red_XD_38205166138.xd','58966788CF369885C2395CE217D6E0443ED57BCD7F40BD550B2F3A24C2B5B831'))) {
            if((Get-FileHash -LiteralPath (Join-Path $root $pair[0]) -Algorithm SHA256).Hash -ne $pair[1]){throw 'XD_PICKER_PROTECTED_SHA_CHANGED'}
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $pickers=@(Get-Process -Name PickerHost -ErrorAction SilentlyContinue|Where-Object{$_.SessionId -eq 1})
          if($pickers.Count -ne 1){throw "XD_PICKER_NOT_UNIQUE count=$($pickers.Count)"}
          $pickerPidValue=[int]$pickers[0].Id
          Write-Host "XD_PICKER_PROCESS=PASS pid=$pickerPidValue"
          $desktop=[System.Windows.Automation.AutomationElement]::RootElement
          $top=$desktop.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $xd=@($top|Where-Object{[string]$_.Current.Name -eq 'Adobe XD' -and [string]$_.Current.ClassName -eq 'ApplicationFrameWindow'})
          if($xd.Count -ne 1){throw 'XD_PICKER_PARENT_HOME_NOT_UNIQUE'}
          $children=$xd[0].FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
          Write-Host "XD_PICKER_XD_FRAME_DESCENDANTS=$($children.Count)"
          $dialogs=@()
          foreach($node in $children){
            if([int]$node.Current.ProcessId -eq $pickerPidValue -and
              [string]$node.Current.ControlType.ProgrammaticName -eq 'ControlType.Window'){
              $dialogs+=,$node
              Write-Host "XD_PICKER_DIALOG_FOUND name=$($node.Current.Name) class=$($node.Current.ClassName) id=$($node.Current.AutomationId)"
            }
          }
          foreach($t in $top){
            if([int]$t.Current.ProcessId -eq $pickerPidValue){
              $dialogs+=,$t
              Write-Host "XD_PICKER_TOP_WINDOW name=$($t.Current.Name) class=$($t.Current.ClassName) id=$($t.Current.AutomationId)"
            }
          }
          Write-Host "XD_PICKER_DIALOG_CANDIDATES=$($dialogs.Count)"
          $seen=New-Object 'System.Collections.Generic.HashSet[String]'
          foreach($dialog in $dialogs){
            $els=$dialog.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
            Write-Host "XD_PICKER_DIALOG_DESCENDANTS=$($els.Count)"
            $printed=0
            foreach($el in $els){
              if($printed -ge 125){break}
              if([int]$el.Current.ProcessId -ne $pickerPidValue){continue}
              $type=[string]$el.Current.ControlType.ProgrammaticName
              $name=[string]$el.Current.Name
              $id=[string]$el.Current.AutomationId
              if($type -match 'Edit|Button|ComboBox|Window' -or
                 $id -match '^1001$|^1$|FileNameControlHost|FileName|Breadcrumb' -or
                 $name -match '(?i)Open|File name|ファイル名|開く'){
                 $key=$type+'|'+$id+'|'+$name
                 if(-not $seen.Add($key)){continue}
                 $printed++
                 Write-Host "XD_PICKER_CONTROL type=$type name=$($name.Substring(0,[Math]::Min(110,$name.Length))) id=$id enabled=$($el.Current.IsEnabled) hwnd=$($el.Current.NativeWindowHandle)"
              }
            }
          }
          if((Get-FileHash -LiteralPath (Join-Path $root 'MCP_KFP4_Red_XD_38205166138.xd') -Algorithm SHA256).Hash -ne '58966788CF369885C2395CE217D6E0443ED57BCD7F40BD550B2F3A24C2B5B831'){throw 'XD_PICKER_NATIVE_CHANGED'}
          Write-Host 'XD_PICKER_READONLY_COMPLETE=PASS'
