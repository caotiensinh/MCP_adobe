name: Mode 2 XD native Undo one applied Fill on saved disposable Rectangle
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-live-fill-undo-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  undo-native:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require exact applied Fill receipt and protect source/native plugin before Undo
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){
            throw 'MODE2_UNDO_WRONG_HOST'
          }
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $baseline='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          $saved='1E15162107A64E3D7D4CAF8C12B88FE24B64488DA9788854E6D300DDBAE88C2F'
          foreach($rel in @('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd')){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $baseline){
              throw 'MODE2_UNDO_PROTECTED_PANDA_CHANGED'
            }
          }
          $native=Join-Path $root 'mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd'
          if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash -ne $saved){
            throw 'MODE2_UNDO_SAVED_DISPOSABLE_DISK_CHANGED'
          }
          $dir=Join-Path $root 'mode2-disposable-native'
          $fill=Join-Path $dir 'mode2_exact_guid_fill_mutation_receipt.json'
          $undo=Join-Path $dir 'mode2_exact_guid_fill_undo_receipt.json'
          $marker=Join-Path $dir 'Mode2_GUID_Fill_Undo_Once.marker'
          if(!(Test-Path -LiteralPath $fill -PathType Leaf) -or
             (Test-Path -LiteralPath $undo) -or (Test-Path -LiteralPath $marker)){
            throw 'MODE2_UNDO_FILL_MISSING_OR_UNDO_ALREADY_ATTEMPTED_NO_REPLAY'
          }
          $r=Get-Content -LiteralPath $fill -Raw -Encoding UTF8 | ConvertFrom-Json
          if($r.state -ne 'applied_verified' -or
             $r.document_id -ne '98d6635b-3767-4254-b200-ec8442b69ad2' -or
             $r.node_id -ne '9989e92f-7c9b-4721-9cdc-b5b5ea33cdf2' -or
             $r.fill_before -ne '#445566' -or $r.fill_requested -ne '#A1B2C3' -or
             $r.operation_id -ne 'xd-1792161320011-1'){
            throw 'MODE2_UNDO_APPLIED_FILL_RECEIPT_MISMATCH'
          }
          if(@(Get-Process -Name Illustrator,Photoshop,PickerHost -ErrorAction SilentlyContinue).Count -gt 0){
            throw 'MODE2_UNDO_FOREIGN_ADOBE_APP_OR_MODAL'
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $windows=[System.Windows.Automation.AutomationElement]::RootElement.FindAll(
            [System.Windows.Automation.TreeScope]::Children,
            [System.Windows.Automation.Condition]::TrueCondition)
          $xd=@($windows|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_UNDO_NOT_SOLE_DISPOSABLE_GUI'}
          $develop=Join-Path $env:LOCALAPPDATA 'Packages\Adobe.XD_pc75e8sa7ep4e\LocalState\develop'
          $exp=Join-Path $develop 'MCPAdobeMode2Experiment\main.js'
          $git=(Get-Command git -ErrorAction Stop).Source
          if((& $git hash-object -- $exp).Trim() -ne 'd47edb15284ff4653da919513815fe4f9d846a70'){
            throw 'MODE2_UNDO_WRONG_EXPERIMENTAL_UXP_BLOB'
          }
          if(@(Get-NetTCPConnection -LocalPort 8766 -State Listen -ErrorAction SilentlyContinue).Count -gt 0){
            throw 'MODE2_UNDO_UNOWNED_8766_LISTENER'
          }
          Write-Host 'MODE2_UNDO_PRECHECK_APPLIED_EXACT_GUID_AND_RECEIPT=PASS'
      - name: Invoke one native XD Undo and verify solid Fill restored on same 34-node graph
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          $uv=(Get-Command uv -ErrorAction Stop).Source
          & $uv run --python 3.12 python -m py_compile scripts/mode2_live_disposable_fill_once.py scripts/mode2_live_disposable_fill_undo_once.py
          if($LASTEXITCODE -ne 0){throw 'MODE2_UNDO_DRIVER_INVALID_SYNTAX'}
          & $uv run --python 3.12 python scripts/mode2_live_disposable_fill_undo_once.py --wait-seconds 95
          if($LASTEXITCODE -ne 0){throw 'MODE2_UNDO_REAL_GUI_PROOF_FAILED_NO_REPLAY'}
          $dir=Join-Path $env:USERPROFILE 'Documents\MCPAdobe\mode2-disposable-native'
          $u=Get-Content -LiteralPath (Join-Path $dir 'mode2_exact_guid_fill_undo_receipt.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if($u.state -ne 'undone_verified' -or $u.operation_id -ne 'xd-1792161320011-1'){
            throw 'MODE2_UNDO_REAL_RECEIPT_NOT_VERIFIED'
          }
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $sha='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          foreach($rel in @('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd')){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $sha){
              throw 'MODE2_UNDO_PROTECTED_PANDA_CHANGED'
            }
          }
          $native=Join-Path $dir 'Mode2_Undo_E2E_38584984023.xd'
          if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash -ne
             '1E15162107A64E3D7D4CAF8C12B88FE24B64488DA9788854E6D300DDBAE88C2F'){
            throw 'MODE2_UNDO_DISPOSABLE_DISK_CHANGED'
          }
          Write-Host 'MODE2_NATIVE_FILL_UNDO_PROTECTED_FILES_PASS'
          Write-Host 'MODE2_NATIVE_EXACT_FILL_UNDO_E2E=PASS'
