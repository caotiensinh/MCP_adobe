name: Targeted Photoshop 24 UXP compatibility v2

on:
  pull_request:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-photoshop-core-ps24-v2.yml"
      - "scripts/probe_photoshop_core_live.cjs"

concurrency:
  group: targeted-photoshop-core-ps24-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-ps24-v2:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Verify Photoshop 24 is running
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Process -Name Photoshop -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          if(-not $p){throw 'Photoshop is not running'}
          $v=([regex]::Match((Get-Item $p.Path).VersionInfo.ProductVersion,'\d+\.\d+(?:\.\d+)?')).Value
          if(-not $v.StartsWith('24.')){throw "Expected Photoshop 24.x, got $v"}
          "PHOTOSHOP_VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PHOTOSHOP_VERSION=$v SESSION=$($p.SessionId)"
          Write-Host 'PHOTOSHOP_24_PROCESS_VERIFY=PASS'

      - name: Prepare pinned PS24-compatible upstream
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dst=Join-Path $env:RUNNER_TEMP 'core-photoshop-mcp-v2'
          if(Test-Path $dst){Remove-Item -Recurse -Force $dst}
          git clone https://github.com/CORE-Automate-WSS/photoshop-mcp.git $dst
          git -C $dst checkout --detach 586b66499852c801bcdb3b718c036f16f043c1d7
          if((git -C $dst rev-parse HEAD).Trim() -ne '586b66499852c801bcdb3b718c036f16f043c1d7'){throw 'upstream pin mismatch'}
          $panel=Join-Path $dst 'packages\ps-uxp-bridge'
          $manifest=Join-Path $panel 'manifest.json'
          $j=Get-Content $manifest -Raw | ConvertFrom-Json
          if([version]$j.host[0].minVersion -gt [version]'24.0.0'){throw "upstream minVersion incompatible: $($j.host[0].minVersion)"}
          $main=Join-Path $panel 'main.js'
          $src=Get-Content $main -Raw
          $needle='  log("MCP Bridge initialized");'
          if(-not $src.Contains($needle)){throw 'auto-connect hook location missing'}
          $src=$src.Replace($needle,$needle+"`r`n  setTimeout(connect, 500);")
          [IO.File]::WriteAllText($main,$src,(New-Object Text.UTF8Encoding($false)))
          "CORE_PANEL=$panel" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CORE_SERVER_DIR=$(Join-Path $dst 'packages\mcp-server')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CORE_MIN_VERSION=$($j.host[0].minVersion)"
          Write-Host 'CORE_PS24_COMPAT_DECLARATION=PASS'

      - name: Build and test pinned upstream
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:CORE_SERVER_DIR
          try {
            npm install --no-audit --no-fund
            if($LASTEXITCODE -ne 0){throw 'npm install failed'}
            npm run build
            if($LASTEXITCODE -ne 0){throw 'build failed'}
            npm test -- --run
            if($LASTEXITCODE -ne 0){throw 'tests failed'}
          } finally { Pop-Location }
          Write-Host 'CORE_BUILD_TEST=PASS'

      - name: Install Adobe UXP CLI 1.2.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cli=Join-Path $env:RUNNER_TEMP 'uxp-cli-ps24-v2'
          if(Test-Path $cli){Remove-Item -Recurse -Force $cli}
          New-Item -ItemType Directory -Force $cli | Out-Null
          Push-Location $cli
          try {
            npm init -y | Out-Null
            npm install --no-audit --no-fund --ignore-scripts tar@6.2.1 @adobe/uxp-devtools-cli@1.2.0
            if($LASTEXITCODE -ne 0){throw 'UXP CLI install failed'}
            node (Join-Path $cli 'node_modules\@adobe\uxp-devtools-helper\scripts\devtools_setup.js')
            if($LASTEXITCODE -ne 0){throw 'native helper setup failed'}
            $uxp=Join-Path $cli 'node_modules\.bin\uxp.cmd'
            if(-not (Test-Path $uxp)){throw 'uxp.cmd missing'}
            "UXP_CLI=$uxp" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } finally { Pop-Location }
          Write-Host 'UXP_CLI_INSTALL=PASS'

      - name: Enable Adobe UXP Developer Tools with confirmation
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host 'UXP_DEVTOOLS_ENABLE_CONFIRMATION=SENT'
          '' | & $env:UXP_CLI devtools enable
          $rc=$LASTEXITCODE
          Write-Host "UXP_DEVTOOLS_ENABLE_RC=$rc"
          if($rc -ne 0){throw "uxp devtools enable failed rc=$rc"}
          Write-Host 'UXP_DEVTOOLS_ENABLE=PASS'

      - name: Start UXP service and discover Photoshop 24
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'uxp-service-ps24-v2.log'
          $cmd="`"$env:UXP_CLI`" service start > `"$log`" 2>&1"
          $svc=Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/s','/c',$cmd) -PassThru -WindowStyle Hidden
          "UXP_SERVICE_PID=$($svc.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $deadline=[DateTime]::UtcNow.AddSeconds(60); $ready=$false
          do {
            Start-Sleep 2
            & $env:UXP_CLI apps list
            if($LASTEXITCODE -eq 0){$ready=$true;break}
            if($svc.HasExited){break}
          } while([DateTime]::UtcNow -lt $deadline)
          if(Test-Path $log){Get-Content $log -Raw}
          if(-not $ready){throw 'UXP service/Photoshop discovery failed'}
          Write-Host 'PHOTOSHOP_24_UXP_DISCOVERY=PASS'

      - name: Start direct UXP bridge probe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'photoshop-core-probe-v2'; New-Item -ItemType Directory -Force $out | Out-Null
          "PHOTOSHOP_PROBE_OUT=$out" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $stdout=Join-Path $env:RUNNER_TEMP 'ps24-probe-v2.out.log'; $stderr=Join-Path $env:RUNNER_TEMP 'ps24-probe-v2.err.log'
          $p=Start-Process node -ArgumentList @((Join-Path $env:GITHUB_WORKSPACE 'scripts\probe_photoshop_core_live.cjs')) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "PHOTOSHOP_PROBE_PID=$($p.Id)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PHOTOSHOP_PROBE_STDOUT=$stdout" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PHOTOSHOP_PROBE_STDERR=$stderr" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Start-Sleep 2
          if($p.HasExited){if(Test-Path $stderr){Get-Content $stderr -Raw}; throw "probe exited early rc=$($p.ExitCode)"}
          Write-Host 'PHOTOSHOP_CORE_PROBE_STARTED=PASS'

      - name: Load PS24 UXP panel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & $env:UXP_CLI plugin load --manifest $env:CORE_PANEL --apps "PS@$env:PHOTOSHOP_VERSION"
          if($LASTEXITCODE -ne 0){throw "plugin load failed rc=$LASTEXITCODE"}
          Write-Host 'PHOTOSHOP_24_UXP_PLUGIN_LOAD=PASS'
          Write-Host 'Open Photoshop > Plugins > MCP Bridge if the panel is not already visible. The test copy auto-connects.'

      - name: Verify live create save export
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $probePid=[int]$env:PHOTOSHOP_PROBE_PID
          $deadline=[DateTime]::UtcNow.AddSeconds(190)
          do { Start-Sleep 2; $p=Get-Process -Id $probePid -ErrorAction SilentlyContinue; if(-not $p){break} } while([DateTime]::UtcNow -lt $deadline)
          $p=Get-Process -Id $probePid -ErrorAction SilentlyContinue
          if($p){Stop-Process -Id $probePid -Force -ErrorAction SilentlyContinue; $timedOut=$true}else{$timedOut=$false}
          if(Test-Path $env:PHOTOSHOP_PROBE_STDOUT){Get-Content $env:PHOTOSHOP_PROBE_STDOUT -Raw}
          if(Test-Path $env:PHOTOSHOP_PROBE_STDERR){Get-Content $env:PHOTOSHOP_PROBE_STDERR -Raw}
          if($timedOut){throw 'live probe timed out'}
          $text=if(Test-Path $env:PHOTOSHOP_PROBE_STDOUT){Get-Content $env:PHOTOSHOP_PROBE_STDOUT -Raw}else{''}
          if($text -notmatch 'PHOTOSHOP_24_LIVE_OPERATION_VERIFY=PASS'){throw 'live operation PASS marker missing'}
          Write-Host 'PHOTOSHOP_24_PRODUCTION_CANDIDATE=PASS'

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          if($env:PHOTOSHOP_PROBE_PID){Stop-Process -Id ([int]$env:PHOTOSHOP_PROBE_PID) -Force -ErrorAction SilentlyContinue}
          if($env:UXP_SERVICE_PID){Stop-Process -Id ([int]$env:UXP_SERVICE_PID) -Force -ErrorAction SilentlyContinue}
