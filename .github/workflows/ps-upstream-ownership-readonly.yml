name: Photoshop upstream process ownership and UXP sockets readonly
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/ps-upstream-ownership-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Inspect exact Photoshop MCP process genealogy and sockets, without changes
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'PS_OWNER_WRONG_DESKTOP'}
          $all=@(Get-CimInstance Win32_Process -ErrorAction Stop)
          $nodes=@($all|Where-Object {$_.Name -match '^(node|npx)(\.exe)?$' -and $_.CommandLine -match 'photoshop-mcp'})
          foreach($p in $nodes){
            $parent=@($all|Where-Object {$_.ProcessId -eq $p.ParentProcessId}|Select-Object -First 1)
            Write-Host "PS_OWNER_NODE pid=$($p.ProcessId) ppid=$($p.ParentProcessId) parentName=$($parent.Name) session=$($p.SessionId) created=$($p.CreationDate)"
          }
          Write-Host "PS_OWNER_UPSTREAM_COUNT=$($nodes.Count)"
          $ps=@($all|Where-Object {$_.Name -ieq 'Photoshop.exe'})
          foreach($p in $ps){Write-Host "PS_OWNER_APP pid=$($p.ProcessId) session=$($p.SessionId)"}
          foreach($port in @(8787,8765,8081,3000,3001,3002,4000,4001,4002)){
            $tcp=@(Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue)
            $listeners=@($tcp|Where-Object {$_.State -eq 'Listen'})
            $established=@($tcp|Where-Object {$_.State -eq 'Established'})
            Write-Host "PS_OWNER_PORT port=$port listeners=$($listeners.Count) established=$($established.Count) ownerPids=$((@($listeners|ForEach-Object {$_.OwningProcess})|Select-Object -Unique)-join ',')"
          }
          Write-Host 'PS_OWNER_READONLY_COMPLETE=PASS'
