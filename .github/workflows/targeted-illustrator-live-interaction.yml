name: Live Illustrator direct interaction

on:
  push:
    branches: [feat/illustrator-cep-backend]
    paths:
      - ".github/workflows/targeted-illustrator-live-interaction.yml"
      - "src/mcp_adobe/illustrator.py"
      - "src/mcp_adobe/illustrator_cep.py"
      - "src/mcp_adobe/server.py"
      - "scripts/install_local_host.ps1"
      - "scripts/ensure_illustrator_cep_bootstrap.ps1"
      - "tests/test_illustrator_cep_bootstrap_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: illustrator-live-interaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-interaction:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      - name: Prepare local MCP client runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $machine=[Environment]::GetEnvironmentVariable('Path','Machine')
          $user=[Environment]::GetEnvironmentVariable('Path','User')
          $env:Path=(@($machine,$user,$env:Path) | Where-Object {$_}) -join ';'
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)) {
            $uvDir=Join-Path $HOME '.local\bin'
            if(Test-Path (Join-Path $uvDir 'uv.exe')) { $env:Path="$uvDir;$env:Path" }
          }
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)){ throw 'uv unavailable' }
          uv sync

      - name: Diagnose live Illustrator CEP runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $panel=Join-Path $env:APPDATA 'Adobe\CEP\extensions\com.illustrator.mcp.panel'
          $manifest=Join-Path $panel 'CSXS\manifest.xml'
          $bootstrap=Join-Path $panel 'bootstrap\index.html'
          Write-Host "CEP_PANEL_PATH=$panel"
          foreach($p in @($manifest,$bootstrap,(Join-Path $panel 'dist\CSInterface.js'))){
            if(Test-Path -LiteralPath $p){
              $item=Get-Item -LiteralPath $p
              Write-Host "CEP_FILE=PASS PATH=$p SIZE=$($item.Length) MTIME=$($item.LastWriteTime.ToString('o'))"
            } else {
              Write-Host "CEP_FILE=MISSING PATH=$p"
            }
          }
          $cep=@(Get-CimInstance Win32_Process -Filter "Name='CEPHtmlEngine.exe'" -ErrorAction SilentlyContinue)
          Write-Host "CEP_HTML_ENGINE_COUNT=$($cep.Count)"
          foreach($p in $cep){
            Write-Host "CEP_HTML_ENGINE PID=$($p.ProcessId) CMD=$($p.CommandLine)"
          }
          foreach($ver in @('12','11','10','9')){
            $key="HKCU:\Software\Adobe\CSXS.$ver"
            $value=(Get-ItemProperty -Path $key -Name PlayerDebugMode -ErrorAction SilentlyContinue).PlayerDebugMode
            Write-Host "CEP_PLAYER_DEBUG CSXS=$ver VALUE=$value"
          }
          foreach($root in @((Join-Path $env:APPDATA 'Adobe\CEP'),(Join-Path $env:LOCALAPPDATA 'Adobe\CEP'))){
            if(Test-Path -LiteralPath $root){
              Write-Host "CEP_LOG_ROOT=$root"
              Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 30 |
                ForEach-Object { Write-Host "CEP_RECENT_FILE PATH=$($_.FullName) MTIME=$($_.LastWriteTime.ToString('o')) SIZE=$($_.Length)" }
            }
          }
          exit 0

      - name: Require existing persistent Illustrator connection
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($port in @(8787,8081)){
            $listeners=@(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue)
            if($listeners.Count -ne 1){ throw "expected one existing listener on $port, got $($listeners.Count)" }
            $ownerPid=$listeners[0].OwningProcess
            $p=Get-CimInstance Win32_Process -Filter "ProcessId=$ownerPid"
            Write-Host "LIVE_EXISTING_PORT_$port=PASS PID=$ownerPid EXE=$($p.ExecutablePath) CMD=$($p.CommandLine)"
          }

          $visible=Get-Process -Name Illustrator -ErrorAction SilentlyContinue |
            Where-Object {$_.MainWindowHandle -ne 0} |
            Select-Object -First 1
          if(-not $visible){ throw 'Illustrator interactive window is not open' }
          Write-Host "LIVE_ILLUSTRATOR_PROCESS=PASS PID=$($visible.Id) SESSION=$($visible.SessionId)"

          $established=@(Get-NetTCPConnection -State Established -LocalPort 8081 -ErrorAction SilentlyContinue)
          if($established.Count -eq 0){
            $manifest=Join-Path $env:APPDATA 'Adobe\CEP\extensions\com.illustrator.mcp.panel\CSXS\manifest.xml'
            if(-not (Test-Path -LiteralPath $manifest)){ throw "Illustrator CEP manifest missing: $manifest" }
            $manifestItem=Get-Item -LiteralPath $manifest
            Write-Host "ILLUSTRATOR_BOOTSTRAP_TIMES PROCESS_START=$($visible.StartTime.ToString('o')) MANIFEST_TIME=$($manifestItem.LastWriteTime.ToString('o')) TITLE=$($visible.MainWindowTitle)"
            $manifestText=[IO.File]::ReadAllText($manifest)
            foreach($required in @(
              '<StartOn>',
              '<Event>applicationActivate</Event>',
              '<Event>com.adobe.csxs.events.ApplicationActivate</Event>'
            )){
              if(-not $manifestText.Contains($required)){
                throw "Production Illustrator CEP manifest is missing auto-start marker: $required"
              }
            }
            $shell=New-Object -ComObject WScript.Shell
            [void]$shell.AppActivate($visible.Id)
            Write-Host 'ILLUSTRATOR_AUTOSTART_WAKE=APPLICATION_ACTIVATE'
            $deadline=(Get-Date).AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 500
              $established=@(Get-NetTCPConnection -State Established -LocalPort 8081 -ErrorAction SilentlyContinue)
              if($established.Count -gt 0){ break }
            } until((Get-Date) -gt $deadline)
            if($established.Count -eq 0){
              throw 'Illustrator CEP auto-start did not establish the persistent 8081 WebSocket session'
            }
          }
          Write-Host "ILLUSTRATOR_PANEL_SESSION=PASS connections=$($established.Count)"

          @'
          import asyncio
          import json
          from collections.abc import Mapping
          from mcp import Client

          URL = "http://127.0.0.1:8787/mcp"

          def walk(value):
              yield value
              if isinstance(value, Mapping):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from walk(child)

          def find_layers(value):
              for node in walk(value):
                  if isinstance(node, Mapping):
                      layers = node.get("layers")
                      if isinstance(layers, Mapping) and "panel" in layers:
                          return layers
              return None

          def find_execution(value):
              for node in walk(value):
                  if (
                      isinstance(node, Mapping)
                      and "activeJob" in node
                      and "waiting" in node
                      and "unresolvedJobs" in node
                  ):
                      return node
              return None

          async def main():
              async with Client(URL) as client:
                  result = await client.call_tool(
                      "creative_read",
                      {
                          "application": "illustrator",
                          "capability": "creative.health",
                          "arguments": {"probe": False, "timeout": 5.0},
                      },
                  )
                  if result.is_error:
                      raise RuntimeError(f"creative.health failed: {result}")
                  payload = result.structured_content
                  layers = find_layers(payload)
                  panel = layers.get("panel") if isinstance(layers, Mapping) else None
                  illustrator = layers.get("illustrator") if isinstance(layers, Mapping) else None
                  execution = find_execution(payload)
                  if not (
                      isinstance(panel, Mapping)
                      and panel.get("status") in {"ok", "degraded"}
                      and not panel.get("heartbeatStale")
                      and not panel.get("busy")
                      and panel.get("activeRequestId") is None
                  ):
                      raise RuntimeError(
                          "Illustrator panel is not connected and idle; refusing mutation: " +
                          json.dumps(panel, ensure_ascii=False, default=str)
                      )
                  if not (isinstance(illustrator, Mapping) and illustrator.get("status") == "ok"):
                      raise RuntimeError(
                          "Illustrator host is not ready: " +
                          json.dumps(illustrator, ensure_ascii=False, default=str)
                      )
                  if isinstance(execution, Mapping):
                      if execution.get("activeJob") is not None or execution.get("waiting") not in {0, None}:
                          raise RuntimeError(
                              "Illustrator backend has active work; refusing mutation: " +
                              json.dumps(execution, ensure_ascii=False, default=str)
                          )
                      if execution.get("unresolvedJobs"):
                          raise RuntimeError(
                              "Illustrator backend has unresolved jobs; refusing mutation: " +
                              json.dumps(execution, ensure_ascii=False, default=str)
                          )
                  print(
                      "ILLUSTRATOR_LIVE_CONNECTION_GATE=PASS " +
                      json.dumps(
                          {"panel": panel, "illustrator": illustrator, "execution": execution},
                          ensure_ascii=False,
                          default=str,
                      ),
                      flush=True,
                  )

          asyncio.run(main())
          '@ | Set-Content -Path illustrator_connection_gate.py -Encoding UTF8
          uv run python illustrator_connection_gate.py

      - name: Draw a car through MCP and verify read-back
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import asyncio
          import json
          from collections.abc import Mapping
          from mcp import Client

          URL = "http://127.0.0.1:8787/mcp"
          DOC_NAME = "ChatGPT MCP Car Test"

          def walk(value):
              yield value
              if isinstance(value, Mapping):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from walk(child)

          def token_from_item(item):
              if not isinstance(item, Mapping):
                  return None
              uuid = item.get("uuid")
              if isinstance(uuid, str) and uuid:
                  return uuid
              ref = item.get("itemRef")
              if isinstance(ref, Mapping):
                  ident = ref.get("identity")
                  if isinstance(ident, Mapping):
                      item_id = ident.get("itemId")
                      if isinstance(item_id, str) and item_id:
                          return item_id
              handle = item.get("handle")
              if isinstance(handle, str) and handle:
                  return "handle:" + handle
              return None

          def find_named_item(value, name):
              for node in walk(value):
                  if isinstance(node, Mapping) and node.get("name") == name:
                      token = token_from_item(node)
                      if token:
                          return node, token
              return None, None

          async def call(client, tool, capability, arguments):
              result = await client.call_tool(
                  tool,
                  {
                      "application": "illustrator",
                      "capability": capability,
                      "arguments": arguments,
                  },
              )
              if result.is_error:
                  raise RuntimeError(f"{tool}/{capability} failed: {result}")
              payload = result.structured_content
              print(
                  f"LIVE_{capability}=" +
                  json.dumps(payload, ensure_ascii=False, default=str),
                  flush=True,
              )
              return payload

          async def create_and_verify(client, capability, spec):
              name = spec["name"]
              await call(client, "creative_write", capability, spec)
              found = await call(
                  client,
                  "creative_read",
                  "creative.object.find",
                  {"name": name},
              )
              item, token = find_named_item(found, name)
              if item is None or token is None:
                  raise RuntimeError(f"MCP car part did not read back: {name}")
              print(
                  "ILLUSTRATOR_MCP_CAR_PART=PASS " +
                  json.dumps({"name": name, "token": token}, ensure_ascii=False),
                  flush=True,
              )
              return token

          async def main():
              async with Client(URL) as client:
                  listed = await client.list_tools()
                  names = {tool.name for tool in listed.tools}
                  required = {
                      "creative_discover",
                      "creative_read",
                      "creative_write",
                      "creative_authorized_write",
                  }
                  if names != required:
                      raise RuntimeError(f"unexpected MCP tools: {sorted(names)}")

                  await call(
                      client,
                      "creative_write",
                      "creative.document.create",
                      {
                          "width": 760,
                          "height": 480,
                          "color_mode": "RGB",
                          "name": DOC_NAME,
                      },
                  )

                  parts = [
                      (
                          "creative.shape.rectangle",
                          {
                              "name": "MCP Car Body",
                              "x": 130,
                              "y": 215,
                              "width": 500,
                              "height": 125,
                              "fill": {"r": 220, "g": 48, "b": 52},
                          },
                      ),
                      (
                          "creative.shape.rectangle",
                          {
                              "name": "MCP Car Cabin",
                              "x": 250,
                              "y": 135,
                              "width": 250,
                              "height": 95,
                              "fill": {"r": 220, "g": 48, "b": 52},
                          },
                      ),
                      (
                          "creative.shape.rectangle",
                          {
                              "name": "MCP Car Window Left",
                              "x": 270,
                              "y": 150,
                              "width": 90,
                              "height": 58,
                              "fill": {"r": 151, "g": 214, "b": 255},
                          },
                      ),
                      (
                          "creative.shape.rectangle",
                          {
                              "name": "MCP Car Window Right",
                              "x": 385,
                              "y": 150,
                              "width": 90,
                              "height": 58,
                              "fill": {"r": 151, "g": 214, "b": 255},
                          },
                      ),
                      (
                          "creative.shape.ellipse",
                          {
                              "name": "MCP Car Wheel Left",
                              "x": 190,
                              "y": 290,
                              "width": 96,
                              "height": 96,
                              "fill": {"r": 32, "g": 32, "b": 36},
                          },
                      ),
                      (
                          "creative.shape.ellipse",
                          {
                              "name": "MCP Car Wheel Right",
                              "x": 475,
                              "y": 290,
                              "width": 96,
                              "height": 96,
                              "fill": {"r": 32, "g": 32, "b": 36},
                          },
                      ),
                      (
                          "creative.shape.ellipse",
                          {
                              "name": "MCP Car Hub Left",
                              "x": 218,
                              "y": 318,
                              "width": 40,
                              "height": 40,
                              "fill": {"r": 180, "g": 180, "b": 185},
                          },
                      ),
                      (
                          "creative.shape.ellipse",
                          {
                              "name": "MCP Car Hub Right",
                              "x": 503,
                              "y": 318,
                              "width": 40,
                              "height": 40,
                              "fill": {"r": 180, "g": 180, "b": 185},
                          },
                      ),
                      (
                          "creative.shape.rectangle",
                          {
                              "name": "MCP Car Headlight",
                              "x": 602,
                              "y": 245,
                              "width": 28,
                              "height": 26,
                              "fill": {"r": 255, "g": 226, "b": 98},
                          },
                      ),
                  ]

                  tokens = {}
                  for capability, spec in parts:
                      tokens[spec["name"]] = await create_and_verify(
                          client, capability, spec
                      )

                  structure = await call(
                      client,
                      "creative_read",
                      "creative.document.structure",
                      {},
                  )
                  missing = [
                      name
                      for name in tokens
                      if not any(
                          isinstance(node, Mapping) and node.get("name") == name
                          for node in walk(structure)
                      )
                  ]
                  if missing:
                      raise RuntimeError(
                          "MCP car document structure missing: " + ", ".join(missing)
                      )

                  print(
                      "ILLUSTRATOR_MCP_CAR_DRAW=PASS " +
                      json.dumps(
                          {
                              "document": DOC_NAME,
                              "parts": len(tokens),
                              "tokens": tokens,
                          },
                          ensure_ascii=False,
                      ),
                      flush=True,
                  )

          asyncio.run(main())
          '@ | Set-Content -Path illustrator_mcp_draw_car.py -Encoding UTF8
          uv run python illustrator_mcp_draw_car.py
