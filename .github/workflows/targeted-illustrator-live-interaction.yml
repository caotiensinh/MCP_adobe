name: Live Illustrator direct interaction

on:
  push:
    branches: [feat/illustrator-cep-backend]
    paths:
      - ".github/workflows/targeted-illustrator-live-interaction.yml"
      - "src/mcp_adobe/illustrator.py"
      - "src/mcp_adobe/illustrator_cep.py"
      - "src/mcp_adobe/server.py"
      - "scripts/install_local_host.ps1"
      - "scripts/ensure_illustrator_cep_bootstrap.ps1"
      - "tests/test_illustrator_cep_bootstrap_contract.py"
      - "scripts/illustrator_cep_fallback_transport.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: illustrator-live-interaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-interaction:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      - name: Prepare local MCP client runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $machine=[Environment]::GetEnvironmentVariable('Path','Machine')
          $user=[Environment]::GetEnvironmentVariable('Path','User')
          $env:Path=(@($machine,$user,$env:Path) | Where-Object {$_}) -join ';'
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)) {
            $uvDir=Join-Path $HOME '.local\bin'
            if(Test-Path (Join-Path $uvDir 'uv.exe')) { $env:Path="$uvDir;$env:Path" }
          }
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)){ throw 'uv unavailable' }
          uv sync

      - name: Install fallback MCP transport into auto-start CEP bootstrap
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $panel=Join-Path $env:APPDATA 'Adobe\CEP\extensions\com.illustrator.mcp.panel'
          $manifest=Join-Path $panel 'CSXS\manifest.xml'
          $bootstrap=Join-Path $panel 'bootstrap\index.html'
          $source=Join-Path $env:GITHUB_WORKSPACE 'scripts\illustrator_cep_fallback_transport.html'
          foreach($p in @($manifest,$source)){ if(-not (Test-Path -LiteralPath $p)){ throw "required file missing: $p" } }

          $liveSession=@(Get-NetTCPConnection -State Established -LocalPort 8081 -ErrorAction SilentlyContinue)
          $liveIllustrator=Get-Process -Name Illustrator -ErrorAction SilentlyContinue |
            Where-Object {$_.MainWindowHandle -ne 0} |
            Select-Object -First 1
          if($liveSession.Count -gt 0 -and $liveIllustrator){
            Write-Host "ILLUSTRATOR_CEP_FALLBACK_RELOAD=SKIP existing-live-session connections=$($liveSession.Count) PID=$($liveIllustrator.Id) TITLE=$($liveIllustrator.MainWindowTitle)"
            exit 0
          }
          $manifestText=[IO.File]::ReadAllText($manifest)
          $pattern='<MainPath>\./bootstrap/index\.html</MainPath>\s*<ScriptPath>\./jsx/host\.jsx</ScriptPath>'
          if($manifestText -notmatch $pattern){
            $main='<MainPath>./bootstrap/index.html</MainPath>'
            if(-not $manifestText.Contains($main)){ throw 'bootstrap MainPath missing from installed manifest' }
            $replacement=$main + [Environment]::NewLine + '                    <ScriptPath>./jsx/host.jsx</ScriptPath>'
            $manifestText=$manifestText.Replace($main,$replacement)
            [IO.File]::WriteAllText($manifest,$manifestText,(New-Object Text.UTF8Encoding($false)))
          }
          New-Item -ItemType Directory -Path (Split-Path -Parent $bootstrap) -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination $bootstrap -Force
          Write-Host 'ILLUSTRATOR_CEP_FALLBACK_PATCH=PASS'

          $visible=Get-Process -Name Illustrator -ErrorAction SilentlyContinue |
            Where-Object {$_.MainWindowHandle -ne 0} |
            Select-Object -First 1
          if($visible){
            $title=[string]$visible.MainWindowTitle
            $isHome=[string]::IsNullOrWhiteSpace($title) -or $title -eq 'Adobe Illustrator' -or $title -eq 'Adobe Illustrator 2023'
            Write-Host "ILLUSTRATOR_CEP_FALLBACK_RELOAD_TITLE=$title HOME=$isHome PID=$($visible.Id)"
            if(-not $isHome){ throw "BLOCKED_SAFE_RELOAD: active document detected: $title" }
            $oldPid=$visible.Id
            [void]$visible.CloseMainWindow()
            $deadline=(Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 500
              $remaining=Get-Process -Id $oldPid -ErrorAction SilentlyContinue
            } until(-not $remaining -or (Get-Date) -gt $deadline)
            if($remaining){
              Write-Host "ILLUSTRATOR_CEP_FALLBACK_FORCE_CLOSE_HOME_PID=$oldPid"
              Stop-Process -Id $oldPid -Force -ErrorAction Stop
              Start-Sleep -Seconds 2
            }
          }

          $aiPath='D:\Ilustrator\Adobe Illustrator 2023\Support Files\Contents\Windows\Illustrator.exe'
          if(-not (Test-Path -LiteralPath $aiPath)){ throw "Illustrator executable missing: $aiPath" }
          $oldTracking=$env:RUNNER_TRACKING_ID
          try {
            Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
            $started=Start-Process -FilePath $aiPath -PassThru
            Write-Host "ILLUSTRATOR_CEP_FALLBACK_RELAUNCH_PID=$($started.Id)"
          } finally {
            if($null -ne $oldTracking){ $env:RUNNER_TRACKING_ID=$oldTracking }
          }
          $deadline=(Get-Date).AddSeconds(90)
          do {
            Start-Sleep -Seconds 1
            $visible=Get-Process -Name Illustrator -ErrorAction SilentlyContinue |
              Where-Object {$_.MainWindowHandle -ne 0} |
              Select-Object -First 1
          } until($visible -or (Get-Date) -gt $deadline)
          if(-not $visible){ throw 'Illustrator did not expose an interactive window after fallback transport reload' }
          Write-Host "ILLUSTRATOR_CEP_FALLBACK_WINDOW=PASS PID=$($visible.Id) TITLE=$($visible.MainWindowTitle)"
          $deadline=(Get-Date).AddSeconds(40)
          do {
            Start-Sleep -Milliseconds 500
            $established=@(Get-NetTCPConnection -State Established -LocalPort 8081 -ErrorAction SilentlyContinue)
          } until($established.Count -gt 0 -or (Get-Date) -gt $deadline)
          if($established.Count -eq 0){ throw 'CEP fallback transport did not establish WebSocket 8081 after Illustrator restart' }
          Write-Host "ILLUSTRATOR_CEP_FALLBACK_WS=PASS connections=$($established.Count)"

      - name: Diagnose live Illustrator CEP runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $panel=Join-Path $env:APPDATA 'Adobe\CEP\extensions\com.illustrator.mcp.panel'
          $manifest=Join-Path $panel 'CSXS\manifest.xml'
          $bootstrap=Join-Path $panel 'bootstrap\index.html'
          Write-Host "CEP_PANEL_PATH=$panel"
          foreach($p in @($manifest,$bootstrap,(Join-Path $panel 'dist\CSInterface.js'))){
            if(Test-Path -LiteralPath $p){
              $item=Get-Item -LiteralPath $p
              Write-Host "CEP_FILE=PASS PATH=$p SIZE=$($item.Length) MTIME=$($item.LastWriteTime.ToString('o'))"
            } else {
              Write-Host "CEP_FILE=MISSING PATH=$p"
            }
          }
          $cep=@(Get-CimInstance Win32_Process -Filter "Name='CEPHtmlEngine.exe'" -ErrorAction SilentlyContinue)
          Write-Host "CEP_HTML_ENGINE_COUNT=$($cep.Count)"
          foreach($p in $cep){
            Write-Host "CEP_HTML_ENGINE PID=$($p.ProcessId) CMD=$($p.CommandLine)"
          }
          foreach($ver in @('12','11','10','9')){
            $key="HKCU:\Software\Adobe\CSXS.$ver"
            $value=(Get-ItemProperty -Path $key -Name PlayerDebugMode -ErrorAction SilentlyContinue).PlayerDebugMode
            Write-Host "CEP_PLAYER_DEBUG CSXS=$ver VALUE=$value"
          }
          foreach($root in @((Join-Path $env:APPDATA 'Adobe\CEP'),(Join-Path $env:LOCALAPPDATA 'Adobe\CEP'))){
            if(Test-Path -LiteralPath $root){
              Write-Host "CEP_LOG_ROOT=$root"
              Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 30 |
                ForEach-Object { Write-Host "CEP_RECENT_FILE PATH=$($_.FullName) MTIME=$($_.LastWriteTime.ToString('o')) SIZE=$($_.Length)" }
            }
          }
          $panelLog=Join-Path $env:TEMP 'CEPHtmlEngine11-ILST-27.4.0-com.illustrator.mcp.panel.log'
          $bootstrapLog=Join-Path $env:TEMP 'CEPHtmlEngine11-ILST-27.4.0-com.illustrator.mcp.bootstrap.log'
          $hostLog=Join-Path $env:LOCALAPPDATA 'MCPAdobe\gateway\logs\local-host.log'
          foreach($logPath in @($panelLog,$bootstrapLog,$hostLog)){
            if(Test-Path -LiteralPath $logPath){
              Write-Host "CEP_DIAG_LOG_BEGIN=$logPath"
              Get-Content -LiteralPath $logPath -Tail 320 -ErrorAction SilentlyContinue
              Write-Host "CEP_DIAG_LOG_END=$logPath"
            } else {
              Write-Host "CEP_DIAG_LOG_MISSING=$logPath"
            }
          }
          exit 0

      - name: Probe Illustrator backend WebSocket independently
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-NetTCPConnection -State Established -LocalPort 8081 -ErrorAction SilentlyContinue).Count -gt 0){
            Write-Host 'ILLUSTRATOR_BACKEND_WS_PROBE=SKIP live-cep-connected'
            exit 0
          }
          @'
          import asyncio
          import json
          import websockets

          async def main():
              async with websockets.connect(
                  'ws://127.0.0.1:8081',
                  open_timeout=4,
                  close_timeout=2,
                  ping_interval=None,
              ) as ws:
                  print('ILLUSTRATOR_BACKEND_WS_PROBE=OPEN', flush=True)
                  await ws.send(json.dumps({
                      'type': 'heartbeat',
                      'busy': False,
                      'activeRequestId': None,
                      'uptimeMs': 0,
                      'capabilities': ['payload-v1'],
                  }))
                  print('ILLUSTRATOR_BACKEND_WS_PROBE=HEARTBEAT_SENT', flush=True)
                  await asyncio.sleep(0.5)
              print('ILLUSTRATOR_BACKEND_WS_PROBE=PASS', flush=True)

          asyncio.run(main())
          '@ | Set-Content -Path illustrator_ws_probe.py -Encoding UTF8
          uv run python illustrator_ws_probe.py
          Start-Sleep -Seconds 1

      - name: Require existing persistent Illustrator connection
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($port in @(8787,8081)){
            $listeners=@(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue)
            if($listeners.Count -ne 1){ throw "expected one existing listener on $port, got $($listeners.Count)" }
            $ownerPid=$listeners[0].OwningProcess
            $p=Get-CimInstance Win32_Process -Filter "ProcessId=$ownerPid"
            Write-Host "LIVE_EXISTING_PORT_$port=PASS PID=$ownerPid EXE=$($p.ExecutablePath) CMD=$($p.CommandLine)"
          }

          $visible=Get-Process -Name Illustrator -ErrorAction SilentlyContinue |
            Where-Object {$_.MainWindowHandle -ne 0} |
            Select-Object -First 1
          if(-not $visible){
            $aiPath='D:\Ilustrator\Adobe Illustrator 2023\Support Files\Contents\Windows\Illustrator.exe'
            if(-not (Test-Path -LiteralPath $aiPath)){ throw "Illustrator executable missing: $aiPath" }
            $oldTracking=$env:RUNNER_TRACKING_ID
            try {
              Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
              $started=Start-Process -FilePath $aiPath -PassThru
              Write-Host "LIVE_ILLUSTRATOR_LAUNCH_REQUEST=PASS PID=$($started.Id)"
            } finally {
              if($null -ne $oldTracking){ $env:RUNNER_TRACKING_ID=$oldTracking }
            }
            $deadline=(Get-Date).AddSeconds(90)
            do {
              Start-Sleep -Seconds 1
              $visible=Get-Process -Name Illustrator -ErrorAction SilentlyContinue |
                Where-Object {$_.MainWindowHandle -ne 0} |
                Select-Object -First 1
            } until($visible -or (Get-Date) -gt $deadline)
            if(-not $visible){ throw 'Illustrator interactive window did not become available within 90 seconds' }
          }
          Write-Host "LIVE_ILLUSTRATOR_PROCESS=PASS PID=$($visible.Id) SESSION=$($visible.SessionId)"

          $established=@(Get-NetTCPConnection -State Established -LocalPort 8081 -ErrorAction SilentlyContinue)
          if($established.Count -eq 0){
            $manifest=Join-Path $env:APPDATA 'Adobe\CEP\extensions\com.illustrator.mcp.panel\CSXS\manifest.xml'
            if(-not (Test-Path -LiteralPath $manifest)){ throw "Illustrator CEP manifest missing: $manifest" }
            $manifestItem=Get-Item -LiteralPath $manifest
            Write-Host "ILLUSTRATOR_BOOTSTRAP_TIMES PROCESS_START=$($visible.StartTime.ToString('o')) MANIFEST_TIME=$($manifestItem.LastWriteTime.ToString('o')) TITLE=$($visible.MainWindowTitle)"
            $manifestText=[IO.File]::ReadAllText($manifest)
            foreach($required in @(
              '<StartOn>',
              '<Event>applicationActivate</Event>',
              '<Event>com.adobe.csxs.events.ApplicationActivate</Event>'
            )){
              if(-not $manifestText.Contains($required)){
                throw "Production Illustrator CEP manifest is missing auto-start marker: $required"
              }
            }
            $shell=New-Object -ComObject WScript.Shell
            [void]$shell.AppActivate($visible.Id)
            Write-Host 'ILLUSTRATOR_AUTOSTART_WAKE=APPLICATION_ACTIVATE'
            $deadline=(Get-Date).AddSeconds(15)
            do {
              Start-Sleep -Milliseconds 500
              $established=@(Get-NetTCPConnection -State Established -LocalPort 8081 -ErrorAction SilentlyContinue)
              if($established.Count -gt 0){ break }
            } until((Get-Date) -gt $deadline)
            if($established.Count -eq 0){
              throw 'Illustrator CEP auto-start did not establish the persistent 8081 WebSocket session'
            }
          }
          Write-Host "ILLUSTRATOR_PANEL_SESSION=PASS connections=$($established.Count)"

          @'
          import asyncio
          import json
          from collections.abc import Mapping
          from mcp import Client

          URL = "http://127.0.0.1:8787/mcp"

          def walk(value):
              yield value
              if isinstance(value, Mapping):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from walk(child)

          def find_layers(value):
              for node in walk(value):
                  if isinstance(node, Mapping):
                      layers = node.get("layers")
                      if isinstance(layers, Mapping) and "panel" in layers:
                          return layers
              return None

          def find_execution(value):
              for node in walk(value):
                  if (
                      isinstance(node, Mapping)
                      and "activeJob" in node
                      and "waiting" in node
                      and "unresolvedJobs" in node
                  ):
                      return node
              return None

          async def main():
              async with Client(URL) as client:
                  result = await client.call_tool(
                      "creative_read",
                      {
                          "application": "illustrator",
                          "capability": "creative.health",
                          "arguments": {"probe": True, "timeout": 8.0},
                      },
                  )
                  if result.is_error:
                      raise RuntimeError(f"creative.health failed: {result}")
                  payload = result.structured_content
                  layers = find_layers(payload)
                  panel = layers.get("panel") if isinstance(layers, Mapping) else None
                  illustrator = layers.get("illustrator") if isinstance(layers, Mapping) else None
                  execution = find_execution(payload)
                  if not (
                      isinstance(panel, Mapping)
                      and panel.get("status") in {"ok", "degraded"}
                      and not panel.get("heartbeatStale")
                      and not panel.get("busy")
                      and panel.get("activeRequestId") is None
                  ):
                      raise RuntimeError(
                          "Illustrator panel is not connected and idle; refusing mutation: " +
                          json.dumps(panel, ensure_ascii=False, default=str)
                      )
                  if not (isinstance(illustrator, Mapping) and illustrator.get("status") == "ok"):
                      raise RuntimeError(
                          "Illustrator host is not ready: " +
                          json.dumps(illustrator, ensure_ascii=False, default=str)
                      )
                  if isinstance(execution, Mapping):
                      if execution.get("activeJob") is not None or execution.get("waiting") not in {0, None}:
                          raise RuntimeError(
                              "Illustrator backend has active work; refusing mutation: " +
                              json.dumps(execution, ensure_ascii=False, default=str)
                          )
                      if execution.get("unresolvedJobs"):
                          raise RuntimeError(
                              "Illustrator backend has unresolved jobs; refusing mutation: " +
                              json.dumps(execution, ensure_ascii=False, default=str)
                          )
                  print(
                      "ILLUSTRATOR_LIVE_CONNECTION_GATE=PASS " +
                      json.dumps(
                          {"panel": panel, "illustrator": illustrator, "execution": execution},
                          ensure_ascii=False,
                          default=str,
                      ),
                      flush=True,
                  )

          asyncio.run(main())
          '@ | Set-Content -Path illustrator_connection_gate.py -Encoding UTF8
          uv run python illustrator_connection_gate.py

      - name: Draw a car through MCP and verify read-back
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import asyncio
          import json
          from collections.abc import Mapping
          from mcp import Client

          URL = "http://127.0.0.1:8787/mcp"
          DOC_NAME = "ChatGPT MCP Car Test"

          def walk(value):
              yield value
              if isinstance(value, Mapping):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from walk(child)

          def token_from_item(item):
              if not isinstance(item, Mapping):
                  return None
              uuid = item.get("uuid")
              if isinstance(uuid, str) and uuid:
                  return uuid
              ref = item.get("itemRef")
              if isinstance(ref, Mapping):
                  ident = ref.get("identity")
                  if isinstance(ident, Mapping):
                      item_id = ident.get("itemId")
                      if isinstance(item_id, str) and item_id:
                          return item_id
              handle = item.get("handle")
              if isinstance(handle, str) and handle:
                  return "handle:" + handle
              return None

          def find_named_item(value, name):
              for node in walk(value):
                  if isinstance(node, Mapping) and node.get("name") == name:
                      token = token_from_item(node)
                      if token:
                          return node, token
              return None, None

          async def call(client, tool, capability, arguments):
              result = await client.call_tool(
                  tool,
                  {
                      "application": "illustrator",
                      "capability": capability,
                      "arguments": arguments,
                  },
              )
              if result.is_error:
                  raise RuntimeError(f"{tool}/{capability} failed: {result}")
              payload = result.structured_content
              print(
                  f"LIVE_{capability}=" +
                  json.dumps(payload, ensure_ascii=False, default=str),
                  flush=True,
              )
              return payload

          async def create_and_verify(client, capability, spec):
              name = spec["name"]
              await call(client, "creative_write", capability, spec)
              found = await call(
                  client,
                  "creative_read",
                  "creative.object.find",
                  {"name": name},
              )
              item, token = find_named_item(found, name)
              if item is None or token is None:
                  raise RuntimeError(f"MCP car part did not read back: {name}")
              print(
                  "ILLUSTRATOR_MCP_CAR_PART=PASS " +
                  json.dumps({"name": name, "token": token}, ensure_ascii=False),
                  flush=True,
              )
              return token

          async def main():
              async with Client(URL) as client:
                  listed = await client.list_tools()
                  names = {tool.name for tool in listed.tools}
                  required = {
                      "creative_discover",
                      "creative_read",
                      "creative_write",
                      "creative_authorized_write",
                  }
                  if names != required:
                      raise RuntimeError(f"unexpected MCP tools: {sorted(names)}")

                  await call(
                      client,
                      "creative_write",
                      "creative.document.create",
                      {
                          "width": 760,
                          "height": 480,
                          "color_mode": "RGB",
                          "name": DOC_NAME,
                      },
                  )

                  parts = [
                      (
                          "creative.shape.rectangle",
                          {
                              "name": "MCP Car Body",
                              "x": 130,
                              "y": 215,
                              "width": 500,
                              "height": 125,
                              "fill": {"r": 220, "g": 48, "b": 52},
                          },
                      ),
                      (
                          "creative.shape.rectangle",
                          {
                              "name": "MCP Car Cabin",
                              "x": 250,
                              "y": 135,
                              "width": 250,
                              "height": 95,
                              "fill": {"r": 220, "g": 48, "b": 52},
                          },
                      ),
                      (
                          "creative.shape.rectangle",
                          {
                              "name": "MCP Car Window Left",
                              "x": 270,
                              "y": 150,
                              "width": 90,
                              "height": 58,
                              "fill": {"r": 151, "g": 214, "b": 255},
                          },
                      ),
                      (
                          "creative.shape.rectangle",
                          {
                              "name": "MCP Car Window Right",
                              "x": 385,
                              "y": 150,
                              "width": 90,
                              "height": 58,
                              "fill": {"r": 151, "g": 214, "b": 255},
                          },
                      ),
                      (
                          "creative.shape.ellipse",
                          {
                              "name": "MCP Car Wheel Left",
                              "x": 190,
                              "y": 290,
                              "width": 96,
                              "height": 96,
                              "fill": {"r": 32, "g": 32, "b": 36},
                          },
                      ),
                      (
                          "creative.shape.ellipse",
                          {
                              "name": "MCP Car Wheel Right",
                              "x": 475,
                              "y": 290,
                              "width": 96,
                              "height": 96,
                              "fill": {"r": 32, "g": 32, "b": 36},
                          },
                      ),
                      (
                          "creative.shape.ellipse",
                          {
                              "name": "MCP Car Hub Left",
                              "x": 218,
                              "y": 318,
                              "width": 40,
                              "height": 40,
                              "fill": {"r": 180, "g": 180, "b": 185},
                          },
                      ),
                      (
                          "creative.shape.ellipse",
                          {
                              "name": "MCP Car Hub Right",
                              "x": 503,
                              "y": 318,
                              "width": 40,
                              "height": 40,
                              "fill": {"r": 180, "g": 180, "b": 185},
                          },
                      ),
                      (
                          "creative.shape.rectangle",
                          {
                              "name": "MCP Car Headlight",
                              "x": 602,
                              "y": 245,
                              "width": 28,
                              "height": 26,
                              "fill": {"r": 255, "g": 226, "b": 98},
                          },
                      ),
                  ]

                  tokens = {}
                  for capability, spec in parts:
                      tokens[spec["name"]] = await create_and_verify(
                          client, capability, spec
                      )

                  structure = await call(
                      client,
                      "creative_read",
                      "creative.document.structure",
                      {},
                  )
                  missing = [
                      name
                      for name in tokens
                      if not any(
                          isinstance(node, Mapping) and node.get("name") == name
                          for node in walk(structure)
                      )
                  ]
                  if missing:
                      raise RuntimeError(
                          "MCP car document structure missing: " + ", ".join(missing)
                      )

                  print(
                      "ILLUSTRATOR_MCP_CAR_DRAW=PASS " +
                      json.dumps(
                          {
                              "document": DOC_NAME,
                              "parts": len(tokens),
                              "tokens": tokens,
                          },
                          ensure_ascii=False,
                      ),
                      flush=True,
                  )

          asyncio.run(main())
          '@ | Set-Content -Path illustrator_mcp_draw_car.py -Encoding UTF8

          uv run python illustrator_mcp_draw_car.py

      - name: Select move undo and reapply car headlight through MCP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import asyncio
          import json
          from collections.abc import Mapping
          from mcp import Client

          URL = "http://127.0.0.1:8787/mcp"
          TARGET = "MCP Car Headlight"
          DX = 50.0

          def walk(value):
              yield value
              if isinstance(value, Mapping):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from walk(child)

          def token_from_item(item):
              if not isinstance(item, Mapping):
                  return None
              uuid = item.get("uuid")
              if isinstance(uuid, str) and uuid:
                  return uuid
              ref = item.get("itemRef")
              if isinstance(ref, Mapping):
                  ident = ref.get("identity")
                  if isinstance(ident, Mapping):
                      item_id = ident.get("itemId")
                      if isinstance(item_id, str) and item_id:
                          return item_id
              handle = item.get("handle")
              if isinstance(handle, str) and handle:
                  return "handle:" + handle
              return None

          def find_named_item(value, name):
              for node in walk(value):
                  if isinstance(node, Mapping) and node.get("name") == name:
                      token = token_from_item(node)
                      if token:
                          return node, token
              return None, None

          def find_token_item(value, token):
              for node in walk(value):
                  if isinstance(node, Mapping) and token_from_item(node) == token:
                      return node
              return None

          def read_x(item):
              if not isinstance(item, Mapping):
                  raise RuntimeError("selection item missing")
              bounds = item.get("bounds")
              if not isinstance(bounds, Mapping):
                  raise RuntimeError("selection item has no bounds")
              if "x" in bounds:
                  return float(bounds["x"])
              if "left" in bounds:
                  return float(bounds["left"])
              raise RuntimeError(f"selection bounds missing x/left: {bounds}")

          async def call(client, tool, capability, arguments):
              result = await client.call_tool(
                  tool,
                  {
                      "application": "illustrator",
                      "capability": capability,
                      "arguments": arguments,
                  },
              )
              if result.is_error:
                  raise RuntimeError(f"{tool}/{capability} failed: {result}")
              payload = result.structured_content
              print(
                  f"LIVE_{capability}=" +
                  json.dumps(payload, ensure_ascii=False, default=str),
                  flush=True,
              )
              return payload

          async def main():
              async with Client(URL) as client:
                  found = await call(
                      client,
                      "creative_read",
                      "creative.object.find",
                      {"name": TARGET},
                  )
                  item, token = find_named_item(found, TARGET)
                  if item is None or token is None:
                      raise RuntimeError(f"target not found through MCP: {TARGET}")
                  baseline_x = read_x(item)
                  print(
                      f"ILLUSTRATOR_MCP_SELECTION_BASELINE=PASS token={token} x={baseline_x}",
                      flush=True,
                  )

                  await call(
                      client,
                      "creative_write",
                      "creative.object.select",
                      {"uuids": [token]},
                  )
                  selection = await call(
                      client,
                      "creative_read",
                      "creative.selection.get",
                      {},
                  )
                  selected = find_token_item(selection, token)
                  if selected is None:
                      raise RuntimeError("MCP-selected headlight did not read back in selection")
                  selected_x = read_x(selected)
                  if abs(selected_x - baseline_x) > 0.01:
                      raise RuntimeError(
                          f"selection baseline mismatch: find={baseline_x} selection={selected_x}"
                      )
                  print("ILLUSTRATOR_MCP_OBJECT_SELECT=PASS", flush=True)

                  moved = await call(
                      client,
                      "creative_write",
                      "creative.selection.move",
                      {"deltaX": DX, "deltaY": 0},
                  )
                  moved_selection = await call(
                      client,
                      "creative_read",
                      "creative.selection.get",
                      {},
                  )
                  moved_item = find_token_item(moved_selection, token)
                  moved_x = read_x(moved_item)
                  if abs((moved_x - baseline_x) - DX) > 0.01:
                      raise RuntimeError(
                          f"MCP move mismatch: baseline={baseline_x} moved={moved_x}"
                      )
                  print(
                      f"ILLUSTRATOR_MCP_SELECTION_MOVE=PASS dx={DX} x={moved_x}",
                      flush=True,
                  )

                  await call(
                      client,
                      "creative_write",
                      "creative.undo",
                      {"count": 1},
                  )
                  after_undo = await call(
                      client,
                      "creative_read",
                      "creative.object.find",
                      {"name": TARGET},
                  )
                  undo_item, undo_token = find_named_item(after_undo, TARGET)
                  if undo_item is None or undo_token != token:
                      raise RuntimeError("MCP undo lost or replaced the headlight object")
                  undo_x = read_x(undo_item)
                  if abs(undo_x - baseline_x) > 0.01:
                      raise RuntimeError(
                          f"MCP undo mismatch: baseline={baseline_x} undo={undo_x}"
                      )
                  print(
                      f"ILLUSTRATOR_MCP_SELECTION_UNDO=PASS x={undo_x}",
                      flush=True,
                  )

                  await call(
                      client,
                      "creative_write",
                      "creative.object.select",
                      {"uuids": [token]},
                  )
                  await call(
                      client,
                      "creative_write",
                      "creative.selection.move",
                      {"deltaX": DX, "deltaY": 0},
                  )
                  final_found = await call(
                      client,
                      "creative_read",
                      "creative.object.find",
                      {"name": TARGET},
                  )
                  final_item, final_token = find_named_item(final_found, TARGET)
                  if final_item is None or final_token != token:
                      raise RuntimeError("final MCP move lost or replaced the headlight object")
                  final_x = read_x(final_item)
                  if abs((final_x - baseline_x) - DX) > 0.01:
                      raise RuntimeError(
                          f"final MCP move mismatch: baseline={baseline_x} final={final_x}"
                      )
                  print(
                      "ILLUSTRATOR_MCP_INTERACTIVE_SELECTION=PASS " +
                      json.dumps(
                          {
                              "target": TARGET,
                              "token": token,
                              "baseline_x": baseline_x,
                              "final_x": final_x,
                              "delta_x": DX,
                          },
                          ensure_ascii=False,
                      ),
                      flush=True,
                  )

          asyncio.run(main())
          '@ | Set-Content -Path illustrator_mcp_selection_interaction.py -Encoding UTF8
          uv run python illustrator_mcp_selection_interaction.py
