name: Live Illustrator direct interaction

on:
  push:
    branches: [feat/illustrator-cep-backend]
    paths:
      - ".github/workflows/targeted-illustrator-live-interaction.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: illustrator-live-interaction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-interaction:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      UV_LINK_MODE: copy

    steps:
      - uses: actions/checkout@v4

      - name: Prepare local MCP client runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $machine=[Environment]::GetEnvironmentVariable('Path','Machine')
          $user=[Environment]::GetEnvironmentVariable('Path','User')
          $env:Path=(@($machine,$user,$env:Path) | Where-Object {$_}) -join ';'
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)) {
            $uvDir=Join-Path $HOME '.local\bin'
            if(Test-Path (Join-Path $uvDir 'uv.exe')) { $env:Path="$uvDir;$env:Path" }
          }
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)){ throw 'uv unavailable' }
          uv sync

      - name: Require existing persistent Illustrator connection
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($port in @(8787,8081)){
            $listeners=@(Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue)
            if($listeners.Count -ne 1){ throw "expected one existing listener on $port, got $($listeners.Count)" }
            $ownerPid=$listeners[0].OwningProcess
            $p=Get-CimInstance Win32_Process -Filter "ProcessId=$ownerPid"
            Write-Host "LIVE_EXISTING_PORT_$port=PASS PID=$ownerPid EXE=$($p.ExecutablePath) CMD=$($p.CommandLine)"
          }

          $visible=Get-Process -Name Illustrator -ErrorAction SilentlyContinue |
            Where-Object {$_.MainWindowHandle -ne 0} |
            Select-Object -First 1
          if(-not $visible){ throw 'Illustrator interactive window is not open' }
          Write-Host "LIVE_ILLUSTRATOR_PROCESS=PASS PID=$($visible.Id) SESSION=$($visible.SessionId)"

          @'
          import asyncio
          import json
          from collections.abc import Mapping
          from mcp import Client

          URL = "http://127.0.0.1:8787/mcp"

          def walk(value):
              yield value
              if isinstance(value, Mapping):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from walk(child)

          def find_layers(value):
              for node in walk(value):
                  if isinstance(node, Mapping):
                      layers = node.get("layers")
                      if isinstance(layers, Mapping) and "panel" in layers:
                          return layers
              return None

          def find_execution(value):
              for node in walk(value):
                  if (
                      isinstance(node, Mapping)
                      and "activeJob" in node
                      and "waiting" in node
                      and "unresolvedJobs" in node
                  ):
                      return node
              return None

          async def main():
              async with Client(URL) as client:
                  result = await client.call_tool(
                      "creative_read",
                      {
                          "application": "illustrator",
                          "capability": "creative.health",
                          "arguments": {"probe": False, "timeout": 5.0},
                      },
                  )
                  if result.is_error:
                      raise RuntimeError(f"creative.health failed: {result}")
                  payload = result.structured_content
                  layers = find_layers(payload)
                  panel = layers.get("panel") if isinstance(layers, Mapping) else None
                  illustrator = layers.get("illustrator") if isinstance(layers, Mapping) else None
                  execution = find_execution(payload)
                  if not (
                      isinstance(panel, Mapping)
                      and panel.get("status") in {"ok", "degraded"}
                      and not panel.get("heartbeatStale")
                      and not panel.get("busy")
                      and panel.get("activeRequestId") is None
                  ):
                      raise RuntimeError(
                          "Illustrator panel is not connected and idle; refusing mutation: " +
                          json.dumps(panel, ensure_ascii=False, default=str)
                      )
                  if not (isinstance(illustrator, Mapping) and illustrator.get("status") == "ok"):
                      raise RuntimeError(
                          "Illustrator host is not ready: " +
                          json.dumps(illustrator, ensure_ascii=False, default=str)
                      )
                  if isinstance(execution, Mapping):
                      if execution.get("activeJob") is not None or execution.get("waiting") not in {0, None}:
                          raise RuntimeError(
                              "Illustrator backend has active work; refusing mutation: " +
                              json.dumps(execution, ensure_ascii=False, default=str)
                          )
                      if execution.get("unresolvedJobs"):
                          raise RuntimeError(
                              "Illustrator backend has unresolved jobs; refusing mutation: " +
                              json.dumps(execution, ensure_ascii=False, default=str)
                          )
                  print(
                      "ILLUSTRATOR_LIVE_CONNECTION_GATE=PASS " +
                      json.dumps(
                          {"panel": panel, "illustrator": illustrator, "execution": execution},
                          ensure_ascii=False,
                          default=str,
                      ),
                      flush=True,
                  )

          asyncio.run(main())
          '@ | Set-Content -Path illustrator_connection_gate.py -Encoding UTF8
          uv run python illustrator_connection_gate.py

      - name: Direct bounded interaction through persistent MCP
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          @'
          import asyncio
          import json
          from collections.abc import Mapping
          from mcp import Client

          URL = "http://127.0.0.1:8787/mcp"
          DOC_NAME = "ChatGPT MCP Direct Interaction"
          PROBE_NAME = "ChatGPT Live Rectangle"

          def walk(value):
              yield value
              if isinstance(value, Mapping):
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from walk(child)

          def find_key(value, key):
              for node in walk(value):
                  if isinstance(node, Mapping) and key in node:
                      return node[key]
              return None

          def token_from_item(item):
              if not isinstance(item, Mapping):
                  return None
              uuid = item.get("uuid")
              if isinstance(uuid, str) and uuid:
                  return uuid
              ref = item.get("itemRef")
              if isinstance(ref, Mapping):
                  ident = ref.get("identity")
                  if isinstance(ident, Mapping):
                      item_id = ident.get("itemId")
                      if isinstance(item_id, str) and item_id:
                          return item_id
              handle = item.get("handle")
              if isinstance(handle, str) and handle:
                  return "handle:" + handle
              return None

          def find_named_item(value, name):
              for node in walk(value):
                  if isinstance(node, Mapping) and node.get("name") == name:
                      token = token_from_item(node)
                      if token:
                          return node, token
              return None, None

          def find_token_item(value, token):
              for node in walk(value):
                  if not isinstance(node, Mapping):
                      continue
                  if token_from_item(node) == token:
                      return node
              return None

          async def call(client, tool, capability, arguments):
              result = await client.call_tool(
                  tool,
                  {
                      "application": "illustrator",
                      "capability": capability,
                      "arguments": arguments,
                  },
              )
              if result.is_error:
                  raise RuntimeError(f"{tool}/{capability} failed: {result}")
              payload = result.structured_content
              print(
                  f"LIVE_{capability}=" +
                  json.dumps(payload, ensure_ascii=False, default=str),
                  flush=True,
              )
              return payload

          async def main():
              async with Client(URL) as client:
                  listed = await client.list_tools()
                  names = {tool.name for tool in listed.tools}
                  required = {
                      "creative_discover",
                      "creative_read",
                      "creative_write",
                      "creative_authorized_write",
                  }
                  if names != required:
                      raise RuntimeError(f"unexpected MCP tools: {sorted(names)}")

                  await call(
                      client,
                      "creative_write",
                      "creative.document.create",
                      {"width": 640, "height": 420, "color_mode": "RGB", "name": DOC_NAME},
                  )
                  await call(
                      client,
                      "creative_write",
                      "creative.shape.rectangle",
                      {
                          "name": PROBE_NAME,
                          "x": 100,
                          "y": 100,
                          "width": 160,
                          "height": 90,
                          "fill": {"r": 24, "g": 119, "b": 242},
                      },
                  )

                  found = await call(
                      client,
                      "creative_read",
                      "creative.object.find",
                      {"name": PROBE_NAME},
                  )
                  found_item, probe_token = find_named_item(found, PROBE_NAME)
                  if found_item is None or probe_token is None:
                      raise RuntimeError("created rectangle could not be resolved to an MCP object token")
                  print(f"ILLUSTRATOR_CREATED_TOKEN=PASS token={probe_token}", flush=True)

                  await call(
                      client,
                      "creative_write",
                      "creative.object.select",
                      {"uuids": [probe_token]},
                  )

                  selection = await call(
                      client,
                      "creative_read",
                      "creative.selection.get",
                      {},
                  )
                  if find_key(selection, "selectionCount") != 1:
                      raise RuntimeError("expected exactly one live Illustrator selection")
                  item = find_token_item(selection, probe_token)
                  if item is None:
                      raise RuntimeError("selected object did not read back with the same MCP token")
                  bounds = item.get("bounds")
                  if not isinstance(bounds, Mapping):
                      raise RuntimeError("selected object has no readable bounds")
                  before_x = float(bounds["x"])
                  before_y = float(bounds["y"])
                  print(
                      f"ILLUSTRATOR_SELECTION_BASELINE=PASS token={probe_token} x={before_x} y={before_y}",
                      flush=True,
                  )

                  moved = await call(
                      client,
                      "creative_write",
                      "creative.selection.move",
                      {"deltaX": 12, "deltaY": 0},
                  )
                  if find_key(moved, "selected_uuid") != probe_token:
                      raise RuntimeError("selection.move did not target the live selected object")

                  moved_selection = await call(
                      client,
                      "creative_read",
                      "creative.selection.get",
                      {},
                  )
                  moved_item = find_token_item(moved_selection, probe_token)
                  if moved_item is None:
                      raise RuntimeError("moved object disappeared from selection read-back")
                  moved_x = float(moved_item["bounds"]["x"])
                  if abs((moved_x - before_x) - 12.0) > 0.01:
                      raise RuntimeError(
                          f"selection.move read-back mismatch: before={before_x} after={moved_x}"
                      )
                  print("ILLUSTRATOR_SELECTION_MOVE_READBACK=PASS dx=12", flush=True)

                  updated = await call(
                      client,
                      "creative_write",
                      "creative.selection.update",
                      {"properties": {"opacity": 61}},
                  )
                  if find_key(updated, "selected_uuid") != probe_token:
                      raise RuntimeError("selection.update did not target the live selected object")

                  after_update = await call(
                      client,
                      "creative_read",
                      "creative.object.find",
                      {"name": PROBE_NAME},
                  )
                  update_item, update_token = find_named_item(after_update, PROBE_NAME)
                  if update_item is None or update_token != probe_token:
                      raise RuntimeError("updated object could not be read back by the same MCP token")
                  opacity = find_key(update_item, "opacity")
                  if opacity is None or abs(float(opacity) - 61.0) > 0.01:
                      raise RuntimeError(f"selection.update opacity read-back mismatch: {opacity}")
                  print("ILLUSTRATOR_SELECTION_OPACITY_READBACK=PASS opacity=61", flush=True)

                  await call(
                      client,
                      "creative_write",
                      "creative.undo",
                      {"count": 1},
                  )
                  after_opacity_undo = await call(
                      client,
                      "creative_read",
                      "creative.object.find",
                      {"name": PROBE_NAME},
                  )
                  undo_item, undo_token = find_named_item(after_opacity_undo, PROBE_NAME)
                  if undo_item is None or undo_token != probe_token:
                      raise RuntimeError("opacity undo lost the target object")
                  undo_opacity = find_key(undo_item, "opacity")
                  if undo_opacity is None or abs(float(undo_opacity) - 100.0) > 0.01:
                      raise RuntimeError(f"opacity undo read-back mismatch: {undo_opacity}")
                  print("ILLUSTRATOR_SELECTION_OPACITY_UNDO=PASS", flush=True)

                  await call(
                      client,
                      "creative_write",
                      "creative.undo",
                      {"count": 1},
                  )
                  final_selection = await call(
                      client,
                      "creative_read",
                      "creative.selection.get",
                      {},
                  )
                  final_item = find_token_item(final_selection, probe_token)
                  if final_item is None:
                      raise RuntimeError("move undo lost the selected target object")
                  final_bounds = final_item.get("bounds")
                  if not isinstance(final_bounds, Mapping):
                      raise RuntimeError("move undo read-back did not contain bounds")
                  final_x = float(final_bounds["x"])
                  if abs(final_x - before_x) > 0.01:
                      raise RuntimeError(
                          f"move undo read-back mismatch: expected={before_x} actual={final_x}"
                      )
                  print("ILLUSTRATOR_SELECTION_MOVE_UNDO=PASS", flush=True)
                  print("ILLUSTRATOR_DIRECT_INTERACTION_E2E=PASS", flush=True)

          asyncio.run(main())
          '@ | Set-Content -Path illustrator_live_interaction.py -Encoding UTF8
          uv run python illustrator_live_interaction.py
