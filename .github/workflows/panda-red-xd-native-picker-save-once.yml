name: Panda red XD native PickerHost unique save and archive proof once
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-xd-native-picker-save-once.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  save:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Set verified PickerHost filename and click its exact native Save button once
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'RED_XD_SAVE_WRONG_DESKTOP'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;using System.Runtime.InteropServices;using System.Text;
          public class RedXdNativeSave {
            public delegate bool EnumProc(IntPtr h,IntPtr arg);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb,IntPtr arg);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr h,EnumProc cb,IntPtr arg);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h,out uint pid);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h,StringBuilder b,int len);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h,StringBuilder b,int len);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern IntPtr SendMessage(IntPtr h,uint m,IntPtr wp,string text);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern IntPtr SendMessage(IntPtr h,uint m,IntPtr wp,StringBuilder text);
            [DllImport("user32.dll")] public static extern IntPtr SendMessage(IntPtr h,uint m,IntPtr wp,IntPtr lp);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
          }
          '@
          function WinClass([IntPtr]$h) {
            $s=New-Object System.Text.StringBuilder(160)
            [void][RedXdNativeSave]::GetClassName($h,$s,160)
            return $s.ToString()
          }
          function WinText([IntPtr]$h) {
            $s=New-Object System.Text.StringBuilder(2600)
            [void][RedXdNativeSave]::GetWindowText($h,$s,2600)
            return $s.ToString()
          }
          function MustOwn([IntPtr]$h,[uint32]$owner,[string]$label) {
            if($h -eq [IntPtr]::Zero){throw "RED_XD_SAVE_MISSING_HWND_$label"}
            $p=[uint32]0
            [void][RedXdNativeSave]::GetWindowThreadProcessId($h,[ref]$p)
            if($p -ne $owner){throw "RED_XD_SAVE_FOREIGN_OWNER_$label"}
          }
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $source=Join-Path $root 'MCP_Mode1_Panda_XD_38136531800.xd'
          $target=Join-Path $root 'MCP_KFP4_Red_XD_38205166138.xd'
          $original='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $original){throw 'RED_XD_SAVE_ORIGINAL_SHA_DIVERGED'}
          if(Test-Path -LiteralPath $target){throw 'RED_XD_SAVE_TARGET_EXISTS_REFUSE_OVERWRITE'}
          $desktop=[System.Windows.Automation.AutomationElement]::RootElement
          $top=$desktop.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $draft=@($top|Where-Object{[string]$_.Current.Name -match '^Untitled-1.*Adobe XD$' -and [string]$_.Current.ClassName -eq 'ApplicationFrameWindow'})
          $old=@($top|Where-Object{[string]$_.Current.Name -match '^MCP_Mode1_Panda_XD_38136531800.*Adobe XD$'})
          $picker=@(Get-Process -Name PickerHost -ErrorAction SilentlyContinue|Where-Object {$_.SessionId -eq 1})
          if($draft.Count -ne 1 -or $old.Count -ne 1 -or $picker.Count -ne 1){throw 'RED_XD_SAVE_OWNERSHIP_AMBIGUOUS'}
          $pickerPid=[uint32]$picker[0].Id
          $windows=New-Object System.Collections.Generic.List[System.IntPtr]
          $cb=[RedXdNativeSave+EnumProc]{
            param([IntPtr]$h,[IntPtr]$arg)
            $p=[uint32]0
            [void][RedXdNativeSave]::GetWindowThreadProcessId($h,[ref]$p)
            if($p -eq $pickerPid -and [RedXdNativeSave]::IsWindowVisible($h) -and (WinClass $h) -eq '#32770'){
              $windows.Add($h)
            }
            return $true
          }
          [void][RedXdNativeSave]::EnumWindows($cb,[IntPtr]::Zero)
          Write-Host "RED_XD_NATIVE_SAVE_PICKER_DIALOGS=$($windows.Count)"
          if($windows.Count -ne 1 -or (WinText $windows[0]) -ne 'Save As'){throw 'RED_XD_SAVE_WRONG_DIALOG'}
          $dialogHwnd=[IntPtr]$windows[0]
          $dialog=[System.Windows.Automation.AutomationElement]::FromHandle($dialogHwnd)
          $elements=$dialog.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
          $filename=@($elements|Where-Object{[string]$_.Current.AutomationId -eq '1001' -and [string]$_.Current.Name -eq 'Untitled-1.xd'})
          $save=@($elements|Where-Object{[string]$_.Current.AutomationId -eq '1' -and [string]$_.Current.Name -eq 'Save' -and $_.Current.IsEnabled})
          $filenameHost=@($elements|Where-Object{[string]$_.Current.AutomationId -eq 'FileNameControlHost'})
          Write-Host "RED_XD_NATIVE_SAVE_CONTROLS filename=$($filename.Count) save=$($save.Count) host=$($filenameHost.Count)"
          if($filename.Count -ne 1 -or $save.Count -ne 1 -or $filenameHost.Count -ne 1){throw 'RED_XD_SAVE_CONTROL_AMBIGUITY'}
          $fileHandle=[IntPtr]$filename[0].Current.NativeWindowHandle
          $buttonHwnd=[IntPtr]$save[0].Current.NativeWindowHandle
          MustOwn $dialogHwnd $pickerPid 'dialog'
          MustOwn $fileHandle $pickerPid 'filename'
          MustOwn $buttonHwnd $pickerPid 'save'
          $children=New-Object System.Collections.Generic.List[System.IntPtr]
          $childCb=[RedXdNativeSave+EnumProc]{
            param([IntPtr]$h,[IntPtr]$arg)
            if((WinClass $h) -match '^Edit$|^RichEdit'){$children.Add($h)}
            return $true
          }
          [void][RedXdNativeSave]::EnumChildWindows($fileHandle,$childCb,[IntPtr]::Zero)
          Write-Host "RED_XD_NATIVE_SAVE_EDIT_CANDIDATES=$($children.Count) filenameClass=$(WinClass $fileHandle) saveClass=$(WinClass $buttonHwnd)"
          if($children.Count -ne 1){throw 'RED_XD_SAVE_FILENAME_EDIT_NOT_UNIQUE_NO_WRITE'}
          $edit=[IntPtr]$children[0]
          MustOwn $edit $pickerPid 'edit'
          if((WinClass $buttonHwnd) -ne 'Button'){throw 'RED_XD_SAVE_NATIVE_BUTTON_CLASS_NOT_BUTTON_NO_WRITE'}
          if((WinText $buttonHwnd) -ne 'Save'){throw 'RED_XD_SAVE_NATIVE_BUTTON_LABEL_CHANGED_NO_WRITE'}
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $original -or (Test-Path -LiteralPath $target)){throw 'RED_XD_SAVE_PREWRITE_GUARD_FAILED'}
          [void][RedXdNativeSave]::SendMessage($edit,[uint32]12,[IntPtr]::Zero,$target)
          Start-Sleep -Milliseconds 350
          $nativeText=WinText $edit
          Write-Host "RED_XD_NATIVE_SAVE_FILENAME_READBACK matches=$($nativeText -eq $target) length=$($nativeText.Length)"
          if($nativeText -ne $target){throw 'RED_XD_SAVE_FILENAME_NOT_VERIFIED_NO_CLICK'}
          [void][RedXdNativeSave]::SendMessage($buttonHwnd,[uint32]245,[IntPtr]::Zero,[IntPtr]::Zero)
          Write-Host 'RED_XD_NATIVE_SAVE_EXACT_BUTTON_CLICK_ONCE=PASS'
          $deadline=(Get-Date).AddSeconds(40)
          do{Start-Sleep -Milliseconds 700}until((Test-Path -LiteralPath $target -PathType Leaf) -or (Get-Date)-ge $deadline)
          if(-not (Test-Path -LiteralPath $target -PathType Leaf)){throw 'RED_XD_SAVE_FILE_UNKNOWN_AFTER_BUTTON_NO_REPLAY'}
          $item=Get-Item -LiteralPath $target
          if($item.Length -lt 1000){throw 'RED_XD_SAVE_TOO_SMALL'}
          Start-Sleep -Seconds 2
          $second=Get-Item -LiteralPath $target
          if($second.Length -ne $item.Length){throw 'RED_XD_SAVE_FILE_NOT_STABLE'}
          $sha=(Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $original){throw 'RED_XD_SAVE_ORIGINAL_CHANGED_AFTER_WRITE'}
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive=[System.IO.Compression.ZipFile]::OpenRead($target)
          try{
            if($archive.Entries.Count -lt 3){throw 'RED_XD_SAVE_ARCHIVE_ENTRIES_TOO_FEW'}
            $count=$archive.Entries.Count
          }finally{$archive.Dispose()}
          Write-Host "RED_XD_NATIVE_FILE_PERSISTED=PASS bytes=$($second.Length) sha256=$sha entries=$count original_unchanged=1 target=$target"
          $artifactDir=Join-Path $env:RUNNER_TEMP 'panda_red_xd_native_artifact'
          New-Item -ItemType Directory -Path $artifactDir -Force|Out-Null
          $proof=Join-Path $artifactDir 'MCP_KFP4_Red_XD_38205166138.xd'
          Copy-Item -LiteralPath $target -Destination $proof -ErrorAction Stop
          if((Get-FileHash -LiteralPath $proof -Algorithm SHA256).Hash -ne $sha){throw 'RED_XD_SAVE_ARTIFACT_CHECKSUM_MISMATCH'}
          Write-Host 'RED_XD_SAVE_ARTIFACT_COPY_VERIFIED=PASS'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: panda-red-xd-38205166138-native
          path: ${{ runner.temp }}/panda_red_xd_native_artifact/MCP_KFP4_Red_XD_38205166138.xd
          if-no-files-found: warn
          retention-days: 14
