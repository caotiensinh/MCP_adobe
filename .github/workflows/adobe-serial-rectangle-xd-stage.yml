name: Adobe serial native rectangle acceptance - XD stage after Illustrator
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/adobe-serial-rectangle-xd-stage.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  xd_stage:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - name: Verify native AI and reconcile clean host before graceful close
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'SERIAL_WRONG_HOST_SESSION'}
          if(@(Get-Process -Name Photoshop -ErrorAction SilentlyContinue).Count -ne 0){throw 'SERIAL_PHOTOSHOP_OVERLAP'}
          $xdHome=@(Get-Process -Name XD -ErrorAction SilentlyContinue)
          $aiInitial=@(Get-Process -Name Illustrator -ErrorAction SilentlyContinue)
          if($xdHome.Count -gt 1 -or ($xdHome.Count -eq 1 -and $xdHome[0].SessionId -ne 1)){throw 'SERIAL_XD_PROCESS_UNOWNED'}
          if($xdHome.Count -gt 0 -and $aiInitial.Count -gt 0){throw 'SERIAL_AI_XD_OVERLAP'}
          # Run 38250431613 already proved Illustrator native, readback and clean close.
          # Run 38250963810 proved exactly one idle XD Home. Reuse it rather than relaunch.
          Write-Host "SERIAL_XD_HOME_REUSE_CHECK=PASS existing=$($xdHome.Count)"
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $native=Join-Path $root 'MCP_RectSpeed_AI_38249401854.ai'
          $sha='9D0330C6FEE635CCAF8F73F620F7274F733BD5EC806C8FCAA3A83CA45656FFED'
          if(-not(Test-Path -LiteralPath $native -PathType Leaf)){throw 'SERIAL_AI_VERIFIED_NATIVE_MISSING'}
          if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash -ne $sha){throw 'SERIAL_AI_NATIVE_DIVERGED'}
          Write-Host 'SERIAL_AI_PRIOR_NATIVE_SHA=PASS'
          $ai=@(Get-Process -Name Illustrator -ErrorAction SilentlyContinue)
          if($ai.Count -gt 1 -or ($ai.Count -eq 1 -and $ai[0].SessionId -ne 1)){throw 'SERIAL_AI_HOST_OWNERSHIP_AMBIGUOUS'}
          if($ai.Count -eq 1){
            if($ai[0].MainWindowHandle -eq 0){throw 'SERIAL_AI_NO_GUI_REFUSE_CLOSE'}
            $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
            $py=Join-Path $env:RUNNER_TEMP 'serial_ai_preclose_readback.py'
            @'
          import asyncio
          from mcp import Client
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  async def read(cap,args=None):
                      r=await asyncio.wait_for(c.call_tool("creative_read",{"application":"illustrator","capability":cap,"arguments":args or {}}),timeout=18)
                      d=r.structured_content
                      if r.is_error or not isinstance(d,dict) or d.get("ok") is not True:raise RuntimeError("SERIAL_AI_READ_UNKNOWN "+cap)
                      return d["result"]
                  h=await read("creative.health",{"probe":False,"timeout":5})
                  d=((h.get("connection") or {}).get("data") or {})
                  e=d.get("execution") or {}
                  if e.get("unresolvedJobs") or e.get("activeJob") or d.get("blocking"):raise RuntimeError("SERIAL_AI_FENCE_NO_CLOSE")
                  info=await read("creative.document.info")
                  data=info.get("data") or {}
                  doc=data.get("document") or {}
                  if doc.get("name") not in ("MCP_RectSpeed_AI_38249401854","MCP_RectSpeed_AI_38249401854.ai"):
                      raise RuntimeError("SERIAL_AI_FOREIGN_DOCUMENT_NO_CLOSE")
                  layers=data.get("layers") or []
                  if sum(int(x.get("itemCount",-1)) for x in layers)!=1:raise RuntimeError("SERIAL_AI_COUNT_NOT_ONE")
                  if not any(any(y.get("name")=="speed_test_rectangle_ai_01" for y in x.get("items",[]) if isinstance(y,dict)) for x in layers):
                      raise RuntimeError("SERIAL_AI_RECT_MISSING")
                  print("SERIAL_AI_LIVE_RECT_VERIFIED_BEFORE_CLOSE=PASS",flush=True)
          asyncio.run(main())
          '@ | Set-Content -LiteralPath $py -Encoding UTF8
            uv run --no-project --with 'mcp>=2,<3' --python 3.12 python $py
            if($LASTEXITCODE -ne 0){throw 'SERIAL_AI_READBACK_NOT_VERIFIED'}
            if(-not $ai[0].CloseMainWindow()){throw 'SERIAL_AI_CLOSE_NOT_ACCEPTED'}
            $deadline=(Get-Date).AddSeconds(35)
            do{
              Start-Sleep -Milliseconds 500
              $still=@(Get-Process -Name Illustrator -ErrorAction SilentlyContinue)
            }until($still.Count -eq 0 -or (Get-Date)-ge $deadline)
            if($still.Count -ne 0){throw 'SERIAL_AI_SAVE_MODAL_OR_UNCLOSED_NO_KILL'}
            Write-Host 'SERIAL_AI_GRACEFUL_CLOSE=PASS'
          }else{
            Write-Host 'SERIAL_AI_PRIOR_HOST_ALREADY_CLOSED=PASS'
          }
          if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash -ne $sha){throw 'SERIAL_AI_CHANGED_AFTER_CLOSE'}
          Write-Host 'SERIAL_AI_NATIVE_UNCHANGED=PASS'
      - name: Isolated XD bootstrap once and original native file verification
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process -Name Illustrator,Photoshop -ErrorAction SilentlyContinue).Count -gt 0){throw 'SERIAL_XD_OVERLAP'}
          $target=Join-Path $env:USERPROFILE ("Documents\MCPAdobe\MCP_Mode1_Panda_XD_"+$env:GITHUB_RUN_ID+".xd")
          if(Test-Path -LiteralPath $target){throw 'SERIAL_XD_CHECKPOINT_EXISTS_NO_REPLAY'}
          $parseErrors=$null;$parseTokens=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/panda_xd_bootstrap_native.ps1'),
            [ref]$parseTokens,[ref]$parseErrors)
          if(@($parseErrors).Count -gt 0){throw 'SERIAL_XD_BOOTSTRAP_SYNTAX_REGRESSION'}
          Write-Host 'SERIAL_XD_POWERSHELL_AST=PASS'
          $sw=[Diagnostics.Stopwatch]::StartNew()
          $unsaved=@(Get-Process -ErrorAction SilentlyContinue | Where-Object {
            $_.SessionId -eq 1 -and $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -match '^Untitled.*Adobe XD
          $sw.Stop()
          if(-not(Test-Path -LiteralPath $target -PathType Leaf)){throw 'SERIAL_XD_NATIVE_MISSING'}
          $file=Get-Item -LiteralPath $target
          $stream=[IO.File]::OpenRead($target)
          try{$a=$stream.ReadByte();$b=$stream.ReadByte()}finally{$stream.Dispose()}
          if($file.Length -lt 1000 -or $a -ne 80 -or $b -ne 75){throw 'SERIAL_XD_NATIVE_FORMAT_INVALID'}
          $hash=(Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          New-Item -ItemType Directory -Force -Path serial_xd_artifact | Out-Null
          Copy-Item -LiteralPath $target -Destination serial_xd_artifact -ErrorAction Stop
          Write-Host "SERIAL_XD_NEW_BLANK_NATIVE_PASS=YES sha256=$hash bytes=$($file.Length) elapsed_ms=$($sw.ElapsedMilliseconds)"
      - name: Read actual XD plugin and scenegraph without any rectangle replay
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process -Name Illustrator,Photoshop -ErrorAction SilentlyContinue).Count -gt 0){throw 'SERIAL_XD_ISOLATION_LOST'}
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          $py=Join-Path $env:RUNNER_TEMP 'serial_xd_health_once.py'
          @'
          import asyncio,json
          from mcp import Client
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  for cap in ("creative.health","creative.document.info","creative.scenegraph.list"):
                      r=await asyncio.wait_for(c.call_tool("creative_read",{"application":"xd","capability":cap,"arguments":{}}),timeout=12)
                      d=r.structured_content
                      res=d.get("result") if isinstance(d,dict) else None
                      print("SERIAL_XD_READ="+json.dumps({"cap":cap,"ok":isinstance(d,dict) and d.get("ok"),"error":r.is_error,"result":res},default=str)[:7000],flush=True)
                      if r.is_error or not isinstance(d,dict) or d.get("ok") is not True:raise RuntimeError("SERIAL_XD_BRIDGE_UNAVAILABLE "+cap)
                      if cap=="creative.health" and (res.get("bridge")!="connected" or res.get("pending_count")!=0):raise RuntimeError("SERIAL_XD_PLUGIN_OR_QUEUE_UNREADY")
                      if cap=="creative.scenegraph.list" and res.get("complete") is not True:raise RuntimeError("SERIAL_XD_SCENEGRAPH_INCOMPLETE")
              print("SERIAL_XD_READONLY_GATE=PASS",flush=True)
          asyncio.run(main())
          '@ | Set-Content -LiteralPath $py -Encoding UTF8
          uv run --no-project --with 'mcp>=2,<3' --python 3.12 python $py
          if($LASTEXITCODE -ne 0){throw 'SERIAL_XD_READONLY_NOT_ACCEPTED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adobe-serial-xd-new-native-before-one-rectangle
          path: serial_xd_artifact/*
          if-no-files-found: warn
          retention-days: 14

          })
          $dialogs=@(Get-Process -Name PickerHost -ErrorAction SilentlyContinue | Where-Object {$_.SessionId -eq 1})
          if($dialogs.Count -gt 0){throw 'SERIAL_XD_PREVIOUS_MODAL_OUTCOME_UNKNOWN_NO_REPLAY'}
          if($unsaved.Count -gt 1){throw 'SERIAL_XD_MULTIPLE_UNSAVED_DOCUMENTS'}
          if($unsaved.Count -eq 1){
            # Run 38251355182 verified create=PASS, save hotkey -> no dialog
            # after bounded observation. Reuse this exact unsaved document.
            Write-Host "SERIAL_XD_EXISTING_UNSAVED_DOCUMENT=PASS title=$($unsaved[0].MainWindowTitle)"
            $otherScript=Join-Path $PWD 'scripts/panda_xd_save_menu_direct.ps1'
            $tokens2=$null;$errors2=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($otherScript,[ref]$tokens2,[ref]$errors2)
            if(@($errors2).Count -gt 0){throw 'SERIAL_XD_MENU_SAVE_SCRIPT_SYNTAX_INVALID'}
            powershell -NoProfile -ExecutionPolicy Bypass -File $otherScript -RunId $env:GITHUB_RUN_ID
          }else{
            # Only a verified Home may create one new document, never retry an unknown.
            $xdHome=@(Get-Process -Name XD -ErrorAction SilentlyContinue | Where-Object {$_.MainWindowTitle -eq 'Adobe XD'})
            if($xdHome.Count -ne 1){throw 'SERIAL_XD_NOT_HOME_OR_UNSAVED_NO_MUTATION'}
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/panda_xd_bootstrap_native.ps1 -RunId $env:GITHUB_RUN_ID
          }
          if($LASTEXITCODE -ne 0){throw 'SERIAL_XD_NATIVE_SAVE_UNVERIFIED_NO_REPLAY'}
          $sw.Stop()
          if(-not(Test-Path -LiteralPath $target -PathType Leaf)){throw 'SERIAL_XD_NATIVE_MISSING'}
          $file=Get-Item -LiteralPath $target
          $stream=[IO.File]::OpenRead($target)
          try{$a=$stream.ReadByte();$b=$stream.ReadByte()}finally{$stream.Dispose()}
          if($file.Length -lt 1000 -or $a -ne 80 -or $b -ne 75){throw 'SERIAL_XD_NATIVE_FORMAT_INVALID'}
          $hash=(Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          New-Item -ItemType Directory -Force -Path serial_xd_artifact | Out-Null
          Copy-Item -LiteralPath $target -Destination serial_xd_artifact -ErrorAction Stop
          Write-Host "SERIAL_XD_NEW_BLANK_NATIVE_PASS=YES sha256=$hash bytes=$($file.Length) elapsed_ms=$($sw.ElapsedMilliseconds)"
      - name: Read actual XD plugin and scenegraph without any rectangle replay
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process -Name Illustrator,Photoshop -ErrorAction SilentlyContinue).Count -gt 0){throw 'SERIAL_XD_ISOLATION_LOST'}
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          $py=Join-Path $env:RUNNER_TEMP 'serial_xd_health_once.py'
          @'
          import asyncio,json
          from mcp import Client
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  for cap in ("creative.health","creative.document.info","creative.scenegraph.list"):
                      r=await asyncio.wait_for(c.call_tool("creative_read",{"application":"xd","capability":cap,"arguments":{}}),timeout=12)
                      d=r.structured_content
                      res=d.get("result") if isinstance(d,dict) else None
                      print("SERIAL_XD_READ="+json.dumps({"cap":cap,"ok":isinstance(d,dict) and d.get("ok"),"error":r.is_error,"result":res},default=str)[:7000],flush=True)
                      if r.is_error or not isinstance(d,dict) or d.get("ok") is not True:raise RuntimeError("SERIAL_XD_BRIDGE_UNAVAILABLE "+cap)
                      if cap=="creative.health" and (res.get("bridge")!="connected" or res.get("pending_count")!=0):raise RuntimeError("SERIAL_XD_PLUGIN_OR_QUEUE_UNREADY")
                      if cap=="creative.scenegraph.list" and res.get("complete") is not True:raise RuntimeError("SERIAL_XD_SCENEGRAPH_INCOMPLETE")
              print("SERIAL_XD_READONLY_GATE=PASS",flush=True)
          asyncio.run(main())
          '@ | Set-Content -LiteralPath $py -Encoding UTF8
          uv run --no-project --with 'mcp>=2,<3' --python 3.12 python $py
          if($LASTEXITCODE -ne 0){throw 'SERIAL_XD_READONLY_NOT_ACCEPTED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adobe-serial-xd-new-native-before-one-rectangle
          path: serial_xd_artifact/*
          if-no-files-found: warn
          retention-days: 14
