name: Mode 2 XD disposable native rectangle one-shot E2E
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-disposable-rectangle-apply.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  mutate-once:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert exactly one disposable XD window and zero foreign Adobe host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $hash='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          foreach($rel in @('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd','mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd')){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $hash){throw 'MODE2_NATIVE_BASELINE_MISMATCH'}
          }
          if(@(Get-Process -Name Illustrator,Photoshop,PickerHost -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_OTHER_ADOBE_OR_PICKER'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $target=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          $ws=@(Get-NetTCPConnection -LocalPort 8765 -State Established -ErrorAction SilentlyContinue)
          Write-Host "MODE2_PREWRITE_WINDOWS=$($xd.Count) TEST=$($target.Count) UXP=$($ws.Count)"
          if($xd.Count -ne 1 -or $target.Count -ne 1 -or $ws.Count -lt 1){throw 'MODE2_WRONG_XD_SESSION_NO_WRITE'}
      - name: Queue and apply ONE disposable rectangle with durable receipt and live scenegraph readback
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          uv run --python 3.12 python scripts/mode2_disposable_rectangle_undo_e2e.py
          if($LASTEXITCODE -ne 0){throw 'MODE2_RECT_E2E_FAILED_NO_REPLAY'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $hash='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          foreach($rel in @('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd')){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $hash){throw 'MODE2_PROTECTED_FILE_CHANGED'}
          }
          Write-Host 'MODE2_NATIVE_UNDO_STILL_REQUIRED=True'
