name: Portable GitHub CLI bootstrap targeted

on:
  push:
    branches: [fix/portable-gh-bootstrap]

permissions:
  contents: read

jobs:
  portable-gh-bootstrap:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Force no-gh no-winget portable bootstrap
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Join-Path $env:RUNNER_TEMP 'mcp-adobe-gh-portable-targeted'
          Remove-Item -LiteralPath $portable -Recurse -Force -ErrorAction SilentlyContinue
          $env:MCP_ADOBE_GH_PORTABLE_DIR = $portable
          $env:MCP_ADOBE_GH_INSTALL_MODE = 'portable'
          $env:MCP_ADOBE_GH_PATH = ''
          $powershellExe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          & $powershellExe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/dispatch_adobe_live_e2e.ps1 -BootstrapOnly
          if ($LASTEXITCODE -ne 0) { throw "portable bootstrap script failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $portable 'gh.exe') -PathType Leaf)) {
            throw 'portable gh.exe was not created'
          }
          & (Join-Path $portable 'gh.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'portable gh version probe failed' }
