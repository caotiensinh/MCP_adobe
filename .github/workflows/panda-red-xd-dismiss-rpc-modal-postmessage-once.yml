name: Panda red XD dismiss proven COM RPC Save As modal with async PostMessage once
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-xd-dismiss-rpc-modal-postmessage-once.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  dismiss:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Post BM_CLICK once only to exact RPC modal OK; verify old dialog survives without native write
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'XD_RPC_MODAL_WRONG_DESKTOP'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;using System.Runtime.InteropServices;using System.Text;
          public class XdRpcDismiss {
            public delegate bool EnumProc(IntPtr h,IntPtr arg);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc cb,IntPtr arg);
            [DllImport("user32.dll")] public static extern bool EnumChildWindows(IntPtr h,EnumProc cb,IntPtr arg);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h,out uint pid);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetClassName(IntPtr h,StringBuilder s,int len);
            [DllImport("user32.dll",CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h,StringBuilder s,int len);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll",SetLastError=true)] public static extern bool PostMessage(IntPtr h,uint msg,IntPtr wp,IntPtr lp);
          }
          '@
          function ClassOf([IntPtr]$h){
            $b=New-Object System.Text.StringBuilder(110)
            [void][XdRpcDismiss]::GetClassName($h,$b,110)
            return $b.ToString()
          }
          function DialogHandles([uint32]$ownerId){
            $list=New-Object 'System.Collections.Generic.List[System.IntPtr]'
            $fn=[XdRpcDismiss+EnumProc]{
              param([IntPtr]$hwnd,[IntPtr]$arg)
              $nativeOwner=[uint32]0
              [void][XdRpcDismiss]::GetWindowThreadProcessId($hwnd,[ref]$nativeOwner)
              if($nativeOwner -eq $ownerId -and (ClassOf $hwnd) -eq '#32770' -and [XdRpcDismiss]::IsWindowVisible($hwnd)){
                $list.Add($hwnd)
              }
              return $true
            }
            [void][XdRpcDismiss]::EnumWindows($fn,[IntPtr]::Zero)
            return $list.ToArray()
          }
          $dir=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $source=Join-Path $dir 'MCP_Mode1_Panda_XD_38136531800.xd'
          $target=Join-Path $dir 'MCP_KFP4_Red_XD_38205166138.xd'
          $sha='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $sha -or (Test-Path -LiteralPath $target)){throw 'XD_RPC_MODAL_SOURCE_OR_TARGET_UNSAFE'}
          $pickers=@(Get-Process -Name PickerHost -ErrorAction SilentlyContinue|Where-Object{$_.SessionId -eq 1})
          if($pickers.Count -ne 1){throw 'XD_RPC_MODAL_PICKER_NOT_UNIQUE'}
          $pickerId=[uint32]$pickers[0].Id
          $dialogs=@(DialogHandles $pickerId)
          $small=@();$large=@()
          foreach($handle in $dialogs){
            $window=[System.Windows.Automation.AutomationElement]::FromHandle($handle)
            $tree=$window.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
            if([string]$window.Current.Name -ne 'Save As'){throw 'XD_RPC_MODAL_UNEXPECTED_DIALOG_TITLE'}
            if($tree.Count -le 10){$small+=,$handle}else{$large+=,$handle}
          }
          Write-Host "XD_RPC_MODAL_PRECONDITION dialogs=$($dialogs.Count) small=$($small.Count) large=$($large.Count)"
          if($dialogs.Count -ne 2 -or $small.Count -ne 1 -or $large.Count -ne 1){throw 'XD_RPC_MODAL_NOT_EXACT_EXPECTED_STATE'}
          $modal=[System.Windows.Automation.AutomationElement]::FromHandle($small[0])
          $all=$modal.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
          $ok=@($all|Where-Object{[string]$_.Current.AutomationId -eq 'CommandButton_1' -and [string]$_.Current.Name -eq 'OK' -and $_.Current.IsEnabled})
          $path=@($all|Where-Object{[string]$_.Current.Name -eq $target})
          if($ok.Count -ne 1 -or $path.Count -ne 1){throw 'XD_RPC_MODAL_NOT_SAME_PATH_OR_BUTTON'}
          $button=[IntPtr]$ok[0].Current.NativeWindowHandle
          $buttonList=@()
          if($button -eq [IntPtr]::Zero -or (ClassOf $button) -ne 'Button'){
            $children=New-Object 'System.Collections.Generic.List[System.IntPtr]'
            $cb=[XdRpcDismiss+EnumProc]{
              param([IntPtr]$hwnd,[IntPtr]$arg)
              if((ClassOf $hwnd) -eq 'Button'){
                $label=New-Object System.Text.StringBuilder(100)
                [void][XdRpcDismiss]::GetWindowText($hwnd,$label,100)
                if($label.ToString() -eq 'OK'){$children.Add($hwnd)}
              }
              return $true
            }
            [void][XdRpcDismiss]::EnumChildWindows([IntPtr]$small[0],$cb,[IntPtr]::Zero)
            $buttonList=@($children.ToArray())
            if($buttonList.Count -ne 1){throw 'XD_RPC_MODAL_NATIVE_OK_NOT_UNIQUE'}
            $button=[IntPtr]$buttonList[0]
          }
          $nativePid=[uint32]0
          [void][XdRpcDismiss]::GetWindowThreadProcessId($button,[ref]$nativePid)
          if($nativePid -ne $pickerId -or (ClassOf $button) -ne 'Button'){throw 'XD_RPC_MODAL_NATIVE_OWNER_MISMATCH'}
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $sha -or (Test-Path -LiteralPath $target)){throw 'XD_RPC_MODAL_GUARD_CHANGED'}
          $posted=[XdRpcDismiss]::PostMessage($button,[uint32]245,[IntPtr]::Zero,[IntPtr]::Zero)
          Write-Host "XD_RPC_MODAL_ASYNC_OK_POSTED=$posted hwnd=$button"
          if(-not $posted){throw 'XD_RPC_MODAL_POST_FAILED_NO_RETRY'}
          $deadline=(Get-Date).AddSeconds(15);$remaining=@()
          do{
            Start-Sleep -Milliseconds 500
            $remaining=@(DialogHandles $pickerId)
            if($remaining.Count -eq 1){break}
          }until((Get-Date)-ge $deadline)
          Write-Host "XD_RPC_MODAL_REMAINING_DIALOGS=$($remaining.Count)"
          if((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash -ne $sha -or (Test-Path -LiteralPath $target)){throw 'XD_RPC_MODAL_SOURCE_OR_TARGET_CHANGED'}
          if($remaining.Count -ne 1 -or [IntPtr]$remaining[0] -ne [IntPtr]$large[0]){throw 'XD_RPC_MODAL_OK_OUTCOME_UNKNOWN_NO_REPLAY'}
          $main=[System.Windows.Automation.AutomationElement]::FromHandle($large[0])
          $children=$main.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
          $save=@($children|Where-Object{[string]$_.Current.AutomationId -eq '1' -and [string]$_.Current.Name -eq 'Save'})
          if($save.Count -ne 1){throw 'XD_RPC_MODAL_MAIN_SAVE_NOT_UNIQUE'}
          Write-Host "XD_RPC_MODAL_DISMISSED=PASS remainingSaveEnabled=$($save[0].Current.IsEnabled) originalUnchanged=1"
