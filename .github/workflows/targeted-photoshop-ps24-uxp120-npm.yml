name: Targeted Photoshop 24 UXP minimal v4 loader

on:
  pull_request:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-photoshop-ps24-uxp120-npm.yml"

concurrency:
  group: targeted-photoshop-ps24-minv4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Verify Photoshop 24 and developer state without mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Process -Name Photoshop -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          if(-not $p){throw 'Photoshop is not running'}
          $v=([regex]::Match((Get-Item $p.Path).VersionInfo.ProductVersion,'\d+\.\d+(?:\.\d+)?')).Value
          if(-not $v.StartsWith('24.')){throw "Expected Photoshop 24.x, got $v"}
          $cfg=Join-Path $env:CommonProgramFiles 'Adobe\UXP\Developer\settings.json'
          if(-not (Test-Path $cfg)){throw "Developer settings missing: $cfg"}
          $cfgInfo=Get-Item $cfg
          $json=Get-Content $cfg -Raw | ConvertFrom-Json
          Write-Host "PHOTOSHOP_VERSION=$v SESSION=$($p.SessionId) START=$($p.StartTime.ToString('o'))"
          Write-Host "DEVTOOLS_CONFIG_MODIFIED=$($cfgInfo.LastWriteTime.ToString('o')) CONTENT=$(Get-Content $cfg -Raw)"
          if($json.developer -ne $true){throw 'Developer mode is not persisted true'}
          if($cfgInfo.LastWriteTime -le $p.StartTime){Write-Host 'DEVTOOLS_CONFIG_PREDATES_PHOTOSHOP=YES'}else{Write-Host 'DEVTOOLS_CONFIG_NEWER_THAN_PHOTOSHOP=YES'}
          Write-Host 'PS24_DEVELOPER_STATE_READONLY_VERIFY=PASS'

      - name: Install published Adobe UXP CLI 1.2.0
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $tool=Join-Path $env:RUNNER_TEMP 'uxp120-published-minv4'
          if(Test-Path $tool){Remove-Item -Recurse -Force $tool}
          New-Item -ItemType Directory -Force $tool | Out-Null
          Push-Location $tool
          try {
            npm init -y | Out-Null
            npm install --ignore-scripts --no-audit --no-fund --fetch-retries=2 --fetch-timeout=60000 @adobe/uxp-devtools-cli@1.2.0 tar@6 fs-extra@9
            if($LASTEXITCODE -ne 0){throw 'Published Adobe UXP CLI 1.2.0 install failed'}
            node (Join-Path $tool 'node_modules\@adobe\uxp-devtools-helper\scripts\devtools_setup.js')
            if($LASTEXITCODE -ne 0){throw 'UXP native helper setup failed'}
          } finally { Pop-Location }
          "UXP_JS=$(Join-Path $tool 'node_modules\@adobe\uxp-devtools-cli\src\uxp.js')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'UXP_CLI_120_PUBLISHED_INSTALL=PASS'

      - name: Build minimal Photoshop manifest v4 plugin with no icons
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'ps24-minimal-v4-no-icons'
          if(Test-Path $dir){Remove-Item -Recurse -Force $dir}
          New-Item -ItemType Directory -Force $dir | Out-Null
          $manifest=[ordered]@{
            id='com.mcpadobe.ps24.minv4'
            name='MCP Adobe PS24 Minimal V4'
            version='1.0.0'
            main='index.html'
            host=@([ordered]@{app='PS';minVersion='22.0.0'})
            manifestVersion=4
            entrypoints=@([ordered]@{
              type='panel'
              id='minimal'
              minimumSize=[ordered]@{width=230;height=200}
              maximumSize=[ordered]@{width=2000;height=2000}
              preferredDockedSize=[ordered]@{width=230;height=200}
              preferredFloatingSize=[ordered]@{width=230;height=200}
              label=[ordered]@{default='MCP Minimal V4'}
            })
          }
          $utf8=New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText((Join-Path $dir 'manifest.json'),($manifest|ConvertTo-Json -Depth 12),$utf8)
          [IO.File]::WriteAllText((Join-Path $dir 'index.html'),'<!doctype html><html><head><meta charset="utf-8"></head><body><div>MCP Adobe PS24 minimal v4</div><script src="main.js"></script></body></html>',$utf8)
          [IO.File]::WriteAllText((Join-Path $dir 'main.js'),'console.log("MCP_ADOBE_PS24_MINV4_BOOT=PASS");',$utf8)
          "MINV4_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content (Join-Path $dir 'manifest.json') -Raw
          Write-Host 'PS24_MINIMAL_V4_BUILD=PASS'

      - name: Load minimal v4 and capture host rejection evidence
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $svc=$null;$loader=$null
          $svcOut=Join-Path $env:RUNNER_TEMP 'minv4-service.out'
          $svcErr=Join-Path $env:RUNNER_TEMP 'minv4-service.err'
          $loadOut=Join-Path $env:RUNNER_TEMP 'minv4-load.out'
          $loadErr=Join-Path $env:RUNNER_TEMP 'minv4-load.err'
          Remove-Item -Force $svcOut,$svcErr,$loadOut,$loadErr -ErrorAction SilentlyContinue
          try {
            $svc=Start-Process node -ArgumentList @($env:UXP_JS,'service','start','--port','14001') -PassThru -RedirectStandardOutput $svcOut -RedirectStandardError $svcErr
            $deadline=[DateTime]::UtcNow.AddSeconds(35);$ready=$false
            do {
              Start-Sleep 2
              node $env:UXP_JS apps list
              if($LASTEXITCODE -eq 0){$ready=$true;break}
              if($svc.HasExited){break}
            } while([DateTime]::UtcNow -lt $deadline)
            if(-not $ready){throw 'UXP service did not discover Photoshop'}
            Write-Host 'PS24_UXP120_DISCOVERY=PASS'

            $manifest=Join-Path $env:MINV4_DIR 'manifest.json'
            $loader=Start-Process node -ArgumentList @($env:UXP_JS,'plugin','load','--manifest',$manifest,'--apps','PS') -PassThru -RedirectStandardOutput $loadOut -RedirectStandardError $loadErr
            if(-not $loader.WaitForExit(15000)){
              Stop-Process -Id $loader.Id -Force -ErrorAction SilentlyContinue
              throw 'Minimal v4 plugin load timed out'
            }
            $stdout=if(Test-Path $loadOut){Get-Content $loadOut -Raw}else{''}
            $stderr=if(Test-Path $loadErr){Get-Content $loadErr -Raw}else{''}
            $text=$stdout+"`n"+$stderr
            Write-Host '--- MINIMAL V4 LOAD OUTPUT ---'
            Write-Host $text
            $failed=($text -match 'Load command failed' -or $text -match "plugin load' failed" -or $text -match 'Failed to load')

            $latest=Get-ChildItem (Join-Path $env:APPDATA 'Adobe\Adobe Photoshop 2023\Logs') -Filter 'UXPLogs_*.log' -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if($latest){
              Write-Host "--- HOST UXP LOG: $($latest.FullName) ---"
              Get-Content $latest.FullName -Tail 120 -ErrorAction SilentlyContinue
            }

            if($failed){throw 'PS24_MINIMAL_V4_NO_ICONS_LOAD=FAIL'}
            Write-Host 'PS24_MINIMAL_V4_NO_ICONS_LOAD=PASS'
          } finally {
            if($loader -and -not $loader.HasExited){Stop-Process -Id $loader.Id -Force -ErrorAction SilentlyContinue}
            if($svc -and -not $svc.HasExited){Stop-Process -Id $svc.Id -Force -ErrorAction SilentlyContinue}
          }
