name: Mode 2 XD disposable reopen persistence E2E
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-disposable-reopen-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  reopen:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Close only verified clean disposable XD and reopen once
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $native=Join-Path $root 'mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd'
          $sha='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          foreach($rel in @('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd','mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd')){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $sha){throw 'MODE2_NATIVE_HASH_MISMATCH'}
          }
          if(@(Get-Process -Name PickerHost,Illustrator,Photoshop -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_OTHER_ADOBE_OR_DIALOG'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $scope=[System.Windows.Automation.TreeScope]::Children
          $cond=[System.Windows.Automation.Condition]::TrueCondition
          $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
          $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          Write-Host "MODE2_PRE_REOPEN_XD=$($xd.Count) TEST=$($test.Count)"
          if($xd.Count -eq 1 -and $test.Count -eq 1){
            $id=[System.Windows.Automation.AutomationElement]::AutomationIdProperty
            $menu=$test[0].FindFirst([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition($id,'AppMenu_File')))
            if(-not $menu){throw 'MODE2_FILE_MENU_MISSING'}
            $xp=$menu.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
            if($xp.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$xp.Expand()}
            Start-Sleep -Milliseconds 250
            $items=$test[0].FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
            $save=@($items|Where-Object {[string]$_.Current.AutomationId -eq 'AppMenu_Save' -and $_.Current.IsEnabled})
            $close=@($items|Where-Object {[string]$_.Current.AutomationId -match '^(AppMenu_Close|file.close)$' -and $_.Current.IsEnabled})
            Write-Host "MODE2_SAVE_ENABLED=$($save.Count) CLOSE_CONTROLS=$($close.Count)"
            if($save.Count -ne 0 -or $close.Count -ne 1){throw 'MODE2_NOT_CLEAN_OR_CLOSE_NOT_UNIQUE'}
            $close[0].GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Write-Host 'MODE2_DISPOSABLE_CLOSE_INVOKED_ONCE'
            Start-Sleep -Seconds 2
          }elseif($xd.Count -ne 0){throw 'MODE2_OTHER_XD_OPEN_NO_CLOSE'}
          $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
          $remaining=@($top|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($remaining.Count -ne 0){throw 'MODE2_CLOSE_NOT_CONFIRMED'}
          if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash -ne $sha){throw 'MODE2_DISK_CHANGED_AFTER_CLOSE'}
          $tracking=$env:RUNNER_TRACKING_ID
          try{$env:RUNNER_TRACKING_ID='';Start-Process -FilePath $native -ErrorAction Stop}finally{$env:RUNNER_TRACKING_ID=$tracking}
          Write-Host 'MODE2_DISPOSABLE_REOPEN_REQUESTED_ONCE'
          $ok=$false
          for($i=1;$i -le 12;$i++){
            Start-Sleep -Seconds 3
            $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
            $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
            $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
            $socket=@(Get-NetTCPConnection -LocalPort 8765 -State Established -ErrorAction SilentlyContinue)
            Write-Host "MODE2_REOPEN_POLL=$i XD=$($xd.Count) TEST=$($test.Count) BRIDGE=$($socket.Count)"
            if($xd.Count -eq 1 -and $test.Count -eq 1 -and $socket.Count -gt 0){$ok=$true;break}
          }
          if(-not $ok){throw 'MODE2_REOPEN_HOST_UNVERIFIED'}
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          @'
          import asyncio
          from mcp import Client
          from scripts.export_region_metadata import payload,unwrap
          def test_exists(nodes):
              for n in nodes:
                  if n.get("name")=="MODE2_DISPOSABLE_UNDO_RECT_ONE_SHOT" or n.get("id")=="29e85d07-75aa-4f8f-9a04-60de4d09477d":return True
                  if test_exists(n.get("children",[])):return True
              return False
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  r=await asyncio.wait_for(c.call_tool("creative_read",{"application":"xd","capability":"creative.scenegraph.list","arguments":{}}),timeout=15)
                  g=unwrap(payload(r))
                  if isinstance(g,dict) and isinstance(g.get("result"),dict):g=unwrap(g["result"])
                  if g.get("complete") is not True or g.get("node_count")!=33 or test_exists(g.get("nodes",[])):
                      raise RuntimeError("MODE2_REOPEN_SCENEGRAPH_MISMATCH")
                  print("MODE2_NATIVE_REOPEN_SCENEGRAPH=PASS nodes=33",flush=True)
          asyncio.run(main())
          '@|Set-Content -LiteralPath .\verify_reopened_xd.py -Encoding UTF8
          uv run --python 3.12 python .\verify_reopened_xd.py
          if($LASTEXITCODE -ne 0){throw 'MODE2_REOPEN_READBACK_FAILED'}
          foreach($rel in @('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd','mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd')){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $sha){throw 'MODE2_REOPEN_NATIVE_HASH_CHANGED'}
          }
          Write-Host 'MODE2_DISPOSABLE_REOPEN_E2E=PASS'
