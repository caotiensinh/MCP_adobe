name: Mode 2 XD guided selection v2 one-shot activation
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-guided-v2-activation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  activate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Activate staged experimental UXP v2 without document mutation
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $native=Join-Path $root 'mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd'
          $sha='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          $paths=@('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd','mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd')
          foreach($p in $paths){if((Get-FileHash -LiteralPath (Join-Path $root $p) -Algorithm SHA256).Hash -ne $sha){throw 'MODE2_NATIVE_NOT_BASELINE'}}
          $marker=Join-Path $root 'mode2-disposable-native\Mode2_StagedGUIDSelectionV2_ReloadOnce.marker'
          if(Test-Path -LiteralPath $marker){throw 'MODE2_GUIDED_V2_RELOAD_ALREADY_ATTEMPTED'}
          $develop=Join-Path $env:LOCALAPPDATA 'Packages\Adobe.XD_pc75e8sa7ep4e\LocalState\develop'
          $production=Join-Path $develop 'MCPAdobeBridge\main.js'
          $expMain=Join-Path $develop 'MCPAdobeMode2Experiment\main.js'
          $expManifest=Join-Path $develop 'MCPAdobeMode2Experiment\manifest.json'
          $git=(Get-Command git -ErrorAction Stop).Source
          if((& $git hash-object -- $expMain).Trim() -ne '7fde12a16a13cd1b79c236a62ee874ea0b3f60d0' -or
             (& $git hash-object -- $expManifest).Trim() -ne '873d9fb1de76612e6e48375e8ad8933d2eaeb83d'){
            throw 'MODE2_WRONG_STAGED_V2'
          }
          $prodHash=(Get-FileHash -LiteralPath $production -Algorithm SHA256).Hash
          if(@(Get-Process -Name Illustrator,Photoshop,PickerHost -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_FOREIGN_ADOBE_OR_MODAL'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $children=[System.Windows.Automation.TreeScope]::Children
          $desc=[System.Windows.Automation.TreeScope]::Descendants
          $cond=[System.Windows.Automation.Condition]::TrueCondition
          $aid=[System.Windows.Automation.AutomationElement]::AutomationIdProperty
          function Get-XdWindow {
            $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($children,$cond)
            $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
            $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
            if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_NOT_ONE_DISPOSABLE_WINDOW'}
            return $test[0]
          }
          $win=Get-XdWindow
          $wp=$win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
          if($wp.Current.WindowVisualState -eq [System.Windows.Automation.WindowVisualState]::Minimized){
            $wp.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Normal)
          }
          try{$win.SetFocus()}catch{}
          Start-Sleep -Milliseconds 800
          function Get-Menu([string]$id){
            $window=Get-XdWindow
            $m=$window.FindFirst($desc,(New-Object System.Windows.Automation.PropertyCondition($aid,$id)))
            if(-not $m){throw "MODE2_MENU_NOT_FOUND_$id"}
            return $m
          }
          $file=Get-Menu 'AppMenu_File'
          $fx=$file.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
          if($fx.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$fx.Expand()}
          Start-Sleep -Milliseconds 250
          $items=$win.FindAll($desc,$cond)
          $save=@($items|Where-Object {[string]$_.Current.AutomationId -eq 'AppMenu_Save' -and $_.Current.IsEnabled})
          $fx.Collapse()
          if($save.Count -ne 0){throw 'MODE2_DIRTY_DOC_NO_RELOAD'}
          Write-Host 'MODE2_GUID_V2_CLEAN_DOC=PASS'
          if(@(Get-NetTCPConnection -LocalPort 8766 -State Listen -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_8766_LISTENER_UNOWNED'}
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          $uv=(Get-Command uv -ErrorAction Stop).Source
          $out=Join-Path $env:RUNNER_TEMP 'mode2_guided_v2_listener.txt'
          $err=Join-Path $env:RUNNER_TEMP 'mode2_guided_v2_listener_err.txt'
          $child=Start-Process -FilePath $uv -ArgumentList @('run','--python','3.12','python','scripts/mode2_xd_experimental_readback.py','--wait-seconds','40') -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
          try{
            $ready=$false
            for($i=1;$i -le 35;$i++){
              Start-Sleep -Milliseconds 450
              if($child.HasExited){throw 'MODE2_SIDECAR_EARLY_EXIT'}
              if(@(Get-NetTCPConnection -LocalPort 8766 -State Listen -ErrorAction SilentlyContinue).Count -eq 1){$ready=$true;break}
            }
            if(-not $ready){throw 'MODE2_8766_NOT_READY'}
            $menu=Get-Menu 'AppMenuBar_Plugins'
            $xp=$menu.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
            if($xp.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$xp.Expand()}
            Start-Sleep -Milliseconds 250
            $dev=Get-Menu 'PluginsMenu_Development'
            $dx=$dev.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
            if($dx.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$dx.Expand()}
            Start-Sleep -Milliseconds 250
            $reload=Get-Menu 'PluginsMenu_Development_Reload'
            if([string]$reload.Current.Name -ne 'Reload Plugins (Legacy)' -or -not $reload.Current.IsEnabled){throw 'MODE2_LEGACY_RELOAD_NOT_UNIQUE'}
            "run=$env:GITHUB_RUN_ID at=$([DateTime]::UtcNow.ToString('o'))" | Set-Content -LiteralPath $marker -Encoding ASCII -NoNewline
            $reload.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Write-Host 'MODE2_GUIDED_V2_RELOAD_INVOKED_ONCE'
            Start-Sleep -Seconds 2
            function Open-Experimental-Menu{
              $pm=Get-Menu 'AppMenuBar_Plugins'
              $px=$pm.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
              if($px.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$px.Expand()}
              Start-Sleep -Milliseconds 230
              $all=(Get-XdWindow).FindAll($desc,$cond)
              $rootMenu=@($all|Where-Object {[string]$_.Current.Name -eq 'MCP Adobe Mode 2 Experimental' -and [string]$_.Current.ControlType.ProgrammaticName -eq 'ControlType.MenuItem'})
              if($rootMenu.Count -ne 1){throw 'MODE2_EXP_MENU_NOT_UNIQUE'}
              $rx=$rootMenu[0].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
              if($rx.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$rx.Expand()}
              Start-Sleep -Milliseconds 240
              return @((Get-XdWindow).FindAll($desc,$cond))
            }
            $all=@(Open-Experimental-Menu)
            $newCommand=@($all|Where-Object {[string]$_.Current.Name -eq 'MCP Mode 2 Select Staged Disposable Rectangle' -and $_.Current.IsEnabled})
            if($newCommand.Count -ne 1){throw 'MODE2_V2_NEW_COMMAND_NOT_LOADED'}
            Write-Host 'MODE2_V2_STAGED_SELECTION_MENU_PRESENT=PASS'
            $connect=@($all|Where-Object {[string]$_.Current.Name -eq 'MCP Adobe Mode 2 Connect' -and $_.Current.IsEnabled})
            if($connect.Count -ne 1){throw 'MODE2_EXPERIMENTAL_CONNECT_NOT_UNIQUE'}
            $connect[0].GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Write-Host 'MODE2_V2_EXPERIMENTAL_CONNECT_INVOKED_ONCE'
            if(-not $child.WaitForExit(50000)){throw 'MODE2_V2_READBACK_TIMEOUT'}
            if(Test-Path -LiteralPath $out){Get-Content -LiteralPath $out|ForEach-Object {Write-Host $_}}
            if(Test-Path -LiteralPath $err){Get-Content -LiteralPath $err -Tail 10 |ForEach-Object {Write-Host "MODE2_EXPERIMENTAL_ERR=$_"}}
            if(-not (Select-String -LiteralPath $out -Pattern '^MODE2_EXPERIMENTAL_BRIDGE_READONLY=PASS$' -Quiet)){throw 'MODE2_V2_BRIDGE_NOT_ATTESTED'}
            Write-Host 'MODE2_GUIDED_V2_EXPERIMENTAL_REAL_READBACK=PASS'
          }finally{
            if(-not $child.HasExited){Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue}
          }
          foreach($p in $paths){if((Get-FileHash -LiteralPath (Join-Path $root $p) -Algorithm SHA256).Hash -ne $sha){throw 'MODE2_NATIVE_CHANGED_BY_ACTIVATION'}}
          if((Get-FileHash -LiteralPath $production -Algorithm SHA256).Hash -ne $prodHash){throw 'MODE2_PRODUCTION_PLUGIN_CHANGED'}
          Write-Host 'MODE2_GUIDED_V2_ACTIVATION_READONLY=PASS'
