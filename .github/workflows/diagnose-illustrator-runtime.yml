name: Diagnose Illustrator runtime read-only

on:
  push:
    branches: [feat/illustrator-cep-backend]
    paths:
      - ".github/workflows/diagnose-illustrator-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnose-illustrator-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    env:
      PYTHONUTF8: "1"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4

      - name: Capture process and socket state
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $ai=@(Get-Process -Name Illustrator -ErrorAction SilentlyContinue)
          foreach($p in $ai){
            Write-Host "DIAG_ILLUSTRATOR PID=$($p.Id) SESSION=$($p.SessionId) HANDLE=$($p.MainWindowHandle) TITLE=$($p.MainWindowTitle) START=$($p.StartTime.ToString('o'))"
          }
          foreach($port in @(8787,8081,8765)){
            Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue |
              Sort-Object State,RemotePort |
              ForEach-Object {
                Write-Host "DIAG_TCP PORT=$port STATE=$($_.State) PID=$($_.OwningProcess) LOCAL=$($_.LocalAddress):$($_.LocalPort) REMOTE=$($_.RemoteAddress):$($_.RemotePort)"
              }
          }
          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {$_.Name -eq 'CEPHtmlEngine.exe'} |
            ForEach-Object { Write-Host "DIAG_CEP PID=$($_.ProcessId) CMD=$($_.CommandLine)" }

      - name: Capture current MCP health without host probe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $machine=[Environment]::GetEnvironmentVariable('Path','Machine')
          $user=[Environment]::GetEnvironmentVariable('Path','User')
          $env:Path=(@($machine,$user,$env:Path) | Where-Object {$_}) -join ';'
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)) {
            $uvDir=Join-Path $HOME '.local\bin'
            if(Test-Path (Join-Path $uvDir 'uv.exe')) { $env:Path="$uvDir;$env:Path" }
          }
          if(-not (Get-Command uv -ErrorAction SilentlyContinue)){ throw 'uv unavailable' }
          uv sync
          @'
          import asyncio
          import json
          from mcp import Client

          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as client:
                  result = await client.call_tool(
                      "creative_read",
                      {
                          "application": "illustrator",
                          "capability": "creative.health",
                          "arguments": {"probe": False, "timeout": 5.0},
                      },
                  )
                  print(
                      "DIAG_MCP_HEALTH=" +
                      json.dumps(
                          {
                              "is_error": result.is_error,
                              "structured": result.structured_content,
                              "content": [str(x) for x in result.content],
                          },
                          ensure_ascii=False,
                          default=str,
                      ),
                      flush=True,
                  )
          asyncio.run(main())
          '@ | Set-Content -Path diag_mcp_health.py -Encoding UTF8
          uv run python diag_mcp_health.py

      - name: Capture persistent host and CEP logs
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $paths=@(
            (Join-Path $env:LOCALAPPDATA 'MCPAdobe\gateway\logs\local-host.log'),
            (Join-Path $env:TEMP 'CEPHtmlEngine11-ILST-27.4.0-com.illustrator.mcp.panel.log'),
            (Join-Path $env:TEMP 'CEPHtmlEngine11-ILST-27.4.0-com.illustrator.mcp.bootstrap.log')
          )
          foreach($p in $paths){
            if(Test-Path -LiteralPath $p){
              Write-Host "DIAG_LOG_BEGIN=$p"
              Get-Content -LiteralPath $p -Tail 900 -ErrorAction SilentlyContinue
              Write-Host "DIAG_LOG_END=$p"
            } else {
              Write-Host "DIAG_LOG_MISSING=$p"
            }
          }

