name: Illustrator C014 panel root cause
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: illustrator-desktop-exclusive
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect read-only panel readiness details and socket owners
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object {$_}) -join ';'
          foreach($port in @(8787,8081)){
            $l=@(Get-NetTCPConnection -LocalPort $port -State Listen -ErrorAction SilentlyContinue)
            Write-Output "C014_LISTEN port=$port count=$($l.Count)"
            foreach($x in $l){Write-Output "C014_LISTEN_OWNER port=$port pid=$($x.OwningProcess)"}
          }
          $con=@(Get-NetTCPConnection -RemotePort 8081 -State Established -ErrorAction SilentlyContinue)
          foreach($x in $con){
            $p=Get-CimInstance Win32_Process -Filter "ProcessId=$($x.OwningProcess)" -ErrorAction SilentlyContinue
            Write-Output "C014_CEP_CLIENT pid=$($x.OwningProcess) name=$($p.Name) session=$($p.SessionId)"
          }
          $trace=Join-Path $env:LOCALAPPDATA 'MCPAdobe\illustrator-mcp\callback_trace.log'
          if(Test-Path $trace){
            Get-Content $trace -Tail 25 | ForEach-Object {
              $safe=$_ -replace '(?i)(token|password|secret|authorization)[=:]\S+','$1=[REDACTED]'
              Write-Output "C014_TRACE $safe"
            }
          }
          uv sync --python 3.12
          if($LASTEXITCODE -ne 0){throw 'C014_SETUP_FAILED'}
          @'
          import asyncio, json
          from mcp import Client
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  r=await c.call_tool("creative_read",{"application":"illustrator","capability":"creative.health","arguments":{"probe":False,"timeout":5}})
                  if r.is_error or not isinstance(r.structured_content,dict):
                      raise RuntimeError("C014_HEALTH_FAILED")
                  d=r.structured_content.get("result",{}).get("connection",{}).get("data",{})
                  print("C014_HEALTH_DETAIL="+json.dumps(d,default=str)[:12000],flush=True)
                  p=(d.get("layers") or {}).get("panel") or {}
                  print("C014_PANEL_STATUS="+json.dumps(p,default=str)[:5000],flush=True)
                  if (d.get("execution") or {}).get("unresolvedJobs"):raise RuntimeError("C014_UNRESOLVED_RETURNED")
                  print("C014_UNRESOLVED_REMAINS_CLEARED=PASS",flush=True)
          asyncio.run(main())
          '@ | Set-Content -LiteralPath panel_c014.py -Encoding UTF8
          uv run python panel_c014.py
          if($LASTEXITCODE -ne 0){throw 'C014_PANEL_DIAG_FAILED'}
