name: Illustrator house gateway job status
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/illustrator-house-gateway-job-status.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: illustrator-desktop-exclusive
  cancel-in-progress: false
jobs:
  status:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read original Illustrator job status through mapped gateway capability
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object {$_}) -join ';'
          uv sync --python 3.12
          @'
          import asyncio,json
          from mcp import Client
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  r=await c.call_tool("creative_read",{"application":"illustrator","capability":"creative.job.status","arguments":{"jobId":"job_40275b48de5d"}})
                  print("MAPPED_JOB_STATUS="+json.dumps({"error":r.is_error,"payload":r.structured_content,"text":str(r.content)[:1000]},default=str)[:9000],flush=True)
          asyncio.run(main())
          '@ | Set-Content -LiteralPath check_job.py -Encoding UTF8
          uv run python check_job.py
