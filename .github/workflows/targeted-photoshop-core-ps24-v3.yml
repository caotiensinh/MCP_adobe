name: Targeted Photoshop 24 UXP compatibility v3

on:
  pull_request:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-photoshop-core-ps24-v3.yml"
      - "scripts/probe_photoshop_core_live.cjs"

concurrency:
  group: targeted-photoshop-core-ps24-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-ps24-v3:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Verify Photoshop 24 host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Process -Name Photoshop -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          if(-not $p){throw 'Photoshop is not running'}
          $v=([regex]::Match((Get-Item $p.Path).VersionInfo.ProductVersion,'\d+\.\d+(?:\.\d+)?')).Value
          if(-not $v.StartsWith('24.')){throw "Expected Photoshop 24.x, got $v"}
          "PHOTOSHOP_VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PHOTOSHOP_VERSION=$v SESSION=$($p.SessionId)"
          Write-Host 'PHOTOSHOP_24_PROCESS_VERIFY=PASS'

      - name: Prepare pinned PS24 upstream
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dst=Join-Path $env:RUNNER_TEMP 'core-photoshop-mcp-v3'
          if(Test-Path $dst){Remove-Item -Recurse -Force $dst}
          git clone https://github.com/CORE-Automate-WSS/photoshop-mcp.git $dst
          git -C $dst checkout --detach 586b66499852c801bcdb3b718c036f16f043c1d7
          if((git -C $dst rev-parse HEAD).Trim() -ne '586b66499852c801bcdb3b718c036f16f043c1d7'){throw 'upstream pin mismatch'}
          $panel=Join-Path $dst 'packages\ps-uxp-bridge'
          $j=Get-Content (Join-Path $panel 'manifest.json') -Raw | ConvertFrom-Json
          if([version]$j.host[0].minVersion -gt [version]'24.0.0'){throw "incompatible minVersion=$($j.host[0].minVersion)"}
          $main=Join-Path $panel 'main.js'
          $src=Get-Content $main -Raw
          $needle='  log("MCP Bridge initialized");'
          if(-not $src.Contains($needle)){throw 'auto-connect hook missing'}
          $src=$src.Replace($needle,$needle+"`r`n  setTimeout(connect, 500);")
          [IO.File]::WriteAllText($main,$src,(New-Object Text.UTF8Encoding($false)))
          "CORE_PANEL=$panel" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CORE_SERVER_DIR=$(Join-Path $dst 'packages\mcp-server')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CORE_MIN_VERSION=$($j.host[0].minVersion)"
          Write-Host 'CORE_PS24_COMPAT_DECLARATION=PASS'

      - name: Build and test pinned upstream
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:CORE_SERVER_DIR
          try {
            npm install --no-audit --no-fund
            if($LASTEXITCODE -ne 0){throw 'npm install failed'}
            npm run build
            if($LASTEXITCODE -ne 0){throw 'build failed'}
            npm test -- --run
            if($LASTEXITCODE -ne 0){throw 'tests failed'}
          } finally { Pop-Location }
          Write-Host 'CORE_BUILD_TEST=PASS'

      - name: Install Adobe UXP CLI 1.2.0
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cli=Join-Path $env:RUNNER_TEMP 'uxp-cli-ps24-v3'
          if(Test-Path $cli){Remove-Item -Recurse -Force $cli}
          New-Item -ItemType Directory -Force $cli | Out-Null
          Push-Location $cli
          try {
            npm init -y | Out-Null
            npm install --no-audit --no-fund --ignore-scripts tar@6.2.1 @adobe/uxp-devtools-cli@1.2.0
            if($LASTEXITCODE -ne 0){throw 'UXP CLI install failed'}
            node (Join-Path $cli 'node_modules\@adobe\uxp-devtools-helper\scripts\devtools_setup.js')
            if($LASTEXITCODE -ne 0){throw 'native helper setup failed'}
            $uxpJs=Join-Path $cli 'node_modules\@adobe\uxp-devtools-cli\src\uxp.js'
            if(-not (Test-Path $uxpJs)){throw "UXP node entry missing: $uxpJs"}
            "UXP_JS=$uxpJs" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } finally { Pop-Location }
          Write-Host 'UXP_CLI_INSTALL=PASS'

      - name: Enable Adobe UXP Developer Tools
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          '' | node $env:UXP_JS devtools enable
          if($LASTEXITCODE -ne 0){throw "devtools enable failed rc=$LASTEXITCODE"}
          Write-Host 'UXP_DEVTOOLS_ENABLE=PASS'

      - name: Live UXP transaction — service load create save export
        timeout-minutes: 5
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $svc=$null
          $probe=$null
          $svcOut=Join-Path $env:RUNNER_TEMP 'uxp-service-v3.out.log'
          $svcErr=Join-Path $env:RUNNER_TEMP 'uxp-service-v3.err.log'
          $probeOut=Join-Path $env:RUNNER_TEMP 'ps24-probe-v3.out.log'
          $probeErr=Join-Path $env:RUNNER_TEMP 'ps24-probe-v3.err.log'
          Remove-Item -Force $svcOut,$svcErr,$probeOut,$probeErr -ErrorAction SilentlyContinue
          try {
            $svc=Start-Process -FilePath node -ArgumentList @($env:UXP_JS,'service','start','--port','14001') -PassThru -RedirectStandardOutput $svcOut -RedirectStandardError $svcErr
            Start-Sleep 2
            if($svc.HasExited){
              if(Test-Path $svcOut){Get-Content $svcOut -Raw}
              if(Test-Path $svcErr){Get-Content $svcErr -Raw}
              throw "UXP service exited early rc=$($svc.ExitCode)"
            }

            $deadline=[DateTime]::UtcNow.AddSeconds(60)
            $ready=$false
            do {
              Start-Sleep 2
              node $env:UXP_JS apps list
              if($LASTEXITCODE -eq 0){$ready=$true;break}
              if($svc.HasExited){break}
            } while([DateTime]::UtcNow -lt $deadline)
            if(-not $ready){
              if(Test-Path $svcOut){Get-Content $svcOut -Raw}
              if(Test-Path $svcErr){Get-Content $svcErr -Raw}
              throw "UXP service/Photoshop discovery failed; serviceExited=$($svc.HasExited)"
            }
            Write-Host 'PHOTOSHOP_24_UXP_DISCOVERY=PASS'

            $out=Join-Path $env:RUNNER_TEMP 'photoshop-core-probe-v3'
            New-Item -ItemType Directory -Force $out | Out-Null
            $env:PHOTOSHOP_PROBE_OUT=$out
            $probe=Start-Process -FilePath node -ArgumentList @((Join-Path $env:GITHUB_WORKSPACE 'scripts\probe_photoshop_core_live.cjs')) -PassThru -RedirectStandardOutput $probeOut -RedirectStandardError $probeErr
            Start-Sleep 2
            if($probe.HasExited){
              if(Test-Path $probeOut){Get-Content $probeOut -Raw}
              if(Test-Path $probeErr){Get-Content $probeErr -Raw}
              throw "probe exited early rc=$($probe.ExitCode)"
            }
            Write-Host 'PHOTOSHOP_CORE_PROBE_STARTED=PASS'

            if($svc.HasExited){throw "UXP service died before plugin load rc=$($svc.ExitCode)"}
            $manifest=Join-Path $env:CORE_PANEL 'manifest.json'
            node $env:UXP_JS plugin load --manifest $manifest --apps 'PS'
            if($LASTEXITCODE -ne 0){
              if(Test-Path $svcOut){Get-Content $svcOut -Raw}
              if(Test-Path $svcErr){Get-Content $svcErr -Raw}
              throw "plugin load failed rc=$LASTEXITCODE"
            }
            Write-Host 'PHOTOSHOP_24_UXP_PLUGIN_LOAD=PASS'
            Write-Host 'If MCP Bridge is not visible, open Photoshop > Plugins > MCP Bridge once; the test copy auto-connects.'

            $verifyDeadline=[DateTime]::UtcNow.AddSeconds(190)
            do {
              Start-Sleep 2
              $p=Get-Process -Id $probe.Id -ErrorAction SilentlyContinue
              if(-not $p){break}
            } while([DateTime]::UtcNow -lt $verifyDeadline)

            $p=Get-Process -Id $probe.Id -ErrorAction SilentlyContinue
            if($p){
              if(Test-Path $probeOut){Get-Content $probeOut -Raw}
              if(Test-Path $probeErr){Get-Content $probeErr -Raw}
              throw 'live probe timed out'
            }
            if(Test-Path $probeOut){Get-Content $probeOut -Raw}
            if(Test-Path $probeErr){Get-Content $probeErr -Raw}
            $text=if(Test-Path $probeOut){Get-Content $probeOut -Raw}else{''}
            if($text -notmatch 'PHOTOSHOP_24_LIVE_OPERATION_VERIFY=PASS'){throw 'live operation PASS marker missing'}
            Write-Host 'PHOTOSHOP_24_PRODUCTION_CANDIDATE=PASS'
          }
          finally {
            if($probe -and -not $probe.HasExited){Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue}
            if($svc -and -not $svc.HasExited){Stop-Process -Id $svc.Id -Force -ErrorAction SilentlyContinue}
          }
