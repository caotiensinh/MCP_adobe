name: Targeted Photoshop 24 CORE live v5

on:
  pull_request:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-photoshop-core-ps24-v3.yml"
      - "scripts/probe_photoshop_core_live.cjs"

concurrency:
  group: targeted-photoshop-core-ps24-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-ps24-core:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Verify Photoshop 24 host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Process -Name Photoshop -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          if(-not $p){throw 'Photoshop is not running'}
          $v=([regex]::Match((Get-Item $p.Path).VersionInfo.ProductVersion,'\d+\.\d+(?:\.\d+)?')).Value
          if(-not $v.StartsWith('24.')){throw "Expected Photoshop 24.x, got $v"}
          Write-Host "PHOTOSHOP_VERSION=$v SESSION=$($p.SessionId)"
          Write-Host 'PHOTOSHOP_24_PROCESS_VERIFY=PASS'

      - name: Prepare exact CORE and Adobe UXP CLI sources
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $core=Join-Path $env:RUNNER_TEMP 'core-photoshop-mcp-v5'
          if(Test-Path $core){Remove-Item -Recurse -Force $core}
          git clone https://github.com/CORE-Automate-WSS/photoshop-mcp.git $core
          git -C $core checkout --detach 586b66499852c801bcdb3b718c036f16f043c1d7
          if((git -C $core rev-parse HEAD).Trim() -ne '586b66499852c801bcdb3b718c036f16f043c1d7'){throw 'CORE upstream pin mismatch'}
          $panel=Join-Path $core 'packages\ps-uxp-bridge'
          $manifest=Get-Content (Join-Path $panel 'manifest.json') -Raw | ConvertFrom-Json
          if([version]$manifest.host[0].minVersion -gt [version]'24.0.0'){throw "CORE incompatible minVersion=$($manifest.host[0].minVersion)"}
          $main=Join-Path $panel 'main.js'
          $src=Get-Content $main -Raw
          $needle='  log("MCP Bridge initialized");'
          if(-not $src.Contains($needle)){throw 'CORE auto-connect hook missing'}
          $src=$src.Replace($needle,$needle+"`r`n  setTimeout(connect, 500);")
          [IO.File]::WriteAllText($main,$src,(New-Object Text.UTF8Encoding($false)))

          $adobe=Join-Path $env:RUNNER_TEMP 'adobe-uxp-cli-151-v5'
          if(Test-Path $adobe){Remove-Item -Recurse -Force $adobe}
          git clone https://github.com/adobe-uxp/devtools-cli.git $adobe
          git -C $adobe checkout --detach 175d01fc4f4e4354e6d095fc54bbc99c67f3aa22
          if((git -C $adobe rev-parse HEAD).Trim() -ne '175d01fc4f4e4354e6d095fc54bbc99c67f3aa22'){throw 'Adobe 1.5.1 source pin mismatch'}
          "CORE_PANEL=$panel" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ADOBE_CLI_ROOT=$adobe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CORE_MIN_VERSION=$($manifest.host[0].minVersion)"
          Write-Host 'CORE_AND_ADOBE_PIN_VERIFY=PASS'

      - name: Install Adobe UXP CLI 1.5.1 source workspace
        timeout-minutes: 6
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:ADOBE_CLI_ROOT
          try {
            npx -y yarn@1.22.22 config set registry https://registry.npmjs.org
            npx -y yarn@1.22.22 config set network-timeout 300000
            npx -y yarn@1.22.22 install --ignore-scripts --non-interactive --network-concurrency 1 --network-timeout 300000
            if($LASTEXITCODE -ne 0){throw 'Adobe UXP 1.5.1 workspace install failed'}
            $helper=Join-Path $env:ADOBE_CLI_ROOT 'packages\uxp-devtools-helper\scripts\devtools_setup.js'
            node $helper
            if($LASTEXITCODE -ne 0){throw 'Adobe UXP 1.5.1 native helper setup failed'}
            $uxpJs=Join-Path $env:ADOBE_CLI_ROOT 'packages\uxp-devtools-cli\src\uxp.js'
            if(-not (Test-Path $uxpJs)){throw 'UXP CLI entry missing'}
            "UXP_JS=$uxpJs" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            "CORE_SERVER_DIR=$env:ADOBE_CLI_ROOT" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } finally { Pop-Location }
          Write-Host 'UXP_CLI_151_SOURCE_INSTALL=PASS'

      - name: Enable UXP Developer Tools
        timeout-minutes: 2
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          '' | node $env:UXP_JS devtools enable
          if($LASTEXITCODE -ne 0){throw "UXP devtools enable failed rc=$LASTEXITCODE"}
          Write-Host 'UXP_DEVTOOLS_151_ENABLE=PASS'

      - name: Live CORE Photoshop 24 operation proof
        timeout-minutes: 3
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $svc=$null; $probe=$null; $loader=$null
          $svcOut=Join-Path $env:RUNNER_TEMP 'uxp151-v5-service.out.log'
          $svcErr=Join-Path $env:RUNNER_TEMP 'uxp151-v5-service.err.log'
          $probeOut=Join-Path $env:RUNNER_TEMP 'ps24-v5-probe.out.log'
          $probeErr=Join-Path $env:RUNNER_TEMP 'ps24-v5-probe.err.log'
          $loadOut=Join-Path $env:RUNNER_TEMP 'ps24-v5-load.out.log'
          $loadErr=Join-Path $env:RUNNER_TEMP 'ps24-v5-load.err.log'
          Remove-Item -Force $svcOut,$svcErr,$probeOut,$probeErr,$loadOut,$loadErr -ErrorAction SilentlyContinue
          try {
            $svc=Start-Process -FilePath node -ArgumentList @($env:UXP_JS,'service','start','--port','14001') -PassThru -RedirectStandardOutput $svcOut -RedirectStandardError $svcErr
            $deadline=[DateTime]::UtcNow.AddSeconds(45); $ready=$false
            do {
              Start-Sleep 2
              node $env:UXP_JS apps list
              if($LASTEXITCODE -eq 0){$ready=$true;break}
              if($svc.HasExited){break}
            } while([DateTime]::UtcNow -lt $deadline)
            if(-not $ready){throw 'UXP service/Photoshop discovery failed'}
            Write-Host 'PHOTOSHOP_24_UXP_151_DISCOVERY=PASS'

            $out=Join-Path $env:RUNNER_TEMP 'photoshop-core-probe-v5'
            New-Item -ItemType Directory -Force $out | Out-Null
            $env:PHOTOSHOP_PROBE_OUT=$out
            $probe=Start-Process -FilePath node -ArgumentList @((Join-Path $env:GITHUB_WORKSPACE 'scripts\probe_photoshop_core_live.cjs')) -PassThru -RedirectStandardOutput $probeOut -RedirectStandardError $probeErr
            Start-Sleep 2
            if($probe.HasExited){throw "probe exited early rc=$($probe.ExitCode)"}
            Write-Host 'PHOTOSHOP_CORE_PROBE_STARTED=PASS'

            $manifest=Join-Path $env:CORE_PANEL 'manifest.json'
            Write-Host "CORE_PLUGIN_LOAD_BEGIN=$manifest"
            $loader=Start-Process -FilePath node -ArgumentList @($env:UXP_JS,'plugin','load','--manifest',$manifest,'--apps','PS') -PassThru -RedirectStandardOutput $loadOut -RedirectStandardError $loadErr
            if(-not $loader.WaitForExit(20000)){
              Write-Host 'CORE_PLUGIN_LOAD_TIMEOUT=20s'
              Stop-Process -Id $loader.Id -Force -ErrorAction SilentlyContinue
            } else {
              Write-Host "CORE_PLUGIN_LOAD_RC=$($loader.ExitCode)"
              if($loader.ExitCode -eq 0){Write-Host 'PHOTOSHOP_24_CORE_PLUGIN_LOAD_151=PASS'}
            }
            if(Test-Path $loadOut){Write-Host '--- CORE LOAD STDOUT ---';Get-Content $loadOut -Raw}
            if(Test-Path $loadErr){Write-Host '--- CORE LOAD STDERR ---';Get-Content $loadErr -Raw}

            Write-Host 'Keep Photoshop open. If Plugins > MCP Bridge is visible, open it once now.'
            $verifyDeadline=[DateTime]::UtcNow.AddSeconds(75)
            do {
              Start-Sleep 2
              $p=Get-Process -Id $probe.Id -ErrorAction SilentlyContinue
              if(-not $p){break}
            } while([DateTime]::UtcNow -lt $verifyDeadline)
            $p=Get-Process -Id $probe.Id -ErrorAction SilentlyContinue
            if($p){
              if(Test-Path $probeOut){Get-Content $probeOut -Raw}
              if(Test-Path $probeErr){Get-Content $probeErr -Raw}
              throw 'live probe timed out waiting for CORE panel connection/operation'
            }
            if(Test-Path $probeOut){Get-Content $probeOut -Raw}
            if(Test-Path $probeErr){Get-Content $probeErr -Raw}
            $text=if(Test-Path $probeOut){Get-Content $probeOut -Raw}else{''}
            if($text -notmatch 'PHOTOSHOP_24_LIVE_OPERATION_VERIFY=PASS'){throw 'live operation PASS marker missing'}
            Write-Host 'PHOTOSHOP_24_PRODUCTION_CANDIDATE=PASS'
          }
          catch {
            if(Test-Path $svcOut){Write-Host '--- UXP SERVICE STDOUT ---';Get-Content $svcOut -Raw}
            if(Test-Path $svcErr){Write-Host '--- UXP SERVICE STDERR ---';Get-Content $svcErr -Raw}
            if(Test-Path $probeOut){Write-Host '--- PROBE STDOUT ---';Get-Content $probeOut -Raw}
            if(Test-Path $probeErr){Write-Host '--- PROBE STDERR ---';Get-Content $probeErr -Raw}
            throw
          }
          finally {
            if($loader -and -not $loader.HasExited){Stop-Process -Id $loader.Id -Force -ErrorAction SilentlyContinue}
            if($probe -and -not $probe.HasExited){Stop-Process -Id $probe.Id -Force -ErrorAction SilentlyContinue}
            if($svc -and -not $svc.HasExited){Stop-Process -Id $svc.Id -Force -ErrorAction SilentlyContinue}
          }
