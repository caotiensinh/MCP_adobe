name: Discovery readiness targeted

on:
  push:
    branches: [feat/discovery-readiness-metadata]

permissions:
  contents: read

jobs:
  discovery-readiness:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Setup Python
        shell: powershell
        run: uv python install 3.12
      - name: Install
        shell: powershell
        run: uv sync --python 3.12
      - name: Discovery readiness contract tests
        shell: powershell
        run: uv run python -m unittest tests.test_discovery_readiness_metadata tests.test_server -v
