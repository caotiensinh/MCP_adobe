name: Targeted Photoshop 24 UXP compatibility

on:
  pull_request:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-photoshop-core-ps24.yml"
      - "scripts/probe_photoshop_core_live.cjs"

concurrency:
  group: targeted-photoshop-core-ps24-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-ps24:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '20'

      - name: Locate running Photoshop 24 host
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $p=Get-Process -Name Photoshop -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          if(-not $p){throw 'Photoshop is not running'}
          $vi=(Get-Item -LiteralPath $p.Path).VersionInfo
          $version=([regex]::Match($vi.ProductVersion,'\d+\.\d+(?:\.\d+)?')).Value
          if(-not $version){throw "Cannot parse Photoshop version from $($vi.ProductVersion)"}
          Write-Host "PHOTOSHOP_EXE=$($p.Path)"
          Write-Host "PHOTOSHOP_VERSION=$version"
          Write-Host "PHOTOSHOP_SESSION=$($p.SessionId)"
          if(-not $version.StartsWith('24.')){throw "Expected live Photoshop 24.x host, got $version"}
          "PHOTOSHOP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'PHOTOSHOP_24_PROCESS_VERIFY=PASS'

      - name: Checkout pinned PS24-compatible upstream
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dst=Join-Path $env:RUNNER_TEMP 'core-photoshop-mcp'
          if(Test-Path $dst){Remove-Item -Recurse -Force $dst}
          git clone https://github.com/CORE-Automate-WSS/photoshop-mcp.git $dst
          git -C $dst checkout --detach 586b66499852c801bcdb3b718c036f16f043c1d7
          $actual=(git -C $dst rev-parse HEAD).Trim()
          if($actual -ne '586b66499852c801bcdb3b718c036f16f043c1d7'){throw 'CORE upstream pin mismatch'}
          $manifest=Join-Path $dst 'packages\ps-uxp-bridge\manifest.json'
          $json=Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          $min=[version]$json.host[0].minVersion
          if($min -gt [version]'24.0.0'){throw "Pinned upstream no longer supports Photoshop 24: minVersion=$min"}
          # Test-only convenience: once the panel is opened, connect automatically.
          $main=Join-Path $dst 'packages\ps-uxp-bridge\main.js'
          $src=Get-Content -LiteralPath $main -Raw
          $needle='  log("MCP Bridge initialized");'
          if(-not $src.Contains($needle)){throw 'Cannot instrument upstream panel auto-connect hook'}
          $src=$src.Replace($needle, $needle+"`r`n  setTimeout(connect, 500);")
          [IO.File]::WriteAllText($main,$src,(New-Object Text.UTF8Encoding($false)))
          "CORE_ROOT=$dst" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CORE_PANEL=$(Join-Path $dst 'packages\ps-uxp-bridge')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CORE_SERVER_DIR=$(Join-Path $dst 'packages\mcp-server')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CORE_HEAD=$actual"
          Write-Host "CORE_MANIFEST_MIN_VERSION=$min"
          Write-Host 'CORE_PS24_COMPAT_DECLARATION=PASS'

      - name: Build pinned upstream server dependencies
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:CORE_SERVER_DIR
          try {
            npm install --no-audit --no-fund
            if($LASTEXITCODE -ne 0){throw 'CORE npm install failed'}
            npm run build
            if($LASTEXITCODE -ne 0){throw 'CORE npm build failed'}
            npm test -- --run
            if($LASTEXITCODE -ne 0){throw 'CORE tests failed'}
          } finally { Pop-Location }
          Write-Host 'CORE_BUILD_TEST=PASS'

      - name: Install official Adobe UXP CLI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $cli=Join-Path $env:RUNNER_TEMP 'uxp-cli-ps24'
          if(Test-Path $cli){Remove-Item -Recurse -Force $cli}
          New-Item -ItemType Directory -Force -Path $cli | Out-Null
          Push-Location $cli
          try {
            npm init -y | Out-Null
            npm install --no-audit --no-fund --ignore-scripts tar@6.2.1 @adobe/uxp-devtools-cli@1.2.0
            if($LASTEXITCODE -ne 0){throw 'UXP CLI install failed'}
            $helperSetup=Join-Path $cli 'node_modules\@adobe\uxp-devtools-helper\scripts\devtools_setup.js'
            node $helperSetup
            if($LASTEXITCODE -ne 0){throw 'UXP native helper setup failed'}
            $uxp=Join-Path $cli 'node_modules\.bin\uxp.cmd'
            if(-not (Test-Path -LiteralPath $uxp)){throw "UXP CLI missing: $uxp"}
            "UXP_CLI=$uxp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally { Pop-Location }
          Write-Host 'UXP_CLI_INSTALL=PASS'

      - name: Enable UXP Developer Tools
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $stdout=Join-Path $env:RUNNER_TEMP 'uxp-enable.out.log'
          $stderr=Join-Path $env:RUNNER_TEMP 'uxp-enable.err.log'
          Remove-Item -Force $stdout,$stderr -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath $env:UXP_CLI -ArgumentList @('devtools','enable') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try { Wait-Process -Id $p.Id -Timeout 45 -ErrorAction Stop } catch {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if(Test-Path $stdout){Get-Content $stdout -Raw}
            if(Test-Path $stderr){Get-Content $stderr -Raw}
            throw 'UXP devtools enable timed out; interactive OS credential approval may be required'
          }
          if(Test-Path $stdout){Get-Content $stdout -Raw}
          if(Test-Path $stderr){Get-Content $stderr -Raw}
          if($p.ExitCode -ne 0){throw "uxp devtools enable failed rc=$($p.ExitCode)"}
          Write-Host 'UXP_DEVTOOLS_ENABLE=PASS'

      - name: Start UXP service and discover Photoshop 24
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'uxp-service-ps24.log'
          Remove-Item -Force $log -ErrorAction SilentlyContinue
          $cmd="`"$env:UXP_CLI`" service start > `"$log`" 2>&1"
          $svc=Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/s','/c',$cmd) -PassThru -WindowStyle Hidden
          "UXP_SERVICE_PID=$($svc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $deadline=[DateTime]::UtcNow.AddSeconds(60)
          $ready=$false
          do {
            Start-Sleep -Seconds 2
            & $env:UXP_CLI apps list
            if($LASTEXITCODE -eq 0){$ready=$true;break}
            if($svc.HasExited){break}
          } while([DateTime]::UtcNow -lt $deadline)
          if(Test-Path $log){Get-Content -LiteralPath $log -Raw}
          if(-not $ready){throw 'UXP service/host discovery did not become ready'}
          Write-Host 'PHOTOSHOP_24_UXP_DISCOVERY=PASS'

      - name: Start live bridge probe
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'photoshop-core-probe'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "PHOTOSHOP_PROBE_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $stdout=Join-Path $env:RUNNER_TEMP 'ps24-probe.out.log'
          $stderr=Join-Path $env:RUNNER_TEMP 'ps24-probe.err.log'
          Remove-Item -Force $stdout,$stderr -ErrorAction SilentlyContinue
          $p=Start-Process -FilePath node -ArgumentList @((Join-Path $env:GITHUB_WORKSPACE 'scripts\probe_photoshop_core_live.cjs')) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          "PHOTOSHOP_PROBE_PID=$($p.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PHOTOSHOP_PROBE_STDOUT=$stdout" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PHOTOSHOP_PROBE_STDERR=$stderr" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Start-Sleep -Seconds 2
          if($p.HasExited){
            if(Test-Path $stdout){Get-Content $stdout -Raw}
            if(Test-Path $stderr){Get-Content $stderr -Raw}
            throw "Photoshop bridge probe exited early rc=$($p.ExitCode)"
          }
          Write-Host 'PHOTOSHOP_CORE_PROBE_STARTED=PASS'

      - name: Load PS24-compatible UXP panel
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & $env:UXP_CLI plugin load --manifest $env:CORE_PANEL --apps "PS@$env:PHOTOSHOP_VERSION"
          if($LASTEXITCODE -ne 0){throw "UXP plugin load failed rc=$LASTEXITCODE"}
          Write-Host 'PHOTOSHOP_24_UXP_PLUGIN_LOAD=PASS'
          Write-Host 'If the probe is waiting, open Photoshop > Plugins > MCP Bridge once; the test copy auto-connects.'

      - name: Wait for live create save export verification
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pid=[int]$env:PHOTOSHOP_PROBE_PID
          $deadline=[DateTime]::UtcNow.AddSeconds(190)
          do {
            Start-Sleep -Seconds 2
            $p=Get-Process -Id $pid -ErrorAction SilentlyContinue
            if(-not $p){break}
          } while([DateTime]::UtcNow -lt $deadline)
          $p=Get-Process -Id $pid -ErrorAction SilentlyContinue
          if($p){Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue; $timedOut=$true}else{$timedOut=$false}
          if(Test-Path $env:PHOTOSHOP_PROBE_STDOUT){Get-Content $env:PHOTOSHOP_PROBE_STDOUT -Raw}
          if(Test-Path $env:PHOTOSHOP_PROBE_STDERR){Get-Content $env:PHOTOSHOP_PROBE_STDERR -Raw}
          if($timedOut){throw 'Photoshop live probe timed out'}
          $text=''
          if(Test-Path $env:PHOTOSHOP_PROBE_STDOUT){$text=Get-Content $env:PHOTOSHOP_PROBE_STDOUT -Raw}
          if($text -notmatch 'PHOTOSHOP_24_LIVE_OPERATION_VERIFY=PASS'){throw 'Photoshop live operation verification marker missing'}
          Write-Host 'PHOTOSHOP_24_PRODUCTION_CANDIDATE=PASS'

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          if($env:PHOTOSHOP_PROBE_PID){Stop-Process -Id ([int]$env:PHOTOSHOP_PROBE_PID) -Force -ErrorAction SilentlyContinue}
          if($env:UXP_SERVICE_PID){Stop-Process -Id ([int]$env:UXP_SERVICE_PID) -Force -ErrorAction SilentlyContinue}
