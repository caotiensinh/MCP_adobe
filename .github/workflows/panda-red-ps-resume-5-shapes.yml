name: Kung Fu Panda 4 Photoshop live two vector curves to five native layers
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-ps-resume-5-shapes.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  vector:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v4
      - name: Safely inspect exact Photoshop process and immutable 3-shape checkpoint
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO'){throw 'RED_PS_VECTOR_WRONG_RUNNER'}
          if([System.Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'RED_PS_VECTOR_WRONG_DESKTOP'}
          $p=@(Get-Process -Name Photoshop -ErrorAction SilentlyContinue|Where-Object{$_.SessionId -eq 1 -and $_.MainWindowHandle -ne 0})
          if($p.Count -ne 1){throw 'RED_PS_VECTOR_GUI_OWNER_NOT_UNIQUE'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $src=Join-Path $root 'MCP_KFP4_Red_PS_38147544140_3shapes.psd'
          if(-not(Test-Path -LiteralPath $src -PathType Leaf)){throw 'RED_PS_VECTOR_SOURCE_NOT_PRESENT'}
          $sha=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash
          if($sha -ne '9396E3F3A0F3CABBC1BC279524FAFA8B3E6EE08F192CCC56A34CC53FC5AC618E'){
            throw 'RED_PS_VECTOR_SOURCE_CHANGED'}
          Write-Host "RED_PS_VECTOR_SOURCE=PASS pid=$($p[0].Id) bytes=$((Get-Item $src).Length) sha256=$sha"
      - name: Run two bounded single-shape high-risk-authorized native strokes and persist
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          uv run --python 3.12 python -m py_compile scripts/panda_red_photoshop_resume_5shapes.py scripts/panda_red_photoshop_vector_fill.py
          if($LASTEXITCODE -ne 0){throw 'RED_PS_VECTOR_COMPILATION_FAILED'}
          uv run --python 3.12 python scripts/panda_red_photoshop_resume_5shapes.py
          if($LASTEXITCODE -ne 0){throw 'RED_PS_NATIVE_VECTOR_OUTCOME_NOT_VERIFIED_NO_RETRY'}
      - name: Persist real Photoshop PSD and PNG artifacts only when present
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $folder=Join-Path $PWD 'red_ps_vector'
          New-Item -ItemType Directory -Force $folder|Out-Null
          foreach($ext in @('psd','png')){
            $src=Join-Path $env:USERPROFILE "Documents\MCPAdobe\MCP_KFP4_Red_PS_$env:GITHUB_RUN_ID" + "_5shapes.$ext"
            # Use explicit per-run filename, not wildcard.
            $src=Join-Path (Join-Path $env:USERPROFILE 'Documents\MCPAdobe') ("MCP_KFP4_Red_PS_{0}_5shapes.{1}" -f $env:GITHUB_RUN_ID,$ext)
            if(Test-Path -LiteralPath $src -PathType Leaf){
              $dst=Join-Path $folder ("red_poster_five.{0}" -f $ext)
              Copy-Item -LiteralPath $src -Destination $dst -ErrorAction Stop
              $original=(Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash
              $artifact=(Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash
              if($original -ne $artifact){throw 'RED_PS_VECTOR_ARTIFACT_SHA_MISMATCH'}
              Write-Host "RED_PS_VECTOR_NATIVE_ARTIFACT=$ext bytes=$((Get-Item $src).Length) sha256=$original"
            }else{Write-Host "RED_PS_VECTOR_ARTIFACT_MISSING=$ext"}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kung-fu-red-photoshop-five-native-strokes
          path: red_ps_vector/*
          if-no-files-found: warn
          retention-days: 14
