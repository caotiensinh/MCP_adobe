name: Mode 2 XD revert dirty disposable to verified saved native
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  revert:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Revert sole disposable XD document once, verifying 33-node clean native baseline
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $hash='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          $files=@('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd','mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd')
          foreach($rel in $files){if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $hash){throw 'MODE2_REVERT_NATIVE_DISK_MISMATCH'}}
          $marker=Join-Path $root 'mode2-disposable-native\Mode2_OneTime_RevertDirtyToSaved.marker'
          if(Test-Path -LiteralPath $marker){throw 'MODE2_REVERT_PREVIOUSLY_REQUESTED_NO_REPLAY'}
          if(@(Get-Process -Name Illustrator,Photoshop,PickerHost -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_FOREIGN_ADOBE_APP'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $scope=[System.Windows.Automation.TreeScope]::Children
          $desc=[System.Windows.Automation.TreeScope]::Descendants
          $cond=[System.Windows.Automation.Condition]::TrueCondition
          $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
          $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_REVERT_FOREIGN_WINDOW'}
          $win=$test[0]
          $wp=$win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
          if($wp.Current.WindowVisualState -eq [System.Windows.Automation.WindowVisualState]::Minimized){
            $wp.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Normal)
          }
          try{$win.SetFocus()}catch{}
          Start-Sleep -Seconds 1
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          @'
          import asyncio,json
          from mcp import Client
          from scripts.export_region_metadata import payload,unwrap
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  result={}
                  for name in ("creative.health","creative.scenegraph.list","creative.selection.get"):
                      r=await asyncio.wait_for(c.call_tool("creative_read",{"application":"xd","capability":name,"arguments":{}}),timeout=15)
                      o=unwrap(payload(r))
                      if isinstance(o,dict) and isinstance(o.get("result"),dict):o=unwrap(o["result"])
                      result[name]=o
                  h,g,s=(result[x] for x in ("creative.health","creative.scenegraph.list","creative.selection.get"))
                  if (h.get("bridge_build")!="xd-ellipse-radius-geometry-v4" or h.get("pending_count")!=0 or
                      g.get("complete") is not True or g.get("node_count")!=33 or
                      g.get("document_id")!="98d6635b-3767-4254-b200-ec8442b69ad2"):
                      raise RuntimeError("MODE2_DISPOSABLE_LIVE_GRAPH_NOT_SAFE_TO_REVERT")
                  print("MODE2_REVERT_PRECHECK_LIVE=PASS selected="+str(len(s.get("items",[]))),flush=True)
          asyncio.run(main())
          '@|Set-Content -LiteralPath .\mode2_pre_revert_once.py -Encoding UTF8
          uv run --python 3.12 python .\mode2_pre_revert_once.py
          if($LASTEXITCODE -ne 0){throw 'MODE2_REVERT_PRECHECK_MCP_FAILED'}
          $aid=[System.Windows.Automation.AutomationElement]::AutomationIdProperty
          # XD can auto-minimize while the separate MCP readback process runs.
          # Re-attest and restore the sole disposable window immediately before UIA.
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Mode2RevertForeground {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          '@
          $file=$null
          for($attempt=1;$attempt -le 20;$attempt++){
            $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
            $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
            $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
            if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_WINDOW_CHANGED_DURING_REVERT'}
            $win=$test[0]
            try{
              $wp=$win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
              if($wp.Current.WindowVisualState -eq [System.Windows.Automation.WindowVisualState]::Minimized){
                $wp.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Normal)
              }
            }catch{if($attempt -eq 1){Write-Host "MODE2_WP_PROBE_EXCEPTION=$($_.Exception.GetType().Name)"}}
            try{$win.SetFocus()}catch{if($attempt -eq 1){Write-Host "MODE2_SETFOCUS_EXCEPTION=$($_.Exception.GetType().Name)"}}
            try{[void][Mode2RevertForeground]::SetForegroundWindow([IntPtr]$win.Current.NativeWindowHandle)}catch{}
            Start-Sleep -Milliseconds 650
            try{$file=$win.FindFirst($desc,(New-Object System.Windows.Automation.PropertyCondition($aid,'AppMenu_File')))}catch{$file=$null}
            if($attempt -eq 1 -or $attempt -eq 10){
              $total=0;try{$total=$win.FindAll($desc,$cond).Count}catch{}
              Write-Host "MODE2_REVERT_UIA_ATTEMPT=$attempt CONTROLS=$total"
            }
            if($file){Write-Host "MODE2_REVERT_MENU_READY_ATTEMPT=$attempt";break}
          }
          if(-not $file){throw 'MODE2_REVERT_FILE_MENU_UNAVAILABLE'}
          $xp=$file.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
          $xp.Expand();Start-Sleep -Milliseconds 250
          $nodes=$win.FindAll($desc,$cond)
          $revert=@($nodes|Where-Object {[string]$_.Current.AutomationId -eq 'AppMenu_RevertToSaved' -and [string]$_.Current.Name -eq 'Revert to Saved' -and $_.Current.IsEnabled})
          $save=@($nodes|Where-Object {[string]$_.Current.AutomationId -eq 'AppMenu_Save' -and $_.Current.IsEnabled})
          Write-Host "MODE2_EXACT_REVERT_COUNT=$($revert.Count) EXACT_ACTIVE_SAVE=$($save.Count)"
          if($revert.Count -ne 1 -or $save.Count -ne 1){throw 'MODE2_REVERT_NOT_EXACT_DIRTY_DOCUMENT'}
          "run=$env:GITHUB_RUN_ID time=$([DateTime]::UtcNow.ToString('o'))" | Set-Content -LiteralPath $marker -Encoding ASCII -NoNewline
          $revert[0].GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          Write-Host 'MODE2_DISPOSABLE_REVERT_MENU_INVOKED_ONCE'
          Start-Sleep -Seconds 3
          $windows=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
          $popup=@($windows|Where-Object {[string]$_.Current.Name -match 'Revert|Confirm|Discard|Save changes'})
          foreach($w in $popup|Select-Object -First 6){Write-Host "MODE2_REVERT_MODAL_NAME=$([string]$w.Current.Name)"}
          if($popup.Count -gt 0){throw 'MODE2_REVERT_CONFIRMATION_PRESENT_NO_AUTOMATIC_CONFIRM'}
          foreach($rel in $files){if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $hash){throw 'MODE2_NATIVE_CHANGED_AFTER_REVERT'}}
          Write-Host 'MODE2_NATIVE_SOURCE_FILES_PRESERVED=PASS'
          Write-Host 'MODE2_REVERT_REQUESTED=PASS_POST_REVERT_HOST_READBACK_REQUIRED'
