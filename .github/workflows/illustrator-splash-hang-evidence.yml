name: Illustrator splash hang Windows evidence
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/illustrator-splash-hang-evidence.yml"]
permissions:
  contents: read
concurrency:
  group: illustrator-desktop-exclusive
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Inspect process chain and recent relevant Windows app events
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $p=Get-CimInstance Win32_Process -Filter "Name='Illustrator.exe'"|Select-Object -First 1
          if($p){
            Write-Output "SPLASH_PID=$($p.ProcessId) SESSION=$($p.SessionId) START=$($p.CreationDate.ToString('o'))"
            $pp=Get-CimInstance Win32_Process -Filter "ProcessId=$($p.ParentProcessId)"
            Write-Output "SPLASH_PARENT=$($pp.Name) PID=$($p.ParentProcessId)"
          }
          $since=(Get-Date).AddMinutes(-25)
          $events=@(Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=$since} -ErrorAction SilentlyContinue |
             Where-Object {$_.ProviderName -match 'Application Error|Application Hang|Windows Error Reporting|Adobe' -and $_.Message -match 'Illustrator|Adobe|CEP|InDesign'}|Select-Object -First 12)
          foreach($e in $events){
            $msg=([string]$e.Message) -replace '[\r\n]+',' '
            if($msg.Length -gt 700){$msg=$msg.Substring(0,700)}
            Write-Output "SPLASH_EVENT id=$($e.Id) provider=$($e.ProviderName) time=$($e.TimeCreated.ToString('o')) message=$msg"
          }
          Write-Output "SPLASH_EVENT_COUNT=$($events.Count)"
