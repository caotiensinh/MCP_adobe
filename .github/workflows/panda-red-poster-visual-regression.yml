name: Red Kung Fu Panda Adobe export visual gate unit regression
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths:
      - scripts/panda_red_poster_visual_acceptance.py
      - tests/test_panda_red_visual_acceptance.py
      - .github/workflows/panda-red-poster-visual-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimum visual test dependency
        run: python -m pip install pillow
      - name: Check syntax and positive negative boundary regressions
        run: |
          python -m py_compile scripts/panda_red_poster_visual_acceptance.py tests/test_panda_red_visual_acceptance.py
          python -m unittest tests.test_panda_red_visual_acceptance -v
