name: Readiness targeted

on:
  push:
    branches: [feat/application-readiness-preflight]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false
      - name: Setup Python
        shell: powershell
        run: uv python install 3.12
      - name: Install
        shell: powershell
        run: uv sync --python 3.12
      - name: Targeted readiness tests
        shell: powershell
        run: uv run python -m unittest tests.test_application_readiness -v
