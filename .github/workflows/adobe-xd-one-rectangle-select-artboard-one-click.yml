name: Adobe XD one rectangle select target artboard once only
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/adobe-xd-one-rectangle-select-artboard-one-click.yml"]
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  select_artboard:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Select visible pixel-confirmed white interior of red XD native artboard once
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'XD_SELECT_WRONG_DESKTOP'}
          foreach($app in @('Illustrator','Photoshop')){
            if(@(Get-Process -Name $app -ErrorAction SilentlyContinue).Count -ne 0){throw "XD_SELECT_SERIAL_ISOLATION_VIOLATION_$app"}
          }
          $rootDir=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          foreach($pair in @(
            @('MCP_Mode1_Panda_XD_38136531800.xd','3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'),
            @('MCP_KFP4_Red_XD_38205166138.xd','58966788CF369885C2395CE217D6E0443ED57BCD7F40BD550B2F3A24C2B5B831'))) {
            if((Get-FileHash -LiteralPath (Join-Path $rootDir $pair[0]) -Algorithm SHA256).Hash -ne $pair[1]){throw 'XD_SELECT_PROTECTED_NATIVE_CHANGED'}
          }
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;using System.Runtime.InteropServices;
          public static class XdArtboardClick {
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags,uint x,uint y,uint data,UIntPtr extra);
          }
          '@
          $root=[System.Windows.Automation.AutomationElement]::RootElement
          $top=$root.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $red=@($top|Where-Object {[string]$_.Current.Name -match '^MCP_KFP4_Red_XD_38205166138.*Adobe XD$' -and [string]$_.Current.ClassName -eq 'ApplicationFrameWindow'})
          $foreign=@($top|Where-Object {[string]$_.Current.Name -match '^Untitled.*Adobe XD$|^MCP_Mode1_Panda_XD_38136531800.*Adobe XD$'})
          $pickers=@(Get-Process -Name PickerHost -ErrorAction SilentlyContinue|Where-Object{$_.SessionId -eq 1})
          if($red.Count -ne 1 -or $foreign.Count -gt 0 -or $pickers.Count -ne 0){throw 'XD_SELECT_DOCUMENT_OR_PICKER_AMBIGUOUS'}
          $h=[IntPtr]$red[0].Current.NativeWindowHandle
          $core=@($red[0].FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)|
            Where-Object{[string]$_.Current.ClassName -eq 'Windows.UI.Core.CoreWindow'})
          if($core.Count -ne 1){throw 'XD_SELECT_COREWINDOW_NOT_UNIQUE'}
          $cond=New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty,'canvasView')
          $canvases=$core[0].FindAll([System.Windows.Automation.TreeScope]::Descendants,$cond)
          if($canvases.Count -ne 1){throw 'XD_SELECT_CANVAS_NOT_UNIQUE'}
          $canvas=$canvases[0].Current.BoundingRectangle
          if($canvas.Width -lt 150 -or $canvas.Height -lt 150){throw 'XD_SELECT_CANVAS_TOO_SMALL'}
          [void][XdArtboardClick]::SetForegroundWindow($h)
          Start-Sleep -Milliseconds 400
          if([XdArtboardClick]::GetForegroundWindow() -ne $h){throw 'XD_SELECT_NOT_FOREGROUND'}
          $candidates=New-Object System.Collections.Generic.List[object]
          foreach($monitor in [System.Windows.Forms.Screen]::AllScreens){
            $b=$monitor.Bounds
            $left=[int][Math]::Ceiling([Math]::Max($b.Left,$canvas.Left+24))
            $topPx=[int][Math]::Ceiling([Math]::Max($b.Top,$canvas.Top+24))
            $right=[int][Math]::Floor([Math]::Min($b.Right,$canvas.Right-24))
            $bottom=[int][Math]::Floor([Math]::Min($b.Bottom,$canvas.Bottom-24))
            $width=$right-$left;$height=$bottom-$topPx
            if($width -lt 100 -or $height -lt 100){continue}
            $bmp=New-Object System.Drawing.Bitmap($width,$height)
            $g=[System.Drawing.Graphics]::FromImage($bmp)
            try{
              $g.CopyFromScreen($left,$topPx,0,0,(New-Object System.Drawing.Size($width,$height)))
              for($y=34;$y -lt ($height-34);$y+=16){
                for($x=34;$x -lt ($width-34);$x+=16){
                  $ok=$true
                  foreach($offset in @(@(0,0),@(-25,0),@(25,0),@(0,-25),@(0,25),@(-20,-20),@(20,20))){
                    $px=$bmp.GetPixel($x+$offset[0],$y+$offset[1])
                    if($px.R -lt 247 -or $px.G -lt 247 -or $px.B -lt 247){$ok=$false;break}
                  }
                  if($ok){
                    $candidates.Add([pscustomobject]@{X=$left+$x;Y=$topPx+$y;Monitor=$monitor.DeviceName})
                  }
                }
              }
            }finally{$g.Dispose();$bmp.Dispose()}
          }
          Write-Host "XD_RECT_WHITE_CANVAS_INTERIOR_CANDIDATES=$($candidates.Count)"
          if($candidates.Count -lt 3){throw 'XD_RECT_NO_UNAMBIGUOUS_VISIBLE_WHITE_ARTBOARD'}
          $selection=@($candidates|Select-Object -Skip ([int][Math]::Floor($candidates.Count/2)) -First 1)[0]
          $x=[int]$selection.X;$y=[int]$selection.Y
          if($x -lt $canvas.Left+25 -or $x -gt $canvas.Right-25 -or
             $y -lt $canvas.Top+25 -or $y -gt $canvas.Bottom-25){throw 'XD_RECT_SELECTED_POINT_OUT_OF_CANVAS'}
          if([XdArtboardClick]::GetForegroundWindow() -ne $h){throw 'XD_RECT_LOST_FOREGROUND_NO_CLICK'}
          if(-not[XdArtboardClick]::SetCursorPos($x,$y)){throw 'XD_RECT_CURSOR_POSITION_FAILED'}
          [XdArtboardClick]::mouse_event([uint32]2,[uint32]0,[uint32]0,[uint32]0,[UIntPtr]::Zero)
          [XdArtboardClick]::mouse_event([uint32]4,[uint32]0,[uint32]0,[uint32]0,[UIntPtr]::Zero)
          Write-Host "XD_RECT_ARTBOARD_PIXEL_SELECT_ONCE=PASS x=$x y=$y"
          foreach($pair in @(
            @('MCP_Mode1_Panda_XD_38136531800.xd','3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'),
            @('MCP_KFP4_Red_XD_38205166138.xd','58966788CF369885C2395CE217D6E0443ED57BCD7F40BD550B2F3A24C2B5B831'))) {
            if((Get-FileHash -LiteralPath (Join-Path $rootDir $pair[0]) -Algorithm SHA256).Hash -ne $pair[1]){throw 'XD_SELECT_FILE_HASH_CHANGED'}
          }
      - name: Read back XD insertion parent after ONE selection, never draw here
        shell: powershell
        env:
          UV_LINK_MODE: copy
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          $script=Join-Path $env:RUNNER_TEMP 'xd_rect_selection_readonly.py'
          @'
          import asyncio,time,json
          from mcp import Client
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  for cap in ("creative.health","creative.selection.get","creative.document.info","creative.scenegraph.list"):
                      start=time.perf_counter()
                      r=await asyncio.wait_for(c.call_tool("creative_read",{"application":"xd","capability":cap,"arguments":{}}),timeout=9)
                      d=r.structured_content or {}
                      print("XD_RECT_CLICK_READ="+json.dumps({"cap":cap,"ok":d.get("ok"),"is_error":r.is_error,
                         "elapsed_ms":round((time.perf_counter()-start)*1000,2),
                         "result":d.get("result")},default=str)[:4200],flush=True)
                      if r.is_error or d.get("ok") is not True:raise RuntimeError("XD_RECT_SELECTION_READ_FAILED "+cap)
          asyncio.run(main())
          '@|Set-Content -LiteralPath $script -Encoding UTF8
          uv run --no-project --with 'mcp>=2,<3' --python 3.12 python $script
          if($LASTEXITCODE -ne 0){throw 'XD_RECT_SELECTION_DIAGNOSTIC_FAILED'}
