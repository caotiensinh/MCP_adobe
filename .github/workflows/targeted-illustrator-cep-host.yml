name: Targeted Illustrator CEP host diagnostics

on:
  push:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-illustrator-cep-host.yml"

concurrency:
  group: targeted-illustrator-cep-host-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cep-host:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect CEP host configuration and logs
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          Write-Host "USER=$env:USERDOMAIN\\$env:USERNAME"
          Write-Host "PROFILE=$env:USERPROFILE"
          Write-Host "APPDATA=$env:APPDATA"
          Write-Host "LOCALAPPDATA=$env:LOCALAPPDATA"
          Write-Host "SESSION_ID=$([Diagnostics.Process]::GetCurrentProcess().SessionId)"

          Write-Host '=== CSXS registry keys ==='
          foreach($key in @(
            'HKCU:\Software\Adobe\CSXS.9',
            'HKCU:\Software\Adobe\CSXS.10',
            'HKCU:\Software\Adobe\CSXS.11',
            'HKCU:\Software\Adobe\CSXS.12'
          )) {
            Write-Host "KEY=$key EXISTS=$(Test-Path $key)"
            if(Test-Path $key){Get-ItemProperty $key -ErrorAction SilentlyContinue | Format-List *}
          }

          Write-Host '=== CEP extension locations ==='
          $locations=@(
            (Join-Path $env:APPDATA 'Adobe\CEP\extensions'),
            (Join-Path $env:ProgramFiles 'Common Files\Adobe\CEP\extensions'),
            (Join-Path ${env:ProgramFiles(x86)} 'Common Files\Adobe\CEP\extensions')
          )
          foreach($loc in $locations) {
            Write-Host "LOCATION=$loc EXISTS=$(Test-Path -LiteralPath $loc)"
            if(Test-Path -LiteralPath $loc) {
              Get-ChildItem -LiteralPath $loc -Directory -ErrorAction SilentlyContinue |
                Select-Object FullName | Format-Table -AutoSize
            }
          }

          $panel=Join-Path $env:APPDATA 'Adobe\CEP\extensions\com.illustrator.mcp.panel'
          $manifest=Join-Path $panel 'CSXS\manifest.xml'
          Write-Host "PANEL=$panel EXISTS=$(Test-Path -LiteralPath $panel)"
          Write-Host "MANIFEST=$manifest EXISTS=$(Test-Path -LiteralPath $manifest)"
          if(Test-Path -LiteralPath $manifest){Get-Content -LiteralPath $manifest -Raw}

          Write-Host '=== Resolve and restart Illustrator ==='
          $p=Get-Process -Name Illustrator -ErrorAction SilentlyContinue | Where-Object {$_.Path} | Select-Object -First 1
          $target=$null
          if($p){$target=$p.Path}
          if(-not $target) {
            $shell=New-Object -ComObject WScript.Shell
            $roots=@((Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs'),(Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'))
            foreach($root in $roots) {
              if(-not (Test-Path -LiteralPath $root)){continue}
              foreach($lnk in @(Get-ChildItem -LiteralPath $root -Recurse -Filter '*.lnk' -File -ErrorAction SilentlyContinue | Where-Object {$_.Name -match 'Illustrator'})) {
                $candidate=$shell.CreateShortcut($lnk.FullName).TargetPath
                if($candidate -and (Test-Path -LiteralPath $candidate -PathType Leaf)){$target=$candidate;break}
              }
              if($target){break}
            }
          }
          if(-not $target){throw 'Illustrator executable not found'}
          Write-Host "ILLUSTRATOR_EXE=$target"
          Get-Process -Name Illustrator,CEPHtmlEngine -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Start-Process -FilePath $target | Out-Null
          Start-Sleep -Seconds 20

          Write-Host '=== Adobe host processes after restart ==='
          Get-Process -Name Illustrator,CEPHtmlEngine -ErrorAction SilentlyContinue |
            Select-Object ProcessName,Id,SessionId,Path | Format-Table -AutoSize

          Write-Host '=== Targeted CEP/CSXS log locations ==='
          $logDirs=@(
            (Join-Path $env:LOCALAPPDATA 'Temp\CEPHtmlEngine'),
            (Join-Path $env:LOCALAPPDATA 'Adobe\CEP'),
            (Join-Path $env:LOCALAPPDATA 'Adobe\CSXS'),
            (Join-Path $env:APPDATA 'Adobe\CEP'),
            (Join-Path $env:APPDATA 'Adobe\CSXS')
          )
          foreach($dir in $logDirs) {
            Write-Host "LOGDIR=$dir EXISTS=$(Test-Path -LiteralPath $dir)"
            if(Test-Path -LiteralPath $dir) {
              Get-ChildItem -LiteralPath $dir -Recurse -File -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 20 FullName,Length,LastWriteTime |
                Format-Table -AutoSize
            }
          }
