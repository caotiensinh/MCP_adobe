name: AI XD PS single rectangle stage 1 start only Illustrator and measure connection
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/adobe-ai-rectangle-start-single-isolated-host.yml"]
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  ai_launch:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Launch only Illustrator once from empty Adobe Session 1 and time window readiness
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'AI_RECT_LAUNCH_WRONG_HOST'}
          foreach($name in @('Illustrator','XD','Photoshop')){
            if(@(Get-Process -Name $name -ErrorAction SilentlyContinue).Count -ne 0){throw "AI_RECT_LAUNCH_NONEMPTY_APP_$name"}
          }
          $exe='D:\Ilustrator\Adobe Illustrator 2023\Support Files\Contents\Windows\Illustrator.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'AI_RECT_EXE_MISSING'}
          $out=Join-Path $env:RUNNER_TEMP 'adobe_one_rect_ai'
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          $ms=[Diagnostics.Stopwatch]::StartNew()
          $tracking=$env:RUNNER_TRACKING_ID
          try{
            Remove-Item Env:RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
            $opened=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -ErrorAction Stop
          }finally{
            if($null -ne $tracking){$env:RUNNER_TRACKING_ID=$tracking}
          }
          Write-Host "AI_RECT_PROCESS_LAUNCH_ONCE=PASS pid=$($opened.Id)"
          $deadline=(Get-Date).AddSeconds(38)
          $windowReady=$false
          do{
            Start-Sleep -Seconds 2
            $a=@(Get-Process -Name Illustrator -ErrorAction SilentlyContinue|Where-Object{$_.SessionId -eq 1})
            $others=@(Get-Process -Name XD,Photoshop -ErrorAction SilentlyContinue)
            if($others.Count -gt 0){throw 'AI_RECT_ISOLATION_VIOLATED_AFTER_START'}
            if($a.Count -eq 1 -and $a[0].MainWindowHandle -ne 0){$windowReady=$true;break}
            Write-Host "AI_RECT_LAUNCH_POLL elapsed_ms=$($ms.ElapsedMilliseconds) illustrator=$($a.Count) window=$(if($a.Count){$a[0].MainWindowHandle}else{0})"
          }until((Get-Date)-ge $deadline)
          $ms.Stop()
          $payload=[ordered]@{
            application='Illustrator'
            metric='process_start_to_MainWindowHandle'
            launch_ms=$ms.Elapsed.TotalMilliseconds
            user_session=1
            process_id=$opened.Id
            unique_window=$windowReady
            other_apps_running=0
            rectangle_created=$false
          }
          $payload|ConvertTo-Json|Set-Content -LiteralPath (Join-Path $out 'launch.json') -Encoding UTF8
          Write-Host "AI_RECT_LAUNCH_MEASURED_MS=$([Math]::Round($ms.Elapsed.TotalMilliseconds,2)) window_ready=$windowReady"
          if(-not $windowReady){throw 'AI_RECT_LAUNCH_WINDOW_NOT_READY_NO_RELAUNCH'}
      - name: Read Illustrator connection health once, never draw on uncertain state
        if: success()
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          $py=Join-Path $env:RUNNER_TEMP 'adobe_one_rect_ai\health.py'
          @'
          import asyncio,json,time
          from mcp import Client
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  t=time.perf_counter_ns()
                  x=await asyncio.wait_for(c.call_tool("creative_read",{"application":"illustrator",
                      "capability":"creative.health","arguments":{"probe":False,"timeout":5}}),timeout=11)
                  ms=(time.perf_counter_ns()-t)/1e6
                  p=x.structured_content or {}
                  d=((p.get("result") or {}).get("connection") or {}).get("data") or {}
                  exe=d.get("execution") or {}
                  layers=d.get("layers") or {}
                  proof={"health_ms":round(ms,3),"is_error":x.is_error,
                         "ok":p.get("ok"),"ready":d.get("ready"),"blockedAt":d.get("blockedAt"),
                         "unresolvedJobs":exe.get("unresolvedJobs"),
                         "panel":layers.get("panel"),"illustrator":layers.get("illustrator"),
                         "document":layers.get("document"),"rectangle_created":False}
                  print("AI_RECT_POST_LAUNCH_HEALTH="+json.dumps(proof,default=str)[:6000],flush=True)
                  if x.is_error or p.get("ok") is not True:print("AI_RECT_READY_FOR_MUTATION=NO_TOOL_ERROR",flush=True)
                  elif exe.get("unresolvedJobs") or d.get("blocking"):print("AI_RECT_READY_FOR_MUTATION=NO_FENCE",flush=True)
                  elif d.get("ready") is not True:print("AI_RECT_READY_FOR_MUTATION=NO_NOT_READY",flush=True)
                  else:print("AI_RECT_READY_FOR_MUTATION=CONDITIONALLY_YES_CHECK_DOCUMENT_NEXT",flush=True)
          asyncio.run(main())
          '@|Set-Content -LiteralPath $py -Encoding UTF8
          uv run --no-project --with 'mcp>=2,<3' --python 3.12 python $py
          if($LASTEXITCODE -ne 0){throw 'AI_RECT_HEALTH_READ_FAILED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adobe-serial-ai-start-timings
          path: ${{ runner.temp }}/adobe_one_rect_ai/launch.json
          if-no-files-found: warn
          retention-days: 14
