name: Targeted Adobe XD live bridge

on:
  push:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-xd-live.yml"
      - "scripts/probe_xd_live.py"
      - "src/mcp_adobe/xd.py"
      - "src/mcp_adobe/xd_bridge.py"
      - "adobe-xd-plugin/**"
      - "scripts/install_xd_plugin.ps1"

concurrency:
  group: targeted-xd-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-xd:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false

      - name: Prepare gateway environment
        shell: powershell
        run: |
          uv python install 3.12
          uv sync --python 3.12

      - name: Verify Adobe XD and sync bridge source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $xd=Get-Process -ErrorAction SilentlyContinue | Where-Object {
            $_.ProcessName -match '^XD$|AdobeXD|Adobe\.XD' -or ($_.Path -and $_.Path -match 'Adobe\.XD')
          } | Select-Object -First 1
          if(-not $xd){throw 'Adobe XD is not running in the interactive desktop session'}
          Write-Host "XD_PROCESS=PASS PID=$($xd.Id) SESSION=$($xd.SessionId)"

          $packagesRoot=Join-Path $env:LOCALAPPDATA 'Packages'
          $installedMain=Get-ChildItem -LiteralPath $packagesRoot -Directory -Filter 'Adobe.XD_*' -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'LocalState\develop\MCPAdobeBridge\main.js' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          $sourceMain=Join-Path $PWD 'adobe-xd-plugin\main.js'
          if(-not (Test-Path -LiteralPath $sourceMain)){throw 'XD bridge source main.js missing'}

          $needsInstall=$true
          if($installedMain){
            $sourceHash=(Get-FileHash -LiteralPath $sourceMain -Algorithm SHA256).Hash
            $installedHash=(Get-FileHash -LiteralPath $installedMain -Algorithm SHA256).Hash
            Write-Host "XD_SOURCE_SHA256=$sourceHash"
            Write-Host "XD_INSTALLED_SHA256=$installedHash"
            if($sourceHash -eq $installedHash){$needsInstall=$false}
          }

          if($needsInstall){
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install_xd_plugin.ps1 -NoReloadHint
            if($LASTEXITCODE -ne 0){throw 'Adobe XD bridge installation failed'}
            Write-Host 'XD_BRIDGE_SYNC=UPDATED'

            $shell=New-Object -ComObject WScript.Shell
            $activated=$shell.AppActivate([int]$xd.Id)
            if(-not $activated){$activated=$shell.AppActivate('Adobe XD')}
            if(-not $activated){throw 'Could not focus Adobe XD to reload development plugins'}
            Start-Sleep -Milliseconds 700
            $shell.SendKeys('^+r')
            Write-Host 'XD_DEV_PLUGIN_RELOAD=SENT'
            Start-Sleep -Seconds 3
          } else {
            Write-Host "XD_BRIDGE_SYNC=CURRENT main=$installedMain"
          }

      - name: Live XD bridge read plus approval write gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "Keep Plugins > MCP Adobe Bridge panel open in Adobe XD."
          Write-Host "When Pending approvals becomes 1, click Apply pending."
          uv run python scripts/probe_xd_live.py
          if($LASTEXITCODE -ne 0){throw 'Adobe XD live approval probe failed'}
