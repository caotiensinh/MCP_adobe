name: Targeted Adobe XD live bridge

on:
  push:
    branches: [fix/photoshop-path-override]
    paths:
      - ".github/workflows/targeted-xd-live.yml"
      - "scripts/probe_xd_live.py"
      - "src/mcp_adobe/xd.py"
      - "src/mcp_adobe/xd_bridge.py"
      - "adobe-xd-plugin/**"
      - "scripts/install_xd_plugin.ps1"

concurrency:
  group: targeted-xd-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live-xd:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.17'
          enable-cache: false

      - name: Prepare gateway environment
        shell: powershell
        run: |
          uv python install 3.12
          uv sync --python 3.12

      - name: Verify Adobe XD and sync bridge source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $xd=Get-Process -ErrorAction SilentlyContinue | Where-Object {
            $_.ProcessName -match '^XD$|AdobeXD|Adobe\.XD' -or ($_.Path -and $_.Path -match 'Adobe\.XD')
          } | Select-Object -First 1
          if(-not $xd){throw 'Adobe XD is not running in the interactive desktop session'}
          Write-Host "XD_PROCESS=PASS PID=$($xd.Id) SESSION=$($xd.SessionId)"

          $packagesRoot=Join-Path $env:LOCALAPPDATA 'Packages'
          $installedMain=Get-ChildItem -LiteralPath $packagesRoot -Directory -Filter 'Adobe.XD_*' -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'LocalState\develop\MCPAdobeBridge\main.js' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
            Select-Object -First 1
          $sourceMain=Join-Path $PWD 'adobe-xd-plugin\main.js'
          if(-not (Test-Path -LiteralPath $sourceMain)){throw 'XD bridge source main.js missing'}

          $needsInstall=$true
          if($installedMain){
            $sourceHash=(Get-FileHash -LiteralPath $sourceMain -Algorithm SHA256).Hash
            $installedHash=(Get-FileHash -LiteralPath $installedMain -Algorithm SHA256).Hash
            Write-Host "XD_SOURCE_SHA256=$sourceHash"
            Write-Host "XD_INSTALLED_SHA256=$installedHash"
            if($sourceHash -eq $installedHash){$needsInstall=$false}
          }

          if($needsInstall){
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install_xd_plugin.ps1 -NoReloadHint
            if($LASTEXITCODE -ne 0){throw 'Adobe XD bridge installation failed'}
            Write-Host 'XD_BRIDGE_SYNC=UPDATED'
          } else {
            Write-Host "XD_BRIDGE_SYNC=CURRENT main=$installedMain"
          }

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class Win32XdFocus {
            public delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumWindowsProc cb, IntPtr lp);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern int GetWindowTextLength(IntPtr hWnd);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int count);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
          }
          '@

          $windows = New-Object System.Collections.Generic.List[object]
          $callback = [Win32XdFocus+EnumWindowsProc]{
            param([IntPtr]$hWnd,[IntPtr]$lParam)
            if(-not [Win32XdFocus]::IsWindowVisible($hWnd)){ return $true }
            $len=[Win32XdFocus]::GetWindowTextLength($hWnd)
            if($len -le 0){ return $true }
            $sb=New-Object System.Text.StringBuilder ($len+1)
            [void][Win32XdFocus]::GetWindowText($hWnd,$sb,$sb.Capacity)
            [uint32]$windowPid=0
            [void][Win32XdFocus]::GetWindowThreadProcessId($hWnd,[ref]$windowPid)
            $title=$sb.ToString()
            $windows.Add([pscustomobject]@{Hwnd=$hWnd;Pid=$windowPid;Title=$title})
            return $true
          }
          [void][Win32XdFocus]::EnumWindows($callback,[IntPtr]::Zero)

          $target=$windows | Where-Object {
            $_.Pid -eq [uint32]$xd.Id -or $_.Title -match '(?i)Adobe XD|\bXD\b'
          } | Select-Object -First 1

          if(-not $target){
            Write-Host 'XD_WINDOW_CANDIDATES_BEGIN'
            $windows | ForEach-Object { Write-Host ("PID={0} HWND={1} TITLE={2}" -f $_.Pid,$_.Hwnd,$_.Title) }
            Write-Host 'XD_WINDOW_CANDIDATES_END'
            throw 'Could not find a visible Adobe XD top-level window'
          }

          [void][Win32XdFocus]::ShowWindow($target.Hwnd,9)
          $focused=[Win32XdFocus]::SetForegroundWindow($target.Hwnd)
          Write-Host ("XD_WINDOW_TARGET=PID={0} HWND={1} TITLE={2} FOCUSED={3}" -f $target.Pid,$target.Hwnd,$target.Title,$focused)
          if(-not $focused){throw 'SetForegroundWindow failed for Adobe XD'}
          Start-Sleep -Milliseconds 700
          $shell=New-Object -ComObject WScript.Shell
          $shell.SendKeys('^+r')
          Write-Host 'XD_DEV_PLUGIN_RELOAD=SENT'
          Start-Sleep -Seconds 3

      - name: Live XD bridge read plus approval write gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host "Keep Plugins > MCP Adobe Bridge panel open in Adobe XD."
          Write-Host "When Pending approvals becomes 1, click Apply pending."
          uv run python scripts/probe_xd_live.py
          if($LASTEXITCODE -ne 0){throw 'Adobe XD live approval probe failed'}
