name: Illustrator callback trace live acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/illustrator-callback-trace-live-acceptance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: illustrator-desktop-exclusive
  cancel-in-progress: false
jobs:
  trace:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run one guarded live CEP probe and correlate fresh callback
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object {$_}) -join ';'
          uv sync --python 3.12
          if($LASTEXITCODE -ne 0){throw 'DEPENDENCY_SETUP_FAIL'}
          @'
          import asyncio, json, os
          from pathlib import Path
          from mcp import Client

          TRACE=Path(os.environ["LOCALAPPDATA"])/"MCPAdobe"/"illustrator-mcp"/"callback_trace.log"

          def unpack(r):
              if r.is_error or not isinstance(r.structured_content,dict):
                  raise RuntimeError("MCP_TOOL_ERROR")
              p=r.structured_content
              d=p.get("result",{}).get("connection",{}).get("data",{})
              if not isinstance(d,dict) or not d:
                  raise RuntimeError("HEALTH_PAYLOAD_MISSING")
              return d

          async def health(c,probe):
              r=await c.call_tool("creative_read",{"application":"illustrator",
                  "capability":"creative.health","arguments":{"probe":probe,"timeout":30 if probe else 5}})
              return unpack(r)

          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  before=await health(c,False)
                  b=before.get("blocking") or {}
                  panel=(before.get("layers") or {}).get("panel") or {}
                  execution=before.get("execution") or {}
                  state={"blockedAt":before.get("blockedAt"),"panelBusy":panel.get("busy"),
                     "activeRequestId":panel.get("activeRequestId"),"unresolvedJobs":execution.get("unresolvedJobs"),
                     "priorCompletionObserved":b.get("priorCompletionObserved")}
                  print("ITEM_03_PREFLIGHT="+json.dumps(state),flush=True)
                  if panel.get("busy") is not False or panel.get("activeRequestId") is not None or execution.get("unresolvedJobs"):
                      raise RuntimeError("ITEM_03_BLOCKED_HOST_NOT_IDLE")
                  if before.get("blockedAt") not in (None,"document","probe_fence"):
                      raise RuntimeError("ITEM_03_BLOCKED_UNKNOWN_FENCE")
                  if before.get("blockedAt")=="probe_fence" and b.get("priorCompletionObserved") is not True:
                      raise RuntimeError("ITEM_03_BLOCKED_PREDECESSOR_UNPROVEN")
                  # Cursor excludes all stale callback log entries from previous jobs.
                  offset=TRACE.stat().st_size if TRACE.exists() else 0
                  print("ITEM_03_TRACE_CURSOR="+str(offset),flush=True)
                  after=await health(c,True)
                  print("ITEM_03_PROBE="+json.dumps({"ready":after.get("ready"),"probed":after.get("probed"),
                     "blockedAt":after.get("blockedAt")}),flush=True)
                  if after.get("ready") is not True or after.get("probed") is not True or after.get("blockedAt") not in (None,"document"):
                      raise RuntimeError("ITEM_03_FAIL_HOST_PROBE_NOT_VERIFIED")
                  if not TRACE.exists():
                      raise RuntimeError("ITEM_03_FAIL_TRACE_NOT_INSTALLED")
                  with TRACE.open("rb") as fh:
                      if fh.seek(0,2)<offset:
                          raise RuntimeError("ITEM_03_FAIL_TRACE_ROTATED")
                      fh.seek(offset)
                      fresh=fh.read().decode("utf-8",errors="replace")
                  lines=[x for x in fresh.splitlines() if "CEP_CALLBACK_HANDLED" in x and "kind=complete" in x]
                  print("ITEM_03_FRESH_CALLBACK_COUNT="+str(len(lines)),flush=True)
                  if not lines:
                      raise RuntimeError("ITEM_03_FAIL_NO_FRESH_COMPLETION")
                  print("ITEM_03_PASS_TRUSTED_PROBE_AND_FRESH_CALLBACK",flush=True)

          asyncio.run(main())
          '@ | Set-Content -LiteralPath item03_live.py -Encoding UTF8
          uv run python item03_live.py
          if($LASTEXITCODE -ne 0){throw 'ITEM_03_LIVE_ACCEPTANCE_FAIL'}
