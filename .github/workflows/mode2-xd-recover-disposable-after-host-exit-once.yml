name: Mode 2 XD recover only saved disposable after host exit once
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-recover-disposable-after-host-exit-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  reopen-only:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - name: Recover exactly saved 34-node test document without editing or overwriting source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_RECOVERY_WRONG_CONSOLE'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $baseline='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          $saved='1E15162107A64E3D7D4CAF8C12B88FE24B64488DA9788854E6D300DDBAE88C2F'
          $protected=@('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd')
          foreach($rel in $protected){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $baseline){throw 'MODE2_RECOVER_PROTECTED_PANDA_CHANGED'}
          }
          $dir=Join-Path $root 'mode2-disposable-native'
          $native=Join-Path $dir 'Mode2_Undo_E2E_38584984023.xd'
          if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash -ne $saved){throw 'MODE2_RECOVER_NATIVE_NOT_SAVED_RECTANGLE_BASELINE'}
          $receipt=Get-Content -LiteralPath (Join-Path $dir 'mode2_exact_guid_fill_mutation_receipt.json') -Raw -Encoding UTF8|ConvertFrom-Json
          if($receipt.state -ne 'applied_verified' -or $receipt.operation_id -ne 'xd-1792161320011-1'){
            throw 'MODE2_RECOVER_NOT_KNOWN_PREVIOUS_FILL_TRANSACTION'
          }
          if((Test-Path -LiteralPath (Join-Path $dir 'mode2_exact_guid_fill_undo_receipt.json')) -or
             (Test-Path -LiteralPath (Join-Path $dir 'Mode2_GUID_Fill_Undo_Once.marker'))){
            throw 'MODE2_RECOVER_OLD_UNDO_STATE_AMBIGUOUS'
          }
          $marker=Join-Path $dir 'Mode2_XD_RecoverAfterHostExit_Once.marker'
          if(Test-Path -LiteralPath $marker){throw 'MODE2_RECOVER_ALREADY_ATTEMPTED_NO_REPLAY'}
          $xdProcs=@(Get-Process -Name XD -ErrorAction SilentlyContinue)
          if($xdProcs.Count -ne 0){throw 'MODE2_RECOVER_XD_STILL_RUNNING_DO_NOT_OPEN_SECOND_INSTANCE'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $scope=[System.Windows.Automation.TreeScope]::Children
          $cond=[System.Windows.Automation.Condition]::TrueCondition
          function GetXD {
            $tops=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
            return @($tops|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          }
          if(@(GetXD).Count -ne 0){throw 'MODE2_RECOVER_XD_WINDOW_STILL_OPEN'}
          if(@(Get-Process -Name Illustrator,Photoshop,PickerHost -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_RECOVER_OTHER_ADOBE_OR_MODAL_RUNNING'}
          $app=Join-Path $env:LOCALAPPDATA 'Packages\Adobe.XD_pc75e8sa7ep4e\LocalState\develop'
          $exp=Join-Path $app 'MCPAdobeMode2Experiment\main.js'
          $prod=Join-Path $app 'MCPAdobeBridge\main.js'
          $git=(Get-Command git -ErrorAction Stop).Source
          if((& $git hash-object -- $exp).Trim() -ne 'd47edb15284ff4653da919513815fe4f9d846a70'){
            throw 'MODE2_RECOVER_EXPERIMENTAL_UXP_VERSION_DRIFT'
          }
          $prodHash=(Get-FileHash -LiteralPath $prod -Algorithm SHA256).Hash
          "run=$env:GITHUB_RUN_ID at=$([DateTime]::UtcNow.ToString('o')) sha=$saved" |
            Set-Content -LiteralPath $marker -Encoding ASCII -NoNewline
          $tracking=$env:RUNNER_TRACKING_ID
          try{$env:RUNNER_TRACKING_ID='';Start-Process -FilePath $native -ErrorAction Stop}
          finally{$env:RUNNER_TRACKING_ID=$tracking}
          Write-Host 'MODE2_RECOVER_SAVED_DISPOSABLE_OPEN_REQUESTED_ONCE'
          $ready=$false
          for($i=1;$i -le 38;$i++){
            Start-Sleep -Seconds 2
            $xd=@(GetXD)
            $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
            $pidList=@(Get-Process -Name XD -ErrorAction SilentlyContinue)
            $production=@(Get-NetTCPConnection -LocalPort 8765 -State Established -ErrorAction SilentlyContinue)
            Write-Host "MODE2_RECOVER_POLL=$i XD=$($xd.Count) TEST=$($test.Count) PROCS=$($pidList.Count) 8765=$($production.Count)"
            if($xd.Count -gt 1 -or $pidList.Count -gt 1){throw 'MODE2_RECOVER_AMBIGUOUS_MULTI_XD'}
            if($xd.Count -eq 1 -and $test.Count -eq 1 -and $pidList.Count -eq 1 -and $production.Count -ge 1){
              $ready=$true;break
            }
          }
          if(-not $ready){throw 'MODE2_RECOVER_XD_NOT_LIVE_NO_REOPEN_RETRY'}
          Start-Sleep -Seconds 3
          if(@(GetXD).Count -ne 1){throw 'MODE2_RECOVER_XD_NOT_STABLE'}
          foreach($rel in $protected){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $baseline){throw 'MODE2_RECOVER_PANDA_CHANGED_AFTER_OPEN'}
          }
          if((Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash -ne $saved){throw 'MODE2_RECOVER_TEST_CHANGED_AFTER_OPEN'}
          if((Get-FileHash -LiteralPath $prod -Algorithm SHA256).Hash -ne $prodHash){throw 'MODE2_RECOVER_PRODUCTION_PLUGIN_CHANGED'}
          Write-Host 'MODE2_RECOVER_XD_SOLE_SAVED_34_NODE_DISPOSABLE_OPEN=PASS'
          Write-Host 'MODE2_RECOVER_PANDA_AND_PRODUCTION_PRESERVED=PASS'
          Write-Host 'MODE2_RECOVER_DOCUMENT_MUTATION_ATTEMPTED=False'
