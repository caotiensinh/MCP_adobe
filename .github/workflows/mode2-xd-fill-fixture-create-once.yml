name: Mode 2 XD create new disposable-only rectangle for GUID fill test
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-fill-fixture-create-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  create:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert the only XD window is clean disposable, restore it before existing production Apply
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $sha='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          foreach($p in @('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd','mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd')){
            if((Get-FileHash -LiteralPath (Join-Path $root $p) -Algorithm SHA256).Hash -ne $sha){throw 'MODE2_PRECREATE_NATIVE_HASH_CHANGED'}
          }
          $receipt=Join-Path $root 'mode2-disposable-native\mode2_fill_rect_guid_receipt.json'
          if(Test-Path -LiteralPath $receipt){throw 'MODE2_CREATE_RECEIPT_EXISTS_NO_REPLAY'}
          if(@(Get-Process -Name Illustrator,Photoshop,PickerHost -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_OTHER_APP_OPEN'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class Mode2CreateForeground {
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr h);
          }
          '@
          $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_NOT_SINGLE_DISPOSABLE_XD'}
          $win=$test[0]
          $wp=$win.GetCurrentPattern([System.Windows.Automation.WindowPattern]::Pattern)
          if($wp.Current.WindowVisualState -eq [System.Windows.Automation.WindowVisualState]::Minimized){$wp.SetWindowVisualState([System.Windows.Automation.WindowVisualState]::Normal)}
          try{$win.SetFocus()}catch{}
          [void][Mode2CreateForeground]::SetForegroundWindow([IntPtr]$win.Current.NativeWindowHandle)
          Start-Sleep -Milliseconds 700
          $id=[System.Windows.Automation.AutomationElement]::AutomationIdProperty
          $desc=[System.Windows.Automation.TreeScope]::Descendants
          $file=$win.FindFirst($desc,(New-Object System.Windows.Automation.PropertyCondition($id,'AppMenu_File')))
          if(-not $file){throw 'MODE2_CREATE_FILE_MENU_UNAVAILABLE'}
          $xp=$file.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
          if($xp.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$xp.Expand()}
          Start-Sleep -Milliseconds 250
          $list=$win.FindAll($desc,[System.Windows.Automation.Condition]::TrueCondition)
          $save=@($list|Where-Object {[string]$_.Current.AutomationId -eq 'AppMenu_Save' -and $_.Current.IsEnabled})
          $xp.Collapse()
          if($save.Count -gt 0){throw 'MODE2_DISPOSABLE_DIRTY_NO_CREATE'}
          $connected=@(Get-NetTCPConnection -LocalPort 8765 -State Established -ErrorAction SilentlyContinue)
          if($connected.Count -lt 1){throw 'MODE2_PRODUCTION_BRIDGE_NOT_CONNECTED'}
          Write-Host 'MODE2_FILL_CREATE_SINGLE_CLEAN_XD_AND_PRODUCTION_BRIDGE=PASS'
      - name: Send one bounded native rectangle creation and capture new GUID
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          uv run --python 3.12 python scripts/mode2_create_disposable_fill_fixture_once.py
          if($LASTEXITCODE -ne 0){throw 'MODE2_FILL_CREATE_FAILED_NO_REPLAY'}
