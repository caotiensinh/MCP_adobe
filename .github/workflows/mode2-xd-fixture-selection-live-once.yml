name: Mode 2 XD live user-command select fixture once
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-fixture-selection-live-once.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  select-once:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reload newly pinned experimental plugin and select fixture by explicit XD menu command
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $native=Join-Path $root 'mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd'
          $baseline='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          $rels=@('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd','mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd')
          foreach($rel in $rels){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $baseline){throw 'MODE2_NATIVE_BASELINE_CHANGED'}
          }
          $marker=Join-Path $root 'mode2-disposable-native\Mode2_FixtureSelection_PluginReload_Once.marker'
          if(Test-Path -LiteralPath $marker){throw 'MODE2_FIXTURE_RELOAD_ALREADY_ATTEMPTED_NO_REPLAY'}
          $develop=Join-Path $env:LOCALAPPDATA 'Packages\Adobe.XD_pc75e8sa7ep4e\LocalState\develop'
          $prod=Join-Path $develop 'MCPAdobeBridge\main.js'
          $new=Join-Path $develop 'MCPAdobeMode2Experiment\main.js'
          $newManifest=Join-Path $develop 'MCPAdobeMode2Experiment\manifest.json'
          $git=(Get-Command git -ErrorAction Stop).Source
          if((& $git hash-object -- $new).Trim() -ne '33f99aff6ab0467cab90da7a9fb4bf0838dcc955' -or
             (& $git hash-object -- $newManifest).Trim() -ne '74d0f81a4a26d71e3bb22401e455a58ab40635d3'){
            throw 'MODE2_EXPERIMENTAL_PLUGIN_NOT_PINNED'
          }
          $prodHash=(Get-FileHash -LiteralPath $prod -Algorithm SHA256).Hash
          if(@(Get-Process -Name Illustrator,Photoshop,PickerHost -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_FOREIGN_ADOBE_OR_DIALOG'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $scope=[System.Windows.Automation.TreeScope]::Children
          $desc=[System.Windows.Automation.TreeScope]::Descendants
          $cond=[System.Windows.Automation.Condition]::TrueCondition
          $id=[System.Windows.Automation.AutomationElement]::AutomationIdProperty
          function Windows-XD{
            $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll($scope,$cond)
            return @($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          }
          $xd=@(Windows-XD)
          $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -eq 0){
            $tracking=$env:RUNNER_TRACKING_ID
            try{$env:RUNNER_TRACKING_ID='';Start-Process -FilePath $native -ErrorAction Stop}finally{$env:RUNNER_TRACKING_ID=$tracking}
            Write-Host 'MODE2_FIXTURE_OPEN_DISPOSABLE_ONCE'
          }elseif($xd.Count -ne 1 -or $test.Count -ne 1){throw 'MODE2_FIXTURE_FOREIGN_XD_WINDOW'}
          $ready=$false
          for($i=1;$i -le 18;$i++){
            Start-Sleep -Seconds 3
            $xd=@(Windows-XD)
            $test=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
            $prodWs=@(Get-NetTCPConnection -LocalPort 8765 -State Established -ErrorAction SilentlyContinue)
            if($xd.Count -eq 1 -and $test.Count -eq 1 -and $prodWs.Count -ge 1){$ready=$true;break}
          }
          if(-not $ready){throw 'MODE2_XD_PRODUCTION_NOT_CONNECTED'}
          Write-Host 'MODE2_FIXTURE_SOLE_DISPOSABLE_AND_8765=PASS'
          function Find-Menu([string]$menuId){
            $m=$test[0].FindFirst($desc,(New-Object System.Windows.Automation.PropertyCondition($id,$menuId)))
            if(-not $m){throw "MODE2_MENU_NOT_FOUND_$menuId"}
            return $m
          }
          $file=Find-Menu 'AppMenu_File'
          $fx=$file.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
          $clean=$false
          for($i=1;$i -le 15;$i++){
            if($fx.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$fx.Expand()}
            Start-Sleep -Milliseconds 220
            $list=$test[0].FindAll($desc,$cond)
            $saveEnabled=@($list|Where-Object {[string]$_.Current.Name -eq 'Save' -and $_.Current.IsEnabled})
            $fx.Collapse()
            Write-Host "MODE2_FIXTURE_SAVE_CHECK=$i ENABLED=$($saveEnabled.Count)"
            if($saveEnabled.Count -eq 0){$clean=$true;break}
            Start-Sleep -Seconds 3
          }
          if(-not $clean){throw 'MODE2_FIXTURE_DOC_UNSAVED_NO_RELOAD'}
          if(@(Get-NetTCPConnection -LocalPort 8766 -State Listen -ErrorAction SilentlyContinue).Count -gt 0){throw 'MODE2_FIXTURE_8766_UNOWNED_LISTENER'}
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          $uv=(Get-Command uv -ErrorAction Stop).Source
          $out=Join-Path $env:RUNNER_TEMP 'mode2_fixture_selection_stdout.txt'
          $err=Join-Path $env:RUNNER_TEMP 'mode2_fixture_selection_stderr.txt'
          $child=Start-Process -FilePath $uv -ArgumentList @('run','--python','3.12','python','scripts/mode2_xd_fixture_selection_watch.py','--wait-seconds','85') -PassThru -WindowStyle Hidden -RedirectStandardOutput $out -RedirectStandardError $err
          try{
            $listening=$false
            for($i=1;$i -le 45;$i++){
              Start-Sleep -Milliseconds 400
              if($child.HasExited){throw 'MODE2_FIXTURE_WATCHER_EARLY_EXIT'}
              if(@(Get-NetTCPConnection -LocalPort 8766 -State Listen -ErrorAction SilentlyContinue).Count -eq 1){$listening=$true;break}
            }
            if(-not $listening){throw 'MODE2_FIXTURE_8766_NOT_LISTENING'}
            $plugins=Find-Menu 'AppMenuBar_Plugins'
            $px=$plugins.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
            $px.Expand(); Start-Sleep -Milliseconds 200
            $dev=Find-Menu 'PluginsMenu_Development'
            $dx=$dev.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
            $dx.Expand(); Start-Sleep -Milliseconds 200
            $items=$test[0].FindAll($desc,$cond)
            $reload=@($items|Where-Object {[string]$_.Current.AutomationId -eq 'PluginsMenu_Development_Reload' -and [string]$_.Current.Name -eq 'Reload Plugins (Legacy)' -and $_.Current.IsEnabled})
            if($reload.Count -ne 1){throw 'MODE2_FIXTURE_RELOAD_NOT_UNIQUE'}
            "run=$env:GITHUB_RUN_ID at=$([DateTime]::UtcNow.ToString('o'))" | Set-Content -LiteralPath $marker -Encoding ASCII -NoNewline
            $reload[0].GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Write-Host 'MODE2_FIXTURE_PLUGIN_RELOAD_INVOKED_ONCE'
            $connected=$false
            for($i=1;$i -le 35;$i++){
              Start-Sleep -Milliseconds 300
              if(@(Get-NetTCPConnection -LocalPort 8766 -State Established -ErrorAction SilentlyContinue).Count -gt 0){$connected=$true;break}
            }
            if(-not $connected){throw 'MODE2_FIXTURE_UXP_8766_NO_CONNECTION'}
            Write-Host 'MODE2_FIXTURE_NEW_EXPERIMENTAL_UXP_CONNECTED=PASS'
            $px= (Find-Menu 'AppMenuBar_Plugins').GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
            if($px.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$px.Expand()}
            Start-Sleep -Milliseconds 250
            $menuItems=$test[0].FindAll($desc,$cond)
            $entry=@($menuItems|Where-Object {[string]$_.Current.Name -match '^MCP Adobe Mode 2 Experimental$'})
            if($entry.Count -eq 1){
              $sub=$null
              try{$sub=$entry[0].GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)}catch{}
              if($sub){
                $sub.Expand(); Start-Sleep -Milliseconds 220
              }
            }
            $menuItems=$test[0].FindAll($desc,$cond)
            foreach($menuItem in @($menuItems|Where-Object {[string]$_.Current.Name -match 'Mode 2|Fixture|MCP Adobe'})|Select-Object -First 20){
              Write-Host "MODE2_FIXTURE_UIA_ITEM=$([string]$menuItem.Current.Name) ID=$([string]$menuItem.Current.AutomationId) ENABLED=$($menuItem.Current.IsEnabled)"
            }
            $target=@($menuItems|Where-Object {[string]$_.Current.Name -eq 'MCP Mode 2 Select Verified Fixture' -and $_.Current.IsEnabled})
            if($target.Count -ne 1){throw "MODE2_FIXTURE_SELECTION_MENU_NOT_UNIQUE count=$($target.Count)"}
            $target[0].GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Write-Host 'MODE2_FIXTURE_NATIVE_MENU_SELECT_INVOKED_ONCE'
            if(-not $child.WaitForExit(90000)){throw 'MODE2_FIXTURE_WATCHER_TIMEOUT'}
            if(Test-Path -LiteralPath $out){Get-Content -LiteralPath $out|ForEach-Object {Write-Host $_}}
            if(Test-Path -LiteralPath $err){Get-Content -LiteralPath $err -Tail 12|ForEach-Object {Write-Host "MODE2_FIXTURE_STDERR=$_"}}
            if(-not (Select-String -LiteralPath $out -Pattern '^MODE2_FIXTURE_SELECTED_AND_INSPECTED=PASS$' -Quiet)){
              throw 'MODE2_FIXTURE_SELECTION_NOT_ATTESTED'
            }
            Write-Host 'MODE2_FIXTURE_REAL_XD_SELECTION_E2E=PASS'
          }finally{
            if(-not $child.HasExited){Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue}
          }
          foreach($rel in $rels){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $baseline){throw 'MODE2_FIXTURE_NATIVE_FILE_CHANGED'}
          }
          if((Get-FileHash -LiteralPath $prod -Algorithm SHA256).Hash -ne $prodHash){throw 'MODE2_FIXTURE_PRODUCTION_PLUGIN_CHANGED'}
          Write-Host 'MODE2_FIXTURE_PRODUCTION_AND_DISPOSABLE_PRESERVED=PASS'
