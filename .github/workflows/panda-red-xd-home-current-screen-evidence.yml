name: Panda XD current Home window screenshot safely cropped and checksum verified
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: [".github/workflows/panda-red-xd-home-current-screen-evidence.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 4
    steps:
      - name: Capture only current Adobe XD Home window frame, no keyboard or native document mutation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'XD_SCREEN_WRONG_DESKTOP'}
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;using System.Runtime.InteropServices;
          public class XdScreenRect {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left;public int Top;public int Right;public int Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hwnd,out RECT r);
          }
          '@
          $file=Join-Path $env:USERPROFILE 'Documents\MCPAdobe\MCP_Mode1_Panda_XD_38136531800.xd'
          $expected='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          if((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected){throw 'XD_SCREEN_NATIVE_SOURCE_CHANGED'}
          $root=[System.Windows.Automation.AutomationElement]::RootElement
          $windows=$root.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $homeView=@($windows | Where-Object {[string]$_.Current.Name -eq 'Adobe XD' -and [string]$_.Current.ClassName -eq 'ApplicationFrameWindow'})
          $original=@($windows | Where-Object {[string]$_.Current.Name -match '^MCP_Mode1_Panda_XD_38136531800.*Adobe XD$'})
          Write-Host "XD_SCREEN_PREFLIGHT home=$($homeView.Count) source_doc=$($original.Count)"
          if($homeView.Count -ne 1 -or $original.Count -ne 1){throw 'XD_SCREEN_NOT_EXACT_TWO_WINDOWS'}
          $hwnd=[IntPtr]$homeView[0].Current.NativeWindowHandle
          $rect=New-Object XdScreenRect+RECT
          if(-not([XdScreenRect]::GetWindowRect($hwnd,[ref]$rect))){throw 'XD_SCREEN_RECT_FAILED'}
          $width=$rect.Right-$rect.Left
          $height=$rect.Bottom-$rect.Top
          if($width -lt 300 -or $height -lt 200 -or $width -gt 6000 -or $height -gt 5000){throw 'XD_SCREEN_UNEXPECTED_RECT'}
          $dest=Join-Path $env:RUNNER_TEMP 'panda_red_xd_home_snapshot'
          New-Item -ItemType Directory -Path $dest -Force|Out-Null
          $path=Join-Path $dest 'xd_home_live_window.png'
          $bitmap=New-Object System.Drawing.Bitmap($width,$height)
          $graphics=[System.Drawing.Graphics]::FromImage($bitmap)
          try{
            $graphics.CopyFromScreen($rect.Left,$rect.Top,0,0,(New-Object System.Drawing.Size($width,$height)))
            $bitmap.Save($path,[System.Drawing.Imaging.ImageFormat]::Png)
          }finally{$graphics.Dispose();$bitmap.Dispose()}
          $bytes=(Get-Item -LiteralPath $path).Length
          if($bytes -lt 5000){throw 'XD_SCREEN_IMAGE_TOO_SMALL'}
          if((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected){throw 'XD_SCREEN_SOURCE_CHANGED_AFTER_CAPTURE'}
          Write-Host "XD_SCREEN_NATIVE_IMAGE=PASS size=$width x $height bytes=$bytes sha256=$((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash)"
          Write-Host 'XD_SCREEN_FILE_SOURCE_UNCHANGED=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: panda-red-xd-home-current-ui-only
          path: ${{ runner.temp }}/panda_red_xd_home_snapshot/xd_home_live_window.png
          if-no-files-found: warn
          retention-days: 14
