name: Mode 2 XD post-Undo native disk and host acceptance
on:
  push:
    branches: [feat/canvas-region-targeting]
    paths: ['.github/workflows/mode2-xd-postundo-native-disk-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: adobe-panda-desktop-exclusive
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect real saved native file, protected sources, and File Save availability
        shell: powershell
        env:
          PYTHONUTF8: '1'
          UV_LINK_MODE: copy
        run: |
          $ErrorActionPreference='Stop'
          if($env:COMPUTERNAME -ne 'MRCAO' -or [Diagnostics.Process]::GetCurrentProcess().SessionId -ne 1){throw 'MODE2_WRONG_HOST'}
          $root=Join-Path $env:USERPROFILE 'Documents\MCPAdobe'
          $test=Join-Path $root 'mode2-disposable-native\Mode2_Undo_E2E_38584984023.xd'
          $expected='3A10E1510ABC41ECCD4485D6F852EA6CED7ACC2CF50109E7C1BD123353589ED1'
          foreach($rel in @('MCP_Mode1_Panda_XD_38136531800.xd','mode2-isolated\Panda_Mode2_Editable_Experiment.xd')){
            if((Get-FileHash -LiteralPath (Join-Path $root $rel) -Algorithm SHA256).Hash -ne $expected){throw 'MODE2_PROTECTED_NATIVE_CHANGED'}
          }
          $actual=(Get-FileHash -LiteralPath $test -Algorithm SHA256).Hash
          $file=Get-Item -LiteralPath $test
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip=[System.IO.Compression.ZipFile]::OpenRead($test)
          try{$entries=$zip.Entries.Count}finally{$zip.Dispose()}
          if($file.Length -le 1000 -or $entries -lt 1){throw 'MODE2_DISPOSABLE_NATIVE_INVALID'}
          Write-Host "MODE2_DISPOSABLE_DISK_SHA=$actual EQUALS_PREMUTATION=$($actual -eq $expected) ZIP_ENTRIES=$entries BYTES=$($file.Length)"
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          $top=[System.Windows.Automation.AutomationElement]::RootElement.FindAll([System.Windows.Automation.TreeScope]::Children,[System.Windows.Automation.Condition]::TrueCondition)
          $xd=@($top|Where-Object {[string]$_.Current.Name -match 'Adobe XD$'})
          $testWindow=@($xd|Where-Object {[string]$_.Current.Name -match '^Mode2_Undo_E2E_38584984023.*Adobe XD$'})
          if($xd.Count -ne 1 -or $testWindow.Count -ne 1){throw 'MODE2_DISPOSABLE_HOST_NOT_SOLE'}
          $id=[System.Windows.Automation.AutomationElement]::AutomationIdProperty
          $menu=$testWindow[0].FindFirst([System.Windows.Automation.TreeScope]::Descendants,(New-Object System.Windows.Automation.PropertyCondition($id,'AppMenu_File')))
          if(-not $menu){throw 'MODE2_FILE_MENU_MISSING'}
          $expand=$menu.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern)
          if($expand.Current.ExpandCollapseState -ne [System.Windows.Automation.ExpandCollapseState]::Expanded){$expand.Expand()}
          Start-Sleep -Milliseconds 250
          $all=$testWindow[0].FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
          foreach($item in @($all|Where-Object {[string]$_.Current.ControlType.ProgrammaticName -eq 'ControlType.MenuItem' -and [string]$_.Current.Name -match 'Save' -and [string]$_.Current.Name -notmatch 'Save As'})|Select-Object -First 15){
            Write-Host "MODE2_FILE_SAVE_CONTROL=$([string]$item.Current.Name) id=$([string]$item.Current.AutomationId) enabled=$($item.Current.IsEnabled)"
          }
          $expand.Collapse()
          $env:Path=(@([Environment]::GetEnvironmentVariable('Path','Machine'),[Environment]::GetEnvironmentVariable('Path','User'),$env:Path)|Where-Object{$_}) -join ';'
          @'
          import asyncio
          from mcp import Client
          from scripts.export_region_metadata import payload,unwrap
          def has_test(nodes):
              for n in nodes:
                  if n.get("name")=="MODE2_DISPOSABLE_UNDO_RECT_ONE_SHOT" or n.get("id")=="29e85d07-75aa-4f8f-9a04-60de4d09477d":return True
                  if has_test(n.get("children",[])):return True
              return False
          async def main():
              async with Client("http://127.0.0.1:8787/mcp") as c:
                  r=await asyncio.wait_for(c.call_tool("creative_read",{"application":"xd","capability":"creative.scenegraph.list","arguments":{}}),timeout=15)
                  graph=unwrap(payload(r))
                  if isinstance(graph,dict) and isinstance(graph.get("result"),dict):graph=unwrap(graph["result"])
                  if graph.get("complete") is not True or graph.get("node_count")!=33 or has_test(graph.get("nodes",[])):
                      raise RuntimeError("MODE2_POST_UNDO_LIVE_DIVERGED")
                  print("MODE2_POST_UNDO_LIVE_SCENE=PASS nodes=33",flush=True)
          asyncio.run(main())
          '@|Set-Content -LiteralPath .\postundo_read.py -Encoding UTF8
          uv run --python 3.12 python .\postundo_read.py
          if($LASTEXITCODE -ne 0){throw 'MODE2_POST_UNDO_LIVE_FAILED'}
          if((Get-FileHash -LiteralPath $test -Algorithm SHA256).Hash -ne $actual){throw 'MODE2_TEST_CHANGED_DURING_READ'}
          Write-Host 'MODE2_POST_UNDO_NATIVE_DISK_ACCEPTANCE=PASS'
