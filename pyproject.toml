[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-adobe-creative-gateway"
version = "0.1.0"
description = "Client-neutral gateway core for Adobe Creative MCP adapters"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
  "websockets>=15,<16",
]

[project.scripts]
mcp-adobe = "mcp_adobe.server:main"
mcp-adobe-oauth-preflight = "mcp_adobe.oauth_preflight_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
